[project]
name = "mes-agentic-bi"
version = "0.1.0"
description = "MES Agentic BI – standalone data copilot service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy<2.0",
    "openai>=1.12.0",
    "langfuse>=3.5.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
    "snowflake-connector-python[pandas]>=3.6.0",
    "boto3>=1.40.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]
