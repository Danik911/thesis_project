- test_id: OQ-006
  test_name: System Availability Verification
  test_category: performance
  gamp_category: 3
  objective: Confirm system meets URS-EMS-013 requirement for 99.5% operational availability
    excluding planned maintenance
  prerequisites:
  - System operational for minimum 30-day period
  - Maintenance logs available
  - System uptime monitoring enabled
  test_steps:
  - step_number: 1
    action: Review system logs for 30-day operational period excluding planned maintenance
      windows
    expected_result: Complete operational logs available covering entire test period
    data_to_capture:
    - Total logged operational hours
    - Planned maintenance duration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: 'Calculate actual uptime percentage using formula: (Total Hours - Unplanned
      Downtime) / Total Hours × 100'
    expected_result: Calculated availability meets or exceeds 99.5% threshold
    data_to_capture:
    - Unplanned downtime duration
    - Calculated availability percentage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify all downtime events are properly documented in system logs with
      root cause analysis
    expected_result: Complete documentation exists for all unavailability periods
      exceeding 5 minutes
    data_to_capture:
    - Downtime event records
    - Root cause documentation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System availability ≥99.5% excluding planned maintenance
  - All unplanned downtime events properly documented
  - Calculation methodology aligns with URS requirements
  regulatory_basis:
  - EU GMP Chapter 4
  - 21 CFR 211.68
  risk_level: medium
  data_integrity_requirements:
  - ALCOA+ attributable records
  - Complete data lifecycle
  urs_requirements:
  - URS-EMS-013
  related_tests:
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - System Administration
  - Performance Metrics Analysis
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
