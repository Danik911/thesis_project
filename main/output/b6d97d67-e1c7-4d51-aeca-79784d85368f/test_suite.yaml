test_cases:
- test_id: OQ-001
  test_name: Verify Basic Inventory Tracking of Raw Materials
  test_category: functional
  gamp_category: 3
  objective: To verify the system's ability to track raw materials using the standard
    item master and real-time quantity updates.
  prerequisites:
  - System is installed and configured.
  - User has appropriate access privileges.
  - Item master for raw materials is populated.
  test_steps:
  - step_number: 1
    action: Log into the inventory management system.
    expected_result: User is successfully logged in and the main dashboard is displayed.
    data_to_capture:
    - Login timestamp
    - User ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the inventory tracking module.
    expected_result: The inventory tracking interface is displayed, showing a list
      of items.
    data_to_capture:
    - Screen capture of inventory module
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Search for a specific raw material SKU (e.g., 'RM-XYZ-123').
    expected_result: The system displays the details for the specified raw material,
      including current quantity.
    data_to_capture:
    - Raw material SKU
    - Initial quantity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Perform a stock adjustment to add 10 units to the raw material.
    expected_result: The stock adjustment is processed successfully, and the new quantity
      is reflected.
    data_to_capture:
    - Adjustment quantity
    - New quantity
    - Timestamp of adjustment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Verify the updated quantity within 30 seconds.
    expected_result: The system reflects the updated quantity (initial quantity +
      10) within the specified timeframe.
    data_to_capture:
    - Verified updated quantity
    - Timestamp of verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System successfully tracks raw materials by SKU.
  - Inventory quantities are updated in real-time.
  - Stock adjustments are accurately recorded and reflected.
  regulatory_basis:
  - 'URS-INV-002: Track raw materials, packaging components, and finished goods using
    standard item master.'
  - 'URS-INV-006: Track inventory quantities in real-time using standard database
    updates.'
  - 'URS-INV-013: Inventory updates shall be reflected within 30 seconds using standard
    refresh rates.'
  risk_level: low
  data_integrity_requirements:
  - All inventory transactions must be recorded accurately.
  - Quantity updates must be atomic and consistent.
  urs_requirements:
  - URS-INV-002
  - URS-INV-006
  - URS-INV-013
  related_tests: []
  estimated_duration_minutes: 30
  required_expertise:
  - Inventory Management System Administrator
  - QA Tester
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify FIFO Inventory Rotation and Cycle Count Scheduling
  test_category: functional
  gamp_category: 3
  objective: To verify the system's adherence to FIFO inventory rotation and its ability
    to generate cycle count schedules.
  prerequisites:
  - System is installed and configured.
  - User has appropriate access privileges.
  - Multiple batches of the same item with different expiry dates are present in inventory.
  - Cycle count scheduling is enabled.
  test_steps:
  - step_number: 1
    action: Log into the inventory management system.
    expected_result: User is successfully logged in and the main dashboard is displayed.
    data_to_capture:
    - Login timestamp
    - User ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the inventory management module and view items with multiple
      batches.
    expected_result: The system displays items with their respective batch numbers
      and expiry dates.
    data_to_capture:
    - Screen capture of inventory view with batches
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Simulate picking an item that should be picked using FIFO (earlier expiry
      date).
    expected_result: The system correctly identifies and suggests the batch with the
      earliest expiry date for picking.
    data_to_capture:
    - Item SKU
    - Batches available
    - Batch suggested for picking
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Navigate to the cycle count scheduling module.
    expected_result: The cycle count scheduling interface is displayed.
    data_to_capture:
    - Screen capture of cycle count scheduling module
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate a cycle count schedule for a specific location or item category.
    expected_result: The system generates a cycle count schedule based on vendor's
      standard scheduling engine.
    data_to_capture:
    - Generated cycle count schedule details
    - Date of generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Verify that the generated schedule includes items that require counting.
    expected_result: The schedule contains a list of items and locations to be counted.
    data_to_capture:
    - List of items/locations in schedule
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System correctly implements FIFO rotation for inventory picking.
  - System generates cycle count schedules based on configured parameters.
  - Generated cycle count schedules are comprehensive and actionable.
  regulatory_basis:
  - 'URS-INV-003: Implement First-In-First-Out (FIFO) inventory rotation using vendor
    default algorithms.'
  - 'URS-INV-008: Generate cycle count schedules using vendor''s standard scheduling
    engine.'
  - 'URS-INV-018: Generate inventory accuracy reports using standard reconciliation
    features.'
  risk_level: low
  data_integrity_requirements:
  - Inventory rotation logic must be consistently applied.
  - Cycle count schedules must be generated accurately to ensure inventory accuracy.
  urs_requirements:
  - URS-INV-003
  - URS-INV-008
  - URS-INV-018
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - Inventory Management System Administrator
  - QA Tester
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify FEFO Rotation and Expiry Date Management
  test_category: functional
  gamp_category: 3
  objective: To verify the system's ability to manage inventory using the First-Expired-First-Out
    (FEFO) rotation principle and accurately track expiry dates.
  prerequisites:
  - System is installed and configured.
  - User has appropriate access privileges.
  - Inventory items with different expiry dates are available in the system.
  test_steps:
  - step_number: 1
    action: Receive a batch of raw materials with a specific expiry date into a designated
      storage location.
    expected_result: The system successfully records the received raw materials, including
      their expiry date, in the specified location.
    data_to_capture:
    - Item ID
    - Batch Number
    - Expiry Date
    - Quantity Received
    - Storage Location
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Receive another batch of the same raw material with an earlier expiry
      date into the same storage location.
    expected_result: The system successfully records the second batch of raw materials
      with its earlier expiry date.
    data_to_capture:
    - Item ID
    - Batch Number
    - Expiry Date
    - Quantity Received
    - Storage Location
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Initiate a picking request for a quantity of the raw material.
    expected_result: The system automatically suggests picking the batch with the
      earliest expiry date (FEFO).
    data_to_capture:
    - Suggested Batch ID
    - Suggested Quantity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Confirm the picking of the suggested batch.
    expected_result: The system updates the inventory quantities, reflecting the picked
      items from the earliest expiring batch.
    data_to_capture:
    - Actual Picked Batch ID
    - Quantity Picked
    - Remaining Quantity in Batch
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate an inventory report showing expiry dates for all items.
    expected_result: The report accurately displays the expiry dates for all inventory
      items, reflecting the FEFO picking.
    data_to_capture:
    - Item ID
    - Batch Number
    - Expiry Date
    - Current Quantity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system correctly identifies and suggests the earliest expiring batch for picking.
  - Inventory quantities are accurately updated after FEFO picking.
  - Expiry dates are correctly recorded and displayed in inventory reports.
  regulatory_basis:
  - 'URS-INV-004: Support First-Expired-First-Out (FEFO) rotation for expiry date
    management.'
  risk_level: medium
  data_integrity_requirements:
  - Expiry dates must be accurately captured and maintained.
  - Inventory quantities must be updated correctly based on FEFO logic.
  urs_requirements:
  - URS-INV-004
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Warehouse Operations
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Real-time Inventory Quantity Updates and Barcode Scanning
  test_category: functional
  gamp_category: 3
  objective: To verify that inventory quantities are updated in real-time and that
    the system supports barcode scanning for inventory movements.
  prerequisites:
  - System is installed and configured.
  - User has appropriate access privileges.
  - Barcode scanner is connected and configured with the system.
  - Inventory items have corresponding barcodes.
  test_steps:
  - step_number: 1
    action: Perform a physical count of a specific inventory item in a storage location.
    expected_result: The system displays the current inventory quantity for the item.
    data_to_capture:
    - Item ID
    - Current System Quantity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Use the barcode scanner to record the receipt of a new quantity of the
      same inventory item into the system.
    expected_result: The system immediately updates the inventory quantity to reflect
      the newly received items.
    data_to_capture:
    - Item ID
    - Quantity Received
    - Updated System Quantity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Use the barcode scanner to record the picking of a quantity of the same
      inventory item for a production order.
    expected_result: The system immediately updates the inventory quantity to reflect
      the picked items.
    data_to_capture:
    - Item ID
    - Quantity Picked
    - Updated System Quantity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Perform a cycle count for the same inventory item using the barcode scanner
      to confirm quantities.
    expected_result: The system accurately reflects the scanned quantities during
      the cycle count process.
    data_to_capture:
    - Item ID
    - Scanned Quantity
    - System Quantity during Cycle Count
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate an inventory movement report for the tested item.
    expected_result: The report accurately reflects all receipts, picks, and adjustments
      made using barcode scanning, showing real-time updates.
    data_to_capture:
    - Item ID
    - Transaction Type
    - Quantity
    - Timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Inventory quantities are updated in real-time (within 30 seconds) after scanning
    operations.
  - Barcode scanning accurately records inventory receipts and issues.
  - Cycle counts reflect accurate, real-time inventory data.
  regulatory_basis:
  - 'URS-INV-006: Track inventory quantities in real-time using standard database
    updates.'
  - 'URS-INV-007: Support barcode scanning using vendor''s barcode integration module.'
  risk_level: medium
  data_integrity_requirements:
  - Inventory quantities must be accurate and reflect all transactions in real-time.
  - Barcode data must be correctly interpreted and applied to inventory records.
  urs_requirements:
  - URS-INV-006
  - URS-INV-007
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 75
  required_expertise:
  - Warehouse Operations
  - IT Support (Barcode Scanner)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
