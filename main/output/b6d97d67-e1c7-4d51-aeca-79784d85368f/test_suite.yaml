- test_id: OQ-006
  test_name: Verify User Access Controls and Audit Trail Functionality
  test_category: security
  gamp_category: 3
  objective: To verify that the system enforces user access controls based on roles
    and maintains a comprehensive audit trail of all significant transactions.
  prerequisites:
  - System is installed and configured.
  - User roles and permissions are defined.
  - Multiple user accounts with different roles are created.
  test_steps:
  - step_number: 1
    action: Log in to the system using a user account with limited permissions (e.g.,
      a basic warehouse operator).
    expected_result: The user can only access modules and perform actions permitted
      by their assigned role.
    data_to_capture:
    - Screenshot of the user interface after login.
    - List of accessible modules/functions.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to perform an action that is outside the user's assigned role
      (e.g., modifying system settings).
    expected_result: The system prevents the action and displays an appropriate error
      message indicating insufficient permissions.
    data_to_capture:
    - Screenshot of the error message.
    - Details of the attempted action.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in using a user account with administrative privileges.
    expected_result: The user can access all modules and perform all system functions.
    data_to_capture:
    - Screenshot of the user interface after login.
    - Confirmation of full access.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Perform a significant transaction (e.g., adding a new item, adjusting
      inventory quantity, changing a location).
    expected_result: The transaction is successfully processed.
    data_to_capture:
    - Details of the performed transaction.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Access the system's audit trail module and search for the transaction
      performed in Step 4.
    expected_result: The audit trail accurately records the transaction, including
      the user who performed it, the timestamp, the action taken, and any relevant
      data changes.
    data_to_capture:
    - Screenshot of the audit trail entry for the transaction.
    - Details of the audit trail record.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - User access is restricted according to defined roles.
  - Unauthorized actions are prevented.
  - All significant transactions are logged in the audit trail with sufficient detail.
  regulatory_basis:
  - 'URS-INV-016: Maintain inventory audit trail using vendor''s standard logging
    functionality.'
  - 'URS-INV-017: Support user access controls through vendor''s role-based security.'
  risk_level: medium
  data_integrity_requirements:
  - Audit trail entries must be immutable.
  - Audit trail must capture all critical data changes.
  urs_requirements:
  - URS-INV-016
  - URS-INV-017
  related_tests:
  - OQ-001
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - Quality Assurance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify Multiple Storage Location Management and Inventory Accuracy Reporting
  test_category: functional
  gamp_category: 3
  objective: To verify the system's capability to manage inventory across multiple
    storage locations and generate accurate inventory reconciliation reports.
  prerequisites:
  - System is installed and configured.
  - User has administrative privileges.
  - At least two distinct storage locations are configured in the system.
  - Inventory items are present in the system.
  test_steps:
  - step_number: 1
    action: Navigate to the inventory management module and select the option to view
      inventory by location.
    expected_result: The system displays a list of configured storage locations.
    data_to_capture:
    - Screenshot of the storage location list.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select a specific storage location and verify the inventory items and
      quantities listed for that location.
    expected_result: The displayed inventory items and quantities accurately reflect
      the stock within the selected location.
    data_to_capture:
    - List of items and quantities for the selected location.
    - Screenshot of the inventory for the selected location.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Perform a manual inventory count for a few items in a designated storage
      location and input these counts into the system for reconciliation.
    expected_result: The system allows for manual count entry and flags any discrepancies
      between system quantity and manual count.
    data_to_capture:
    - Manual count data entered.
    - System's discrepancy report.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Generate an inventory accuracy report for the storage location where the
      manual count was performed.
    expected_result: The generated report accurately reflects the inventory status,
      including any discrepancies identified during reconciliation.
    data_to_capture:
    - Generated inventory accuracy report.
    - Screenshot of the report.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System successfully displays all configured storage locations.
  - Inventory displayed for each location is accurate.
  - System correctly identifies and reports inventory discrepancies during reconciliation.
  - Generated inventory accuracy reports are complete and accurate.
  regulatory_basis:
  - 'URS-INV-010: Support multiple storage locations with standard location master
    setup.'
  - 'URS-INV-018: Generate inventory accuracy reports using standard reconciliation
    features.'
  risk_level: low
  data_integrity_requirements:
  - Inventory quantities must be accurately displayed per location.
  - Reconciliation reports must reflect actual counts and system discrepancies.
  urs_requirements:
  - URS-INV-010
  - URS-INV-018
  related_tests:
  - OQ-001
  - OQ-004
  estimated_duration_minutes: 45
  required_expertise:
  - Inventory Management
  - System Administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Reorder Alerts and Data Export to Excel
  test_category: integration
  gamp_category: 3
  objective: To verify the system's ability to generate reorder alerts based on minimum
    stock levels and to export inventory data to Excel format.
  prerequisites:
  - System is installed and configured.
  - User has appropriate access rights.
  - Inventory items with defined minimum stock levels are present in the system.
  - Excel software is available on the testing workstation.
  test_steps:
  - step_number: 1
    action: Identify an inventory item with a defined minimum stock level and reduce
      its current quantity below this threshold.
    expected_result: The system updates the inventory quantity.
    data_to_capture:
    - Item ID and its original quantity.
    - New reduced quantity.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access the reorder alerts or notifications section of the system.
    expected_result: A reorder alert is generated for the item whose quantity has
      fallen below the minimum stock level.
    data_to_capture:
    - Screenshot of the reorder alert.
    - Details of the alert (item, quantity, alert trigger).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Navigate to the inventory reporting module and select an option to export
      inventory data.
    expected_result: The system presents an option to export data, typically to CSV
      or Excel.
    data_to_capture:
    - Screenshot of the export options.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Select an inventory report and choose to export it to Excel format.
    expected_result: The system generates and downloads an Excel file containing the
      selected inventory data.
    data_to_capture:
    - Downloaded Excel file.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Open the downloaded Excel file and verify that the data is correctly formatted
      and contains the expected inventory information.
    expected_result: The Excel file opens correctly, and the data is presented in
      a readable and accurate format, matching the system's displayed inventory data.
    data_to_capture:
    - Screenshot of the opened Excel file.
    - Comparison of data between system and Excel file.
