test_cases:
- test_id: OQ-001
  test_name: 'Functional Test: SPC Chart Creation and Nelson Rules Application'
  test_category: functional
  gamp_category: 3
  objective: To verify that the SPC dashboard can correctly create X-bar/R and p-charts
    from a CSV file and accurately apply the vendor's standard Nelson rules to identify
    out-of-control conditions.
  prerequisites:
  - SPC Dashboard software is installed and accessible
  - Test CSV files with valid and invalid SPC data are available
  - User account with chart creation permissions is configured
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using the pre-configured user credentials.
    expected_result: User successfully authenticates and the main dashboard interface
      loads without errors.
    data_to_capture:
    - Login success/failure
    - Any system error messages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the chart creation module and select the option to create
      a new X-bar/R chart.
    expected_result: System displays the chart creation wizard or interface for configuring
      an X-bar/R chart.
    data_to_capture:
    - Interface responsiveness
    - Available configuration options
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the provided valid test CSV file containing 1000 data points for
      a continuous variable.
    expected_result: System accepts the file, parses the data, and displays a preview
      of the data columns.
    data_to_capture:
    - File upload success/failure
    - Data parsing accuracy
    - Preview display
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure the chart by selecting the appropriate data columns for subgroups
      and measurements.
    expected_result: System applies the configuration and generates the X-bar and
      R control charts.
    data_to_capture:
    - Chart generation time
    - Visual accuracy of control limits and center lines
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Enable all vendor-standard Nelson rules from the chart settings.
    expected_result: Nelson rules are activated, and the chart visually highlights
      any points that violate the rules.
    data_to_capture:
    - Successful activation of rules
    - Correct visual highlighting of out-of-control points
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Repeat steps 2-5 to create a p-chart using a CSV file with attribute (pass/fail)
      data.
    expected_result: System correctly generates a p-chart and applies Nelson rules
      to the attribute data.
    data_to_capture:
    - p-chart generation success
    - Accuracy of proportion calculations
    - Nelson rule application on attributes
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R and p-charts are generated accurately from the provided CSV data.
  - Control limits and center lines are calculated correctly according to statistical
    formulas.
  - Vendor-standard Nelson rules are applied and correctly flag expected out-of-control
    conditions.
  - The system does not generate charts from invalid CSV formats and provides appropriate
    error messages.
  regulatory_basis:
  - 21 CFR Part 211 - Current Good Manufacturing Practice for Finished Pharmaceuticals
  - 'FDA Guidance on Process Validation: General Principles and Practices'
  risk_level: medium
  data_integrity_requirements:
  - Data imported from CSV must remain unchanged and accurately represented in the
    charts.
  - Chart configurations must be saved as controlled records per URS-020-008.
  urs_requirements:
  - 'URS-020-001: Users shall create X-bar/R and p-charts from CSV inputs.'
  - 'URS-020-002: Users shall apply vendor''s standard Nelson rules.'
  related_tests:
  - OQ-002
  - OQ-003 (Future Data Integrity Test)
  estimated_duration_minutes: 45
  required_expertise:
  - SPC Chart Interpretation
  - Basic CSV Data Structure
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: 'Performance Test: Data Loading and Chart Rendering Speed'
  test_category: performance
  gamp_category: 3
  objective: To verify that the SPC dashboard meets the performance requirements for
    loading large datasets and rendering charts after filter changes as specified
    in the URS.
  prerequisites:
  - SPC Dashboard software is installed on supported hardware
  - Large test CSV file with exactly 100,000 data points is available
  - Stopwatch or system timer tool is ready for use
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using the pre-configured user credentials.
    expected_result: User successfully authenticates and the main dashboard interface
      loads.
    data_to_capture:
    - Login time
    - Initial system responsiveness
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the data import module and initiate the upload of the 100,000
      point CSV file. Start the timer upon file selection.
    expected_result: System begins processing the file and displays a progress indicator.
    data_to_capture:
    - File selection time
    - Progress indicator appearance
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Stop the timer when the system confirms the data is fully loaded and ready
      for analysis.
    expected_result: Data load completes successfully, and the data is accessible
      for charting. The elapsed time is less than 5 seconds.
    data_to_capture:
    - Total data load time (seconds)
    - System confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Create a standard X-bar chart from the loaded 100,000 point dataset.
    expected_result: The chart is generated and fully rendered on the screen.
    data_to_capture:
    - Initial chart rendering time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Apply a data filter (e.g., filter by a specific date range that reduces
      the dataset by 50%). Start the timer upon applying the filter.
    expected_result: The system acknowledges the filter command and begins re-rendering
      the chart.
    data_to_capture:
    - Filter application success
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Stop the timer when the chart is completely re-rendered with the filtered
      data.
    expected_result: The chart updates to reflect the filtered dataset. The elapsed
      time is less than 2 seconds.
    data_to_capture:
    - Chart re-rendering time after filter (seconds)
    - Visual accuracy of the filtered chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 7
    action: Repeat the filter test (steps 5-6) two more times with different filter
      criteria to ensure consistent performance.
    expected_result: All subsequent filter applications and chart re-renders complete
      in less than 2 seconds.
    data_to_capture:
    - Consistency of rendering times across multiple trials
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system loads a CSV file containing 100,000 data points in less than 5 seconds.
  - The system re-renders a chart after applying a filter in less than 2 seconds.
  - Performance is consistent across multiple iterations of filtering.
  regulatory_basis:
  - General principle that computerized systems should perform reliably to support
    quality decisions.
  risk_level: low
  data_integrity_requirements:
  - Filtering operations must not corrupt or alter the underlying dataset.
  urs_requirements:
  - 'URS-020-010: Load 100k data points in < 5 seconds on supported hardware.'
  - 'URS-020-011: Render charts in < 2 seconds after filter changes.'
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - Performance Measurement Techniques
  - Basic Use of Timing Tools
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based View Access Verification
  test_category: security
  gamp_category: 3
  objective: Verify that the system properly enforces role-based access controls for
    different user roles and view permissions
  prerequisites:
  - System installed and configured
  - Test users with different roles created (Admin, QC Analyst, Viewer)
  - Sample datasets available for testing
  test_steps:
  - step_number: 1
    action: Log in as Admin user and verify access to all dashboard features and configuration
      options
    expected_result: Admin user has full access to all system features, configuration
      settings, and data views
    data_to_capture:
    - Screenshots of available features
    - List of accessible menu options
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as QC Analyst user and attempt to access configuration settings
      and data views
    expected_result: QC Analyst has access to create/view charts and data but limited
      configuration access
    data_to_capture:
    - Screenshots of available features
    - Error messages for restricted functions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as Viewer role and attempt to modify data or configurations
    expected_result: Viewer role has read-only access with no modification capabilities
    data_to_capture:
    - Screenshots showing read-only interface
    - Error messages for modification attempts
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Different user roles have appropriate access levels
  - Viewer role cannot modify data or configurations
  - Admin has full system access
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records; Electronic Signatures
  - Data integrity principles for access controls
  risk_level: medium
  data_integrity_requirements:
  - Access controls prevent unauthorized data modification
  - User roles enforce appropriate data viewing permissions
  urs_requirements:
  - 'URS-020-004: The dashboard shall allow role-based view access'
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Control Analyst
  - IT Security Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
