test_cases:
- test_id: OQ-001
  test_name: Verify Continuous Temperature Monitoring and Recording Intervals
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS continuously monitors temperature in GMP storage
    areas and records readings at intervals not exceeding 5 minutes.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are installed and calibrated in all GMP storage areas.
  - Access to EMS software and data logs is available.
  test_steps:
  - step_number: 1
    action: Observe the EMS software interface for a continuous period of at least
      10 minutes.
    expected_result: The EMS software displays real-time temperature readings for
      all monitored GMP storage areas without interruption.
    data_to_capture:
    - Screenshots of EMS interface showing continuous monitoring.
    - Timestamp of observation.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access the recorded data logs for the observed period.
    expected_result: Temperature readings are recorded for each sensor at intervals
      not exceeding 5 minutes.
    data_to_capture:
    - Exported data log showing timestamps and temperature values.
    - Analysis of time differences between consecutive readings.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS continuously displays temperature readings for all GMP storage areas.
  - All recorded temperature data points are within 5-minute intervals.
  regulatory_basis:
  - URS-EMS-001
  - URS-EMS-002
  risk_level: low
  data_integrity_requirements:
  - Data must be recorded accurately and without loss.
  - Timestamps must be precise.
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Temperature Range, Accuracy, and Alert Deviation
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS operates within the specified temperature range
    and accuracy, and generates alerts when temperature deviates from the setpoint.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are installed and calibrated in all GMP storage areas.
  - Access to EMS software and alarm configuration is available.
  - Calibrated reference thermometer for verification.
  test_steps:
  - step_number: 1
    action: Using a calibrated reference thermometer, measure the temperature in a
      GMP storage area and compare it to the EMS reading.
    expected_result: The EMS temperature reading is within ±0.5°C of the reference
      thermometer reading.
    data_to_capture:
    - Reference thermometer reading.
    - EMS temperature reading.
    - Timestamp of measurement.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Adjust the temperature in a GMP storage area to be 2°C above the setpoint.
    expected_result: The EMS generates an alert notification within 30 seconds.
    data_to_capture:
    - Timestamp of temperature adjustment.
    - Screenshot of alert notification in EMS.
    - Confirmation of alert received by site paging system (if applicable).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Adjust the temperature in a GMP storage area to be 2°C below the setpoint.
    expected_result: The EMS generates an alert notification within 30 seconds.
    data_to_capture:
    - Timestamp of temperature adjustment.
    - Screenshot of alert notification in EMS.
    - Confirmation of alert received by site paging system (if applicable).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Temperature readings from the EMS are accurate within ±0.5°C compared to a calibrated
    reference thermometer.
  - The system generates an alert within 30 seconds when temperature deviates ±2°C
    from the setpoint.
  regulatory_basis:
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  risk_level: medium
  data_integrity_requirements:
  - Temperature readings must be accurate and reliable.
  - Alerts must be generated promptly and reliably.
  urs_requirements:
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - Calibration Technician
  - System Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Vendor Software Unmodified and Data Storage Format
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS system utilizes vendor-supplied software without
    modification and that all data is stored in the vendor's standard database format.
  prerequisites:
  - EMS system is installed and operational.
  - Access to system configuration and database logs is available.
  test_steps:
  - step_number: 1
    action: Access the EMS system's software installation directory and configuration
      files.
    expected_result: No custom modifications or unauthorized changes are present in
      the vendor-supplied software files.
    data_to_capture:
    - Screenshots of software file directory and timestamps.
    - Confirmation of no unauthorized modifications.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Generate a sample temperature data log from the EMS system.
    expected_result: The generated data log is in the vendor's standard database format
      (e.g., CSV, SQL dump).
    data_to_capture:
    - Sample data log file.
    - Confirmation of data format.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS system's software is confirmed to be vendor-supplied and unmodified.
  - All recorded temperature data is stored in the vendor's standard database format.
  regulatory_basis:
  - URS-EMS-003
  - URS-EMS-006
  risk_level: low
  data_integrity_requirements:
  - Data must be stored in a format that ensures its integrity and is retrievable.
  urs_requirements:
  - URS-EMS-003
  - URS-EMS-006
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Alarm Notification and Response Time
  test_category: performance
  gamp_category: 3
  objective: To verify that the EMS system generates alerts when temperature deviates
    from setpoint within the specified time and that system response time for alarm
    conditions does not exceed 30 seconds.
  prerequisites:
  - EMS system is operational and configured with a setpoint and deviation tolerance.
  - Site paging system is integrated and functional.
  - Access to a controlled environment or a method to simulate temperature deviation
    is available.
  test_steps:
  - step_number: 1
    action: Set a temperature setpoint and a deviation of ±2°C within the EMS system.
    expected_result: The system accepts the setpoint and deviation parameters.
    data_to_capture:
    - Screenshot of setpoint and deviation configuration.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Induce a temperature deviation exceeding the ±2°C threshold in a monitored
      area.
    expected_result: An alarm is triggered by the EMS system.
    data_to_capture:
    - Timestamp of temperature deviation initiation.
    - Screenshots of alarm notification within the EMS system.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Measure the time from the temperature deviation exceeding the threshold
      to the alarm notification appearing on the EMS system interface and/or the paging
      system.
    expected_result: The system response time for the alarm condition is less than
      or equal to 30 seconds.
    data_to_capture:
    - Timestamp of alarm notification.
    - Calculated response time.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the alarm notification is received by the site paging system.
    expected_result: The alarm notification is successfully sent to and received by
      the site paging system.
    data_to_capture:
    - Confirmation of receipt on paging system (e.g., log entry, received message).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS system generates an alert when temperature deviates ±2°C from the setpoint.
  - The system response time for alarm conditions does not exceed 30 seconds.
  - Alarm notifications are successfully integrated with the site paging system.
  regulatory_basis:
  - URS-EMS-005
  - URS-EMS-011
  - URS-EMS-015
  risk_level: medium
  data_integrity_requirements:
  - Accurate and timely alarm generation is critical for product protection.
  urs_requirements:
  - URS-EMS-005
  - URS-EMS-011
  - URS-EMS-015
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - Validation Engineer
  - Environmental Monitoring Specialist
  - IT Support (for paging system integration)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Audit Trail and Electronic Signature Functionality
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system maintains a comprehensive audit trail and
    supports electronic signatures as per 21 CFR Part 11.
  prerequisites:
  - EMS system is installed and configured.
  - User accounts with appropriate permissions are created.
  - A simulated temperature deviation event has occurred.
  test_steps:
  - step_number: 1
    action: Access the audit trail log within the EMS software.
    expected_result: The audit trail log is accessible and displays entries for user
      logins, system configuration changes, and data modifications.
    data_to_capture:
    - Screenshot of the audit trail access.
    - Sample audit trail entries.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Review audit trail entries for the simulated temperature deviation event,
      noting user, date, time, and action taken.
    expected_result: All actions related to the simulated event are accurately recorded
      in the audit trail, including who performed the action, when, and what was changed.
    data_to_capture:
    - Detailed audit trail entries for the simulated event.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Initiate an action requiring an electronic signature (e.g., acknowledging
      an alarm or approving a report).
    expected_result: The system prompts for electronic signature credentials (username
      and password) before completing the action.
    data_to_capture:
    - Screenshot of the electronic signature prompt.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Enter valid electronic signature credentials and complete the action.
    expected_result: The action is successfully completed, and the electronic signature
      is recorded in the audit trail associated with the action.
    data_to_capture:
    - Screenshot of successful action completion.
    - Audit trail entry showing the electronic signature.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The audit trail accurately records all significant system events and user actions.
  - Electronic signatures are captured with user ID, date, time, and the meaning of
    the signature.
  - The system enforces the use of electronic signatures for required actions.
  regulatory_basis:
  - 21 CFR Part 11.10(e) - Audit trails
  - 21 CFR Part 11.200 - Electronic signatures
  risk_level: high
  data_integrity_requirements:
  - Audit trail must be secure and unalterable.
  - Electronic signatures must be unique and attributable to an individual.
  urs_requirements:
  - URS-EMS-008
  - URS-EMS-009
  related_tests:
  - OQ-001
  - OQ-002
  - OQ-003
  - OQ-004
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify Data Retention and Archival Functionality
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system can retain data for the required 7 years
    and utilize the vendor's archival feature.
  prerequisites:
  - EMS system is installed and configured.
  - Sufficient historical data exists to test archival.
  - Archival storage location is configured and accessible.
  test_steps:
  - step_number: 1
    action: Access the system's data retention settings.
    expected_result: The system displays the configured data retention period, which
      should be set to at least 7 years.
    data_to_capture:
    - Screenshot of data retention settings.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the archival process for data older than a specified period (e.g.,
      1 year, to simulate older data).
    expected_result: The system successfully archives the selected historical data,
      and the original data is no longer readily accessible in the primary database.
    data_to_capture:
    - Screenshot of archival initiation.
    - Confirmation of archival completion.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to retrieve archived data.
    expected_result: The system can retrieve the archived data from the designated
      archival storage location.
    data_to_capture:
    - Screenshot of data retrieval process.
    - Sample of retrieved archived data.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the archived data remains intact and uncorrupted.
    expected_result: The retrieved archived data matches the original data in terms
      of content and format.
    data_to_capture:
    - Comparison of original and archived data.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system is configured to retain data for a minimum of 7 years.
  - The vendor's archival feature successfully moves historical data to a separate
    storage location.
  - Archived data can be retrieved and is verified to be intact and uncorrupted.
  regulatory_basis:
  - 21 CFR Part 11.10(b) - Data retention
  risk_level: high
  data_integrity_requirements:
  - Data must be retained for the specified period.
  - Archived data must be secure, accessible, and unalterable.
  urs_requirements:
  - URS-EMS-010
  related_tests:
  - OQ-001
  - OQ-002
  - OQ-003
  - OQ-004
  - OQ-005
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Analyst
  - IT Support (for storage)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify Standard Reports for Batch Release and Data Storage Capacity
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the system utilizes vendor-supplied standard reports for
    batch release and has sufficient data storage capacity for 10 years of monitoring.
  prerequisites:
  - Environmental Monitoring System (EMS) is installed and configured.
  - Access to system reports and configuration settings is available.
  test_steps:
  - step_number: 1
    action: Access the reporting module of the EMS and generate a standard report
      for a defined period (e.g., one day).
    expected_result: A standard report, as provided by the vendor, is successfully
      generated.
    data_to_capture:
    - Generated report file
    - Report generation timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Review the generated report to confirm it is a standard vendor report
      and suitable for batch release purposes.
    expected_result: The generated report matches the expected format and content
      of vendor-supplied standard reports for batch release.
    data_to_capture:
    - Confirmation of report suitability for batch release
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the system's configuration or administration settings to view the
      current data storage capacity and estimated remaining capacity.
    expected_result: The system displays the current data storage utilization and
      an estimate of remaining capacity.
    data_to_capture:
    - Current storage utilization percentage
    - Estimated remaining storage capacity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Calculate the estimated time to fill the storage based on current data
      generation rates and compare it to the requirement of 10 years.
    expected_result: The estimated time to fill storage is greater than or equal to
      10 years.
    data_to_capture:
    - Calculated storage fill time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system generates standard vendor reports that are confirmed to be suitable
    for batch release.
  - The system's data storage capacity is confirmed to support a minimum of 10 years
    of continuous monitoring.
  regulatory_basis:
  - 'URS-EMS-007: Standard reports provided by vendor shall be used for batch release.'
  - 'URS-EMS-012: Data storage capacity shall support minimum 10 years of continuous
    monitoring.'
  risk_level: low
  data_integrity_requirements:
  - Reports generated must be accurate and complete.
  - Storage capacity must be sufficient to prevent data loss.
  urs_requirements:
  - URS-EMS-007
  - URS-EMS-012
  related_tests:
  - OQ-003
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Facility Management System Integration and Alarm Notification
    Integration
  test_category: integration
  gamp_category: 3
  objective: To verify that the EMS can interface with the existing facility management
    system and integrate alarm notifications with the site paging system.
  prerequisites:
  - Environmental Monitoring System (EMS) is installed and configured.
  - Facility Management System (FMS) is accessible and configured for integration.
  - Site paging system is accessible and configured for integration.
  - Network connectivity between systems is established.
  test_steps:
  - step_number: 1
    action: Configure the EMS to send temperature and humidity data to the FMS using
      the specified standard protocols.
    expected_result: The EMS is successfully configured to interface with the FMS.
    data_to_capture:
    - EMS configuration settings for FMS integration
    - Timestamp of configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Induce a simulated temperature deviation that triggers an alarm in the
      EMS.
    expected_result: An alarm is generated within the EMS.
    data_to_capture:
    - Alarm event log entry
    - Timestamp of alarm generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the alarm notification is successfully sent to the site paging
      system via the vendor API.
    expected_result: An alert is received on the designated paging system within the
      specified response time.
    data_to_capture:
    - Paging system alert log
    - Timestamp of alert reception
    - Content of the alert message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the data transmitted to the FMS accurately reflects the monitored
      environmental conditions.
    expected_result: The data displayed in the FMS for the monitored areas matches
      the data recorded in the EMS.
    data_to_capture:
    - FMS data logs
    - EMS data logs for comparison
    - Timestamp of data comparison
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS successfully interfaces with the facility management system via standard
    protocols.
  - Alarm notifications from the EMS are successfully integrated with and sent to
    the site paging system using the vendor API.
  - Data transmitted to the FMS accurately reflects the monitored environmental conditions.
  regulatory_basis:
  - 'URS-EMS-014: System shall interface with existing facility management system
    via standard protocols.'
  - 'URS-EMS-015: Alarm notifications shall integrate with site paging system using
    vendor API.'
  risk_level: medium
  data_integrity_requirements:
  - Data transmitted to FMS must be accurate and complete.
  - Alarm notifications must be timely and reliable.
  urs_requirements:
  - URS-EMS-014
  - URS-EMS-015
  related_tests:
  - OQ-004
  estimated_duration_minutes: 60
  required_expertise:
  - System Integrator
  - Network Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify System Availability and Planned Maintenance Exclusion
  test_category: performance
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System meets the specified
    availability of 99.5% excluding planned maintenance periods.
  prerequisites:
  - Environmental Monitoring System is installed and operational.
  - Access to system logs and uptime records.
  - Schedule of planned maintenance activities.
  test_steps:
  - step_number: 1
    action: Monitor system uptime for a defined period (e.g., 30 days) and record
      all periods of system unavailability.
    expected_result: System logs accurately record all downtime events.
    data_to_capture:
    - Date and time of each downtime event.
    - Duration of each downtime event.
    - Reason for downtime (if available).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Compare recorded downtime with the schedule of planned maintenance activities.
    expected_result: All recorded downtime events are either planned maintenance or
      fall within acceptable unplanned downtime limits.
    data_to_capture:
    - List of planned maintenance dates and durations.
    - Calculated total unplanned downtime.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Calculate the system availability percentage based on total monitoring
      time minus unplanned downtime.
    expected_result: Calculated system availability is >= 99.5%.
    data_to_capture:
    - Total monitoring time in hours.
    - Total unplanned downtime in hours.
    - Calculated system availability percentage.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The calculated system availability is 99.5% or higher over the monitoring period,
    excluding documented planned maintenance.
  regulatory_basis:
  - 'URS-EMS-013: System availability shall be 99.5% excluding planned maintenance.'
  risk_level: medium
  data_integrity_requirements:
  - System logs must be accurate and tamper-evident.
  urs_requirements:
  - URS-EMS-013
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 120
  required_expertise:
  - System Administrator
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Verify Data Storage Capacity for 10 Years
  test_category: performance
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System's data storage capacity
    is sufficient to support a minimum of 10 years of continuous monitoring.
  prerequisites:
  - Environmental Monitoring System is installed and operational.
  - Access to system configuration and storage management tools.
  - Knowledge of expected data generation rate per sensor.
  test_steps:
  - step_number: 1
    action: Determine the current data storage utilization and the rate of data generation
      per sensor per day.
    expected_result: Accurate figures for current storage usage and data generation
      rate are obtained.
    data_to_capture:
    - Current storage used (e.g., GB).
    - Data generation rate per sensor per day (e.g., MB/day).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Calculate the total storage required for 10 years of continuous monitoring,
      considering the number of sensors and the data generation rate.
    expected_result: A projected total storage requirement for 10 years is calculated.
    data_to_capture:
    - Number of active sensors.
    - Projected storage for 10 years (e.g., TB).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the installed storage capacity of the system meets or exceeds
      the calculated 10-year requirement.
