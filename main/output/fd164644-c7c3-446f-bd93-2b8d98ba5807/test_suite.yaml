test_cases:
- test_id: OQ-001
  test_name: Verify Continuous Temperature Monitoring and Recording Intervals
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS continuously monitors temperature in GMP storage
    areas and records readings at intervals not exceeding 5 minutes.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are calibrated and operational in all GMP storage areas.
  - Access to EMS software and data logs is available.
  test_steps:
  - step_number: 1
    action: Observe the EMS dashboard and data logs for a continuous period of at
      least 15 minutes.
    expected_result: Temperature readings for all GMP storage areas are displayed
      and recorded continuously.
    data_to_capture:
    - Timestamp of each recorded temperature reading.
    - Temperature value for each sensor.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Analyze the captured data logs to determine the time interval between
      consecutive temperature readings for each sensor.
    expected_result: The time interval between consecutive temperature readings for
      each sensor does not exceed 5 minutes.
    data_to_capture:
    - Calculated time intervals between readings for each sensor.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All GMP storage areas show continuous temperature monitoring.
  - Temperature readings are recorded at intervals of 5 minutes or less.
  regulatory_basis:
  - URS-EMS-001
  - URS-EMS-002
  risk_level: low
  data_integrity_requirements:
  - Data must be recorded accurately and without loss.
  - Timestamps must be precise and reflect actual recording times.
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - Environmental Monitoring System Administrator
  - Quality Assurance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Temperature Range, Accuracy, and Alarm Deviation
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS operates within the specified temperature range
    and accuracy, and generates alerts when temperature deviates from the setpoint.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are calibrated and operational.
  - Access to EMS software and alarm configuration is available.
  - A calibrated reference thermometer is available for comparison.
  test_steps:
  - step_number: 1
    action: Set a target temperature within the EMS for a specific storage area (e.g.,
      20°C).
    expected_result: The EMS accepts the setpoint and displays it correctly.
    data_to_capture:
    - Configured setpoint value.
    - Timestamp of setpoint configuration.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Using the calibrated reference thermometer, verify the actual temperature
      in the storage area. Compare this with the EMS reading.
    expected_result: The EMS temperature reading is within ±0.5°C of the reference
      thermometer reading.
    data_to_capture:
    - Reference thermometer reading.
    - EMS temperature reading.
    - Timestamp of measurement.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Gradually increase or decrease the temperature in the storage area to
      simulate a deviation from the setpoint (e.g., to 22°C if setpoint is 20°C).
    expected_result: The EMS generates an alert notification within 30 seconds of
      the temperature deviating by ±2°C from the setpoint.
    data_to_capture:
    - Actual temperature reading at alarm trigger.
    - Timestamp of alarm generation.
    - Alarm notification details.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Return the temperature to within the acceptable range and verify that
      the alarm condition is cleared in the EMS.
    expected_result: The alarm condition is cleared in the EMS, and the system returns
      to normal monitoring status.
    data_to_capture:
    - Timestamp of alarm clearance.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Temperature readings are accurate within ±0.5°C.
  - Alerts are generated when temperature deviates ±2°C from the setpoint.
  - Alarm notifications are received within 30 seconds.
  - Alarm conditions are cleared appropriately.
  regulatory_basis:
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  risk_level: low
  data_integrity_requirements:
  - Temperature readings must be accurate and reliable.
  - Alarm triggers must be timely and correctly recorded.
  urs_requirements:
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - Environmental Monitoring System Administrator
  - Quality Assurance
  - Calibration Technician
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Vendor Software Unmodified and Data Storage Format
  test_category: functional
  gamp_category: 3
  objective: To verify that the vendor-supplied software is used without modification
    and that all data is stored in the vendor's standard database format.
  prerequisites:
  - Environmental Monitoring System (EMS) is installed and configured.
  - Access to system logs and configuration files is available.
  - Access to the EMS database is available.
  test_steps:
  - step_number: 1
    action: Review system installation and configuration documentation to confirm
      no modifications were made to the vendor-supplied software.
    expected_result: Documentation confirms that the vendor-supplied software has
      not been modified.
    data_to_capture:
    - System configuration documentation
    - Software version information
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Generate a sample data log from the EMS for a defined period.
    expected_result: A data log is successfully generated.
    data_to_capture:
    - Sample data log file
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Examine the generated data log file and its underlying database structure
      to confirm it adheres to the vendor's standard database format.
    expected_result: The data log and database structure match the vendor's specified
      format.
    data_to_capture:
    - Database schema documentation
    - Sample data log content analysis
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The vendor-supplied software is confirmed to be unmodified.
  - The EMS data is stored in the vendor's standard database format.
  regulatory_basis:
  - URS-EMS-003
  - URS-EMS-006
  risk_level: low
  data_integrity_requirements:
  - Data must be stored in a format that ensures its integrity and is retrievable.
  urs_requirements:
  - URS-EMS-003
  - URS-EMS-006
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - Database Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Alarm Notification Integration and Response Time
  test_category: integration
  gamp_category: 3
  objective: To verify that alarm notifications integrate with the site paging system
    using the vendor API and that system response time for alarm conditions does not
    exceed 30 seconds.
  prerequisites:
  - EMS is operational and configured with alarm setpoints.
  - Site paging system is operational and configured.
  - Vendor API documentation for alarm notifications is available.
  - Access to the paging system logs and EMS alarm logs.
  test_steps:
  - step_number: 1
    action: Induce a temperature deviation that triggers an alarm condition (e.g.,
      by temporarily placing a sensor in a warmer environment).
    expected_result: An alarm is triggered within the EMS.
    data_to_capture:
    - Alarm trigger time
    - Temperature reading at alarm trigger
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Measure the time from alarm trigger to the receipt of a notification on
      the site paging system.
    expected_result: Notification is received on the paging system within 30 seconds
      of the alarm trigger.
    data_to_capture:
    - Alarm notification receipt time
    - Time difference between trigger and receipt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the content and format of the alarm notification received on the
      paging system against expected parameters.
    expected_result: The alarm notification contains accurate and relevant information
      as per vendor API specifications.
    data_to_capture:
    - Alarm notification content
    - Screenshot of notification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Review EMS alarm logs to confirm the timestamp of the alarm event and
      the successful transmission to the paging system.
    expected_result: EMS logs accurately reflect the alarm event and its integration
      with the paging system.
    data_to_capture:
    - EMS alarm log entries
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alarm notifications are successfully sent to the site paging system via the vendor
    API.
  - System response time for alarm conditions does not exceed 30 seconds.
  - Alarm notifications contain accurate and relevant information.
  regulatory_basis:
  - URS-EMS-005
  - URS-EMS-011
  - URS-EMS-015
  risk_level: medium
  data_integrity_requirements:
  - Alarm events must be accurately logged and transmitted to ensure timely response.
  urs_requirements:
  - URS-EMS-005
  - URS-EMS-011
  - URS-EMS-015
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - Integration Specialist
  - Network Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Audit Trail and Electronic Signature Functionality
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system maintains a comprehensive audit trail and
    supports electronic signatures as per 21 CFR Part 11.
  prerequisites:
  - EMS system is installed and configured.
  - User accounts with appropriate permissions are created.
  - A test temperature deviation event has been triggered.
  test_steps:
  - step_number: 1
    action: Access the audit trail log within the EMS software.
    expected_result: The audit trail log displays a detailed record of all system
      events, including user logins, configuration changes, data modifications (if
      applicable), and alarm events.
    data_to_capture:
    - Audit trail log entries
    - Timestamps of events
    - User performing the action
    - Description of the action
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Trigger an action requiring an electronic signature (e.g., acknowledging
      an alarm, approving a report).
    expected_result: The system prompts the user to enter their credentials for an
      electronic signature.
    data_to_capture:
    - Prompt for electronic signature
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Enter valid electronic signature credentials and confirm.
    expected_result: The action is successfully completed and recorded in the audit
      trail with the electronic signature details.
    data_to_capture:
    - Electronic signature details
    - Confirmation of successful action
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to perform an action requiring an electronic signature with invalid
      credentials.
    expected_result: The system rejects the invalid credentials and prevents the action
      from being completed.
    data_to_capture:
    - Error message for invalid credentials
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All system events are logged in the audit trail with sufficient detail.
  - Electronic signatures are captured accurately and linked to the corresponding
    actions.
  - The system enforces the use of valid electronic signatures.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: high
  data_integrity_requirements:
  - Audit trail must be complete, accurate, and secure.
  - Electronic signatures must be unique, attributable, and verifiable.
  urs_requirements:
  - URS-EMS-008
  - URS-EMS-009
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify Data Retention and Archival Functionality
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system can retain data for the required period
    and utilize the vendor's archival feature.
  prerequisites:
  - EMS system is installed and configured.
  - Sufficient historical data exists to test archival.
  - Archival destination is configured and accessible.
  test_steps:
  - step_number: 1
    action: Review the system's data retention configuration.
    expected_result: The system is configured to retain data for at least 7 years.
    data_to_capture:
    - Data retention period setting
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the vendor's archival process for a defined period of historical
      data.
    expected_result: The archival process completes successfully without errors, and
      the data is moved to the designated archival location.
    data_to_capture:
    - Archival process logs
    - Confirmation of successful archival
    - Location of archived data
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to access data that has been archived.
    expected_result: The system provides a mechanism to retrieve and view archived
      data, or indicates that the data is archived and accessible via the archival
      tool.
    data_to_capture:
    - Confirmation of archived data accessibility
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the original data is no longer present in the active database
      after archival (if applicable based on vendor functionality).
    expected_result: The active database reflects the removal of the archived data,
      or the system clearly distinguishes between active and archived data.
    data_to_capture:
    - Status of data in active database
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data retention settings meet the 7-year requirement.
  - Archival process is functional and reliable.
  - Archived data is retrievable and verifiable.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: high
  data_integrity_requirements:
  - Data must be retained for the specified period.
  - Archived data must be secure, accurate, and retrievable.
  urs_requirements:
  - URS-EMS-010
  related_tests:
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - Validation Engineer
  - IT Support
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
