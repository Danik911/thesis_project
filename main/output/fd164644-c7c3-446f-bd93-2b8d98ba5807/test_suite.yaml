- test_id: OQ-008
  test_name: Verify Data Storage Capacity for 10 Years
  test_category: performance
  gamp_category: 3
  objective: To verify that the system's data storage capacity is sufficient to support
    a minimum of 10 years of continuous monitoring data.
  prerequisites:
  - EMS system is installed and configured.
  - System has been running and collecting data for a significant period (e.g., several
    months or a year) to allow for capacity estimation.
  test_steps:
  - step_number: 1
    action: Determine the current data storage utilization of the EMS system.
    expected_result: The current storage utilization (e.g., GB used, percentage of
      capacity) is identified.
    data_to_capture:
    - Current storage utilization metrics
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Calculate the average daily/monthly data generation rate based on current
      monitoring intervals and data points.
    expected_result: An average data generation rate is calculated (e.g., MB/day).
    data_to_capture:
    - Average data generation rate
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Project the total data storage required for 10 years based on the calculated
      data generation rate.
    expected_result: The projected storage requirement for 10 years is calculated.
    data_to_capture:
    - Projected 10-year storage requirement
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Compare the projected storage requirement with the system's available
      storage capacity.
    expected_result: The available storage capacity is confirmed to be greater than
      or equal to the projected 10-year requirement.
    data_to_capture:
    - Confirmation of sufficient storage capacity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system's data storage capacity is sufficient to store a minimum of 10 years
    of continuous monitoring data.
  - Calculations demonstrate that the projected data volume for 10 years does not
    exceed available storage.
  regulatory_basis:
  - 'URS-EMS-012: Data storage capacity shall support minimum 10 years of continuous
    monitoring.'
  risk_level: medium
  data_integrity_requirements:
  - Data is not lost due to storage limitations.
  - System continues to log data without interruption.
  urs_requirements:
  - URS-EMS-012
  related_tests:
  - OQ-006
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - IT Infrastructure Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify System Availability and Planned Maintenance Exclusion
  test_category: performance
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System meets the required
    availability of 99.5% excluding planned maintenance periods.
  prerequisites:
  - Environmental Monitoring System is installed and operational.
  - Access to system logs and uptime reports.
  - Schedule of planned maintenance activities.
  test_steps:
  - step_number: 1
    action: Monitor system uptime over a defined period (e.g., 30 days).
    expected_result: The system logs indicate continuous operation with minimal unplanned
      downtime.
    data_to_capture:
    - System uptime logs
    - Dates and durations of unplanned downtime
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Compare total operational time against total time in the monitoring period,
      excluding documented planned maintenance.
    expected_result: The calculated availability percentage is >= 99.5%.
    data_to_capture:
    - Total monitoring period duration
    - Total planned maintenance duration
    - Total unplanned downtime duration
    - Calculated availability percentage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system availability is confirmed to be 99.5% or higher, calculated over a
    representative period, excluding all documented planned maintenance.
  regulatory_basis:
  - URS-EMS-013
  risk_level: medium
  data_integrity_requirements:
  - Accurate logging of system uptime and downtime events.
  urs_requirements:
  - URS-EMS-013
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Verify Facility Management System Integration via Standard Protocols
  test_category: integration
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System successfully interfaces
    with the existing facility management system using standard protocols.
  prerequisites:
  - Environmental Monitoring System is installed and operational.
  - Facility Management System is installed and operational.
  - Network connectivity between both systems.
  - Documentation of the standard protocols used for integration.
  test_steps:
  - step_number: 1
    action: Configure the EMS to send temperature and humidity data to the Facility
      Management System using the specified standard protocols.
    expected_result: The EMS successfully establishes a connection and begins transmitting
      data.
    data_to_capture:
    - Configuration settings for integration
    - Connection status logs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that the Facility Management System receives and correctly displays
      the temperature and humidity data from the EMS.
    expected_result: The data received by the Facility Management System matches the
      data being monitored by the EMS, within acceptable accuracy tolerances.
    data_to_capture:
    - Sample data points from EMS
    - Corresponding data points in FMS
    - Comparison of data values
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Induce a minor temperature deviation in a monitored area and verify that
      the updated reading is reflected in the Facility Management System.
    expected_result: The Facility Management System updates with the new temperature
      reading within a reasonable timeframe.
    data_to_capture:
    - Induced temperature change
    - Timestamp of change
    - Timestamp of update in FMS
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS successfully integrates with the Facility Management System, transmitting
    and receiving data accurately via standard protocols.
  - Data consistency is maintained between the EMS and the Facility Management System.
  regulatory_basis:
  - URS-EMS-014
  risk_level: medium
  data_integrity_requirements:
  - Data transmitted between systems must be accurate and complete.
  - Verification of data integrity during transmission.
  urs_requirements:
  - URS-EMS-014
  related_tests: []
  estimated_duration_minutes: 90
  required_expertise:
  - Integration Specialist
  - Network Engineer
  - QA Engineer
  reviewed_by: QA Manager
