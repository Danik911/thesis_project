test_cases:
- test_id: OQ-001
  test_name: Verify Continuous Temperature Monitoring and Data Recording Intervals
  test_category: functional
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System continuously monitors
    temperature in GMP storage areas and records data at intervals not exceeding 5
    minutes.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are installed and calibrated in all GMP storage areas.
  - System is powered on and operational.
  test_steps:
  - step_number: 1
    action: Observe the EMS interface for a designated GMP storage area.
    expected_result: The system displays real-time temperature readings for the selected
      storage area.
    data_to_capture:
    - Screenshot of the EMS interface showing real-time temperature.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the recorded data log for the same storage area over a period
      of at least 10 minutes.
    expected_result: Temperature readings are logged at intervals of 5 minutes or
      less.
    data_to_capture:
    - Exported data log showing timestamps and temperature readings.
    - Analysis of logged data to confirm interval compliance.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS continuously displays real-time temperature readings.
  - All recorded temperature data points are within 5 minutes of each other.
  regulatory_basis:
  - URS-EMS-001
  - URS-EMS-002
  risk_level: low
  data_integrity_requirements:
  - Data is recorded accurately and without loss.
  - Timestamps are accurate and sequential.
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Temperature Range, Accuracy, and Alarm Deviation
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS operates within the specified temperature range
    and accuracy, and generates alerts when temperature deviates from the setpoint.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are installed and calibrated in all GMP storage areas.
  - System is powered on and operational.
  - A specific GMP storage area is selected for testing.
  - A setpoint for temperature monitoring is defined for the selected area.
  test_steps:
  - step_number: 1
    action: Using a calibrated external temperature source, simulate a temperature
      reading within the specified range (-80°C to +50°C) at the sensor location.
    expected_result: The EMS displays a temperature reading that is within ±0.5°C
      of the simulated temperature.
    data_to_capture:
    - Simulated temperature value.
    - EMS displayed temperature value.
    - Calibration certificate of the external temperature source.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Adjust the simulated temperature to be 2°C above the defined setpoint
      for the selected storage area.
    expected_result: The EMS generates an alert notification within 30 seconds.
    data_to_capture:
    - Setpoint value.
    - Simulated temperature value.
    - Timestamp of alert generation.
    - Screenshot of the alert notification.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Adjust the simulated temperature to be 2°C below the defined setpoint
      for the selected storage area.
    expected_result: The EMS generates an alert notification within 30 seconds.
    data_to_capture:
    - Setpoint value.
    - Simulated temperature value.
    - Timestamp of alert generation.
    - Screenshot of the alert notification.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS accurately displays temperatures within ±0.5°C of the simulated value.
  - The EMS generates an alarm within 30 seconds when the temperature deviates ±2°C
    from the setpoint.
  - The system operates within the specified temperature range of -80°C to +50°C.
  regulatory_basis:
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  risk_level: low
  data_integrity_requirements:
  - Temperature readings are accurate and reliable.
  - Alarm triggers are correctly recorded with timestamps.
  urs_requirements:
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Analyst
  - HVAC/Environmental Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Vendor Software Unmodified and Data Storage Format
  test_category: functional
  gamp_category: 3
  objective: To verify that the vendor-supplied software is used without modification
    and that data is stored in the vendor's standard database format.
  prerequisites:
  - EMS system is installed and operational.
  - Access to system configuration and database logs.
  test_steps:
  - step_number: 1
    action: Review system installation files and configuration settings to confirm
      no custom modifications have been made to the vendor-supplied software.
    expected_result: System installation files and configuration settings show no
      evidence of custom modifications to the vendor-supplied software.
    data_to_capture:
    - System configuration screenshots
    - Installation log files
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access the EMS database and examine the structure and format of stored
      temperature and humidity data.
    expected_result: Stored data is in the vendor's standard database format, as documented
      by the vendor.
    data_to_capture:
    - Database schema screenshots
    - Sample data records
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The vendor-supplied software has not been modified.
  - All recorded data is stored in the vendor's standard database format.
  regulatory_basis:
  - URS-EMS-003
  - URS-EMS-006
  risk_level: low
  data_integrity_requirements:
  - Data must be stored in a verifiable and standard format.
  urs_requirements:
  - URS-EMS-003
  - URS-EMS-006
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - Database Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Alarm Generation and Notification Integration
  test_category: integration
  gamp_category: 3
  objective: To verify that the system generates alerts when temperature deviates
    from setpoints and that these notifications integrate with the site paging system.
  prerequisites:
  - EMS system is operational and configured with setpoints.
  - Site paging system is operational and configured for integration.
  - Access to system logs and paging system logs.
  test_steps:
  - step_number: 1
    action: Manually adjust a temperature sensor in a monitored area to a value that
      is 2°C above or below the defined setpoint.
    expected_result: The EMS system generates an audible and visual alarm within 30
      seconds.
    data_to_capture:
    - Timestamp of temperature adjustment
    - Alarm activation timestamp
    - Screenshots of alarm notification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that an alert notification is sent to the site paging system via
      the vendor API.
    expected_result: A notification is received by the designated personnel via the
      site paging system.
    data_to_capture:
    - Paging system notification log
    - Confirmation from personnel receiving the page
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Return the temperature sensor to within the acceptable range and verify
      that the alarm condition clears and any associated notifications are updated.
    expected_result: The alarm condition clears, and the system status is updated
      accordingly.
    data_to_capture:
    - Timestamp of temperature correction
    - System status update timestamp
    - Screenshots of cleared alarm
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alarms are generated within 30 seconds of temperature deviation from setpoint.
  - Alarm notifications are successfully integrated with the site paging system.
  - Alarm conditions are cleared appropriately when the temperature returns to normal.
  regulatory_basis:
  - URS-EMS-005
  - URS-EMS-015
  - URS-EMS-011
  risk_level: medium
  data_integrity_requirements:
  - Alarm events and their resolution must be accurately logged.
  urs_requirements:
  - URS-EMS-005
  - URS-EMS-011
  - URS-EMS-015
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - EMS Operator
  - IT Support (for paging system integration)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Standard Report Usage for Batch Release and Data Retention
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that standard vendor reports are utilized for batch release
    and that data is retained for the required 7 years.
  prerequisites:
  - EMS system is operational and collecting data.
  - Access to vendor's standard reporting module.
  - Access to system's archival feature.
  test_steps:
  - step_number: 1
    action: Generate a standard temperature report for a specific historical period
      using the vendor's provided reporting tool.
    expected_result: The system generates a report containing temperature data for
      the specified period in the vendor's standard format.
    data_to_capture:
    - Generated report file
    - Report generation timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that the generated report contains all required data points and
      is suitable for batch release decisions.
    expected_result: The report accurately reflects the monitored environmental conditions
      and meets the criteria for batch release documentation.
    data_to_capture:
    - Confirmation of report suitability for batch release
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Initiate the archival process for historical data using the vendor's archival
      feature, ensuring data from at least 7 years prior is included.
    expected_result: The system successfully archives historical data, and the archival
      process is logged.
    data_to_capture:
    - Archival process log
    - Confirmation of data archival completion
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to retrieve archived data from the 7-year-old period to confirm
      its accessibility and integrity.
    expected_result: Archived data from the 7-year-old period is successfully retrieved
      and is consistent with the original recorded data.
    data_to_capture:
    - Retrieved archived data sample
    - Verification of data integrity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Standard vendor reports are successfully generated and are suitable for batch
    release.
  - Data is successfully archived for a minimum of 7 years.
  - Archived data is retrievable and maintains its integrity.
  regulatory_basis:
  - URS-EMS-007
  - URS-EMS-010
  - 21 CFR Part 11
  risk_level: low
  data_integrity_requirements:
  - Data must be accurate and complete in reports.
  - Archived data must be secure and retrievable.
  urs_requirements:
  - URS-EMS-007
  - URS-EMS-010
  related_tests:
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify System Availability and Response Time for Alarms
  test_category: performance
  gamp_category: 3
  objective: To verify that the EMS system meets the specified availability requirement
    and that alarm conditions are responded to within the defined time limit.
  prerequisites:
  - EMS system is operational and actively monitoring.
  - Access to system logs and monitoring tools.
  - Ability to simulate alarm conditions.
  test_steps:
  - step_number: 1
    action: Monitor system uptime over a defined period (e.g., 24 hours) and calculate
      the percentage of availability, excluding planned maintenance windows.
    expected_result: The system availability is calculated to be 99.5% or higher.
    data_to_capture:
    - System uptime logs
    - Calculated availability percentage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Induce a temperature deviation that triggers an alarm condition (e.g.,
      by temporarily altering a sensor reading or environmental condition).
    expected_result: An alarm is triggered by the system.
    data_to_capture:
    - Alarm trigger timestamp
    - Nature of the simulated alarm condition
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Measure the time from the alarm trigger to the system's notification or
      response (e.g., alert generation, logging of alarm).
    expected_result: The system response time for the alarm condition does not exceed
      30 seconds.
    data_to_capture:
    - Alarm response timestamp
    - Measured response time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Repeat steps 2 and 3 for different alarm scenarios if applicable (e.g.,
      high and low temperature alarms).
    expected_result: All tested alarm conditions are responded to within 30 seconds.
    data_to_capture:
    - Record of all tested alarm scenarios and their response times
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System availability is 99.5% or greater, excluding planned maintenance.
  - System response time for alarm conditions does not exceed 30 seconds.
  regulatory_basis:
  - URS-EMS-011
  - URS-EMS-013
  risk_level: medium
  data_integrity_requirements:
  - System must be available to record data and trigger alarms.
  - Timely alarm notification is critical for preventing product loss.
  urs_requirements:
  - URS-EMS-011
  - URS-EMS-013
  related_tests:
  - OQ-002
  - OQ-004
  estimated_duration_minutes: 90
  required_expertise:
  - System Administrator
  - Environmental Monitoring Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify 21 CFR Part 11 Audit Trail and Electronic Signatures
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system maintains a compliant audit trail and utilizes
    electronic signatures as per 21 CFR Part 11.
  prerequisites:
  - EMS system is installed and configured.
  - User accounts with appropriate permissions are created.
  - A simulated event requiring an electronic signature is possible (e.g., data review,
    system configuration change).
  test_steps:
  - step_number: 1
    action: Perform a configuration change or data review that requires an electronic
      signature within the EMS.
    expected_result: The system prompts for and captures a valid electronic signature,
      including user ID, date, time, and reason for the signature.
    data_to_capture:
    - Screenshot of the electronic signature prompt.
    - Audit trail entry showing the signature event, user, date, time, and reason.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access and review the audit trail for the performed action.
    expected_result: The audit trail accurately records all relevant details of the
      action, including who performed it, when, and any associated electronic signatures.
    data_to_capture:
    - Exported audit trail log for the specific event.
    - Confirmation that all required fields for an audit trail entry are present.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All actions requiring an electronic signature are logged with a valid electronic
    signature.
  - The audit trail captures all required elements for 21 CFR Part 11 compliance (user,
    date, time, action, reason for signature).
  - The electronic signature functionality uses the vendor's built-in capabilities.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: high
  data_integrity_requirements:
  - Audit trail must be secure, unalterable, and time-stamped.
  - Electronic signatures must be unique and attributable to an individual.
  urs_requirements:
  - URS-EMS-008
  - URS-EMS-009
  related_tests:
  - OQ-001
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - Validation Engineer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Data Archival and Storage Capacity
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system can store data for at least 10 years and
    that the archival feature functions correctly.
  prerequisites:
  - EMS system is installed and configured.
  - Sufficient historical data is available or can be simulated to test archival.
  - Access to the vendor's archival feature is confirmed.
  test_steps:
  - step_number: 1
    action: Simulate or utilize existing data to exceed the capacity of the primary
      database for a period approaching 10 years.
    expected_result: The system continues to log data without interruption, and the
      primary database does not become full or unstable.
    data_to_capture:
    - System logs indicating continuous data logging.
    - Database size and performance metrics.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the vendor's archival process for data older than a specified
      period (e.g., 7 years).
    expected_result: The archival process completes successfully, moving the specified
      data to the archival storage location.
    data_to_capture:
    - Confirmation of successful archival process completion.
    - Verification that data older than the specified period is no longer in the primary
      database.
    - Verification that the archived data is accessible and retrievable.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the system's storage capacity can support a minimum of 10
      years of continuous monitoring.
    expected_result: The system's configuration and available storage are sufficient
      to retain data for at least 10 years.
    data_to_capture:
    - System configuration details related to data retention.
    - Calculations or vendor documentation supporting 10-year data storage capacity.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully archives data older than 7 years using the vendor's archival
    feature.
  - Archived data is retrievable and remains in its original format.
  - The system demonstrates the capability to support a minimum of 10 years of continuous
    monitoring data storage.
  regulatory_basis:
  - URS-EMS-010
  risk_level: medium
  data_integrity_requirements:
  - Archived data must be retained for the specified period (7 years).
  - Archived data must be secure and retrievable.
  urs_requirements:
  - URS-EMS-010
  - URS-EMS-012
  related_tests:
  - OQ-005
  - OQ-003
  estimated_duration_minutes: 90
  required_expertise:
  - Validation Engineer
  - System Administrator
  - Database Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify Facility Management System Integration and Alarm Notification
  test_category: integration
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System can successfully interface
    with the existing facility management system and integrate alarm notifications
    with the site paging system.
  prerequisites:
  - Environmental Monitoring System (EMS) is installed and configured.
  - Facility Management System (FMS) is operational and accessible.
  - Site paging system is operational and accessible.
  - Vendor API documentation for alarm notifications is available.
  test_steps:
  - step_number: 1
    action: Configure the EMS to establish an interface with the FMS using standard
      protocols as specified in URS-EMS-014.
    expected_result: The EMS successfully establishes a connection and data exchange
      with the FMS.
    data_to_capture:
    - Configuration settings for FMS integration
    - Confirmation of successful connection from EMS and FMS logs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate a temperature deviation that triggers an alarm condition within
      the EMS.
    expected_result: The EMS generates an alarm notification.
    data_to_capture:
    - Simulated temperature value
    - Timestamp of alarm generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the alarm notification is sent to the site paging system via
      the vendor API as per URS-EMS-015.
    expected_result: An alarm notification is received on the designated site paging
      system within the specified response time.
    data_to_capture:
    - Content of the alarm notification on the paging system
    - Timestamp of notification receipt
    - Confirmation of integration via vendor API logs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS successfully interfaces with the FMS, allowing for data exchange.
  - Alarm notifications are accurately transmitted to the site paging system.
  - Alarm notifications are received within the specified response time of 30 seconds
    (URS-EMS-011).
  regulatory_basis:
  - URS-EMS-014
  - URS-EMS-015
  - URS-EMS-011
  risk_level: medium
  data_integrity_requirements:
  - Ensure no data corruption occurs during FMS integration.
  - Verify that alarm notifications accurately reflect the triggered event.
  urs_requirements:
  - URS-EMS-014
  - URS-EMS-015
  - URS-EMS-011
  related_tests:
  - OQ-004
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - Validation Engineer
  - IT Network Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Verify System Availability and Data Storage Capacity
  test_category: performance
  gamp_category: 3
  objective: To verify that the Environmental Monitoring System meets the specified
    availability target and has sufficient data storage capacity for the required
    retention period.
  prerequisites:
  - Environmental Monitoring System (EMS) is installed and operational.
  - Access to system logs and monitoring tools for availability tracking.
  - Knowledge of the system's data storage configuration.
  test_steps:
  - step_number: 1
    action: Monitor the EMS for a defined period (e.g., 7 days) to track uptime and
      identify any unplanned downtime events.
    expected_result: The system remains operational and accessible for the entire
      monitoring period, excluding any documented planned maintenance.
    data_to_capture:
    - Uptime logs
    - Downtime logs with reasons and durations
    - Dates and times of planned maintenance
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Calculate the system availability based on the collected uptime and downtime
      data.
    expected_result: The calculated system availability is >= 99.5% as per URS-EMS-013.
    data_to_capture:
    - Calculated availability percentage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the system's data storage configuration and estimate the current
      data growth rate.
    expected_result: The current storage capacity and growth rate indicate that the
      system can support a minimum of 10 years of continuous monitoring as per URS-EMS-012.
    data_to_capture:
    - Current storage utilization
    - Estimated daily/weekly/monthly data volume
    - Total storage capacity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System availability is confirmed to be 99.5% or higher, excluding planned maintenance.
  - Data storage capacity is sufficient to support a minimum of 10 years of continuous
    monitoring.
  - No unexpected system failures or data loss occurred during the availability monitoring
    period.
  regulatory_basis:
  - URS-EMS-013
  - URS-EMS-012
  risk_level: medium
  data_integrity_requirements:
  - Ensure that no data is lost or corrupted during periods of potential downtime.
  - Verify that the storage capacity calculation is accurate and accounts for future
    data growth.
  urs_requirements:
  - URS-EMS-013
  - URS-EMS-012
  related_tests:
  - OQ-006
  estimated_duration_minutes: 120
  required_expertise:
  - System Administrator
  - Validation Engineer
  - Database Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
