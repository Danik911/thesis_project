test_cases:
- test_id: OQ-001
  test_name: Verify Continuous Temperature Monitoring and Recording Intervals
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS continuously monitors temperature in GMP storage
    areas and records readings at intervals not exceeding 5 minutes.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are calibrated and operational.
  - Access to EMS software and data logs.
  test_steps:
  - step_number: 1
    action: Observe the EMS software interface for a designated GMP storage area.
    expected_result: The EMS displays real-time temperature readings for the monitored
      area.
    data_to_capture:
    - Screenshot of EMS interface showing real-time temperature.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the EMS data logs for the same storage area over a period of at
      least 10 minutes.
    expected_result: Temperature readings are recorded in the data logs at intervals
      of 5 minutes or less.
    data_to_capture:
    - Exported data log showing timestamped temperature readings.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Real-time temperature is displayed on the EMS interface.
  - Temperature readings are logged at intervals not exceeding 5 minutes.
  regulatory_basis:
  - URS-EMS-001
  - URS-EMS-002
  risk_level: low
  data_integrity_requirements:
  - Data must be recorded accurately and without loss.
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Temperature Alarm Generation and Notification Integration
  test_category: integration
  gamp_category: 3
  objective: To verify that the EMS generates alerts when temperature deviates from
    setpoint and that alarm notifications integrate with the site paging system.
  prerequisites:
  - EMS system is installed and configured.
  - Temperature sensors are calibrated and operational.
  - Site paging system is operational and configured for integration.
  - Defined temperature setpoints and alarm deviation thresholds.
  test_steps:
  - step_number: 1
    action: Adjust the temperature in a monitored GMP storage area to intentionally
      trigger a temperature deviation alarm (e.g., ±2°C from setpoint).
    expected_result: The EMS generates an audible and visual alarm notification within
      the system.
    data_to_capture:
    - Screenshot of EMS alarm notification.
    - Timestamp of alarm generation.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that the alarm notification is sent to the site paging system.
    expected_result: An alert is received on the designated paging device or system.
    data_to_capture:
    - Confirmation of receipt of alarm notification on paging system.
    - Timestamp of notification.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Return the temperature to within the acceptable range and verify that
      the alarm condition is cleared in the EMS.
    expected_result: The alarm status in the EMS is updated to indicate the condition
      has been resolved.
    data_to_capture:
    - Screenshot of EMS showing alarm cleared.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Temperature deviation triggers an alarm in the EMS.
  - Alarm notifications are successfully sent to the site paging system.
  - Alarm status is correctly updated upon resolution.
  regulatory_basis:
  - URS-EMS-005
  - URS-EMS-015
  risk_level: medium
  data_integrity_requirements:
  - Alarm events must be accurately logged with timestamps.
  urs_requirements:
  - URS-EMS-005
  - URS-EMS-015
  related_tests: []
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Engineer
  - IT Support (for paging system)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Temperature Accuracy and Range Compliance
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS accurately measures temperature within the specified
    range and meets the required accuracy.
  prerequisites:
  - EMS is installed and configured.
  - Calibrated reference thermometer is available.
  - Access to EMS monitoring interface.
  test_steps:
  - step_number: 1
    action: Place a calibrated reference thermometer in a GMP storage area alongside
      an EMS sensor.
    expected_result: The reference thermometer is placed correctly and does not interfere
      with the EMS sensor.
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Allow both thermometers to stabilize for at least 30 minutes.
    expected_result: Both thermometers have reached a stable reading.
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Record the temperature reading from the reference thermometer and the
      corresponding EMS reading.
    expected_result: Temperature readings are recorded from both devices.
    data_to_capture:
    - Reference thermometer reading (°C)
    - EMS reading (°C)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Repeat steps 1-3 at various points within the specified temperature range
      (-80°C to +50°C), including setpoints and alarm thresholds.
    expected_result: Readings are taken across the full operational temperature range.
    data_to_capture:
    - Reference thermometer readings (°C)
    - EMS readings (°C)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The difference between the reference thermometer reading and the EMS reading shall
    not exceed ±0.5°C for all recorded measurements within the specified range.
  regulatory_basis:
  - URS-EMS-004
  risk_level: low
  data_integrity_requirements:
  - All recorded temperature data must be accurate and traceable to the reference
    thermometer.
  urs_requirements:
  - URS-EMS-004
  related_tests: []
  estimated_duration_minutes: 120
  required_expertise:
  - Quality Assurance
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Audit Trail and Electronic Signature Functionality
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system generates a comprehensive audit trail and
    supports electronic signatures as per 21 CFR Part 11 requirements.
  prerequisites:
  - EMS is installed and configured.
  - User accounts with appropriate permissions are created.
  - Access to EMS audit trail and electronic signature features.
  test_steps:
  - step_number: 1
    action: Log into the EMS system with a user account.
    expected_result: Successful login to the EMS system.
    data_to_capture:
    - Login timestamp
    - Username
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Perform a configuration change, such as adjusting a setpoint or sensor
      calibration.
    expected_result: Configuration change is accepted by the system.
    data_to_capture:
    - Configuration change details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the audit trail and verify that the configuration change is logged
      with user, date, time, and details of the change.
    expected_result: Audit trail entry accurately reflects the configuration change.
    data_to_capture:
    - Audit trail entry details (user, date, time, action)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Initiate an action requiring an electronic signature (e.g., approving
      a report or acknowledging an alarm).
    expected_result: The system prompts for electronic signature.
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Provide valid electronic signature credentials.
    expected_result: Electronic signature is accepted and applied.
    data_to_capture:
    - Electronic signature details (username, timestamp)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Review the audit trail to confirm the electronic signature event is logged.
    expected_result: Electronic signature event is recorded in the audit trail.
    data_to_capture:
    - Audit trail entry for electronic signature
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All significant events (logins, configuration changes, electronic signatures)
    are recorded in the audit trail.
  - Audit trail entries include user ID, date, time, and a description of the event.
  - Electronic signatures are captured with user ID, timestamp, and intent.
  - The system prevents modification or deletion of audit trail entries.
  regulatory_basis:
  - URS-EMS-008
  - URS-EMS-009
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Audit trail must be complete, accurate, and protected from alteration.
  - Electronic signatures must be legally equivalent to handwritten signatures.
  urs_requirements:
  - URS-EMS-008
  - URS-EMS-009
  related_tests: []
  estimated_duration_minutes: 90
  required_expertise:
  - Quality Assurance
  - Validation Engineer
  - IT Security
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Data Storage and Archival Capabilities
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system can store continuous monitoring data for
    at least 10 years and that the archival feature functions correctly.
  prerequisites:
  - EMS system is installed and configured.
  - Sufficient storage space is allocated for 10 years of data.
  - Archival process is understood and documented.
  test_steps:
  - step_number: 1
    action: Simulate continuous temperature and humidity monitoring for a period equivalent
      to 10 years of expected data generation (e.g., by adjusting system clock or
      using simulated data).
    expected_result: The system successfully records and stores all simulated data
      without errors.
    data_to_capture:
    - System logs for data recording errors.
    - Database size after simulated period.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the vendor-supplied archival process for the simulated 10 years
      of data.
    expected_result: The archival process completes successfully, and archived data
      is accessible and verifiable.
    data_to_capture:
    - Archival process logs.
    - Confirmation of archived data integrity.
    - Location of archived data.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Retrieve a sample of archived data and compare it with the original data
      to ensure no corruption or loss.
    expected_result: Retrieved archived data matches the original data exactly.
    data_to_capture:
    - Sample of retrieved archived data.
    - Comparison report of original and archived data.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System successfully stores data for a simulated 10-year period.
  - Archival process completes without errors.
  - Archived data is retrievable and matches original data.
  regulatory_basis:
  - 'URS-EMS-010: Data shall be retained for 7 years using vendor''s archival feature.'
  - 'URS-EMS-012: Data storage capacity shall support minimum 10 years of continuous
    monitoring.'
  risk_level: medium
  data_integrity_requirements:
  - Data shall be stored accurately and completely for the required retention period.
  - Archived data shall be protected from corruption and loss.
  urs_requirements:
  - URS-EMS-010
  - URS-EMS-012
  - URS-EMS-006
  related_tests:
  - OQ-001
  - OQ-006
  estimated_duration_minutes: 120
  required_expertise:
  - System Administrator
  - Database Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify System Availability and Integration with Facility Management
  test_category: integration
  gamp_category: 3
  objective: To verify that the EMS system meets the required availability percentage
    and integrates correctly with the facility management system.
  prerequisites:
  - EMS system is operational.
  - Facility management system is operational and accessible.
  - Network connectivity between EMS and facility management system is established.
  - Standard protocols for integration are documented.
  test_steps:
  - step_number: 1
    action: Monitor EMS system uptime over a defined period (e.g., 7 days) excluding
      scheduled maintenance windows.
    expected_result: The system availability is at least 99.5% during the monitoring
      period.
    data_to_capture:
    - System uptime logs.
    - Downtime records and reasons.
    - Calculated availability percentage.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Configure the EMS to send temperature and humidity data to the facility
      management system via standard protocols.
    expected_result: Data is successfully transmitted from EMS to the facility management
      system without errors.
    data_to_capture:
    - EMS system logs for data transmission.
    - Facility management system logs for data reception.
    - Sample of transmitted data in facility management system.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the data received by the facility management system is accurate
      and consistent with the data recorded by the EMS.
    expected_result: Received data in the facility management system accurately reflects
      the EMS readings.
    data_to_capture:
    - Comparison of data between EMS and facility management system.
    - Discrepancy report (if any).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System availability meets or exceeds 99.5% (excluding planned maintenance).
  - Data is successfully transmitted to the facility management system.
  - Data integrity is maintained during the integration process.
  regulatory_basis:
  - 'URS-EMS-013: System availability shall be 99.5% excluding planned maintenance.'
  - 'URS-EMS-014: System shall interface with existing facility management system
    via standard protocols.'
  risk_level: medium
  data_integrity_requirements:
  - Data transmitted to the facility management system must be accurate and complete.
  - System availability is critical for continuous monitoring.
  urs_requirements:
  - URS-EMS-013
  - URS-EMS-014
  - URS-EMS-001
  - URS-EMS-002
  related_tests:
  - OQ-001
  - OQ-005
  estimated_duration_minutes: 90
  required_expertise:
  - System Administrator
  - Integration Specialist
  - Facility Management System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify Vendor-Supplied Software Unmodified and Standard Reports Usage
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS system utilizes vendor-supplied software without
    any modifications and that standard reports are used for batch release.
  prerequisites:
  - EMS system is installed and configured.
  - Access to system logs and vendor documentation.
  test_steps:
  - step_number: 1
    action: Review system installation files and configuration settings to confirm
      no custom code or modifications have been introduced to the vendor-supplied
      software.
    expected_result: System files and configurations match the original vendor-supplied
      version without any unauthorized changes.
    data_to_capture:
    - System file checksums/hashes
    - Configuration file comparison results
    - Vendor documentation reference
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Generate a standard report from the EMS system for a defined period (e.g.,
      one week) and verify its format and content against vendor specifications.
    expected_result: The generated report is in the vendor's standard format and contains
      all required data points for batch release.
    data_to_capture:
    - Generated report file
    - Report content verification checklist
    - Vendor report specification document
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS software is confirmed to be unmodified vendor-supplied software.
  - Standard reports generated by the system are suitable for batch release as per
    vendor specifications.
  regulatory_basis:
  - 'URS-EMS-003: The system shall use vendor-supplied software without modification.'
  - 'URS-EMS-007: Standard reports provided by vendor shall be used for batch release.'
  risk_level: low
  data_integrity_requirements:
  - Ensure no unauthorized modifications to software that could impact data integrity.
  urs_requirements:
  - URS-EMS-003
  - URS-EMS-007
  related_tests:
  - OQ-001
  - OQ-007
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Alarm Notification Integration with Site Paging System
  test_category: integration
  gamp_category: 3
  objective: To verify that alarm notifications generated by the EMS system are successfully
    integrated and transmitted to the site paging system.
  prerequisites:
  - EMS system is operational and configured with alarm setpoints.
  - Site paging system is operational and accessible.
  - Vendor API documentation for alarm notifications.
  test_steps:
  - step_number: 1
    action: Induce a temperature deviation that triggers an alarm condition in the
      EMS system (e.g., by temporarily altering a sensor reading or simulating a fault).
    expected_result: The EMS system generates an alarm notification.
    data_to_capture:
    - Alarm event log entry
    - Timestamp of alarm generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the site paging system to confirm receipt of the alarm notification
      triggered by the EMS system.
    expected_result: The site paging system receives and displays the alarm notification
      from the EMS system.
    data_to_capture:
    - Screenshot of paging system displaying alarm
    - Timestamp of alarm notification receipt
    - Content of the received alarm message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the alarm notification content on the paging system accurately
      reflects the alarm details (e.g., location, severity, temperature value) as
      generated by the EMS.
    expected_result: The alarm notification content on the paging system is consistent
      with the EMS alarm details.
    data_to_capture:
    - Comparison of alarm details between EMS and paging system
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Temperature alarms generated by the EMS system are successfully transmitted to
    the site paging system.
  - Alarm notification content is accurate and complete.
  regulatory_basis:
  - 'URS-EMS-015: Alarm notifications shall integrate with site paging system using
    vendor API.'
  risk_level: medium
  data_integrity_requirements:
  - Ensure timely and accurate communication of critical alarm events to relevant
    personnel.
  urs_requirements:
  - URS-EMS-015
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - Validation Engineer
  - IT/Network Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify Data Storage Capacity for 10 Years of Continuous Monitoring
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the EMS system has sufficient data storage capacity to
    support a minimum of 10 years of continuous temperature and humidity monitoring
    data.
  prerequisites:
  - EMS system is installed and configured.
  - Access to system logs and storage utilization reports.
  test_steps:
  - step_number: 1
    action: Calculate the expected daily data storage requirement based on the defined
      recording interval (URS-EMS-002) and the number of monitored points.
    expected_result: Daily data storage requirement is calculated and documented.
    data_to_capture:
    - Number of monitored points
    - Recording interval (minutes)
    - Estimated data size per reading
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Project the total data storage needed for 10 years based on the daily
      requirement.
    expected_result: Total 10-year data storage requirement is calculated and documented.
    data_to_capture:
    - Total 10-year storage requirement (GB/TB)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review system configuration and available storage capacity, or simulate
      data generation to fill storage and observe system behavior.
    expected_result: The system's current or projected storage capacity meets or exceeds
      the calculated 10-year requirement without performance degradation or data loss.
    data_to_capture:
    - Current available storage capacity
    - System storage utilization reports
    - Observation of system behavior under simulated load
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system's data storage capacity is confirmed to be sufficient for a minimum
    of 10 years of continuous monitoring data.
  - No data loss or significant performance degradation is observed during storage
    capacity verification.
  regulatory_basis:
  - URS-EMS-012
  risk_level: medium
  data_integrity_requirements:
  - Data must be stored without loss or corruption.
  - System must not fail due to storage limitations.
  urs_requirements:
  - URS-EMS-012
  related_tests:
  - OQ-005
  estimated_duration_minutes: 60
  required_expertise:
  - System Administrator
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Verify Vendor-Supplied Software Unmodified and Standard Reports Usage
    for Batch Release
  test_category: functional
  gamp_category: 3
  objective: To confirm that the EMS system utilizes vendor-supplied software without
    any modifications and that standard vendor reports are used for batch release
    purposes.
  prerequisites:
  - EMS system is installed and operational.
  - Access to system software files and vendor documentation.
  - Access to standard vendor reports.
  test_steps:
  - step_number: 1
    action: Examine system software files and configuration settings to confirm they
      are identical to the vendor-supplied version, referencing vendor documentation
      or checksums if available.
    expected_result: No unauthorized modifications to the vendor-supplied software
      are identified.
    data_to_capture:
    - Software version numbers
    - File checksums (if applicable)
    - Confirmation of no custom code or scripts
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Generate a standard report from the EMS system that would typically be
      used for batch release (e.g., temperature log for a specific period).
    expected_result: The generated report is a standard report provided by the vendor
      and contains all necessary information for batch release.
    data_to_capture:
    - Name of the generated report
    - Content of the report
    - Confirmation that the report format matches vendor specifications
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Compare the generated standard report with the requirements for batch
      release documentation to ensure it meets all necessary criteria.
    expected_result: The standard vendor report is deemed suitable and sufficient
      for batch release purposes.
    data_to_capture:
    - Confirmation of report suitability for batch release
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The EMS system software is confirmed to be unmodified vendor-supplied software.
  - Standard vendor reports are utilized and are adequate for batch release requirements.
  regulatory_basis:
  - URS-EMS-003
  - URS-EMS-007
  risk_level: low
  data_integrity_requirements:
  - Ensures that the system's behavior is predictable and supported by the vendor.
  - Ensures that batch release decisions are based on validated and standard reporting
    mechanisms.
  urs_requirements:
  - URS-EMS-003
  - URS-EMS-007
  related_tests:
  - OQ-007
  estimated_duration_minutes: 45
  required_expertise:
  - QA Engineer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
