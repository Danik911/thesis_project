test_cases:
- test_id: OQ-001
  test_name: 'Functional Test: X-bar/R Chart Creation and Nelson Rules Application'
  test_category: functional
  gamp_category: 3
  objective: To verify that the SPC dashboard can correctly create X-bar/R control
    charts from a CSV file and accurately apply the vendor's standard Nelson rules
    to identify out-of-control points.
  prerequisites:
  - SPC dashboard software is installed and accessible
  - Test CSV file with sample QC data (e.g., 100 rows, 5 subgroups) is available
  - User account with 'Analyst' role permissions is created
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using the credentials for the 'Analyst' role.
    expected_result: Login is successful, and the main dashboard interface is displayed.
    data_to_capture:
    - Screenshot of the main dashboard
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the 'New Chart' function and select the option to create an
      X-bar/R chart.
    expected_result: The system prompts for a data source and displays configuration
      options for the X-bar/R chart.
    data_to_capture:
    - Screenshot of the chart configuration screen
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the prepared test CSV file using the standard import function.
    expected_result: The system successfully imports the data and populates the data
      preview grid.
    data_to_capture:
    - Screenshot of the data preview
    - Log message confirming successful import
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure the chart by mapping the CSV columns to the subgroup and measurement
      fields, then enable the 'Apply Nelson Rules' option.
    expected_result: Chart configuration is saved, and the system indicates that Nelson
      rules are active.
    data_to_capture:
    - Screenshot of the final chart configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate the X-bar/R chart and observe the plotted data points and control
      limits.
    expected_result: The chart renders completely, displaying all data points, control
      limits, and any points flagged by Nelson rules.
    data_to_capture:
    - Screenshot of the final rendered chart
    - List of any points flagged by Nelson rules
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The X-bar/R chart is generated successfully from the CSV data.
  - The vendor's standard Nelson rules are applied correctly, flagging known out-of-control
    points in the test dataset.
  - All chart elements (points, center line, control limits) are displayed accurately.
  regulatory_basis:
  - 21 CFR Part 211.68 requires that automated equipment reliably performs intended
    functions.
  - General GAMP principles for verifying configured software functionality.
  risk_level: medium
  data_integrity_requirements:
  - The imported data from the CSV must be rendered accurately on the chart without
    alteration.
  - The application of Nelson rules must be consistent and based solely on the provided
    dataset.
  urs_requirements:
  - 'URS-020-001: Users shall create X-bar/R and p-charts from CSV inputs.'
  - 'URS-020-002: Users shall apply vendor''s standard Nelson rules.'
  related_tests:
  - OQ-002
  - OQ-003 (Future Test for p-charts)
  estimated_duration_minutes: 30
  required_expertise:
  - SPC Chart Knowledge
  - Basic Navigation of the SPC Dashboard
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: 'Performance Test: Data Loading and Chart Rendering Speed'
  test_category: performance
  gamp_category: 3
  objective: To verify that the SPC dashboard meets the performance requirements for
    loading a large dataset and rendering charts within the specified time limits
    on supported hardware.
  prerequisites:
  - SPC dashboard software is installed on supported hardware as per vendor specifications
  - A large test CSV file containing exactly 100,000 data points is available
  - A stopwatch or system timer is available for measurement
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard and navigate to the data import screen.
    expected_result: The import screen loads successfully.
    data_to_capture:
    - Timestamp of login completion
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the import of the 100,000-point CSV file and start the timer
      simultaneously.
    expected_result: The system begins processing the file upload.
    data_to_capture:
    - Start timestamp of the import process
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Monitor the system until the data import is complete and the data preview
      is shown. Stop the timer.
    expected_result: The system displays a confirmation message and a preview of the
      loaded data.
    data_to_capture:
    - End timestamp of the import process
    - Total data load time in seconds
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure a simple X-bar chart using the loaded dataset and apply a basic
      filter (e.g., filter by a specific product ID). Start a new timer upon applying
      the filter.
    expected_result: The system acknowledges the filter command and begins chart rendering.
    data_to_capture:
    - Start timestamp of chart rendering
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Wait for the chart to be fully rendered on the screen. Stop the timer
      once rendering is complete.
    expected_result: The chart is displayed completely with all data points and axes.
    data_to_capture:
    - End timestamp of chart rendering
    - Total chart render time in seconds
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The 100,000 data points are loaded from the CSV file in less than 5 seconds.
  - The chart is fully rendered after a filter change in less than 2 seconds.
  regulatory_basis:
  - General principles for ensuring automated systems perform adequately for their
    intended use.
  risk_level: medium
  data_integrity_requirements:
  - The performance test must not corrupt or alter the source data file.
  - The chart must render the correct subset of data after the filter is applied.
  urs_requirements:
  - 'URS-020-010: Load 100k data points in < 5 seconds on supported hardware.'
  - 'URS-020-011: Render charts in < 2 seconds after filter changes.'
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - Basic Performance Measurement Techniques
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based Access Control and Read-Only Data Verification
  test_category: security
  gamp_category: 3
  objective: Verify that role-based access controls function correctly and released
    datasets are read-only as required by regulatory standards.
  prerequisites:
  - System installed and configured
  - User accounts with different roles created (Admin, Viewer, Analyst)
  - Sample dataset imported and marked as released
  test_steps:
  - step_number: 1
    action: Log in as Viewer role user and attempt to modify a released dataset
    expected_result: System prevents modifications and displays read-only warning
      message
    data_to_capture:
    - Screenshot of error message
    - System response time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as Analyst role user and attempt to annotate points in a released
      chart
    expected_result: Annotation feature is disabled for released datasets with appropriate
      indication
    data_to_capture:
    - UI behavior documentation
    - System status messages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as Admin role user and verify configuration change capabilities
    expected_result: Admin can modify configurations with audit trail recording if
      vendor supports
    data_to_capture:
    - Audit trail entries
    - Configuration change success confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access controls enforce appropriate permissions
  - Released datasets cannot be modified by any user role
  - Audit trail records configuration changes if vendor supports this feature
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - Data integrity principles for read-only controlled records
  risk_level: medium
  data_integrity_requirements:
  - Ensures data cannot be altered after release
  - Maintains controlled record status for regulatory compliance
  urs_requirements:
  - URS-020-004
  - URS-020-007
  - URS-020-009
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Assurance
  - System Administration
  - Regulatory Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
