test_cases:
- test_id: OQ-001
  test_name: SPC Dashboard Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: To verify that the SPC dashboard can correctly create X-bar/R and p-charts
    from a CSV file and apply the vendor's standard Nelson rules for statistical process
    control.
  prerequisites:
  - SPC dashboard software is installed and accessible
  - Test CSV file with valid QC data for X-bar/R and p-charts is available
  - User account with chart creation permissions is configured
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using the pre-configured user credentials.
    expected_result: User successfully logs in and the main dashboard interface is
      displayed.
    data_to_capture:
    - Screenshot of the main dashboard screen
    - Login timestamp from the system
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the chart creation module and select the option to import
      data from a CSV file.
    expected_result: The system displays the file import dialog and accepts the CSV
      file format.
    data_to_capture:
    - Screenshot of the import dialog
    - List of supported file formats displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the provided test CSV file containing sample QC data for both variable
      and attribute data.
    expected_result: The system successfully loads the CSV file and displays a preview
      of the data columns.
    data_to_capture:
    - Screenshot of the data preview
    - Confirmation message for successful upload
    - Time taken to load the file
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure and generate an X-bar/R chart using the appropriate columns
      from the imported data.
    expected_result: The system generates a correct X-bar/R control chart displaying
      control limits, center line, and data points.
    data_to_capture:
    - Screenshot of the generated X-bar/R chart
    - Calculated control limit values
    - Chart configuration settings used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Configure and generate a p-chart using the appropriate attribute data
      columns from the imported file.
    expected_result: The system generates a correct p-chart displaying proportion
      data with appropriate control limits.
    data_to_capture:
    - Screenshot of the generated p-chart
    - Calculated control limit values
    - Chart configuration settings used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Enable the vendor's standard Nelson rules on both generated charts and
      verify rule violations are flagged.
    expected_result: The system correctly applies Nelson rules and visually flags
      any data points that violate the control rules.
    data_to_capture:
    - Screenshot showing Nelson rule violations highlighted
    - List of specific rule violations detected
    - Number of points flagged for each chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart is generated with correct statistical calculations
  - p-chart is generated with correct proportion calculations
  - All vendor standard Nelson rules are properly applied and violations are visually
    indicated
  - Charts render within 2 seconds after configuration changes
  regulatory_basis:
  - FDA 21 CFR Part 11 for electronic records
  - ICH Q9 Quality Risk Management principles
  - GMP requirements for statistical process control in QC laboratories
  risk_level: medium
  data_integrity_requirements:
  - Original CSV data must not be modified during import
  - Chart configurations must be saved as controlled records
  - Statistical calculations must be accurate and reproducible
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-008
  - URS-020-011
  related_tests:
  - OQ-002
  - PQ-010
  estimated_duration_minutes: 45
  required_expertise:
  - SPC chart interpretation
  - Basic statistics knowledge
  - Software navigation skills
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Data Export and Scheduled Reporting Functionality
  test_category: integration
  gamp_category: 3
  objective: To verify that the SPC dashboard can export charts and data to PDF/CSV
    formats and successfully configure scheduled report emails using the vendor's
    scheduler.
  prerequisites:
  - SPC dashboard is installed and configured
  - Test chart is created and saved in the system
  - Email server configuration is completed
  - Test email recipient account is set up
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard and open a previously saved control chart from
      the test library.
    expected_result: The saved chart loads correctly with all data points and configurations
      intact.
    data_to_capture:
    - Screenshot of the loaded chart
    - Chart metadata showing save timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select the export function and choose PDF format for the current chart
      view.
    expected_result: The system generates a PDF file containing the chart image and
      relevant statistics.
    data_to_capture:
    - Screenshot of the export options
    - Generated PDF file for verification
    - Export completion timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the PDF export contains all chart elements including title, axes,
      data points, control limits, and any Nelson rule violations.
    expected_result: The PDF file contains a complete and accurate representation
      of the on-screen chart.
    data_to_capture:
    - PDF file checksum for integrity verification
    - Visual verification checklist completion
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Export the underlying chart data to CSV format using the data export function.
    expected_result: The system generates a CSV file containing the raw data used
      to create the chart.
    data_to_capture:
    - Generated CSV file
    - File size and record count
    - Export completion timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Compare the exported CSV data with the original imported data to verify
      data integrity.
    expected_result: The exported CSV data matches the original imported data without
      modification.
    data_to_capture:
    - Data comparison results
    - Any discrepancies found between original and exported data
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Navigate to the scheduler module and configure a daily scheduled report
      for the test chart.
    expected_result: The system accepts the scheduling parameters and confirms the
      scheduled job creation.
    data_to_capture:
    - Screenshot of the scheduler configuration
    - Scheduled job ID and parameters
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 7
    action: Manually trigger the scheduled report to test the email functionality
      immediately.
    expected_result: The system sends an email to the specified recipient with the
      chart attachment.
    data_to_capture:
    - Email delivery confirmation
    - Screenshot of received email with attachment
    - Email timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - PDF exports contain accurate and complete chart representations
  - CSV exports maintain data integrity compared to original imports
  - Scheduled reports are successfully generated and emailed to recipients
  - All export and scheduling functions complete within performance requirements
  regulatory_basis:
  - FDA 21 CFR Part 11 for electronic records and signatures
  - EU Annex 11 for electronic systems used in regulated environments
  - Data integrity ALCOA+ principles
  risk_level: medium
  data_integrity_requirements:
  - Exported data must be identical to source data
  - PDF exports must be complete and unalterable
  - Scheduled reports must maintain data accuracy during transmission
  urs_requirements:
  - URS-020-003
  - URS-020-006
  - URS-020-007
  - URS-020-010
  related_tests:
  - OQ-001
  - PQ-015
  estimated_duration_minutes: 35
  required_expertise:
  - Email system configuration
  - Data export validation
  - Scheduling system operation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based Access Control and Read-Only Data Verification
  test_category: security
  gamp_category: 3
  objective: Verify that role-based access control functions correctly and released
    datasets are read-only as required by regulatory standards
  prerequisites:
  - SPC dashboard installed and configured
  - Active Directory integration configured (if available)
  - Test user accounts with different roles created
  - Sample dataset with released status available
  test_steps:
  - step_number: 1
    action: Log in as a user with administrator privileges and navigate to user management
      section
    expected_result: Administrator can access user management and view role assignments
    data_to_capture:
    - Screenshot of user management interface
    - List of available roles and permissions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Create test users with different roles (viewer, analyst, administrator)
      and assign appropriate permissions
    expected_result: Users are successfully created with correct role assignments
    data_to_capture:
    - User creation confirmation
    - Role assignment details for each test user
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as a viewer role user and attempt to access a released dataset
    expected_result: User can view the dataset but cannot modify any data or configurations
    data_to_capture:
    - Screenshot showing read-only access
    - Error message when attempting modification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log in as analyst role user and attempt to modify a released dataset
    expected_result: System prevents modifications to released data and displays appropriate
      warning
    data_to_capture:
    - Error message displayed
    - Confirmation that data remains unchanged
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access control functions as configured
  - Released datasets cannot be modified by any user role
  - Appropriate error messages displayed for unauthorized actions
  - AD integration works correctly if supported
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - Data integrity ALCOA+ principles
  - GAMP 5 guidelines for access control
  risk_level: high
  data_integrity_requirements:
  - Data cannot be modified once released
  - Access controls prevent unauthorized changes
  - Audit trail records access attempts if available
  urs_requirements:
  - URS-020-004
  - URS-020-007
  - URS-020-013
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Assurance
  - IT Security
  - Regulatory Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Data Import and Integration Performance Validation
  test_category: performance
  gamp_category: 3
  objective: Verify that data import from CSV and ODBC sources meets performance requirements
    and handles large datasets efficiently
  prerequisites:
  - SPC dashboard installed on supported hardware
  - Test CSV files with varying sizes up to 100k data points
  - ODBC data source configured if available
  - Performance monitoring tools ready
  test_steps:
  - step_number: 1
    action: Prepare a CSV file containing exactly 100,000 data points with appropriate
      SPC data structure
    expected_result: CSV file is created with correct format and exact data point
      count
    data_to_capture:
    - CSV file metadata
    - Data point count verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate import of the 100k data point CSV file and start timer
    expected_result: Import process begins immediately after file selection
    data_to_capture:
    - Import start time
    - System response time after file selection
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Monitor import progress and stop timer when data is fully loaded and available
      in dashboard
    expected_result: All 100,000 data points are imported successfully in less than
      5 seconds
    data_to_capture:
    - Import completion time
    - Total import duration
    - System resource usage during import
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Apply filter changes to the imported dataset and measure chart rendering
      time
    expected_result: Charts render with filtered data in less than 2 seconds after
      filter application
    data_to_capture:
    - Filter application time
    - Chart rendering completion time
    - Visual verification of correct data display
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Repeat steps with ODBC connection if supported by vendor configuration
    expected_result: ODBC data import meets similar performance standards as CSV import
    data_to_capture:
    - ODBC connection time
    - ODBC data retrieval duration
    - Data integrity verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - 100k data points import completes in <5 seconds
  - Chart rendering after filter changes completes in <2 seconds
  - All imported data maintains integrity and accuracy
  - ODBC integration works correctly if supported
  regulatory_basis:
  - FDA guidance on software performance requirements
  - GAMP 5 performance qualification guidelines
  - Industry standards for data processing efficiency
  risk_level: medium
  data_integrity_requirements:
  - Imported data must match source data exactly
  - No data loss or corruption during import process
  - Data relationships maintained during filtering operations
  urs_requirements:
  - URS-020-010
  - URS-020-011
  - URS-020-012
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Performance Testing
  - Data Analysis
  - System Administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
