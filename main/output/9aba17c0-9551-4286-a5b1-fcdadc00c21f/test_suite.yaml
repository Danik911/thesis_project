- test_id: OQ-007
  test_name: User Annotation and Comment Functionality Verification
  test_category: functional
  gamp_category: 3
  objective: To verify that users can successfully annotate data points on control
    charts using the vendor's built-in comment features as specified in the URS.
  prerequisites:
  - SPC Dashboard is installed and operational
  - Valid user account with annotation permissions is available
  - A control chart with data points is created and displayed
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with a user account that has annotation permissions.
    expected_result: User successfully logs in and the main dashboard interface is
      displayed.
    data_to_capture:
    - Screenshot of successful login and main dashboard
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to an existing control chart or create a new X-bar/R chart from
      a CSV file.
    expected_result: A control chart is successfully loaded and displayed on the screen.
    data_to_capture:
    - Screenshot of the displayed control chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Right-click or use the vendor-specified method to select a specific data
      point on the chart for annotation.
    expected_result: The annotation or comment dialog box opens for the selected data
      point.
    data_to_capture:
    - Screenshot of the annotation dialog box
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Enter a test comment (e.g., 'Investigation initiated for out-of-trend
      result') and save the annotation.
    expected_result: The comment is saved and a visual indicator (e.g., icon, marker)
      appears on the chart for the annotated point.
    data_to_capture:
    - Screenshot of the chart showing the annotation marker
    - Text of the comment entered
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Hover over or click the annotated point to view the saved comment.
    expected_result: The saved comment is displayed in a tooltip or pop-up window.
    data_to_capture:
    - Screenshot of the displayed comment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Users can successfully add comments to any data point on a control chart.
  - Annotations are visually indicated on the chart and are persistently saved.
  - Saved comments can be retrieved and viewed correctly.
  regulatory_basis:
  - 21 CFR Part 11 requirements for electronic records, as they relate to annotations
    as part of the complete data record.
  risk_level: medium
  data_integrity_requirements:
  - Annotations must be permanently linked to the specific data point and form part
    of the immutable record.
  - The system must prevent unauthorized modification or deletion of annotations after
    saving.
  urs_requirements:
  - 'URS-020-005: Users shall annotate points with comments using built-in features.'
  related_tests:
  - OQ-001
  - OQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - SPC Dashboard User
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Chart Configuration Control and Record Retention Verification
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that chart configurations are saved as controlled records and
    cannot be altered for released datasets, ensuring data integrity.
  prerequisites:
  - SPC Dashboard is installed and operational
  - A dataset has been imported and a control chart created
  - Chart configuration (limits, rules, etc.) has been set and saved
  - Dataset has been marked as 'Released'
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with a user account that has configuration
      permissions.
    expected_result: User successfully logs in and the main dashboard interface is
      displayed.
    data_to_capture:
    - Screenshot of successful login
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to a control chart that is based on a dataset with a status of
      'Released'.
    expected_result: The chart is displayed, and the interface indicates the dataset
      is read-only or released.
    data_to_capture:
    - Screenshot of the chart view showing the read-only/released status
    verification_method: visual_inspection
