  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Validate Alarm Notification Integration
  test_category: integration
  gamp_category: 3
  objective: To verify that alarm notifications are correctly integrated with the
    site paging system using the vendor API as specified in URS-EMS-015.
  prerequisites:
  - System is installed and operational
  - Site paging system is configured
  test_steps:
  - step_number: 1
    action: Simulate a temperature deviation exceeding ±2°C from the setpoint.
    expected_result: System generates an alarm condition.
    data_to_capture:
    - Time of alarm generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Check the site paging system for the alarm notification.
    expected_result: Alarm notification is received on the site paging system.
    data_to_capture:
    - Time of notification receipt
    - Notification content
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alarm notification is received on the site paging system within 30 seconds of
    alarm generation
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: high
  data_integrity_requirements:
  - Notifications must be accurate and timely
  urs_requirements:
  - URS-EMS-015
  related_tests:
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - System integration
  - API configuration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
