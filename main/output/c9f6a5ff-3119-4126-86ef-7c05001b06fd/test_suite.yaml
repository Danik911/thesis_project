- test_id: OQ-007
  test_name: Verify Temperature Data Accuracy and Range
  test_category: functional
  gamp_category: 3
  objective: To ensure the EMS accurately measures and records temperature within
    the specified range of -80°C to +50°C with an accuracy of ±0.5°C.
  prerequisites:
  - EMS installed and operational
  - Calibrated temperature sensors available
  test_steps:
  - step_number: 1
    action: Set the EMS to monitor temperature in a controlled environment.
    expected_result: EMS displays temperature readings within the specified range.
    data_to_capture:
    - Temperature readings
    - Time stamps
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Compare EMS readings with calibrated temperature sensor readings.
    expected_result: EMS readings match calibrated sensor readings within ±0.5°C.
    data_to_capture:
    - EMS readings
    - Calibrated sensor readings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - EMS readings are within ±0.5°C of calibrated sensor readings
  - EMS operates within the specified temperature range
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Ensure data is accurate and unaltered
  urs_requirements:
  - URS-EMS-004
  related_tests:
