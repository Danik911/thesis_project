- test_id: OQ-007
  test_name: Read-Only Access Verification for Released Datasets
  test_category: security
  gamp_category: 3
  objective: Verify that released datasets are locked with read-only access to prevent
    unauthorized modifications as required by regulatory controls.
  prerequisites:
  - System administrator access
  - Released dataset available in system
  - Standard user account with QC role
  test_steps:
  - step_number: 1
    action: Log in as system administrator and mark a test dataset as 'Released' using
      the vendor's release functionality.
    expected_result: Dataset status changes to 'Released' and system confirms successful
      status update.
    data_to_capture:
    - Dataset release status
    - System confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log out of administrator account and log in as standard QC user with appropriate
      role-based permissions.
    expected_result: Successful login with standard user credentials and access to
      dashboard features.
    data_to_capture:
    - Login success confirmation
    - Available dashboard features for user role
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Navigate to the released dataset and attempt to modify data points or
      chart configurations.
    expected_result: System prevents modifications and displays message indicating
      dataset is read-only due to release status.
    data_to_capture:
    - System response to modification attempts
    - Error/warning messages displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Released datasets cannot be modified by any user role
  - System clearly indicates read-only status for released data
  - All modification attempts are properly blocked with appropriate messaging
  regulatory_basis:
  - FDA 21 CFR Part 11 - Controls for closed systems
  - Data integrity ALCOA+ principles for attributable and legible records
  risk_level: high
  data_integrity_requirements:
  - Data cannot be altered once released
  - Audit trail must record release status changes if vendor provides this capability
  urs_requirements:
  - 'URS-020-007: Read-only access for released datasets'
  related_tests:
  - 'OQ-002: Role-Based Access Verification'
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Control Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Chart Configuration Control and Retention Verification
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that chart configurations are properly retained as controlled
    records and cannot be modified without proper authorization.
  prerequisites:
  - Saved chart configuration in system
  - System administrator access
  - Standard user account
  test_steps:
  - step_number: 1
    action: Log in as standard user and create a new chart configuration with specific
      control limits, rules, and display settings.
    expected_result: Chart configuration is successfully saved with all specified
      parameters.
    data_to_capture:
    - Configuration save confirmation
    - Configuration parameters stored
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log out and log in as different user, then attempt to modify the saved
      chart configuration.
    expected_result: System prevents unauthorized modifications based on user permissions
      and configuration control status.
    data_to_capture:
    - System response to modification attempts
    - Permission error messages if applicable
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Export the chart configuration to verify it contains all controlled parameters
      and metadata.
    expected_result: Configuration export contains complete set of parameters, timestamps,
      and user information.
    data_to_capture:
    - Exported configuration content
    - Metadata completeness
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify configuration remains unchanged after system restart or session
      timeout.
    expected_result: Chart configuration persists identically after system events
      without corruption or alteration.
    data_to_capture:
    - Configuration consistency verification
    - System stability impact assessment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Chart configurations are retained as immutable controlled records
  - Unauthorized modifications are prevented by the system
  - Configurations maintain integrity through system events and sessions
  regulatory_basis:
  - FDA 21 CFR Part 11 - Controls for closed systems
  - GMP requirements for controlled documentation
  - Data integrity principles for complete and consistent records
  risk_level: medium
  data_integrity_requirements:
  - Configurations must be retained without alteration
  - Change control must be enforced for modifications
  - Metadata must be preserved with configurations
  urs_requirements:
  - 'URS-020-008: Retain chart configurations as controlled records'
  - 'URS-020-009: Audit trail for configuration changes if provided by vendor'
  related_tests:
  - 'OQ-001: SPC Chart Creation and Nelson Rules Application'
  estimated_duration_minutes: 30
  required_expertise:
