test_cases:
- test_id: OQ-001
  test_name: SPC Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: To verify that the SPC dashboard can correctly create X-bar/R and p-charts
    from CSV data and accurately apply the vendor's standard Nelson rules for statistical
    process control.
  prerequisites:
  - SPC dashboard software is installed and accessible
  - Test CSV files with valid SPC data are available
  - User account with chart creation permissions is configured
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using a valid user account with appropriate
      permissions.
    expected_result: User successfully logs in and is presented with the main dashboard
      interface.
    data_to_capture:
    - Screenshot of successful login
    - System time and user ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the chart creation module and select the option to create
      a new X-bar/R chart.
    expected_result: System displays the chart creation wizard with options to upload
      data.
    data_to_capture:
    - Screenshot of the chart creation interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the prepared test CSV file containing valid numerical process data
      for X-bar/R charting.
    expected_result: System successfully imports the CSV data and displays a preview
      of the dataset.
    data_to_capture:
    - Screenshot of data preview
    - Import confirmation message
    - Number of data points imported
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure the chart parameters (subgroup size, specifications) and enable
      the vendor's standard Nelson rules.
    expected_result: System accepts the configuration and displays the configured
      Nelson rules as active.
    data_to_capture:
    - Screenshot of configuration settings
    - List of enabled Nelson rules
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate the X-bar/R chart and verify that Nelson rule violations are
      correctly flagged.
    expected_result: System renders the X-bar/R chart with control limits and correctly
      identifies any points that violate the enabled Nelson rules.
    data_to_capture:
    - Screenshot of the final chart
    - List of flagged rule violations
    - Chart rendering time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart is generated successfully from CSV input
  - All vendor standard Nelson rules are correctly applied and violations are visually
    flagged
  - Chart configuration settings are saved and applied correctly
  regulatory_basis:
  - FDA 21 CFR Part 11 for electronic records
  - ICH Q9 for Quality Risk Management principles applied in SPC
  risk_level: medium
  data_integrity_requirements:
  - Original CSV data must remain unaltered during import
  - Chart calculations must be accurate and reproducible
  - All rule violations must be traceable to specific data points
  urs_requirements:
  - URS-020-001
  - URS-020-002
  related_tests:
  - OQ-002
  - OQ-003
  estimated_duration_minutes: 45
  required_expertise:
  - SPC chart interpretation
  - Basic statistical knowledge
  - System navigation skills
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Data Export and Role-Based Access Verification
  test_category: functional
  gamp_category: 3
  objective: To verify that the system correctly exports charts and data to PDF/CSV
    formats and properly enforces role-based view access controls.
  prerequisites:
  - SPC dashboard is operational
  - Pre-configured user roles (viewer, editor, admin) exist
  - Sample charts with released datasets are available
  test_steps:
  - step_number: 1
    action: Log into the system using an administrator account and navigate to a previously
      created chart with released data.
    expected_result: Administrator can access the chart and all editing functions
      are available.
    data_to_capture:
    - Screenshot of admin access level
    - Available functions list
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to export the chart to PDF format using the vendor's standard
      export function.
    expected_result: System generates a PDF file containing the chart image and relevant
      statistics.
    data_to_capture:
    - Exported PDF file
    - Export completion time
    - PDF file integrity check
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to export the underlying chart data to CSV format using the export
      function.
    expected_result: System generates a CSV file containing the original data points
      and calculated statistics.
    data_to_capture:
    - Exported CSV file
    - Data accuracy verification
    - File format compliance
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log out and log back in using a viewer-only role account and attempt to
      access the same released chart.
    expected_result: Viewer can access the chart but all editing functions are disabled
      or hidden.
    data_to_capture:
    - Screenshot of viewer access level
    - List of disabled functions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: As a viewer, attempt to modify the chart configuration or data.
    expected_result: System prevents any modifications and displays an access denied
      message for protected functions.
    data_to_capture:
    - Screenshot of access denial message
    - System response to modification attempts
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - PDF and CSV exports are generated correctly with accurate data representation
  - Role-based access controls prevent unauthorized modifications to released data
  - Viewer roles have read-only access as specified
  regulatory_basis:
  - FDA 21 CFR Part 11 requirements for electronic signatures and record controls
  - EU Annex 11 for electronic data integrity and access controls
  risk_level: medium
  data_integrity_requirements:
  - Exported files must accurately represent the original data without alteration
  - Access controls must prevent unauthorized data modification
  - Read-only status for released data must be enforced
  urs_requirements:
  - URS-020-003
  - URS-020-004
  - URS-020-007
  related_tests:
  - OQ-001
  - OQ-004
  estimated_duration_minutes: 35
  required_expertise:
  - User role management
  - File export functionality
  - Access control verification
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: User Annotation and Comment Functionality Verification
  test_category: functional
  gamp_category: 3
  objective: To verify that users can successfully annotate data points on SPC charts
    with comments using the vendor's built-in annotation features.
  prerequisites:
  - System installation is complete and verified
  - Valid user account with annotation permissions is available
  - Test dataset with at least 10 data points is loaded into the system
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using valid credentials with annotation permissions
    expected_result: User successfully logs in and the main dashboard interface is
      displayed
    data_to_capture:
    - Screenshot of successful login
    - Timestamp of login
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Load the test dataset and create an X-bar/R chart using the standard chart
      creation workflow
    expected_result: X-bar/R chart is successfully generated and displayed with all
      data points visible
    data_to_capture:
    - Screenshot of generated chart
    - Chart configuration settings used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select a data point on the chart and use the built-in annotation tool
      to add a comment
    expected_result: Annotation interface opens and allows text input for the selected
      data point
    data_to_capture:
    - Screenshot of annotation interface
    - Text of comment entered
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Save the annotation and verify it appears on the chart
    expected_result: Comment is successfully saved and displayed as an annotation
      marker on the chart
    data_to_capture:
    - Screenshot of annotated chart
    - Annotation metadata (timestamp, user)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Export the chart to PDF format and verify annotations are included
    expected_result: PDF export contains the chart with all annotations visible and
      legible
    data_to_capture:
    - Exported PDF file
    - Verification of annotation presence in export
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Users can successfully add annotations to any data point on SPC charts
  - Annotations are persistently saved with the chart configuration
  - Annotations are included in all export formats (PDF, CSV)
  - Annotation metadata (user, timestamp) is captured and displayed
  regulatory_basis:
  - 21 CFR Part 11 requirements for electronic records
  - GMP requirements for data integrity and traceability
  risk_level: medium
  data_integrity_requirements:
  - Annotations must be permanently associated with specific data points
  - Annotation metadata must include user identification and timestamp
  - Annotations must be included in all data exports and reports
  urs_requirements:
  - 'URS-020-005: Users shall annotate points with comments using built-in features'
  related_tests:
  - 'OQ-001: SPC Chart Creation and Nelson Rules Application'
  - 'OQ-002: Data Export and Role-Based Access Verification'
  estimated_duration_minutes: 30
  required_expertise:
  - SPC dashboard user interface navigation
  - Basic understanding of chart annotation features
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
