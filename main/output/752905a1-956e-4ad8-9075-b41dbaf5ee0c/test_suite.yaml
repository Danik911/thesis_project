      X-bar/R chart with custom control limits)
    expected_result: Configuration is successfully saved and appears in the configuration
      library
    data_to_capture:
    - Configuration name
    - Save timestamp
    - Configuration parameters
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Modify the saved configuration by changing control limit settings and
      save changes
    expected_result: Configuration updates are saved successfully and previous version
      is retained if supported
    data_to_capture:
    - Modified parameters
    - Modification timestamp
    - Version history if available
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the audit trail/log feature to review configuration change history
    expected_result: Audit trail displays complete record of configuration changes
      including user, timestamp, and specific modifications
    data_to_capture:
    - Audit trail entries
    - Change details
    - User identification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Chart configurations are retained as controlled records
  - Audit trail captures all configuration changes when vendor provides this feature
  - Previous versions are maintained when modifications occur
  regulatory_basis:
  - FDA 21 CFR Part 11
  - EU Annex 11
  - ICH Q9 Quality Risk Management
  risk_level: medium
  data_integrity_requirements:
  - Configuration changes must be traceable to specific users
  - Historical configurations must be preserved for regulatory reference
  - Audit trail must be tamper-evident if provided
  urs_requirements:
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-005
  - OQ-006
  estimated_duration_minutes: 30
  required_expertise:
  - Quality System Knowledge
  - SPC Chart Configuration
  - Regulatory Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verification of Point Annotation and Comment Functionality
  test_category: functional
  gamp_category: 3
  objective: Verify that users can successfully annotate data points with comments
    using the built-in annotation features of the SPC dashboard.
  prerequisites:
  - SPC dashboard with active session
  - Control chart displayed with data points
  - User with annotation permissions logged in
  test_steps:
  - step_number: 1
    action: Select a specific data point on an active control chart that requires
      annotation
    expected_result: Data point is highlighted and annotation options become available
    data_to_capture:
    - Selected point coordinates
    - Point value
    - Selection timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access the annotation feature and add a detailed comment explaining the
      data point (e.g., 'Investigation required - potential measurement error')
    expected_result: Comment is successfully attached to the data point and visible
      on the chart
    data_to_capture:
    - Comment text
    - Annotation timestamp
    - User who added annotation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Save the chart with annotations and verify annotations persist when reloading
    expected_result: All annotations remain attached to their respective data points
