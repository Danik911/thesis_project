- test_id: OQ-007
  test_name: Audit Trail Verification for Chart Configuration Changes
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that the system maintains an audit trail for any changes made
    to chart configurations, as provided by the vendor, ensuring traceability and
    compliance.
  prerequisites:
  - System is installed and configured
  - User with administrative privileges is logged in
  - At least one chart configuration exists in the system
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with an administrative account.
    expected_result: User successfully logs in and accesses the main dashboard.
    data_to_capture:
    - Screenshot of successful login
    - System time and date
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the chart configuration settings for an existing chart.
    expected_result: The chart configuration interface is displayed, showing current
      settings.
    data_to_capture:
    - Screenshot of the configuration screen
    - Name/ID of the chart configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Modify a configuration parameter (e.g., change a control limit or chart
      title) and save the changes.
    expected_result: The system confirms that the configuration has been successfully
      updated.
    data_to_capture:
    - Screenshot of the confirmation message
    - Details of the specific change made
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Access the vendor-provided audit trail or event log functionality.
    expected_result: The audit trail log is displayed, showing entries for the recent
      configuration change.
    data_to_capture:
    - Screenshot of the audit trail entry
    - Log entry showing user ID, timestamp, and description of change
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The audit trail records the user who made the change.
  - The audit trail records the date and time of the change.
  - The audit trail describes the nature of the configuration change.
  - The audit trail entries are sequential and cannot be modified by the user.
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records; Electronic Signatures
  - Annex 11 - Computerised Systems
  risk_level: medium
  data_integrity_requirements:
  - ALCOA+ principles must be maintained for configuration records.
  - Audit trail must be secure, time-stamped, and attributable.
  urs_requirements:
  - 'URS-020-009: Audit trail for configuration changes if provided by vendor.'
  related_tests:
  - 'OQ-005: ODBC Data Import and Chart Configuration Verification'
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Assurance Specialist
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
