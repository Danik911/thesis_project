test_cases:
- test_id: OQ-001
  test_name: CSV Import and X-bar/R Chart Creation with Nelson Rules
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully import a CSV file containing QC data
    and generate an X-bar/R control chart with vendor-standard Nelson rules applied
    correctly.
  prerequisites:
  - SPC Dashboard software is installed and accessible
  - Test CSV file with at least 100 rows of valid subgroup data (e.g., 5 measurements
    per subgroup)
  - User account with 'Analyst' role permissions
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using valid credentials for an Analyst role.
    expected_result: User successfully authenticates and the main dashboard interface
      is displayed.
    data_to_capture:
    - Screenshot of successful login and main screen
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the data import module and select the option to import from
      a CSV file.
    expected_result: The CSV import dialog opens, allowing the user to browse for
      a file.
    data_to_capture:
    - Screenshot of the import dialog
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select the pre-prepared test CSV file and confirm the import, mapping
      the appropriate columns to 'Subgroup', 'Measurement', and 'Timestamp' fields.
    expected_result: System processes the file and displays a confirmation message
      indicating successful import of 100k data points.
    data_to_capture:
    - Screenshot of import confirmation message and data summary
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Navigate to the chart creation wizard, select 'X-bar/R Chart' as the chart
      type, and configure it using the imported dataset.
    expected_result: Chart configuration panel opens, allowing selection of the dataset
      and chart parameters.
    data_to_capture:
    - Screenshot of the chart configuration panel with settings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Enable the 'Apply Nelson Rules' option in the chart configuration and
      save the chart.
    expected_result: System applies the vendor-standard Nelson rules and displays
      the configured X-bar/R chart.
    data_to_capture:
    - Screenshot of the final chart displaying data points and any Nelson rule violations
      highlighted
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - CSV file containing 100k data points is imported in less than 5 seconds.
  - X-bar and R charts are rendered correctly with calculated control limits.
  - Nelson rules are visibly applied, correctly highlighting any out-of-control points
    based on the vendor's standard logic.
  - All chart elements (axes, labels, points, control limits) are displayed accurately.
  regulatory_basis:
  - '21 CFR Part 211.68: Requires automated equipment to perform intended function
    accurately and reliably.'
  - General GAMP principles for ensuring configured software functions as specified.
  risk_level: medium
  data_integrity_requirements:
  - Imported data must be an exact representation of the source CSV file.
  - Chart calculations (means, ranges, control limits) must be mathematically accurate.
  - Nelson rule application must be consistent and reproducible.
  urs_requirements:
  - 'URS-020-001: Users shall create X-bar/R and p-charts from CSV inputs.'
  - 'URS-020-002: Users shall apply vendor''s standard Nelson rules.'
  - 'URS-020-010: Load 100k data points in < 5 seconds on supported hardware.'
  - 'URS-020-011: Render charts in < 2 seconds after filter changes.'
  related_tests:
  - OQ-002
  - PQ-001 (Performance Qualification for data loading)
  estimated_duration_minutes: 30
  required_expertise:
  - SPC Chart Knowledge
  - Basic CSV Data Structure Understanding
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Role-Based Access Control and Data Export Functionality
  test_category: security
  gamp_category: 3
  objective: Verify that role-based view access controls function correctly and that
    standard export features (PDF, CSV) are available and produce accurate outputs.
  prerequisites:
  - SPC Dashboard software is installed and accessible
  - At least one released dataset is available in the system
  - User accounts with 'Viewer' (read-only) and 'Analyst' roles
  - A configured and saved chart linked to a released dataset
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using credentials for a 'Viewer' role account.
    expected_result: User successfully authenticates and the main dashboard interface
      is displayed.
    data_to_capture:
    - Screenshot of successful login
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to navigate to and open the pre-configured chart based on a released
      dataset.
    expected_result: The chart opens in a read-only view. All editing options (e.g.,
      modify configuration, change data) are disabled or hidden.
    data_to_capture:
    - Screenshot of the chart view with disabled/hidden edit functions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: While viewing the chart, locate and select the 'Export to PDF' option.
    expected_result: A PDF file is generated and downloaded, containing an accurate
      representation of the chart as displayed on screen.
    data_to_capture:
    - Saved PDF export file for review
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log out of the Viewer account and log in using credentials for an 'Analyst'
      role account.
    expected_result: User successfully authenticates and the main dashboard interface
      is displayed.
    data_to_capture:
    - Screenshot of successful login
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Navigate to the same chart and attempt to modify its configuration (e.g.,
      change a filter).
    expected_result: The system allows configuration changes, demonstrating elevated
      permissions compared to the Viewer role.
    data_to_capture:
    - Screenshot confirming ability to modify chart settings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Export the underlying dataset used for the chart to a CSV file using the
      standard export function.
    expected_result: A CSV file is generated and downloaded, containing the complete
      and accurate dataset.
    data_to_capture:
    - Saved CSV export file for data verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Viewer role cannot modify released datasets or chart configurations, enforcing
    read-only access.
  - Analyst role can modify configurations for non-released data, demonstrating functional
    role separation.
  - PDF export produces a file that is a pixel-perfect or data-accurate representation
    of the on-screen chart.
  - CSV export produces a file containing the complete dataset without alteration
    or data loss.
  regulatory_basis:
  - '21 CFR Part 11.10(d): Authority checks to ensure only authorized individuals
    can use the system.'
  - '21 CFR Part 11.10(b): Generation of accurate and complete copies of records in
    human-readable form.'
  - 'URS-020-007: Read-only access for released datasets.'
  risk_level: medium
  data_integrity_requirements:
  - Exported data (PDF and CSV) must be a complete and unaltered representation of
    the system data.
  - Access controls must be enforced consistently, preventing unauthorized modifications.
  urs_requirements:
  - 'URS-020-003: The system shall provide vendor standard export to PDF and CSV.'
  - 'URS-020-004: The dashboard shall allow role-based view access.'
  - 'URS-020-007: Read-only access for released datasets.'
  related_tests:
  - OQ-001
  - IQ-002 (Installation Qualification for User Setup)
  estimated_duration_minutes: 25
  required_expertise:
  - Understanding of Role-Based Access Control (RBAC)
  - Basic File Format Knowledge (PDF, CSV)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
