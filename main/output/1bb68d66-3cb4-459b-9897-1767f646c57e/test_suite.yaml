test_cases:
- test_id: OQ-001
  test_name: X-bar/R Chart Creation and Nelson Rules Application Test
  test_category: functional
  gamp_category: 3
  objective: Verify that users can successfully create X-bar/R control charts from
    CSV input data and apply vendor's standard Nelson rules for statistical process
    control analysis.
  prerequisites:
  - SPC dashboard software installed and configured
  - Test CSV file with sample QC data (minimum 25 subgroups)
  - User account with appropriate permissions
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with valid credentials and navigate to the
      chart creation module
    expected_result: User successfully logs in and accesses the chart creation interface
    data_to_capture:
    - Login success status
    - Time to access chart creation module
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Import the test CSV file containing QC data using the standard CSV import
      functionality
    expected_result: CSV file is successfully imported and data is displayed in the
      preview pane
    data_to_capture:
    - Import success status
    - Number of data points imported
    - Any import errors encountered
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Configure X-bar/R chart parameters including subgroup size and control
      limits calculation method
    expected_result: Chart configuration is saved and applied to the dataset
    data_to_capture:
    - Configuration parameters set
    - Configuration save status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Apply vendor's standard Nelson rules to the created X-bar/R chart
    expected_result: Nelson rules are successfully applied and any out-of-control
      points are flagged according to the rules
    data_to_capture:
    - Number of Nelson rules violations detected
    - Specific rules that triggered violations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart is successfully created from CSV input
  - All 8 standard Nelson rules are properly applied and functioning
  - Out-of-control points are correctly identified and flagged
  - Chart configuration is saved as a controlled record
  regulatory_basis:
  - 21 CFR Part 211 - Current Good Manufacturing Practice
  - FDA Guidance on Process Validation
  - ICH Q9 Quality Risk Management
  risk_level: medium
  data_integrity_requirements:
  - Chart configurations must be retained as controlled records
  - Data import must maintain original data integrity without modification
  - All statistical calculations must follow validated algorithms
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-008
  related_tests:
  - OQ-002
  - PQ-001
  - PQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - SPC methodology knowledge
  - QC data analysis experience
  - Software operation proficiency
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Role-Based Access Control and Data Export Functionality Test
  test_category: security
  gamp_category: 3
  objective: Verify that the system properly implements role-based access control
    and supports standard export functionalities including PDF and CSV formats for
    different user roles.
  prerequisites:
  - SPC dashboard software installed
  - Multiple user accounts with different roles (admin, user, viewer)
  - Released dataset available in the system
  - Email system configured for scheduled reports
  test_steps:
  - step_number: 1
    action: Log in as an administrator user and create a control chart from test data,
      then mark the dataset as released
    expected_result: Chart is created successfully and dataset status is changed to
      released
    data_to_capture:
    - Chart creation status
    - Dataset release status confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log out and log in as a viewer role user, attempt to modify the released
      dataset and chart configuration
    expected_result: System prevents modifications to released data and displays read-only
      access message
    data_to_capture:
    - Access denial messages
    - Available modification options for viewer role
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: As a standard user, export the chart report to PDF format using the vendor's
      standard export functionality
    expected_result: PDF report is generated successfully and contains all chart elements
      and data
    data_to_capture:
    - PDF export success status
    - Report content completeness
    - Export time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Export the underlying data to CSV format and verify data integrity
    expected_result: CSV file is generated with complete and accurate data matching
      the original dataset
    data_to_capture:
    - CSV export success status
    - Data accuracy verification results
    - File format compliance
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access control functions correctly for different user roles
  - Released datasets are read-only for non-admin users
  - PDF and CSV exports generate complete and accurate files
  - All export functionalities work as specified by vendor
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records Requirements
  - EU Annex 11 - Computerized Systems
  - FDA Data Integrity Guidance
  risk_level: medium
  data_integrity_requirements:
  - Read-only access must be enforced for released datasets
  - Export functions must maintain data accuracy and completeness
  - Audit trail must record access attempts and export activities
  urs_requirements:
  - URS-020-003
  - URS-020-004
  - URS-020-007
  - URS-020-009
  related_tests:
  - OQ-001
  - PQ-003
  - PQ-004
  estimated_duration_minutes: 30
  required_expertise:
  - User access management knowledge
  - Data export validation experience
  - Regulatory compliance understanding
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
