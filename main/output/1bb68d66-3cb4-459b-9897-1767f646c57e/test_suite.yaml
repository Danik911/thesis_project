- test_id: OQ-004
  test_name: Chart Configuration Control and Audit Trail Verification
  test_category: data_integrity
  gamp_category: 3
  objective: Validate that chart configurations are properly controlled as records
    and audit trails capture configuration changes when supported by vendor
  prerequisites:
  - System with configured user accounts
  - Sample dataset loaded
  - Access to configuration management features
  - Admin-level permissions
  test_steps:
  - step_number: 1
    action: Create a new chart configuration with specific parameters (control limits,
      rules, display settings)
    expected_result: Configuration is successfully created and saved in the system
    data_to_capture:
    - Configuration details
    - Creation timestamp
    - User who created configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Mark the configuration as 'released' using the system's control status
      functionality
    expected_result: Configuration status changes to released/controlled state
    data_to_capture:
    - Release status
    - Release timestamp
    - User who released configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to modify the released configuration with standard user permissions
    expected_result: System prevents modifications to released configurations (read-only
      access)
    data_to_capture:
    - Error messages
    - Access restrictions applied
    - System behavior on modification attempt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Review available audit trail entries for configuration changes (if vendor
      supports this feature)
    expected_result: Audit trail captures all configuration changes with timestamps
      and user information
    data_to_capture:
    - Audit trail entries
    - Change details
    - User identification
    - Timestamp accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Export configuration as a controlled record using system export functionality
    expected_result: Configuration exports successfully with all metadata and control
      information
    data_to_capture:
    - Export format
    - Completeness of exported data
    - Metadata preservation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Released configurations are read-only and cannot be modified
  - Audit trails capture configuration changes when supported by vendor
  - Configurations maintain controlled record status throughout lifecycle
  regulatory_basis:
  - 21 CFR Part 11 - Electronic records and signatures
  - FDA Data Integrity Guidance - Controlled configurations
  - EU Annex 11 - Audit trail requirements
  risk_level: high
  data_integrity_requirements:
  - Immutable control of released configurations
  - Accurate and complete audit trail of changes
  - Preservation of configuration metadata and history
  urs_requirements:
  - 'URS-020-007: Read-only access for released datasets'
  - 'URS-020-008: Retain chart configurations as controlled records'
  - 'URS-020-009: Audit trail for configuration changes if provided by vendor'
  related_tests:
  - 'OQ-002: Role-Based Access Control and Data Export Functionality Test'
  estimated_duration_minutes: 30
  required_expertise:
  - Data integrity principles
  - Regulatory compliance
  - System administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
