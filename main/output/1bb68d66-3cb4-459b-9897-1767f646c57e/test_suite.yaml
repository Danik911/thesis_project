- test_id: OQ-009
  test_name: Read-Only Access Verification for Released Datasets
  test_category: security
  gamp_category: 3
  objective: Verify that released datasets are set to read-only access as required
    by regulatory controls to prevent unauthorized modifications.
  prerequisites:
  - Released dataset available in system
  - User with viewer role credentials
  - User with editor role credentials
  test_steps:
  - step_number: 1
    action: Log in as user with editor role and attempt to modify data in a released
      dataset
    expected_result: System prevents modifications and displays message indicating
      dataset is read-only
    data_to_capture:
    - Error message displayed
    - Timestamp of access attempt
    - User ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as user with viewer role and attempt to access the same released
      dataset
    expected_result: System allows read-only access to view data but prevents any
      modifications
    data_to_capture:
    - Access granted timestamp
    - Available view options
    - Modification capabilities
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Released datasets cannot be modified by any user role
  - Read-only access is properly enforced for all released data
  - Appropriate error messages are displayed for modification attempts
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - Data integrity ALCOA+ principles
  - GAMP5 data governance controls
