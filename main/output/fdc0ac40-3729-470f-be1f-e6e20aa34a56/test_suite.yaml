  test_name: Verify Dual-Scanning CoI/CoC Verification Integrity
  test_category: data_integrity
  gamp_category: 4
  objective: Verify the robustness of the dual-scanning mechanism for maintaining
    Chain-of-Identity and Chain-of-Custody during critical material transfers.
  prerequisites:
  - System is operational.
  - Test materials (simulated patient sample/product) are available with unique identifiers.
  - Two distinct scanning devices are available and authenticated (URS-028-014).
  test_steps:
  - step_number: 1
    action: Initiate a material transfer step requiring dual verification (e.g., Apheresis
      collection). Scan the first identifier (Patient ID) using Scanner 1.
    expected_result: System accepts the first scan and prompts for the second verification.
    data_to_capture:
    - First Scan Timestamp
    - Scanner 1 ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Scan the second identifier (Material Lot ID) using Scanner 2, ensuring
      the IDs match the expected patient journey.
    expected_result: System validates the dual scan, logs the successful custody transfer
      event, and updates the CoI/CoC status.
    data_to_capture:
    - Second Scan Timestamp
    - Scanner 2 ID
    - System Status Update
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to complete the same transfer step using only one scan (Scanner
      1) or by providing a mismatched second ID.
    expected_result: The system blocks the transfer, logs an integrity violation event,
      and requires re-initiation of the dual-scan process.
    data_to_capture:
    - Violation Log Entry
    - Error Message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Custody transfers are only recorded upon successful completion of both required
    scans.
