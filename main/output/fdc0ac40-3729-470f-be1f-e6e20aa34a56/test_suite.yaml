test_cases:
- test_id: OQ-001
  test_name: Workflow Configuration and Chain-of-Custody Verification
  test_category: functional
  gamp_category: 4
  objective: Verify the system can successfully configure and execute a standard vein-to-vein
    workflow template, enforcing dual-scan CoC/CoI.
  prerequisites:
  - System configured with a standard apheresis-to-infusion workflow template.
  - Test patient data loaded.
  - Two unique barcode scanners configured and linked.
  test_steps:
  - step_number: 1
    action: Initiate a new patient journey using the configured end-to-end workflow
      template (URS-028-001).
    expected_result: The workflow successfully transitions to the Apheresis scheduling
      step.
    data_to_capture:
    - Workflow ID
    - Start Timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate the apheresis collection event, performing dual-scan verification
      of the patient ID and the collection bag ID (URS-028-002).
    expected_result: The system accepts both scans, records the custody transfer,
      and updates the patient record status.
    data_to_capture:
    - Apheresis Scan 1 Timestamp
    - Apheresis Scan 2 Timestamp
    - Custody Event Audit Log Entry
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Advance the workflow through simulated manufacturing slotting and QC release
      steps.
    expected_result: Workflow progresses automatically based on configured rules without
      manual intervention.
    data_to_capture:
    - Slot Allocation Time
    - QC Release Timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify the audit trail for all handoffs recorded during the process (URS-028-008).
    expected_result: All custody transfers and status changes are logged with user/system
      ID, timestamp, and action details.
    data_to_capture:
    - Audit Trail Report Snippet
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The end-to-end workflow executes successfully from start to finish.
  - Chain-of-Identity/Custody is verified and logged at all critical transfer points.
  - All actions are traceable in the audit trail.
  regulatory_basis:
  - URS-028-002
  - URS-028-008
  risk_level: high
  data_integrity_requirements:
  - Ensure no data loss during custody transfer logging.
  urs_requirements:
  - URS-028-001
  - URS-028-002
  - URS-028-008
  related_tests:
  - OQ-002
  estimated_duration_minutes: 90
  required_expertise:
  - Workflow Configuration Specialist
  - Quality Assurance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Configurable Risk Scoring and Custom Module Integration Test
  test_category: integration
  gamp_category: 4
  objective: Validate the system's ability to apply configurable risk scoring rules
    and successfully integrate a placeholder custom algorithm module for matching.
  prerequisites:
  - System configured with a specific risk scoring rule (e.g., Delay > 24h = High
    Risk).
  - A containerized placeholder custom algorithm module (URS-028-015) deployed and
    accessible.
  - Test data including one 'High Risk' scenario (delayed shipment) and one 'Low Risk'
    scenario.
  test_steps:
  - step_number: 1
    action: Execute the workflow for the 'High Risk' scenario, simulating a 30-hour
      delay before QC release (URS-028-004).
    expected_result: The system applies the configured risk scoring rule, flagging
      the patient journey as High Risk.
    data_to_capture:
    - Risk Score Calculated Value
    - Risk Flag Timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that the system generates the required explainability artifact
      for the High Risk decision (URS-028-016).
    expected_result: An artifact detailing the delay duration and the rule triggered
      is generated and linked to the journey.
    data_to_capture:
    - Explainability Artifact ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Advance the 'Low Risk' scenario to the patient-to-lot matching step, triggering
      the optional custom algorithm module (URS-028-006).
    expected_result: The workflow successfully calls the containerized custom module,
      receives a matching recommendation, and proceeds.
    data_to_capture:
    - Custom Module API Call Log
    - Matching Recommendation Output
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the matching decision made by the custom module requires an
      e-signature before proceeding to infusion (URS-028-009).
    expected_result: The workflow pauses at the final release step, prompting for
      an electronic signature.
    data_to_capture:
    - E-Signature Prompt Verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Configurable risk rules are correctly enforced and documented.
  - The custom algorithm module is successfully invoked and returns a result.
  - Critical decisions (matching/release) are protected by e-signatures.
  regulatory_basis:
  - URS-028-005
  - URS-028-006
  - URS-028-009
  - URS-028-016
  risk_level: critical
  data_integrity_requirements:
  - Ensure custom module output is immutable once recorded.
  urs_requirements:
  - URS-028-004
  - URS-028-005
  - URS-028-006
  - URS-028-009
  - URS-028-015
  - URS-028-016
  related_tests:
  - OQ-001
  estimated_duration_minutes: 120
  required_expertise:
  - Algorithm Developer
  - Security/Containerization Engineer
  - Validation Lead
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: E2E Workflow Template Validation and Scheduling Constraints
  test_category: functional
  gamp_category: 4
  objective: Verify the successful configuration and execution of an end-to-end workflow
    template, including constraint-based scheduling.
  prerequisites:
  - System is fully installed and configured.
  - Test data representing one patient journey (Apheresis -> Manufacturing Slot ->
    QC) is available.
  - Scheduling constraints (e.g., minimum 48hr gap between steps) are configured.
  test_steps:
  - step_number: 1
    action: Configure a new end-to-end workflow template incorporating Apheresis,
      Slotting, and QC steps based on URS-028-001.
    expected_result: Workflow template is saved successfully and available for instantiation.
    data_to_capture:
    - Template ID
    - Configuration settings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Instantiate the workflow for Patient A and schedule the Apheresis step
      to occur at T=0.
    expected_result: The system accepts the initial step scheduling.
    data_to_capture:
    - Patient A ID
    - Apheresis Start Time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to schedule the subsequent Manufacturing Slot step for Patient
      A to occur immediately (T+1 hour), violating the configured 48-hour constraint.
    expected_result: The system rejects the scheduling attempt and displays an error
      message referencing the violated constraint (URS-028-003).
    data_to_capture:
    - Error message text
    - Attempted Slot Time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Reschedule the Manufacturing Slot step to occur 50 hours after Apheresis
      (T+50 hours) and confirm system acceptance.
    expected_result: The system accepts the rescheduled slot time, confirming constraint
      enforcement.
    data_to_capture:
    - Confirmed Slot Time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Workflow template creation is successful.
  - The system correctly enforces configured scheduling constraints (URS-028-003).
  regulatory_basis:
  - URS-028-001
  - URS-028-003
  risk_level: medium
  data_integrity_requirements:
  - All configuration changes must be logged in the audit trail (URS-028-008).
  urs_requirements:
  - URS-028-001
  - URS-028-003
  related_tests:
  - OQ-001
  estimated_duration_minutes: 60
  required_expertise:
  - Workflow Configuration Specialist
  - Domain Expert
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Audit Trail and E-Signature Verification for Custody Handoffs
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that all critical custody handoffs are recorded with complete
    audit trails and require valid 21 CFR Part 11 compliant e-signatures.
  prerequisites:
  - System is operational.
  - Two distinct user accounts with appropriate e-signature privileges are available
    (User A, User B).
  - A workflow instance requiring custody transfer (e.g., Apheresis collection to
    Logistics handover) is ready for execution.
  test_steps:
  - step_number: 1
    action: Execute the custody transfer step (e.g., scanning the apheresis bag) using
      User A's credentials, simulating a successful dual-scan verification (URS-028-002).
    expected_result: The system prompts for User A's e-signature to finalize the custody
      transfer.
    data_to_capture:
    - Transaction ID
    - Timestamp of prompt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: User A provides a valid e-signature to complete the handoff.
    expected_result: The custody transfer is marked complete, and the system records
      the event.
    data_to_capture:
    - User A Signature Details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Query the audit trail for the specific transaction ID recorded in Step
      1 (URS-028-008).
    expected_result: 'The audit trail entry must explicitly show: 1) Original state,
      2) New state (Custody transferred), 3) User ID (User A), 4) Timestamp, and 5)
      E-signature confirmation details (URS-028-009).'
    data_to_capture:
    - Full Audit Trail Record
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to modify the recorded custody transfer time using User B's credentials
      without providing a valid e-signature.
    expected_result: The modification attempt is blocked, and the system requires
      a valid e-signature for any change to the custody record.
    data_to_capture:
    - Error message regarding modification restriction
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Custody handoffs require and successfully capture valid e-signatures (URS-028-009).
  - The audit trail comprehensively captures all required custody events, including
    user, time, and signature confirmation (URS-028-008).
  regulatory_basis:
  - URS-028-008
  - URS-028-009
  risk_level: critical
  data_integrity_requirements:
  - Immutability of audit records must be verified.
  - E-signature validation must meet Part 11 requirements.
  urs_requirements:
  - URS-028-002
  - URS-028-008
  - URS-028-009
  related_tests:
  - OQ-001
  estimated_duration_minutes: 75
  required_expertise:
  - QA/Compliance Specialist
  - Security Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Exception Handling Workflow Trigger and KPI Reporting
  test_category: functional
  gamp_category: 4
  objective: Verify the system correctly triggers exception workflows (e.g., temperature
    excursion) and updates relevant KPIs.
  prerequisites:
  - System configured with a standard apheresis-to-infusion workflow.
  - A simulated courier integration endpoint is active.
  - Dashboard access granted for KPI review.
  test_steps:
  - step_number: 1
    action: Initiate a patient journey workflow and simulate a temperature excursion
      event on a critical cold-chain shipment record.
    expected_result: The system automatically flags the shipment as 'Excursion Alert'
      and initiates the configured exception handling workflow (URS-028-004).
    data_to_capture:
    - Timestamp of excursion trigger
    - Workflow status change log
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify the exception workflow steps are correctly logged in the audit
      trail (URS-028-008).
    expected_result: All exception handling steps, including notifications and required
      manual overrides, are recorded with user/system stamps.
    data_to_capture:
    - Audit trail entries for exception handling
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the Vein-to-Vein time KPI dashboard (URS-028-007) after the exception
      is resolved.
    expected_result: The KPI reflects the delay caused by the excursion, and the system
      accurately calculates the revised expected vein-to-vein time.
    data_to_capture:
    - Observed KPI values before and after exception resolution
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Exception workflow is triggered automatically upon simulated event.
  - All actions related to the exception are auditable.
  - KPIs accurately reflect the impact of the exception.
  regulatory_basis:
  - URS-028-004
  - URS-028-007
  - URS-028-008
  risk_level: high
  data_integrity_requirements:
  - Ensure exception status is immutable once recorded.
  urs_requirements:
  - URS-028-004
  - URS-028-007
  - URS-028-008
  related_tests:
  - OQ-001
  estimated_duration_minutes: 60
  required_expertise:
  - Workflow Configuration Specialist
  - Quality Assurance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: 'Performance Test: Concurrent Orchestration and Latency Check'
  test_category: performance
  gamp_category: 4
  objective: Validate the system's ability to orchestrate 1,000 concurrent patient
    journeys while maintaining sub-second event processing latency.
  prerequisites:
  - Load testing tools configured to simulate 1,000 active patient workflows.
  - System monitoring tools configured to capture transaction latency.
  test_steps:
  - step_number: 1
    action: Initiate the load test, simulating 1,000 concurrent patient journeys progressing
      through the initial configuration and scheduling phases (URS-028-003, URS-028-011).
    expected_result: All 1,000 workflows are successfully instantiated without system
      failure or queue overflow.
    data_to_capture:
    - Total number of successfully started workflows
    - System resource utilization during peak load
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor system logs and performance metrics to measure the latency for
      critical state transitions (e.g., custody handoff verification, scheduling updates)
      during the load test.
    expected_result: The 95th percentile latency for all recorded events remains below
      1 second (URS-028-012).
    data_to_capture:
    - P95 latency metrics for key events
    - Error rates during load
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that integration points (EHR, LIMS) respond correctly under the
      sustained high load (URS-028-013).
    expected_result: Integration response times remain within acceptable operational
      limits, and no integration timeouts occur.
    data_to_capture:
    - Integration response time logs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System successfully manages 1,000 concurrent journeys.
  - Event processing latency meets the < 1 second requirement.
  - No integration failures due to load.
  regulatory_basis:
  - URS-028-011
  - URS-028-012
  - URS-028-013
  risk_level: critical
  data_integrity_requirements:
  - Ensure no data corruption or loss occurs during high-volume processing.
  urs_requirements:
  - URS-028-003
  - URS-028-011
  - URS-028-012
  - URS-028-013
  related_tests:
  - OQ-003
  estimated_duration_minutes: 120
  required_expertise:
  - Performance Engineer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: 'Integration Test: EHR/LIMS/MES Data Exchange and CoC Logging'
  test_category: integration
  gamp_category: 4
  objective: Verify successful bidirectional data exchange with external systems (EHR,
    LIMS, MES) and confirm accurate logging of custody events triggered by these integrations.
  prerequisites:
  - External systems (EHR, LIMS, MES) are configured and accessible via APIs.
  - Test patient data is staged in the EHR.
  - API credentials and connection settings are verified.
  test_steps:
  - step_number: 1
    action: Initiate a new patient workflow in the Orchestration Platform, triggering
      data pull from EHR (e.g., patient demographics, order details).
    expected_result: Patient record is created, and all required demographic data
      is accurately populated in the platform.
    data_to_capture:
    - API response codes for EHR pull
    - Time taken for data synchronization
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate the LIMS system confirming sample receipt and logging the initial
      sample ID into the platform.
    expected_result: The platform updates the workflow status, and the LIMS Sample
      ID is recorded as the initial custody event.
    data_to_capture:
    - Custody event timestamp for LIMS receipt
    - Verification that LIMS ID matches platform record
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Simulate the MES system confirming manufacturing slot allocation and updating
      the resulting Lot ID.
    expected_result: The platform successfully receives the Lot ID, links it to the
      patient journey, and updates the workflow status to 'Manufacturing Slot Secured'.
    data_to_capture:
    - Lot ID received from MES
    - Audit trail entry confirming MES update
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All required data fields are successfully transferred between the Orchestration
    Platform and EHR/LIMS/MES.
  - All handoffs between systems are accurately recorded in the platform's audit trail
    (URS-028-008).
  regulatory_basis:
  - URS-028-013
  - URS-028-008
  risk_level: high
  data_integrity_requirements:
  - Data mapping accuracy verification
  - Completeness of custody records
  urs_requirements:
  - URS-028-001
  - URS-028-002
  - URS-028-013
  related_tests:
  - OQ-001
  estimated_duration_minutes: 60
  required_expertise:
  - Integration Specialist
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Algorithm Explainability and Cold Chain Compliance Check
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that custom algorithm decisions are traceable and that the system
    correctly enforces GDP/Chain-of-Custody rules for temperature excursions.
  prerequisites:
  - A custom-developed, containerized matching algorithm module is deployed and active.
  - Test scenario data includes a planned temperature excursion event during simulated
    courier transit.
  test_steps:
  - step_number: 1
    action: Execute a patient-to-lot matching scenario that requires the custom algorithm
      module.
    expected_result: The platform generates a matching recommendation, and the system
      provides an accessible artifact detailing the inputs and logic used by the algorithm.
    data_to_capture:
    - Algorithm decision output
    - Explainability artifact content (e.g., feature weights, decision path)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate a courier system reporting a temperature excursion event (e.g.,
      -80C shipment briefly hits -60C) for a critical material.
    expected_result: The platform automatically triggers the exception handling workflow
      (URS-028-004) and flags the affected custody segment as non-compliant.
    data_to_capture:
    - Exception workflow initiation confirmation
    - System flag status on the affected custody record
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to proceed past the QC release step for the affected material
      without documented authorization (e.g., using a standard user login).
    expected_result: The system blocks progression and requires an authorized e-signature
      to override the GDP violation, logging the override attempt.
    data_to_capture:
    - Result of override attempt without signature
    - Audit trail entry for the attempted override and subsequent required e-signature
      (if performed).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The custom algorithm's decision-making process is fully documented and accessible
    (URS-028-016).
  - Temperature excursions correctly trigger defined exception workflows and block
    downstream progression until authorized (URS-028-004, URS-028-010).
  regulatory_basis:
  - URS-028-010 (GDP)
  - URS-028-016 (Explainability)
  - URS-028-009 (E-signatures)
  risk_level: critical
  data_integrity_requirements:
  - Verification of algorithm transparency
  - Immutability of custody status following excursion
  urs_requirements:
  - URS-028-004
  - URS-028-005
  - URS-028-006
  - URS-028-009
  - URS-028-010
  - URS-028-016
  related_tests:
  - OQ-002
  - OQ-005
  estimated_duration_minutes: 75
  required_expertise:
  - Algorithm Developer
  - Quality Assurance Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: OIDC SSO and Scanner Device Identity Verification
  test_category: security
  gamp_category: 4
  objective: Verify successful Single Sign-On (SSO) via OIDC and confirm that physical
    scanners are correctly authenticated using device identity.
  prerequisites:
  - OIDC provider configured and accessible.
  - Test user accounts provisioned.
  - At least two physical scanning devices registered with the system.
  test_steps:
  - step_number: 1
    action: Attempt to log into the main orchestration platform interface using a
      standard user account via the OIDC login portal.
    expected_result: User is successfully authenticated and redirected to the main
      dashboard within 5 seconds.
    data_to_capture:
    - Login timestamp
    - OIDC token validity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Using the first registered scanner, attempt to perform a Chain-of-Identity
      (CoI) scan (e.g., patient wristband scan) within an active workflow.
    expected_result: The scanner successfully transmits the scanned data, and the
      system verifies the scanner's device identity against the registered list.
    data_to_capture:
    - Scanner ID used
    - Successful scan data transmission log
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to perform the same CoI scan using an unregistered or unauthorized
      device.
    expected_result: The system rejects the scan attempt, logging a 'Device Identity
      Mismatch' error, and the workflow step is not advanced.
    data_to_capture:
    - Unauthorized device ID
    - Error message logged
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All authorized users can log in successfully via OIDC.
  - Only registered scanners can successfully submit CoI data.
  - Unauthorized device usage is blocked and logged.
  regulatory_basis:
  - URS-028-014
  risk_level: high
  data_integrity_requirements:
  - Ensure device identity verification does not corrupt the CoI record.
  urs_requirements:
  - URS-028-014
  related_tests:
  - OQ-004
  estimated_duration_minutes: 45
  required_expertise:
  - Security Engineer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
