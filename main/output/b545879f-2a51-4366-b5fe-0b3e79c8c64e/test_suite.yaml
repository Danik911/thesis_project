- test_id: OQ-019
  test_name: Verify Message Bus Resilience During Input Ingestion Failure
  test_category: integration
  gamp_category: 5
  objective: Verify the system's resilience and message handling when an upstream
    integration (e.g., LIMS) fails to deliver required input data during batch ingestion.
  prerequisites:
  - System is fully deployed and operational.
  - LIMS API simulator configured to intentionally fail ingestion requests for a specific
    batch.
  - Monitoring tools are active to observe Kafka/Message Bus state.
  test_steps:
  - step_number: 1
    action: Initiate the batch release process for a new batch, providing valid metadata
      but triggering the LIMS API simulator to return a connection error for QC results.
    expected_result: The orchestrator service should log the ingestion failure, place
      the incomplete batch message onto the message bus with appropriate error metadata,
      and prevent premature release scoring.
    data_to_capture:
    - Message Bus queue depth and error logs.
    - Status of the batch record in the orchestrator database (should be 'Pending
      Ingestion').
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Resolve the simulated LIMS failure and re-trigger the ingestion mechanism
      (or wait for automated retry, if applicable).
    expected_result: The system successfully ingests the previously failed data, processes
      the batch according to the current release rules, and moves the batch to the
      next stage (e.g., Scoring).
    data_to_capture:
    - Time taken for successful re-ingestion and subsequent processing.
    - Audit log entry confirming data lineage for the recovered inputs.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the final disposition (Release/Reject) is based on the complete,
      successfully ingested data set, not the partial failure state.
    expected_result: The final disposition matches the expected outcome based on the
      complete data set, confirming no data loss occurred due to the transient integration
      failure.
    data_to_capture:
    - Final batch disposition.
    - Comparison of input data used vs. expected input data.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully handles transient upstream integration failures without
    data loss.
  - The batch processing resumes correctly once the upstream connection is restored.
  - The final release decision reflects the complete data set.
  regulatory_basis:
  - URS-025-001 (Ingest test results)
  - URS-025-008 (ALCOA+ attributes)
  - URS-025-015 (Message bus resilience)
  risk_level: high
  data_integrity_requirements:
  - Message persistence and guaranteed delivery semantics must be confirmed.
  urs_requirements:
