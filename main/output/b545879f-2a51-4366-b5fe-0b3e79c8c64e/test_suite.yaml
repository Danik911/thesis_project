test_cases:
- test_id: OQ-001
  test_name: Verify Proprietary Release Scoring Algorithm Execution and Explainability
  test_category: functional
  gamp_category: 5
  objective: Verify the system correctly applies the proprietary multi-factor release
    scoring algorithm and presents the resulting decision with full explainability.
  prerequisites:
  - System is fully deployed and configured (URS-025-017).
  - API endpoints for LIMS/QMS simulation are active.
  - A test batch configuration with known input parameters (QC results, deviations)
    is loaded.
  test_steps:
  - step_number: 1
    action: Simulate ingestion of a batch's data set (1000 inputs) via the designated
      API endpoint, including positive and negative indicators for release.
    expected_result: The orchestrator accepts the input payload without error, and
      an event is logged on the message bus.
    data_to_capture:
    - API response code
    - Message bus event ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the system to observe the execution of the release scoring algorithm
      (URS-025-002).
    expected_result: A final disposition (e.g., RELEASED, HOLD, REJECT) is determined
      within the required time frame (< 5 seconds).
    data_to_capture:
    - Total processing time
    - Final disposition status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the Explainability Dashboard for the processed batch decision (URS-025-003).
    expected_result: The dashboard displays the calculated score, the weight contribution
      of each input factor (QC, deviation, stability), and the rationale leading to
      the final disposition.
    data_to_capture:
    - Screenshot of the dashboard showing factor contributions
    - Calculated final score
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The batch decision is rendered in under 5 seconds.
  - The final disposition matches the expected outcome based on the known input data
    and the proprietary algorithm logic.
  - All input factors contributing to the score are traceable and visible on the dashboard.
  regulatory_basis:
  - URS-025-003 (Explainability)
  - URS-025-010 (Traceability)
  risk_level: high
  data_integrity_requirements:
  - All input data must maintain ALCOA+ attributes (URS-025-008).
  urs_requirements:
  - URS-025-001
  - URS-025-002
  - URS-025-003
  - URS-025-011
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Algorithm Developer
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Rule Versioning and Manual Override with Dual E-Signature
  test_category: functional
  gamp_category: 5
  objective: Validate the system's ability to manage rule versions, successfully execute
    a manual override, and enforce 21 CFR Part 11 compliant e-signatures.
  prerequisites:
  - System is running Rule Version 1.0.
  - A new rule set (Version 2.0) is staged but not active.
  - Two distinct user accounts with appropriate signing privileges are available (User
    A and User B).
  test_steps:
  - step_number: 1
    action: Process a batch that should automatically fail under Version 1.0 rules,
      and attempt to manually override the decision to RELEASED (URS-025-004).
    expected_result: The system prompts for the first e-signature (User A) and rationale.
    data_to_capture:
    - User A signature timestamp and rationale
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: User A completes the first signature. Immediately attempt to complete
      the second required e-signature (User B) for the override.
    expected_result: The system accepts the second signature, and the batch is marked
      as manually released.
    data_to_capture:
    - User B signature timestamp and rationale
    - Final disposition record
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Activate Rule Version 2.0 and attempt to rollback to Version 1.0 (URS-025-006).
    expected_result: The system successfully rolls back the active rule set to Version
      1.0, and Version 2.0 remains available for future use.
    data_to_capture:
    - Active rule version confirmation
    - Audit log entry for rollback action
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Generate the final release packet for the manually overridden batch (URS-025-005).
    expected_result: The packet includes the original inputs, the algorithm score
      (if calculated), the dual e-signatures, and the rationale for the override.
    data_to_capture:
    - Release packet generation confirmation
    - Verification that signatures are embedded in the packet
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Manual override requires and successfully captures two distinct, compliant e-signatures.
  - Rule versioning allows activation of a new version and successful rollback to
    the previous version.
  - The final release packet contains all required evidentiary documents, including
    override details.
  regulatory_basis:
  - URS-025-004 (Manual Override)
  - URS-025-009 (21 CFR Part 11)
  - URS-025-006 (Versioning)
  risk_level: critical
  data_integrity_requirements:
  - Audit trail must capture the identity, date, time, and reason for the override
    and signature actions (URS-025-016).
  urs_requirements:
  - URS-025-004
  - URS-025-005
  - URS-025-006
  - URS-025-009
  related_tests:
  - OQ-001
  estimated_duration_minutes: 90
  required_expertise:
  - Security/Compliance Specialist
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Sandbox What-If Analysis and Rule Rollback
  test_category: functional
  gamp_category: 5
  objective: To verify the system's capability to execute what-if analysis in the
    sandbox environment and successfully roll back rule versions.
  prerequisites:
  - System is fully operational with current release rules (V1.0) active.
  - Access to the sandbox environment is granted.
  - A set of representative LIMS/QC data is available for simulation.
  test_steps:
  - step_number: 1
    action: Access the sandbox environment and load the current release rule set (V1.0).
    expected_result: Sandbox environment loads successfully, displaying the active
      rule set configuration.
    data_to_capture:
    - Sandbox load time
    - Active rule version displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Modify a critical parameter within the proprietary release scoring algorithm
      (e.g., change weightings) to create a hypothetical V1.1 rule set.
    expected_result: The V1.1 rule set is saved as a draft/sandbox version, distinct
      from the active V1.0.
    data_to_capture:
    - New rule version identifier (V1.1)
    - Configuration changes logged
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Execute the what-if analysis using the V1.1 rule set against the representative
      input data set.
    expected_result: The system processes the data using V1.1 rules and displays the
      resulting disposition and explainability report without affecting production
      data.
    data_to_capture:
    - Resulting batch disposition under V1.1
    - Explainability report content
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Discard the V1.1 sandbox changes and verify that the production system
      reverts to using the original V1.0 rule set.
    expected_result: The system confirms that the active rule version is V1.0, and
      a subsequent test run confirms the original disposition.
    data_to_capture:
    - Final active rule version confirmation
    - Rollback confirmation timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - What-if analysis executes successfully using non-production rules.
  - Sandbox modifications do not impact the live release process.
  - The system correctly reverts to the previously active rule version upon sandbox
    discard.
  regulatory_basis:
  - URS-025-006 (Rule versioning with rollback)
  - URS-025-007 (Sandbox for what-if analysis)
  risk_level: medium
  data_integrity_requirements:
  - Ensure sandbox operations do not corrupt production audit trails.
  urs_requirements:
  - URS-025-006
  - URS-025-007
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Application Developer
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Data Lineage and Part 11 Compliance for Release Packet Generation
  test_category: data_integrity
  gamp_category: 5
  objective: To verify that the generated release packet contains complete, traceable
    data lineage and adheres to 21 CFR Part 11 requirements for electronic signatures.
  prerequisites:
  - A batch requiring release has been processed through the orchestrator.
  - The batch decision has resulted in an automatic 'Release' disposition.
  - User accounts with appropriate e-signature privileges are available.
  test_steps:
  - step_number: 1
    action: Trigger the generation of the final release packet for the test batch.
    expected_result: The system generates a comprehensive release packet containing
      all evidentiary documents.
    data_to_capture:
    - Release packet generation time
    - Total number of included documents
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Inspect the lineage section of the release packet to trace a specific
      input metric (e.g., a single LIMS result) back to its source system.
    expected_result: The lineage clearly maps the input metric to the originating
      API call, timestamp, and source system ID, satisfying ALCOA+.
    data_to_capture:
    - Traceability path for the selected input
    - Timestamp verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the final disposition record within the packet to confirm the presence
      of the electronic signature block.
    expected_result: The signature block includes User ID, Date/Time, Meaning of Signature,
      and Audit Trail reference, compliant with Part 11.
    data_to_capture:
    - Signature block details
    - Audit trail reference ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the immutable audit store contains an entry corresponding
      to the final release decision and signature event.
    expected_result: The audit store entry is immutable, time-stamped, and accurately
      reflects the final disposition and the identity of the signing authority.
    data_to_capture:
    - Audit store entry hash/ID
    - Verification of append-only status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The release packet is complete and contains all required inputs and outputs.
  - Data lineage is fully traceable from algorithm output back to source system inputs
    (URS-025-010).
  - Electronic signatures meet all 21 CFR Part 11 requirements (URS-025-009).
  regulatory_basis:
  - URS-025-008 (ALCOA+)
  - URS-025-009 (21 CFR Part 11)
  - URS-025-010 (Traceability)
  risk_level: critical
  data_integrity_requirements:
  - Ensure all data within the packet is protected against unauthorized modification
    (URS-025-016).
  urs_requirements:
  - URS-025-005
  - URS-025-008
  - URS-025-009
  - URS-025-010
  related_tests:
  - OQ-001
  estimated_duration_minutes: 75
  required_expertise:
  - Validation Engineer
  - Regulatory Compliance Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify High-Volume Input Processing and Performance SLA
  test_category: performance
  gamp_category: 5
  objective: Verify the system meets the sub-5-second processing SLA when ingesting
    1,000 combined inputs (QC, deviations, stability metrics).
  prerequisites:
  - System is deployed in active-active configuration.
  - Test harness capable of simulating 1,000 API inputs simultaneously.
  - Monitoring tools configured to capture end-to-end processing time.
  test_steps:
  - step_number: 1
    action: Initiate the ingestion of a batch payload containing exactly 1,000 simulated
      data points (QC results, deviations, stability metrics) via the primary ingestion
      API.
    expected_result: The ingestion API returns a success code (e.g., HTTP 202) indicating
      queuing.
    data_to_capture:
    - Ingestion timestamp
    - API response code
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the orchestrator service logs and performance monitoring tools
      to capture the time elapsed from ingestion completion to the final disposition
      calculation.
    expected_result: The total processing time for the batch decision must be less
      than 5.0 seconds.
    data_to_capture:
    - Start time of processing
    - End time of processing
    - Total elapsed time (ms)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the final disposition generated by the algorithm is recorded and
      accessible via the explainability dashboard.
    expected_result: A valid release decision (Pass/Fail/Hold) is present, and the
      processing time meets the SLA.
    data_to_capture:
    - Final disposition status
    - Link to generated explanation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully processes 1,000 inputs.
  - The end-to-end decision time is strictly less than 5.0 seconds.
  - The system remains stable and responsive during the high-load test.
  regulatory_basis:
  - URS-025-011
  risk_level: high
  data_integrity_requirements:
  - All 1,000 inputs must be accounted for in the audit store.
  urs_requirements:
  - URS-025-001
  - URS-025-002
  - URS-025-011
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - Performance Testing
  - Microservices Architecture
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify Integration Connectivity and Role-Based Authorization (SSO/OIDC)
  test_category: integration
  gamp_category: 5
  objective: Verify successful bidirectional API integration with LIMS/QMS/ERP and
    confirm SSO/OIDC enforcement for role-based access control.
  prerequisites:
  - LIMS, QMS, and ERP test instances are accessible.
  - OIDC Identity Provider (IdP) is configured.
  - Test users configured with 'QC Analyst' and 'Release Manager' roles.
  test_steps:
  - step_number: 1
    action: Using a 'QC Analyst' credential authenticated via OIDC, attempt to push
      a simulated QC result payload to the orchestrator API.
    expected_result: The API accepts the payload, and the orchestrator successfully
      logs the input via the message bus.
    data_to_capture:
    - API response code
    - Audit log entry confirming data ingestion
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Using the same 'QC Analyst' credential, attempt to access the manual override
      function (URS-025-004) via the UI/API.
    expected_result: Access to the manual override function is denied with an authorization
      error.
    data_to_capture:
    - Authorization failure message
    - Audit log entry for failed access attempt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Using a 'Release Manager' credential authenticated via OIDC, successfully
      execute a manual override requiring dual e-signature.
    expected_result: The override is accepted, and both signatures are correctly captured
      with Part 11 compliance.
    data_to_capture:
    - Confirmation of successful override
    - Evidence of dual e-signature capture
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the orchestrator successfully pulls and processes a simulated
      stability metric update from the external stability trending system via its
      configured API.
    expected_result: The stability metric is ingested, and the system flags the batch
      for re-evaluation based on the new input.
    data_to_capture:
    - Confirmation of stability data ingestion
    - New batch status reflecting re-evaluation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All required external systems (LIMS, QMS, ERP) can successfully exchange data
    via API.
  - SSO/OIDC enforces role-based authorization correctly, preventing unauthorized
    actions.
  - Part 11 requirements are met for the Release Manager's signature.
  regulatory_basis:
  - URS-025-009
  - URS-025-013
  - URS-025-014
  risk_level: critical
  data_integrity_requirements:
  - Ensure all integration transactions are logged in the immutable audit store.
  urs_requirements:
  - URS-025-004
  - URS-025-009
  - URS-025-013
  - URS-025-014
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Integration Testing
  - Security/Authentication
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify Microservice Event Sourcing and Immutable Audit Store Integrity
  test_category: data_integrity
  gamp_category: 5
  objective: Verify that all state changes and release decisions are correctly captured
    via event sourcing and stored immutably, ensuring complete data lineage.
  prerequisites:
  - System deployed in OQ environment with active message bus (Kafka).
  - A test batch configured with known QC results and deviations.
  - Access credentials for the audit store database/log.
  test_steps:
  - step_number: 1
    action: Submit a batch record for processing through the Orchestrator API, triggering
      the release algorithm.
    expected_result: The Orchestrator successfully processes the batch and generates
      a preliminary disposition.
    data_to_capture:
    - Batch ID
    - Timestamp of submission
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Inspect the message bus (Kafka topics) associated with the batch processing
      to confirm that all intermediate steps (input ingestion, scoring calculation,
      disposition) are recorded as discrete events.
    expected_result: All processing steps are verifiable as sequential, immutable
      events in the message bus.
    data_to_capture:
    - Event IDs and sequence numbers
    - Payloads of key events (e.g., scoring result event)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Query the immutable audit store directly and verify that the final release
      decision and all preceding events are present, correctly sequenced, and cannot
      be modified.
    expected_result: The audit store contains a complete, unalterable record matching
      the sequence observed in the message bus, satisfying ALCOA+ requirements.
    data_to_capture:
    - Audit store entry hashes/checksums
    - Comparison report between Kafka events and Audit Store entries
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All processing steps are captured as distinct, time-stamped events.
  - The audit store reflects the exact sequence of events without modification.
  - Data lineage (URS-025-008) is fully traceable from input to final disposition
    (URS-025-010).
  regulatory_basis:
  - 21 CFR Part 11 (Audit Trails)
  - URS-025-008
  - URS-025-010
  - URS-025-016
  risk_level: high
  data_integrity_requirements:
  - Immutability verification
  - Event sequencing validation
  urs_requirements:
  - URS-025-002
  - URS-025-010
  - URS-025-016
  related_tests:
  - OQ-004
  estimated_duration_minutes: 60
  required_expertise:
  - Microservices Architecture
  - Kafka/Event Sourcing
  - Database Forensics
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Availability SLA and Blue/Green Deployment Rollback Functionality
  test_category: performance
  gamp_category: 5
  objective: Verify the system meets the 99.9% availability SLA under load and confirm
    the automated rollback mechanism functions correctly during a simulated deployment
    failure.
  prerequisites:
  - System running in active-active configuration.
  - Load testing tools configured to simulate 1000 concurrent inputs.
  - Access to deployment pipeline controls.
  test_steps:
  - step_number: 1
    action: Execute sustained load test simulating 1,000 inputs per minute for 1 hour,
      monitoring system availability and response times.
    expected_result: System availability remains above 99.9% for the duration, and
      individual batch processing remains under the 5-second SLA.
    data_to_capture:
    - Total processed batches
    - Total downtime incidents
    - Average and P95 latency metrics
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate a simulated Blue/Green deployment where the 'Green' environment
      is intentionally configured to fail the initial health check (e.g., by disabling
      a critical integration API).
    expected_result: The deployment pipeline automatically detects the failure and
      immediately routes all traffic back to the stable 'Blue' environment without
      user intervention.
    data_to_capture:
    - Time taken for failure detection
    - Time taken for traffic redirection/rollback completion
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that batches processed during the rollback window were correctly
      handled (either completed by Blue or queued/reprocessed without data loss).
    expected_result: No batches are lost or corrupted during the automated rollback
      sequence.
    data_to_capture:
    - Status of batches submitted during the rollback window
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Availability target of 99.9% is met during sustained load testing.
  - Automated Blue/Green rollback successfully reverts traffic within defined safety
    thresholds.
  - No data loss or corruption occurs during the automated rollback procedure (URS-025-017).
  regulatory_basis:
  - URS-025-012
  - URS-025-017
  risk_level: medium
  data_integrity_requirements:
  - Verification of zero data loss during deployment switchover.
  urs_requirements:
  - URS-025-011
  - URS-025-012
  - URS-025-017
  related_tests:
  - OQ-005
  estimated_duration_minutes: 90
  required_expertise:
  - Load Testing
  - DevOps/CI/CD
  - High Availability Architecture
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify LIMS/QMS Integration Data Ingestion and Lineage
  test_category: integration
  gamp_category: 5
  objective: Verify successful ingestion of QC results and deviations from LIMS and
    QMS via API, ensuring data lineage is correctly established.
  prerequisites:
  - LIMS and QMS systems are configured for API communication.
  - Test batch data (including known deviations and QC results) is staged.
  - Orchestrator service is running in OQ environment.
  test_steps:
  - step_number: 1
    action: Initiate batch processing by sending a trigger request to the Orchestrator
      API for a specific batch ID.
    expected_result: The Orchestrator accepts the trigger and begins processing.
    data_to_capture:
    - Batch ID
    - API response time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the Orchestrator's message bus (Kafka) to confirm receipt of LIMS
      (QC results) and QMS (Deviation records) events.
    expected_result: Corresponding events for QC results and deviations are logged
      on the message bus within 1 second.
    data_to_capture:
    - Event timestamps
    - Payload verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Query the Orchestrator's data store to verify that the ingested inputs
      (URS-025-001) are correctly mapped and linked to the batch record, establishing
      full data lineage (URS-025-008).
    expected_result: All input records show correct source system IDs, timestamps,
      and are traceable to the final release decision record.
    data_to_capture:
    - Lineage trace IDs
