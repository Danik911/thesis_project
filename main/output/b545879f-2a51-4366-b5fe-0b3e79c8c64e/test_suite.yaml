- test_id: OQ-020
  test_name: Verify Explainability Dashboard Traceability During Rule Version Change
  test_category: data_integrity
  gamp_category: 5
  objective: Verify that the Explainability Dashboard accurately reflects the specific
    version of the proprietary algorithm used for a decision, especially when rule
    versions are updated concurrently.
  prerequisites:
  - System is running with Rule Version V1.0 active.
  - A batch (Batch A) is processed using V1.0.
  - Rule Version V2.0 (with a known change to scoring weights) is deployed but not
    yet active for new batches.
  - A second batch (Batch B) is processed using V2.0.
  test_steps:
  - step_number: 1
    action: Access the Explainability Dashboard for Batch A (processed under V1.0)
      and record the calculated score and the rule version cited.
    expected_result: The dashboard explicitly states that Release Rule Version V1.0
      was used, and the score calculation matches the expected output for V1.0.
    data_to_capture:
    - Batch A Score and V1.0 citation.
    - Audit log entry confirming Batch A used V1.0.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access the Explainability Dashboard for Batch B (processed under V2.0)
      and record the calculated score and the rule version cited.
    expected_result: The dashboard explicitly states that Release Rule Version V2.0
      was used, and the score calculation reflects the changes introduced in V2.0.
    data_to_capture:
    - Batch B Score and V2.0 citation.
    - Audit log entry confirming Batch B used V2.0.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to view the explanation for Batch A using the V2.0 rule set configuration
      (simulating a potential misconfiguration in the dashboard viewer).
    expected_result: The system must prevent the V2.0 engine from recalculating or
      displaying the explanation for Batch A, enforcing that the explanation is tied
      to the immutable audit record of the V1.0 execution.
    data_to_capture:
    - Error message or warning indicating version mismatch.
    - Confirmation that Batch A's displayed explanation remains tied to V1.0.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Traceability (URS-025-010) is maintained, linking the decision to the exact rule
    version used.
  - The Explainability Dashboard (URS-025-003) correctly reflects the versioning implemented
    in URS-025-006.
  - Concurrent rule versions do not corrupt the historical explanation fidelity.
  regulatory_basis:
  - URS-025-003 (Explainability dashboard)
  - URS-025-006 (Rule versioning)
  - URS-025-010 (Traceability)
  risk_level: medium
  data_integrity_requirements:
  - The rule version identifier must be stored immutably alongside the final decision
    record.
  urs_requirements:
  - URS-025-003
  - URS-025-006
  - URS-025-010
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Algorithm Validation
  - Configuration Management
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
