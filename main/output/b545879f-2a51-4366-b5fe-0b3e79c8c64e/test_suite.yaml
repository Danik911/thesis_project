- test_id: OQ-030
  test_name: Verify Explainability Traceability During Rule Version Rollback
  test_category: data_integrity
  gamp_category: 5
  objective: Verify that the Explainability Dashboard accurately reflects the specific
    rule version used for a decision, even after a rollback to a previous version.
  prerequisites:
  - System is running Rule Version V2.0.
  - A batch (Batch_V2) was released using V2.0 rules.
  - Rule Version V1.0 (which yields a different score) is available for rollback.
  test_steps:
  - step_number: 1
    action: Access the Explainability Dashboard for Batch_V2 (released under V2.0).
    expected_result: The dashboard displays the release score and explicitly states
      that Rule Version V2.0 was used for calculation.
    data_to_capture:
    - Displayed Rule Version for Batch_V2
    - Score components from V2.0
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Execute a system rollback to Rule Version V1.0 (URS-025-006).
    expected_result: The system confirms the rollback to V1.0.
    data_to_capture:
    - Timestamp of rollback
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Re-access the Explainability Dashboard for the *already released* Batch_V2.
    expected_result: The dashboard must still display the original score calculated
      by V2.0, and explicitly state that the decision was based on V2.0, demonstrating
      historical traceability.
    data_to_capture:
    - Displayed Rule Version for Batch_V2 (should remain V2.0)
    - Score components (should match Step 1)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Use the sandbox (URS-025-007) with the *current* active rule set (V1.0)
      to process the inputs from Batch_V2.
    expected_result: The sandbox calculates a new, different score based on V1.0 rules,
      confirming V1.0 is active, but the historical record for Batch_V2 remains unchanged.
    data_to_capture:
    - Sandbox calculated score (V1.0)
    - Comparison between historical score and sandbox score
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Historical release decisions maintain immutable linkage to the exact rule version
    used at the time of decision.
  - Rollback only affects future processing/sandbox analysis, not historical records.
  - The Explainability Dashboard correctly identifies the historical rule version.
  regulatory_basis:
  - URS-025-003
  - URS-025-006
  - URS-025-010
  risk_level: high
  data_integrity_requirements:
  - Ensure historical data integrity is maintained across configuration changes (rule
    versioning).
