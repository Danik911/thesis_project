- test_id: OQ-012
  test_name: Verify Event Sourcing Integrity During Rule Version Rollback
  test_category: data_integrity
  gamp_category: 5
  objective: To verify that when a rule version rollback is executed, the system correctly
    reverts the processing logic while maintaining the immutability and lineage of
    the original audit trail and event store.
  prerequisites:
  - System is running Rule Version V2.0.
  - A batch (Batch Y) was processed and released using V2.0 rules.
  - Rule Version V1.0 (known to produce a different result for Batch Y) is available
    for rollback.
  test_steps:
  - step_number: 1
    action: Execute the rule version rollback mechanism to revert the active rule
      set from V2.0 back to V1.0.
    expected_result: The system confirms the rollback, and the active rule version
      is updated to V1.0.
    data_to_capture:
    - Timestamp of rollback initiation and completion
    - Confirmation of active rule version change.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Re-process Batch Y (which was previously processed under V2.0) using the
      newly active V1.0 rule set.
    expected_result: The system applies V1.0 logic, resulting in a disposition different
      from the original V2.0 disposition.
    data_to_capture:
    - New disposition result for Batch Y
    - Comparison against the original V2.0 result.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Inspect the immutable audit store and event sourcing logs for Batch Y.
    expected_result: The audit store must contain the original V2.0 processing events
      AND the new V1.0 reprocessing events, demonstrating that the original data was
      not modified, only appended to.
    data_to_capture:
    - Evidence of both V2.0 and V1.0 processing events in the append-only log.
    - Verification that the V2.0 release packet remains accessible/traceable.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Rule rollback successfully switches the active processing logic.
  - Reprocessing yields the expected result based on the older rule version.
  - The immutable audit store retains full, unalterable history of both processing
    runs.
  regulatory_basis:
  - URS-025-006
  - URS-025-008
  - URS-025-016
  risk_level: critical
  data_integrity_requirements:
  - Event sourcing integrity must be maintained across rule version changes.
  urs_requirements:
  - URS-025-006
  - URS-025-016
  related_tests:
  - OQ-003
  - OQ-007
  estimated_duration_minutes: 75
  required_expertise:
  - Data Architect
  - Validation Lead
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
