    - Rule application consistency
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify the system correctly identifies and flags all expected Nelson rule
      violations
    expected_result: All known pattern violations are correctly identified and visually
      flagged on the chart
    data_to_capture:
    - Violation detection accuracy
    - Visual flagging effectiveness
    - Rule interpretation consistency
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Export the chart with Nelson rule violations to PDF using the vendor standard
      export feature
    expected_result: PDF export completes successfully with all chart elements and
      violation markers preserved
    data_to_capture:
    - PDF export completion
    - Content preservation in export
    - Export file integrity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Nelson rules are correctly applied to detect pattern violations
  - All expected violations are accurately identified
  - PDF export contains complete chart with all annotations and markers
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - FDA guidance on process validation
  - GAMP 5 software category 3 validation
  risk_level: medium
  data_integrity_requirements:
  - Nelson rule application must be consistent and accurate
  - Export functionality must preserve all chart data and annotations
  - Pattern detection must be reliable and repeatable
  urs_requirements:
  - URS-020-002
  - URS-020-003
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-001
  - PQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - Nelson rules knowledge
  - PDF export verification
  - Statistical pattern recognition
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based Access Control and Read-Only Data Verification
  test_category: security
  gamp_category: 3
  objective: To verify that the system correctly enforces role-based view access and
    prevents modification of released datasets as required by regulatory controls.
  prerequisites:
  - System installation is complete and validated
  - Test users with different roles (e.g., Viewer, Analyst) are created
  - A sample dataset has been imported and marked as 'released'
  test_steps:
  - step_number: 1
    action: Log in to the SPC dashboard as a user with 'Viewer' role permissions.
    expected_result: Login is successful. The user interface displays only viewable
      functions as defined for the Viewer role.
    data_to_capture:
    - Screenshot of the dashboard interface post-login
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the previously released dataset and attempt to edit any data
      point or chart configuration.
    expected_result: The system prevents any edits and displays a message indicating
      the data is read-only.
    data_to_capture:
    - Screenshot of the error/warning message
    - Log entry confirming the access denial
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log in as a user with 'Analyst' or higher privileges. Attempt
      to modify the same released dataset.
    expected_result: The system prevents modification of the released dataset, even
      for privileged users, enforcing read-only access.
    data_to_capture:
    - Screenshot confirming read-only status for the dataset
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access is functional and restricts actions appropriately.
  - Released datasets are immutable and cannot be altered by any user role.
  - The system provides a clear indication when access to a function is denied.
  regulatory_basis:
  - 21 CFR Part 11 - Controls for closed systems and electronic records
  - General data integrity principles (ALCOA+) ensuring data is Attributable, Legible,
    Contemporaneous, Original, and Accurate
  risk_level: high
  data_integrity_requirements:
  - Ensures data cannot be altered after release, maintaining its integrity and validity
    for regulatory purposes.
  urs_requirements:
  - 'URS-020-004: The dashboard shall allow role-based view access.'
  - 'URS-020-007: Read-only access for released datasets.'
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - QA Analyst
  - IT Security Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: ODBC Data Import and Annotation Functionality Verification
  test_category: integration
  gamp_category: 3
  objective: To verify the system's ability to import data via a standard ODBC connection
    and allow users to annotate data points using built-in features.
  prerequisites:
  - System installation is complete and validated
  - A test database with a configured ODBC Data Source Name (DSN) is available
  - Valid login credentials for the test database
  test_steps:
  - step_number: 1
    action: From the SPC dashboard main menu, select the option to import data via
      an ODBC connection.
    expected_result: The system displays a configuration dialog for specifying the
      ODBC DSN and connection parameters.
    data_to_capture:
    - Screenshot of the ODBC connection configuration screen
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Enter the valid DSN, username, and password for the test database and
      execute the import for a predefined table or query.
    expected_result: The system successfully connects to the database and imports
      the specified data without errors. A confirmation message is displayed.
    data_to_capture:
    - Screenshot of the successful import confirmation
    - Log file entry confirming the data transfer
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Create a control chart (e.g., X-bar/R) from the imported ODBC data.
    expected_result: The chart is rendered correctly, displaying the data points from
      the ODBC source.
    data_to_capture:
    - Screenshot of the generated control chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Select a specific data point on the chart and use the built-in annotation
      feature to add a comment (e.g., 'Investigation Initiated'). Save the annotation.
    expected_result: The annotation is successfully saved and is visibly associated
      with the selected data point on the chart.
    data_to_capture:
    - Screenshot of the chart showing the annotated point
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data is successfully imported into the SPC dashboard from a configured ODBC source.
  - The imported data is accurately represented in the generated control charts.
  - The annotation feature functions correctly, allowing comments to be saved and
    displayed on specific data points.
  regulatory_basis:
  - General principle for data transfer integrity ensuring data is not corrupted during
    import.
  risk_level: medium
  data_integrity_requirements:
  - Verifies that data transferred via ODBC maintains accuracy and completeness.
  - Annotations provide necessary context for data points, supporting data reliability.
  urs_requirements:
  - 'URS-020-005: Users shall annotate points with comments using built-in features.'
  - 'URS-020-012: Import data from CSV and ODBC connections using standard connectors.'
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - Database Administrator
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
