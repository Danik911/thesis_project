- test_id: OQ-008
  test_name: Configuration Control and Audit Trail Verification
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that chart configurations are retained as controlled records and
    that vendor-provided audit trail functionality for configuration changes operates
    correctly.
  prerequisites:
  - OQ-001 execution passed
  - User account with configuration editing permissions
  - A saved chart configuration from a previous test
  - Access to vendor audit trail/log viewing feature if available
  test_steps:
  - step_number: 1
    action: Log in and open a previously saved chart configuration. Verify all settings
      (limits, rules, annotations) are correctly loaded.
    expected_result: The chart configuration is retrieved accurately with all original
      settings preserved.
    data_to_capture:
    - Screenshot of loaded configuration
    - List of any discrepancies from original settings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Make a defined change to the chart configuration (e.g., change a control
      limit value or toggle a Nelson rule) and save the configuration.
    expected_result: System confirms the configuration has been saved successfully.
    data_to_capture:
    - Description of the specific change made
    - Timestamp of the save action
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: If the vendor provides an audit trail feature, access it and locate the
      record for the configuration change made in step 2.
    expected_result: The audit trail displays an entry with the user ID, timestamp,
      and description of the change.
    data_to_capture:
    - Screenshot or transcript of the audit trail entry
    - Confirmation that the entry details match the action performed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log out and log in as a user with read-only access. Attempt to modify
      the saved configuration.
    expected_result: The system prevents modification and maintains the configuration
      in a read-only state, or does not present edit options.
    data_to_capture:
    - System message received when edit is attempted
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Saved chart configurations are retained accurately between sessions
  - If an audit trail is provided by the vendor, it captures configuration changes
    with user, timestamp, and action
  - Users with read-only access cannot modify released configurations
  - Configuration integrity is maintained after changes and saves
  regulatory_basis:
  - FDA 21 CFR Part 11 §11.10(e) for audit trails
  - FDA 21 CFR Part 11 §11.10(a) for limiting access
  - GAMP 5 for data integrity controls in configured products
  risk_level: high
  data_integrity_requirements:
  - Configuration records must be immutable once saved and released
  - Audit trail entries must be secure, timestamped, and user-specific if the feature
    exists
  - No unauthorized alterations to controlled configurations are permitted
  urs_requirements:
  - URS-020-007
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - GxP Data Integrity Principles
  - System Administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
