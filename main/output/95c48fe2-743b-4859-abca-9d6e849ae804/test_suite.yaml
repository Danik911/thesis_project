test_cases:
- test_id: OQ-001
  test_name: Verify Continuous Temperature Monitoring Functionality
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS continuously monitors temperature in GMP storage
    areas as per URS-EMS-001.
  prerequisites:
  - EMS software installed
  - Temperature sensors calibrated
  - System powered on
  test_steps:
  - step_number: 1
    action: Access the EMS software interface and navigate to the temperature monitoring
      section.
    expected_result: Temperature readings are displayed for all GMP storage areas.
    data_to_capture:
    - Current temperature readings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Observe the temperature readings for a period of 10 minutes.
    expected_result: Temperature readings are updated continuously at intervals not
      exceeding 5 minutes.
    data_to_capture:
    - Timestamp of readings
    - Temperature values
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Temperature readings are continuous and updated within 5-minute intervals.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Ensure all temperature readings are accurately recorded and stored.
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  related_tests:
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - EMS software operation
  - Temperature monitoring
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Validate Temperature Alert Generation
  test_category: functional
  gamp_category: 3
  objective: To validate that the EMS generates alerts when temperature deviates ±2°C
    from the setpoint as per URS-EMS-005.
  prerequisites:
  - EMS software installed
  - Temperature sensors calibrated
  - System powered on
  - Setpoint configured
  test_steps:
  - step_number: 1
    action: Simulate a temperature deviation of +2.5°C from the setpoint.
    expected_result: An alert is generated by the EMS indicating a temperature deviation.
    data_to_capture:
    - Alert message
    - Timestamp of alert
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate a temperature deviation of -2.5°C from the setpoint.
    expected_result: An alert is generated by the EMS indicating a temperature deviation.
    data_to_capture:
    - Alert message
    - Timestamp of alert
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alerts are generated for temperature deviations exceeding ±2°C from the setpoint.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Ensure all alerts are accurately recorded and stored.
  urs_requirements:
  - URS-EMS-005
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - EMS software operation
  - Temperature monitoring
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
