- test_id: OQ-001
  test_name: Document Assignment and Acknowledgment Workflow Verification
  test_category: functional
  gamp_category: 3
  objective: Verify that the COTS document acknowledgment module correctly assigns
    documents to users/groups and tracks completion status through the full workflow
    lifecycle
  prerequisites:
  - System installed and configured
  - Test user accounts created
  - Sample documents loaded into system
  - User groups configured
  test_steps:
  - step_number: 1
    action: Log into the system as an administrator and navigate to the document assignment
      module
    expected_result: Administrator successfully accesses the document assignment interface
      with all functionality available
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select a test document and assign it to both individual users and user
      groups using the vendor UI
    expected_result: System confirms assignment creation and displays the document
      in assigned users' pending acknowledgment lists
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as assigned test users and access the acknowledgment module to
      review and acknowledge the document
    expected_result: Users can access assigned documents, review content, and successfully
      complete electronic acknowledgment
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify completion status updates in real-time and check acknowledgment
      records in the administrator view
    expected_result: System immediately reflects acknowledgment status changes and
      maintains complete audit trail of all actions
    data_to_capture: []
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - 100% of assigned documents properly appear in user queues
  - Electronic signatures are captured and stored securely
  - Real-time status updates function correctly
  - Audit trail contains complete record of all assignment and acknowledgment events
  regulatory_basis:
  - 21 CFR Part 11 electronic signatures requirements
  - Annex 11 electronic records compliance
  - GDPR Article 30 record-keeping obligations
  risk_level: medium
  data_integrity_requirements:
  - ALCOA+ principles applied to all acknowledgment records
  - Immutable audit trail maintained for all transactions
  - Time-stamped electronic signatures with user identification
  urs_requirements:
  - URS-021-001
  - URS-021-005
  - URS-021-007
  related_tests:
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Management System knowledge
  - Document control procedures
  - Electronic signature requirements
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
