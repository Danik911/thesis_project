- test_id: OQ-008
  test_name: Electronic Signature Validation for Document Acknowledgment Process
  test_category: data_integrity
  gamp_category: 3
  objective: Validate that the vendor-provided electronic signature mechanism meets
    regulatory requirements for document acknowledgment records.
  prerequisites:
  - Test user accounts with document assignments
  - System configured for electronic signatures
  - Document requiring acknowledgment available in system
  - Audit trail functionality verified
  test_steps:
  - step_number: 1
    action: Log in as a test user and navigate to assigned documents requiring acknowledgment
    expected_result: System displays documents pending acknowledgment with clear option
      to acknowledge
    data_to_capture:
    - List of documents requiring acknowledgment
    - Interface screenshot
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select a document and initiate the acknowledgment process
    expected_result: System prompts for electronic signature with required fields
      including name, reason for signature, and password/credentials
    data_to_capture:
    - Signature prompt interface
    - Required fields displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Complete the electronic signature process with valid credentials
    expected_result: System accepts the signature, records the acknowledgment, and
      displays confirmation of successful completion
    data_to_capture:
    - Signature timestamp
    - User identity captured
    - Confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify the acknowledgment record in the database and associated audit
      trail entries
    expected_result: System creates a complete electronic record including signature
      components, timestamp, and document association meeting ALCOA+ principles
    data_to_capture:
    - Database record details
    - Audit trail entries related to the signature event
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Attempt to modify an acknowledged document record through database access
    expected_result: System prevents modification of signed records or creates appropriate
      audit trail entries for any attempted changes
    data_to_capture:
    - Modification attempt results
    - Audit trail entries for modification attempts
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Electronic signatures capture all required regulatory elements
  - Signed records are non-repudiable and tamper-evident
  - Audit trail captures signature events with appropriate detail
  - Signature mechanism prevents unauthorized use
  - Records maintain integrity throughout retention period
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Signatures Requirements
  - Annex 11 - Computerized Systems
  - FDA Guidance on Electronic Systems and Records
  - EU GMP Annex 4 and 11
  risk_level: high
  data_integrity_requirements:
  - Electronic signatures must be uniquely linked to their respective records
  - Signature components cannot be separated from their associated records
  - Signatures must be executed by legally authorized individuals
  - Records must be protected against modification after signing
  urs_requirements:
  - 'URS-021-005: Support vendor-provided electronic acknowledgment signature'
  - 'URS-021-006: Maintain acknowledgment records per retention policy'
  - 'URS-021-007: Provide audit trail for assignments and acknowledgments'
  related_tests:
  - 'OQ-003: Audit Trail Verification for Document Acknowledgment Process'
  - 'OQ-006: Audit Trail and Record Retention Compliance Verification'
  estimated_duration_minutes: 60
  required_expertise:
  - 21 CFR Part 11 Compliance Knowledge
  - Electronic Signature Validation Experience
  - Audit Trail Analysis Skills
  - Data Integrity Principles Understanding
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Document Acknowledgment Record Retention and Archival Verification
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that the system properly maintains acknowledgment records according
    to the defined retention policy and ensures data integrity throughout the retention
    period
  prerequisites:
  - System is installed and configured
  - Retention policy is defined in system configuration
  - Test documents and user accounts created
  - Historical acknowledgment data exists in the system
  test_steps:
  - step_number: 1
    action: Configure the system retention policy for acknowledgment records to a
      test period (e.g., 30 days)
    expected_result: System accepts and saves the retention policy configuration without
      errors
    data_to_capture:
    - Retention policy settings
    - Configuration save confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Create multiple document acknowledgment records with varying dates to
      simulate different aging periods
    expected_result: System successfully creates acknowledgment records with accurate
      timestamps
    data_to_capture:
    - Record creation dates
    - Acknowledgment timestamps
    - User and document associations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Execute the system's archival process for records exceeding the retention
      period
    expected_result: System identifies and archives records older than the retention
      period
    data_to_capture:
    - Number of records processed
    - Archival completion status
    - Error logs if any
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that archived records are no longer visible in standard reports
      but remain accessible in archival storage
    expected_result: Archived records are properly segregated and maintained according
      to retention requirements
    data_to_capture:
    - Report output before and after archival
    - Archival storage accessibility verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All acknowledgment records are maintained for the full retention period
  - Archived records remain intact and accessible for audit purposes
  - No data loss occurs during the archival process
  - System complies with configured retention policies
  regulatory_basis:
  - 21 CFR Part 11 - Electronic records requirements
  - Annex 11 - Electronic records and signatures
  - Company retention policy requirements
  risk_level: high
  data_integrity_requirements:
  - Records must maintain integrity throughout retention period
  - Archival process must not corrupt or alter original data
  - Audit trail must track all retention-related actions
  urs_requirements:
  - 'URS-021-006: Maintain acknowledgment records per retention policy'
  related_tests:
  - 'OQ-003: Audit Trail Verification'
  - 'OQ-006: Audit Trail and Record Retention Compliance Verification'
  estimated_duration_minutes: 45
  required_expertise:
  - System Administration
  - Quality Assurance
  - Data Management
  reviewed_by: QA Manager
  data_retention_period: 10 years
