  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Active Directory Integration and User Group Synchronization Test
  test_category: integration
  gamp_category: 3
  objective: Verify the system correctly synchronizes user groups from Active Directory
    using the standard connector and maintains proper group membership for document
    assignments.
  prerequisites:
  - System is installed and configured
  - Active Directory test environment is available
  - Test user groups are created in Active Directory
  - AD connector is properly configured
  test_steps:
  - step_number: 1
    action: Initiate a manual synchronization between the document acknowledgment
      system and Active Directory
    expected_result: Synchronization process completes successfully without errors
    data_to_capture:
    - Synchronization start/end time
    - Number of users/groups synchronized
    - Any error messages generated
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that user groups from Active Directory are correctly imported into
      the document acknowledgment system
    expected_result: All configured Active Directory groups are available in the document
      acknowledgment system
    data_to_capture:
    - List of synchronized groups
    - Group membership counts
    - Group attribute accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Assign a test document to a synchronized Active Directory group using
      the vendor UI
    expected_result: Document is successfully assigned to the AD group with all members
      receiving the assignment
    data_to_capture:
    - Assignment completion status
    - Number of users who received assignment
    - Group assignment details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Modify group membership in Active Directory and initiate another synchronization
    expected_result: Group membership changes are correctly reflected in the document
      acknowledgment system
    data_to_capture:
    - Membership change details
    - Synchronization results
    - Assignment status for added/removed users
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Active Directory groups are successfully synchronized with the document acknowledgment
    system
  - Document assignments to AD groups properly distribute to all group members
  - Group membership changes are accurately reflected after synchronization
  - Synchronization process completes without data loss or corruption
  regulatory_basis:
  - 21 CFR Part 11 - Controls for closed systems
  - GAMP 5 - Supplier and Service Provider Management
  risk_level: medium
  data_integrity_requirements:
  - User group data must maintain integrity during synchronization
  - Group membership must be accurately reflected for proper document assignment
  urs_requirements:
