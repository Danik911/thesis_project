test_cases:
- test_id: OQ-001
  test_name: Verify X-bar/R Chart Creation and Nelson Rule Application
  test_category: functional
  gamp_category: 3
  objective: To verify the system's capability to generate X-bar/R control charts
    from CSV input and correctly apply standard Nelson rules.
  prerequisites:
  - System is installed and accessible.
  - Valid test CSV file containing sufficient data points (e.g., > 30 subgroups) is
    available.
  - User has appropriate permissions to create charts.
  test_steps:
  - step_number: 1
    action: Navigate to the chart creation interface and select the option to import
      data from CSV.
    expected_result: The system successfully prompts for file selection.
    data_to_capture:
    - Timestamp of import initiation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Import the prepared CSV file and select X-bar/R chart type.
    expected_result: The X-bar/R chart renders successfully, displaying control limits
      and data points.
    data_to_capture:
    - Chart ID/Name
    - Control Limit Values (UCL, LCL, Center Line)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Enable the vendor's standard Nelson rules within the chart settings.
    expected_result: The system highlights or flags points that violate the enabled
      Nelson rules according to vendor specifications.
    data_to_capture:
    - Number of points flagged by Nelson rules
    - Screenshot of flagged points
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart is generated successfully from CSV input.
  - All standard Nelson rules provided by the vendor are correctly applied and visualized
    on the chart.
  regulatory_basis:
  - URS-020-001
  - URS-020-002
  risk_level: medium
  data_integrity_requirements:
  - Data imported matches source CSV data.
  urs_requirements:
  - URS-020-001
  - URS-020-002
  related_tests:
  - OQ-003
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Role-Based Access and Configuration Export Functionality
  test_category: security
  gamp_category: 3
  objective: To confirm that user roles restrict chart viewing access and that chart
    configurations can be exported correctly.
  prerequisites:
  - 'System is configured with at least two distinct user roles: ''Viewer'' (read-only)
    and ''Editor''.'
  - A saved chart configuration exists.
  - User authentication via AD (if applicable) is functional.
  test_steps:
  - step_number: 1
    action: Log in as a user with 'Viewer' role.
    expected_result: Login is successful.
    data_to_capture:
    - Username used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to view the saved chart configuration.
    expected_result: The chart configuration is visible, but any modification options
      (e.g., edit, save changes) are disabled or hidden.
    data_to_capture:
    - Verification of disabled edit buttons
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to export the chart configuration to PDF using the built-in export
      function.
    expected_result: The PDF export completes successfully, containing the chart visualization
      and metadata.
    data_to_capture:
    - PDF file hash/size
    - Timestamp of export
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log out and log in as a user with 'Editor' role.
    expected_result: Login is successful.
    data_to_capture:
    - Username used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Attempt to export the chart configuration to CSV.
    expected_result: The CSV export completes successfully, containing chart settings
      and potentially raw data/metadata.
    data_to_capture:
    - CSV file hash/size
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Users with 'Viewer' role cannot modify chart configurations.
  - Both PDF and CSV exports of the chart configuration are generated successfully
    and contain accurate information.
  regulatory_basis:
  - URS-020-004
  - URS-020-003
  - URS-020-008
  risk_level: low
  data_integrity_requirements:
  - Exported configuration accurately reflects the saved state.
  urs_requirements:
  - URS-020-003
  - URS-020-004
  - URS-020-008
  related_tests:
  - OQ-001
  estimated_duration_minutes: 40
  required_expertise:
  - Security Tester
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Data Import Performance and Chart Rendering Speed
  test_category: performance
  gamp_category: 3
  objective: To verify that the system can load a large dataset (100k points) within
    the specified time limit and render charts quickly after filtering.
  prerequisites:
  - System is installed and configured.
  - A CSV file containing 100,000 data points is available.
  - User has permissions to import data and view charts.
  test_steps:
  - step_number: 1
    action: Start a timer and import the 100k data point CSV file using the standard
      import function.
    expected_result: Data import completes successfully, and the total time taken
      is recorded.
    data_to_capture:
    - Time taken for data import (must be < 5 seconds).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the chart creation screen and generate an X-bar/R chart using
      the newly imported data.
    expected_result: The chart renders successfully.
    data_to_capture:
    - Time taken for chart rendering.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Apply a standard filter change (e.g., filter by date range covering 10%
      of the data) and measure the time until the chart updates.
    expected_result: The chart updates to reflect the filter change within the specified
      performance threshold.
    data_to_capture:
    - Time taken for chart re-rendering after filter change (must be < 2 seconds).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data import of 100k points completes in less than 5 seconds (URS-020-010).
  - Chart rendering after filter changes completes in less than 2 seconds (URS-020-011).
  regulatory_basis:
  - URS-020-010
  - URS-020-011
  risk_level: medium
  data_integrity_requirements:
  - Verify data points are correctly counted during import.
  urs_requirements:
  - URS-020-010
  - URS-020-011
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - SPC Software Administrator
  - Performance Tester
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Annotation, Read-Only Access, and Configuration Audit Trail
  test_category: functional
  gamp_category: 3
  objective: To confirm that users can annotate points, that released data is read-only,
    and that configuration changes are logged if the feature is present.
  prerequisites:
  - System is configured with at least two user roles (e.g., Analyst, Viewer).
  - A control chart configuration has been saved.
  - A dataset has been 'released' (if applicable to the system workflow).
  test_steps:
  - step_number: 1
    action: Log in as a user with annotation rights and select a point on a generated
      chart.
    expected_result: The system allows the user to input and save a comment/annotation
      for the selected point (URS-020-005).
    data_to_capture:
    - Annotation text and confirmation of successful save.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as a 'Viewer' role (read-only access) and attempt to modify the
      saved annotation from Step 1.
    expected_result: The system prevents modification of the annotation, confirming
      read-only access for released data/configurations (URS-020-007).
    data_to_capture:
    - Error message or disabled edit function.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Change a saved chart configuration (e.g., change the Nelson Rule set applied)
      and save the configuration.
    expected_result: The configuration is saved successfully, and the system records
      the change in the audit trail (if vendor feature is present) (URS-020-009).
    data_to_capture:
    - Audit trail entry confirming the configuration change, user ID, and timestamp.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the previous configuration state is retrievable or that the
      new configuration is stored as a controlled record (URS-020-008).
    expected_result: The system confirms the new configuration is retained and accessible
      for future use/comparison.
    data_to_capture:
    - Confirmation that the configuration is listed as a controlled record.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Users can successfully annotate points using built-in features (URS-020-005).
  - Read-only users cannot modify released datasets or configurations (URS-020-007).
  - Configuration changes are logged in the audit trail, if supported by the vendor
    (URS-020-009).
  - Chart configurations are retained as controlled records (URS-020-008).
  regulatory_basis:
  - URS-020-005
  - URS-020-007
  - URS-020-008
  - URS-020-009
  risk_level: medium
  data_integrity_requirements:
  - Verify annotations are correctly linked to the specific data point index.
  urs_requirements:
  - URS-020-005
  - URS-020-007
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - QA Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
