- test_id: OQ-006
  test_name: Verify Configuration Retention and AD Integration
  test_category: security
  gamp_category: 3
  objective: To confirm that chart configurations are retained as controlled records
    and that user authentication integrates correctly with Active Directory (AD).
  prerequisites:
  - System is configured for AD integration.
  - 'At least two user accounts exist in AD: one with Admin rights, one with Read-Only
    rights.'
  - A chart configuration has been saved.
  test_steps:
  - step_number: 1
    action: Log out of the system and attempt to log in using the AD credentials for
      the Read-Only user.
    expected_result: Login is successful, and the user interface reflects read-only
      permissions.
    data_to_capture:
    - Login success/failure
    - User role displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to modify the saved chart configuration (e.g., change chart title
      or add a new Nelson rule).
    expected_result: Modification is blocked, and an appropriate permission error
      message is displayed.
    data_to_capture:
    - Error message text
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log back in as the Admin user.
    expected_result: Login is successful.
    data_to_capture:
    - Admin login status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Access the saved chart configuration and verify that the configuration
      details match the last saved state (confirm retention).
    expected_result: The configuration is loaded exactly as it was saved prior to
      the Read-Only test.
    data_to_capture:
    - Configuration hash/ID
    - Audit log entry for configuration load
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Make a minor, authorized change to the chart configuration and save it.
    expected_result: The change is saved, and an entry is recorded in the audit trail
      (if available).
    data_to_capture:
    - Audit trail entry ID for change
    - New configuration version
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - AD authentication successfully enforces role-based access.
  - Read-only users cannot modify configurations.
  - Chart configurations are retained accurately across sessions and user roles.
  regulatory_basis:
  - URS-020-007
  - URS-020-008
  - URS-020-009
  risk_level: high
  data_integrity_requirements:
  - Configuration integrity must be maintained (URS-020-008).
  urs_requirements:
  - URS-020-004
  - URS-020-007
  - URS-020-008
  - URS-020-009
  - URS-020-013
  related_tests:
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Security/Authentication
  - System Configuration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify CSV Import, Nelson Rule Application, and PDF Export
  test_category: functional
  gamp_category: 3
  objective: Verify the system's ability to import data via CSV, correctly apply standard
    Nelson rules, and export the resulting chart to PDF format.
  prerequisites:
  - System is installed and configured.
  - User has appropriate permissions for data import and chart generation.
  - A test CSV file containing data that triggers at least one Nelson rule violation
    is available.
  test_steps:
  - step_number: 1
    action: Log in as a standard user and navigate to the chart creation interface.
    expected_result: User is successfully logged in and the chart creation screen
      is displayed.
    data_to_capture:
    - Login timestamp
    - User ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Import the prepared test CSV file to generate an X-bar/R chart (URS-020-001).
    expected_result: The chart loads successfully, displaying all data points, and
      the system indicates successful import.
    data_to_capture:
    - Chart generation time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the vendor's standard Nelson rules are automatically applied
      and flag the expected violation point(s) (URS-020-002).
    expected_result: The chart displays visual indicators (e.g., symbols, shading)
      corresponding to the triggered Nelson rule(s).
    data_to_capture:
    - Nelson Rule triggered
    - Point index of violation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Use the standard export function to generate a PDF of the configured chart
      (URS-020-003).
    expected_result: A PDF file is generated and downloaded, containing the chart
      image, control limits, and Nelson rule flags.
    data_to_capture:
    - PDF file name
    - PDF generation time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data is imported correctly from CSV.
  - All configured Nelson rules are correctly identified and marked on the chart.
  - The exported PDF accurately reflects the on-screen chart, including flags and
    configuration.
  regulatory_basis:
  - URS-020-001
  - URS-020-002
  - URS-020-003
  risk_level: medium
  data_integrity_requirements:
  - Data fidelity maintained during CSV import.
  - Chart calculation integrity verified against Nelson rule logic.
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-003
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Configuration Retention and Audit Trail for Changes
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that chart configurations are retained across sessions and that
    any subsequent modifications trigger the vendor's audit trail mechanism.
  prerequisites:
  - System is running and accessible.
  - A baseline chart configuration (e.g., specific control limits, chart type) has
    been saved.
  - User has permissions to modify configurations.
  test_steps:
  - step_number: 1
    action: Log out of the system and then log back in as the same user.
    expected_result: User successfully logs in.
    data_to_capture:
    - Login timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the saved chart configuration from the previous step and verify
      it loads exactly as saved (URS-020-008).
    expected_result: The chart loads with the exact saved settings (e.g., limits,
      rules selected, data source mapping).
    data_to_capture:
    - Configuration load verification status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Modify a non-critical configuration setting (e.g., change the chart title
      or switch from X-bar to R chart temporarily) and save the change.
    expected_result: The change is saved successfully.
    data_to_capture:
    - Original configuration setting
    - New configuration setting
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Access the system's audit trail functionality (or configuration history
      view) to review changes made in Step 3 (URS-020-009).
    expected_result: An audit record exists detailing the user, the time, the specific
      configuration element changed, and the old/new values.
    data_to_capture:
    - Audit trail entry timestamp
    - Audit trail entry details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Saved chart configurations persist across user sessions.
  - All configuration changes are logged in the audit trail, including necessary context
    (who, what, when).
  regulatory_basis:
  - URS-020-008
  - URS-020-009
  risk_level: medium
  data_integrity_requirements:
  - Configuration data integrity must be maintained.
  - Audit trail records must be immutable and accurate.
  urs_requirements:
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-006
  estimated_duration_minutes: 40
  required_expertise:
  - QA Engineer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify Annotation, Read-Only Access, and Configuration Retention
  test_category: functional
  gamp_category: 3
  objective: To verify the ability to annotate chart points, enforce read-only access
    for released data, and confirm chart configuration retention.
  prerequisites:
  - System is installed and configured.
  - A user account with standard operator privileges exists.
  - A user account with read-only privileges exists.
  - A dataset has been imported and marked as 'released'.
  test_steps:
  - step_number: 1
    action: Log in as an operator user and load the released dataset to generate a
      control chart.
    expected_result: The control chart loads successfully, and the operator has full
      editing rights.
    data_to_capture:
    - Login success confirmation
    - Chart generation time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select a specific data point on the chart and use the built-in feature
      to add a comment/annotation.
    expected_result: The annotation is successfully saved and visible on the chart.
    data_to_capture:
    - Annotation text saved
    - Audit trail entry for annotation (if applicable)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log back in as the operator, then reload the chart configuration.
    expected_result: The previously saved annotation is present on the chart, confirming
      configuration retention.
    data_to_capture:
    - Annotation persistence confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log out and log in as the read-only user, then attempt to modify the chart
      configuration (e.g., change chart type or add a new annotation).
    expected_result: The system prevents configuration changes and annotations, enforcing
      read-only access for released datasets.
    data_to_capture:
    - Error message or disabled controls confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Annotations are successfully added and retained across sessions (URS-020-005,
    URS-020-008).
  - Read-only users cannot modify chart configurations or data points on released
    datasets (URS-020-007).
  regulatory_basis:
  - URS-020-007
  - URS-020-008
  risk_level: medium
  data_integrity_requirements:
  - Annotation integrity must be maintained.
  urs_requirements:
  - URS-020-005
  - URS-020-007
  - URS-020-008
  related_tests:
  - OQ-004
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Verify Performance Under Load and AD Integration
  test_category: performance
  gamp_category: 3
  objective: To verify the system's performance when loading large datasets and confirm
    successful integration with Active Directory for authentication.
  prerequisites:
  - System is installed and configured.
  - Active Directory (AD) integration is configured.
  - A CSV file containing exactly 100,000 data points is available.
  test_steps:
  - step_number: 1
    action: Attempt to log in using a valid AD user credential.
    expected_result: User is successfully authenticated via AD and gains access to
      the dashboard.
    data_to_capture:
    - AD Authentication success status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Import the 100k data point CSV file and initiate chart generation.
    expected_result: The data import completes, and the initial chart renders in less
      than 5 seconds.
    data_to_capture:
    - Total data load time (must be < 5s)
    - Initial chart render time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Apply a standard filter change (e.g., change the control chart type or
      zoom level) that requires chart recalculation.
    expected_result: The chart updates and re-renders completely in less than 2 seconds.
    data_to_capture:
    - Chart re-render time (must be < 2s)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to log in using an invalid AD credential.
    expected_result: Authentication fails, and the user is denied access.
    data_to_capture:
    - AD Authentication failure status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - AD authentication is successful for valid users and fails for invalid users (URS-020-013).
  - Loading 100k data points takes less than 5 seconds (URS-020-010).
  - Chart rendering after filter changes takes less than 2 seconds (URS-020-011).
