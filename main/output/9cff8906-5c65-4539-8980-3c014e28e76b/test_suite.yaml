test_cases:
- test_id: OQ-001
  test_name: Verify Method Version Locking During Schedule Creation
  test_category: functional
  gamp_category: 4
  objective: To verify that the system correctly enforces method-version locking when
    scheduling chromatography runs.
  prerequisites:
  - System is fully operational and accessible.
  - At least two versions of a chromatography method (e.g., Method_A_v1.0 and Method_A_v1.1)
    are configured.
  - User has 'Schedule Creator' role permissions.
  test_steps:
  - step_number: 1
    action: Log in as a user with schedule creation privileges.
    expected_result: User successfully logs into the Chromatography Sample Scheduling
      Module.
    data_to_capture:
    - Login timestamp
    - User ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Create a new sample run schedule and attempt to select the older version
      (v1.0) of Method_A.
    expected_result: The system accepts the selection of Method_A_v1.0 and locks this
      version for all samples within the schedule.
    data_to_capture:
    - Schedule ID
    - Selected Method Version
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to modify the schedule to use the newer version (v1.1) of Method_A.
    expected_result: The system prevents modification to the method version once the
      schedule is saved or submitted for approval, confirming version lock.
    data_to_capture:
    - Attempted modification details
    - System response message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully locks the initially selected method version (URS-018-002).
  - Subsequent attempts to change the method version on the saved schedule are blocked
    or require a new schedule creation.
  regulatory_basis:
  - URS-018-002
  risk_level: medium
  data_integrity_requirements:
  - Audit trail must record the initial method version selection and any subsequent
    failed attempts to change it (URS-018-006, URS-018-014).
  urs_requirements:
  - URS-018-002
  related_tests:
  - OQ-002
  estimated_duration_minutes: 25
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Pause/Resume and Failure Re-queue with Reason Capture
  test_category: functional
  gamp_category: 4
  objective: To confirm the system's ability to pause, resume, and re-queue failed
    runs while capturing mandatory reason codes.
  prerequisites:
  - System is operational and integrated with an instrument simulator or actual instrument.
  - A test schedule containing at least three runs is loaded.
  - User has execution privileges.
  test_steps:
  - step_number: 1
    action: Start execution of the test schedule.
    expected_result: The first sample run begins processing on the assigned instrument.
    data_to_capture:
    - Start time of Run 1
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Manually pause the schedule execution while Run 1 is in progress.
    expected_result: The system pauses the current run and prevents the next run from
      starting. Pause action is recorded in the audit trail.
    data_to_capture:
    - Pause timestamp
    - Audit trail entry for pause
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Resume the schedule execution.
    expected_result: Run 1 continues execution from where it was paused (URS-018-005).
    data_to_capture:
    - Resume timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Force Run 2 to fail (e.g., by simulating an instrument error or invalid
      sample input).
    expected_result: Run 2 stops, and the system prompts the user to select a disposition
      (e.g., Cancel, Re-queue, Skip).
    data_to_capture:
    - Failure event details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Select 'Re-queue' for Run 2 and enter a mandatory reason code (e.g., 'Instrument
      communication lost').
    expected_result: Run 2 is moved back to the pending queue, and the reason code
      is permanently associated with the failed attempt in the audit trail.
    data_to_capture:
    - Re-queue timestamp
    - Captured reason code
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully pauses and resumes schedule execution (URS-018-005).
  - Failed runs can be re-queued, and the system enforces the capture of a reason
    code before re-queuing (URS-018-005).
  - All actions (Pause, Resume, Re-queue, Reason Capture) are logged in the audit
    trail (URS-018-006).
  regulatory_basis:
  - URS-018-005
  - URS-018-006
  - URS-018-014
  risk_level: medium
  data_integrity_requirements:
  - The reason for re-queuing must be immutable and linked to the specific failed
    run instance.
  urs_requirements:
  - URS-018-005
  - URS-018-006
  related_tests:
  - OQ-001
  estimated_duration_minutes: 40
  required_expertise:
  - QC Analyst
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Schedule Priority and Instrument Routing Based on Availability
  test_category: functional
  gamp_category: 4
  objective: To verify that the system correctly schedules runs based on defined priority
    levels and enforces routing rules based on instrument availability.
  prerequisites:
  - System is fully configured and operational.
  - At least three instruments (A, B, C) are configured and their availability status
    is accessible by the system.
  - A test method (Method X, Version 1.0) is available.
  - User has 'Schedule Creator' role permissions.
  test_steps:
  - step_number: 1
    action: Create a new sample run schedule containing 5 samples requiring Method
      X.
    expected_result: Schedule creation interface opens successfully.
    data_to_capture:
    - Schedule ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Assign Sample 1 and 2 a HIGH priority, Sample 3 and 4 a MEDIUM priority,
      and Sample 5 a LOW priority.
    expected_result: Priorities are accepted and saved to the schedule entry.
    data_to_capture:
    - Assigned Priorities
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: 'Configure routing rules: Instrument A is available, Instrument B is marked
      as ''Down for Maintenance'', Instrument C is available but busy processing a
      long run.'
    expected_result: System accepts the configured availability rules.
    data_to_capture:
    - Instrument Status Configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Submit the schedule for execution, ensuring the system attempts to route
      based on availability and priority.
    expected_result: HIGH priority samples (1 & 2) are routed to Instrument A. MEDIUM
      priority samples (3 & 4) are routed to Instrument C (as A is full/busy, and
      B is down). LOW priority sample (5) remains unscheduled or routed to the next
      available slot.
    data_to_capture:
    - Final Schedule Routing Assignments
    - Instrument Queue Status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully routes samples according to the defined priority order.
  - Samples are only routed to instruments reported as available (Instrument B is
    bypassed).
  - The scheduling logic respects instrument load/availability when assigning runs.
  regulatory_basis:
  - URS-018-001
  - URS-018-004
  risk_level: medium
  data_integrity_requirements:
  - Schedule routing decisions must be logged in the audit trail.
  urs_requirements:
  - Users shall create sample run schedules with priority, instrument, and method
    selections.
  - Users shall route samples to instruments based on configured availability rules.
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Audit Trail Capture for Schedule Modification and Part 11 Compliance
  test_category: data_integrity
  gamp_category: 4
  objective: To verify that all modifications to a schedule entry are securely recorded
    in the audit trail, meeting 21 CFR Part 11 requirements for time-stamping and
    traceability.
  prerequisites:
  - System is configured for Part 11 compliance (electronic signatures enabled).
  - 'A test schedule (Schedule ID: TS-001) containing at least one pending run exists.'
  - User A (Analyst) and User B (Supervisor) accounts are active.
  test_steps:
  - step_number: 1
    action: User A modifies the method associated with Run ID R-101 within TS-001
      from Method X (V1.0) to Method Y (V1.0).
    expected_result: System prompts User A for electronic signature to confirm the
      change.
    data_to_capture:
    - User A Signature Confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: User A submits the change and verifies the audit trail entry for Run ID
      R-101.
    expected_result: 'A secure, time-stamped audit trail entry is generated showing:
      User A, Date/Time, Field Changed (Method), Old Value (V1.0), New Value (V1.0),
      and Reason for Change.'
    data_to_capture:
    - Audit Trail Entry Details for Method Change
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: User B (Supervisor) accesses the schedule and changes the required approval
      status for Run ID R-102 from 'Pending' to 'Approved'.
    expected_result: System prompts User B for electronic signature to confirm the
      approval status change.
    data_to_capture:
    - User B Signature Confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: User B submits the change and verifies the audit trail entry for Run ID
      R-102.
    expected_result: 'A secure, time-stamped audit trail entry is generated showing:
      User B, Date/Time, Field Changed (Approval Status), Old Value (Pending), New
      Value (Approved), and Reason for Change.'
    data_to_capture:
    - Audit Trail Entry Details for Approval Change
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All modifications (method change, status change) trigger an electronic signature
    prompt.
  - The audit trail captures the identity of the actor, the time of the action, the
    specific field modified, and the old/new values.
  - Audit trail entries are immutable and secure.
  regulatory_basis:
  - URS-018-006
  - URS-018-013
  - URS-018-014
  risk_level: high
  data_integrity_requirements:
  - Audit trail data must be retained and retrievable per regulatory requirements.
  urs_requirements:
  - Audit trail entries shall be generated for all changes to schedule entries.
  - Electronic records shall comply with 21 CFR Part 11 including electronic signatures.
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - QA/Compliance Officer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Role-Based Access Control for Schedule Management
  test_category: security
  gamp_category: 4
  objective: To verify that role-based access controls correctly restrict schedule
    creation, approval, and execution based on user roles.
  prerequisites:
  - System is fully installed and configured.
  - User accounts configured for Analyst (Schedule Creator), Supervisor (Approver),
    and Operator (Executor) roles.
  - GMP run configuration is established requiring approval.
  test_steps:
  - step_number: 1
    action: Log in as a user assigned only the 'Analyst' role and attempt to create
      and submit a new GMP sample schedule.
    expected_result: The schedule is created successfully and submitted for approval,
      but execution is blocked.
    data_to_capture:
    - Screenshot of schedule submission confirmation
    - User role verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as a user assigned only the 'Supervisor' role and attempt to execute
      a pending schedule without prior approval.
    expected_result: Execution attempt is blocked, and an 'Unauthorized Action' or
      'Pending Approval' message is displayed.
    data_to_capture:
    - Error message displayed upon execution attempt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as the 'Supervisor' and approve the schedule created in Step 1.
    expected_result: The schedule status changes to 'Approved'. Audit trail records
      the approval action.
    data_to_capture:
    - Audit trail entry for approval
    - Schedule status change
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log in as the 'Operator' and attempt to execute the now-approved schedule.
    expected_result: The schedule execution initiates successfully, routing samples
      according to the schedule.
    data_to_capture:
    - Confirmation of run initiation
    - Audit trail entry for execution start
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Only users with the appropriate roles can perform creation, approval, and execution
    actions.
  - Unauthorized actions result in clear system rejection messages.
  regulatory_basis:
  - URS-018-008
  - URS-018-016
  risk_level: medium
  data_integrity_requirements:
  - All role changes and access attempts must be logged in the audit trail.
  urs_requirements:
  - URS-018-008
  - URS-018-010
  related_tests:
  - OQ-004
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - QC Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify Hold Rules Triggered by External System Excursion
  test_category: functional
  gamp_category: 4
  objective: To verify that the scheduling module correctly pauses or holds scheduled
    runs when an integrated stability chamber reports an excursion event.
  prerequisites:
  - System is integrated with a simulated or actual stability chamber monitoring system.
  - A schedule containing samples designated for the monitored chamber is active or
    queued.
  - Hold rules are configured to trigger based on stability excursion alerts.
  test_steps:
  - step_number: 1
    action: Verify the status of the active schedule, ensuring runs designated for
      the stability chamber are ready or running.
    expected_result: Schedule status is 'Active' or 'Queued'.
    data_to_capture:
    - Initial schedule status snapshot
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate or trigger an excursion event (e.g., temperature out-of-range)
      from the integrated stability chamber system.
    expected_result: The system receives the excursion alert via integration.
    data_to_capture:
    - Log entry confirming receipt of the excursion signal
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Monitor the scheduling module interface for changes to the affected sample
      runs.
    expected_result: All runs associated with the affected stability chamber are immediately
      transitioned to a 'Hold' status, and URS-018-007 alerts are generated for relevant
      personnel.
    data_to_capture:
    - Screenshot of schedule showing 'Hold' status
    - Alert notification details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Resolve the simulated excursion event in the stability chamber system.
    expected_result: The system automatically reverts the affected runs from 'Hold'
      back to 'Ready to Run' or 'Queued', based on configuration.
    data_to_capture:
    - Final schedule status after resolution
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully pauses/holds relevant runs upon receiving an excursion
    signal.
  - The system resumes scheduling automatically or prompts for manual resumption after
    the excursion is cleared.
  regulatory_basis:
  - URS-018-009
  risk_level: high
  data_integrity_requirements:
  - The transition to and from the 'Hold' state must be recorded in the audit trail,
    including the reason (excursion event).
  urs_requirements:
  - URS-018-004
  - URS-018-007
  - URS-018-009
  related_tests:
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - Integration Specialist
  - QC Lab Operations
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify Report Generation and Template Control
  test_category: functional
  gamp_category: 4
  objective: To verify the system correctly generates compliance-ready batch reports
    using controlled templates and meets performance criteria.
  prerequisites:
  - System is configured with at least two controlled report templates.
  - A batch of 200 injections is scheduled and successfully executed.
  - User has permissions to generate reports.
  test_steps:
  - step_number: 1
    action: Execute the standard batch report generation function for the completed
      200-injection batch.
    expected_result: The system initiates report generation within the expected timeframe.
    data_to_capture:
    - Start time of report generation request.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Measure the time taken for the report generation process to complete.
    expected_result: The standard batch report is generated and finalized in less
      than 10 seconds (URS-018-019).
    data_to_capture:
    - End time of report generation.
    - Report generation duration.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the generated report utilizes the currently controlled report
      template version.
    expected_result: The generated report structure and content match the approved,
      controlled template artifact (URS-018-003, URS-018-015).
    data_to_capture:
    - Report template version identifier.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify the report is successfully pushed to the controlled document repository.
    expected_result: The finalized report is accessible and stored in the designated
      repository (URS-018-026).
    data_to_capture:
    - Repository confirmation ID/path.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Report generation completes within 10 seconds for 200 injections.
  - The generated report accurately reflects the executed batch data.
  - The report uses the correct, controlled template version.
  - The report is successfully archived to the document repository.
  regulatory_basis:
  - URS-018-003
  - URS-018-015
  - URS-018-019
  risk_level: medium
  data_integrity_requirements:
  - Report content must match source data (ALCOA+).
  urs_requirements:
  - URS-018-003
  - URS-018-015
  - URS-018-019
  - URS-018-026
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Schedule Gantt View Performance and Filtering
  test_category: performance
  gamp_category: 4
  objective: To verify the system's ability to load and filter the schedule Gantt
    view efficiently under load, meeting specified performance targets.
  prerequisites:
  - System is configured to support 30 concurrent users.
  - A large schedule (e.g., 500 samples) is loaded into the system.
  - User has access to the Gantt view interface.
  test_steps:
  - step_number: 1
    action: Log in 30 concurrent users, ensuring all are active within the system.
    expected_result: System remains responsive during user login sequence.
    data_to_capture:
    - Time taken for 30th user login.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: The primary test user opens the Schedule Gantt View, applying no filters.
    expected_result: The Gantt view loads the 500-sample schedule in less than 3 seconds
      (URS-018-018).
    data_to_capture:
    - Start time of view load.
    - End time of view load.
    - Total load duration.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Apply a filter to the Gantt view based on a specific instrument ID.
    expected_result: The view refreshes to show only the filtered data in less than
      2 seconds (URS-018-023).
    data_to_capture:
    - Start time of filter application.
    - End time of filter refresh.
    - Filter refresh duration.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Apply a second filter based on a specific analyst name.
    expected_result: The view refreshes again, showing the intersection of both filters,
      within 2 seconds.
    data_to_capture:
    - Start time of second filter application.
    - End time of second filter refresh.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Monitor system performance metrics (CPU/Memory) across all 30 users during
      the filtering steps.
    expected_result: No functional degradation is observed for any user, and system
      resource utilization remains within acceptable operational limits (URS-018-020).
    data_to_capture:
    - Peak CPU/Memory utilization during filtering.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The 500-sample schedule loads in under 3 seconds.
  - Filtering operations (by instrument/analyst) complete in under 2 seconds.
  - No functional degradation is observed for any of the 30 concurrent users.
  regulatory_basis:
  - URS-018-012
  - URS-018-018
  - URS-018-020
  - URS-018-023
  risk_level: medium
  data_integrity_requirements:
  - Visual representation must accurately reflect scheduled data.
  urs_requirements:
  - URS-018-012
  - URS-018-018
  - URS-018-020
  - URS-018-023
  related_tests:
  - OQ-005
  estimated_duration_minutes: 60
  required_expertise:
  - Performance Engineer
  - QC Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify GMP Run Approval Workflow and Exception Summary Generation
  test_category: functional
  gamp_category: 4
  objective: Verify that GMP runs require explicit approval before execution and that
    the system generates required exception summaries for out-of-trend results.
  prerequisites:
  - System is configured for GMP run mode.
  - A test sample requiring GMP execution is available in the queue.
  - A method is configured that can generate an out-of-trend (OOT) result based on
    acceptance criteria.
  test_steps:
  - step_number: 1
    action: Log in as a standard Analyst role and attempt to start the configured
      GMP run.
    expected_result: The system prevents execution and prompts for approval.
    data_to_capture:
    - Screenshot of execution block message.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as a Supervisor role and navigate to the schedule approval interface.
    expected_result: The pending GMP run is visible for approval.
    data_to_capture:
    - Approval interface view.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Approve the GMP run schedule.
    expected_result: The run status changes to 'Ready for Execution' or similar.
    data_to_capture:
    - Audit trail entry confirming approval.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Execute the run, ensuring one sample results in an OOT condition (e.g.,
      by spiking data or using a known OOT method parameter).
    expected_result: The run completes, and the OOT result is flagged.
    data_to_capture:
    - Result file/data confirming OOT flag.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Navigate to the reporting module and generate the exception summary report
      for the completed batch.
    expected_result: The system generates a compliant exception summary report detailing
      the OOT result and associated run information.
    data_to_capture:
    - Generated Exception Summary Report (PDF/Electronic format).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - GMP runs cannot be executed without explicit approval.
  - The system successfully generates a compliant exception summary report for the
