- test_id: OQ-010
  test_name: Verify Integration with Asset System for Instrument Status Pull
  test_category: integration
  gamp_category: 4
  objective: Verify the system correctly pulls and utilizes instrument availability
    and calibration status from the external asset management system when creating
    schedules.
  prerequisites:
  - System is configured with valid API connection details for the Asset System.
  - At least two chromatography instruments are configured and linked.
  - Asset System is configured to report one instrument as 'Unavailable/Calibration
    Due' and the other as 'Available/Calibrated'.
  test_steps:
  - step_number: 1
    action: Log in and attempt to create a new sample run schedule, selecting the
      instrument reported as 'Unavailable/Calibration Due' in the Asset System.
    expected_result: The system prevents selection of the unavailable instrument or
      displays a clear warning indicating the reason (e.g., calibration status failure).
    data_to_capture:
    - Screenshot of instrument selection interface showing status feedback.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to route a sample to the instrument reported as 'Available/Calibrated'
      using the configured availability rules.
    expected_result: The routing is successful, and the instrument is assigned to
      the run.
    data_to_capture:
    - Schedule entry showing successful instrument assignment.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Force an update in the Asset System to change the status of the previously
      available instrument to 'Maintenance Required'.
    expected_result: The system reflects the status change within the defined latency
      period (URS-018-022).
    data_to_capture:
    - Time stamp of status change in Asset System.
    - Time stamp of status update reflected in the scheduling module.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to modify the schedule created in Step 2 to route a new sample
      to the instrument now marked as 'Maintenance Required'.
    expected_result: The system blocks the modification or issues a warning based
      on routing rules.
    data_to_capture:
    - Error message or warning displayed upon modification attempt.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The scheduling module accurately reflects the real-time availability and calibration
    status pulled from the Asset System.
  - Samples cannot be routed to instruments flagged as unavailable or out of calibration.
  regulatory_basis:
  - URS-018-004
  - URS-018-025
  risk_level: medium
  data_integrity_requirements:
  - Instrument status synchronization must be auditable to ensure correct routing
    decisions.
  urs_requirements:
  - URS-018-004
  - URS-018-025
  related_tests:
  - OQ-003
  estimated_duration_minutes: 45
  required_expertise:
  - Integration Specialist
  - QC Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-011
  test_name: Verify Concurrent User Load and Schedule Loading Performance
  test_category: performance
  gamp_category: 4
  objective: Verify the system can load a large sample schedule (500 samples) within
    the required time limit while supporting concurrent user access.
  prerequisites:
  - System is configured with a 500-sample schedule template.
  - 30 test user accounts are available and authenticated.
  - System monitoring tools are active to track resource utilization.
  test_steps:
  - step_number: 1
    action: Simultaneously initiate schedule loading (URS-018-018) for the 500-sample
      schedule across 30 concurrent user sessions.
    expected_result: All 30 sessions successfully load the schedule, and the loading
      time for each session is recorded.
    data_to_capture:
    - Time taken for schedule load per user session
    - System CPU/Memory utilization during the load test
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor system performance metrics for functional degradation (URS-018-020)
      during the concurrent load test.
    expected_result: No functional degradation (e.g., inability to interact with the
      schedule or system timeouts) is observed across any of the 30 sessions.
    data_to_capture:
    - Confirmation of no functional errors reported by users
    - System response times for basic schedule navigation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All 30 concurrent users successfully load the 500-sample schedule.
  - Schedule load time for every user is less than 3 seconds (URS-018-018).
  - No functional degradation is observed during the concurrent load test (URS-018-020).
  regulatory_basis:
  - URS-018-018
  - URS-018-020
  risk_level: medium
  data_integrity_requirements:
  - Ensure schedule data integrity is maintained during high concurrency access.
  urs_requirements:
  - URS-018-018
  - URS-018-020
  related_tests:
  - OQ-008
  estimated_duration_minutes: 60
  required_expertise:
  - Performance Testing Engineer
  - LIMS/CDS Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-012
  test_name: Verify Alert Delivery Time and Report Generation Performance
  test_category: performance
  gamp_category: 4
  objective: Verify that system alerts are delivered within the specified time frame
    and that standard batch reports meet performance requirements.
  prerequisites:
  - A scheduled run is configured to trigger an alert upon completion.
  - A batch of 200 injections is ready for reporting.
  - Analyst and Instrument readiness/excursion events can be simulated or triggered.
  test_steps:
  - step_number: 1
    action: Trigger an instrument readiness event (URS-018-007) and measure the time
      until the analyst receives the corresponding alert.
    expected_result: The alert notification is received by the analyst within 5 seconds
      of the event detection (URS-018-022).
    data_to_capture:
    - Timestamp of event trigger
    - Timestamp of alert receipt by analyst
    - Measured alert delivery time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Complete the 200-injection batch run and immediately initiate the generation
      of the standard batch report (URS-018-003).
    expected_result: The standard batch report is fully generated and available for
      viewing within 10 seconds (URS-018-019).
    data_to_capture:
    - Timestamp report generation initiated
    - Timestamp report generation completed
    - Measured report generation time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alert delivery time meets the requirement of <= 5 seconds (URS-018-022).
  - Standard batch report generation for 200 injections completes in <= 10 seconds
    (URS-018-019).
  regulatory_basis:
  - URS-018-003
  - URS-018-007
  - URS-018-019
  - URS-018-022
  risk_level: medium
  data_integrity_requirements:
  - Ensure the time stamps captured for performance measurement are accurate and traceable.
  urs_requirements:
  - URS-018-003
  - URS-018-007
  - URS-018-019
  - URS-018-022
  related_tests:
  - OQ-007
  estimated_duration_minutes: 45
  required_expertise:
