- test_id: OQ-018
  test_name: Verify Schedule Exception Handling and Audit Trail for Re-queues
  test_category: data_integrity
  gamp_category: 4
  objective: To verify that the system correctly captures audit trails for schedule
    modifications, specifically when re-queuing failed runs with mandatory reason
    capture (URS-018-005, URS-018-006).
  prerequisites:
  - A scheduled run is configured and ready for execution.
  - User has permissions to modify schedules and capture audit trails.
  - A method is configured to fail under specific conditions (or manual intervention
    is possible to force a failure).
  test_steps:
  - step_number: 1
    action: Execute the scheduled run until it fails, triggering the failure notification.
    expected_result: The run status changes to 'Failed', and the system prompts for
      a failure reason.
    data_to_capture:
    - Time of failure
    - Initial failure reason prompt status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: As an authorized user, select the failed run, select the 'Re-queue' action,
      and enter a detailed, compliant reason for re-queuing (e.g., 'Instrument maintenance
      required').
    expected_result: The run is successfully re-queued to the schedule, and the system
      prompts for an electronic signature to confirm the action.
    data_to_capture:
    - Re-queue reason text
    - Electronic signature confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the Audit Trail entry corresponding to the re-queue action.
    expected_result: The audit trail must contain a time-stamped entry detailing the
      'Re-queue' action, the user ID, the specific reason provided, and the electronic
      signature confirmation (URS-018-006, URS-018-014).
    data_to_capture:
    - Audit trail entry timestamp
    - Audit trail entry details (Action, User, Data Change/Reason)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Failed runs can be paused, resumed, and re-queued with mandatory reason capture
    (URS-018-005).
  - All schedule changes, including re-queues, generate secure, time-stamped audit
    trail entries capturing the required data (URS-018-006, URS-018-014).
  regulatory_basis:
  - 21 CFR Part 11 (Electronic Signatures)
  - ALCOA+
  risk_level: high
  data_integrity_requirements:
  - Ensure the captured reason for re-queue is immutable and linked to the subsequent
    execution attempt.
  urs_requirements:
  - URS-018-005
  - URS-018-006
  - URS-018-014
  related_tests:
