- test_id: OQ-013
  test_name: Verify Part 11 Compliance for Schedule Electronic Signatures
  test_category: data_integrity
  gamp_category: 4
  objective: To verify that the system enforces 21 CFR Part 11 compliant electronic
    signatures upon final approval of a GMP schedule.
  prerequisites:
  - System is configured for Part 11 compliance (electronic signatures enabled).
  - A test sample schedule requiring GMP approval is created.
  - User accounts with appropriate signature authority are available.
  test_steps:
  - step_number: 1
    action: Create a sample run schedule designated as a 'GMP Run' requiring approval.
    expected_result: Schedule is created and status is set to 'Pending Approval'.
    data_to_capture:
    - Schedule ID
    - Initial Status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to execute the schedule without applying the required electronic
      signature/approval.
    expected_result: Execution is blocked, and a prompt requires electronic signature
      credentials.
    data_to_capture:
    - Error message displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as an authorized approver and apply the electronic signature to
      approve the schedule execution.
    expected_result: Signature is successfully applied, the schedule status changes
      to 'Approved/Ready to Run', and an audit trail entry is created.
    data_to_capture:
    - Signature timestamp
    - Approver ID
    - Audit trail entry verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Review the audit trail entry associated with the approval action.
    expected_result: The audit trail entry clearly links the action (Approval), the
      user ID, the date/time stamp, and the reason for the signature (if applicable).
    data_to_capture:
    - Audit trail record details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully blocks execution until a valid Part 11 compliant electronic
    signature is applied.
  - The electronic signature captures the signer's identity, time, date, and the meaning
    of the signature (e.g., 'Approved').
  regulatory_basis:
  - URS-018-010
  - URS-018-013
  risk_level: high
  data_integrity_requirements:
  - Ensure signature integrity and non-repudiation.
  urs_requirements:
  - URS-018-010
  - URS-018-013
  related_tests:
  - OQ-004
  - OQ-009
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
