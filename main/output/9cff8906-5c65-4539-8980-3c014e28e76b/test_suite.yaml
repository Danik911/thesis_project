- test_id: OQ-015
  test_name: Verify Schedule Creation with Priority and Method Version Lock
  test_category: functional
  gamp_category: 4
  objective: To verify that users can successfully create a sample run schedule, assign
    priority, and confirm that the system enforces the correct, locked version of
    the analytical method.
  prerequisites:
  - System is fully installed and configured.
  - Test user accounts with scheduling permissions are active.
  - At least two different versions of a chromatography method are loaded in the system.
  test_steps:
  - step_number: 1
    action: Log in as a qualified analyst and navigate to the Sample Scheduling module.
    expected_result: User is successfully authenticated and the scheduling interface
      loads.
    data_to_capture:
    - Login timestamp
    - User ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Create a new schedule entry, assigning a high priority level and selecting
      a specific instrument.
    expected_result: Schedule entry is created successfully with the assigned priority
      and instrument.
    data_to_capture:
    - New Schedule ID
    - Assigned Priority
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Add samples to the schedule, explicitly selecting Method Version X.0 (the
      current approved version).
    expected_result: Samples are added, and the system confirms the use of Method
      Version X.0.
    data_to_capture:
    - Method Version selected for samples
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to modify the schedule entry to use an older, unapproved version
      (Method Version Y.0) of the same method.
    expected_result: The system prevents the selection or use of Method Version Y.0,
      enforcing the lock on the approved version selected in Step 3.
    data_to_capture:
    - Error message received (if any)
    - Final confirmed method version in the schedule
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Schedules can be created with defined priorities (URS-018-001).
  - The system successfully prevents the scheduling of runs using non-current or unapproved
    method versions (URS-018-002).
  regulatory_basis:
  - 21 CFR Part 11 (Data Integrity)
  - ALCOA+ Principles
  risk_level: medium
  data_integrity_requirements:
  - Method version used must be traceable in the schedule record.
  urs_requirements:
  - URS-018-001
  - URS-018-002
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - QC Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-016
  test_name: Verify Schedule Routing Based on Availability and AD Authentication
  test_category: integration
  gamp_category: 4
  objective: To verify that the scheduling module correctly routes samples based on
    instrument availability rules and that user authentication is correctly managed
    via the integrated directory service.
  prerequisites:
  - System is integrated with an Asset Management System reporting instrument status.
  - System is integrated with Active Directory (AD) for user authentication.
  - Instrument A is configured as 'Available' and Instrument B is configured as 'Unavailable/In
    Maintenance'.
  test_steps:
  - step_number: 1
    action: Log out and attempt to log in using a standard AD user account that is
      NOT authorized for schedule execution (e.g., Read-Only role).
    expected_result: Login is successful via AD, but the user is restricted from creating
      or modifying schedules (URS-018-008).
    data_to_capture:
    - AD Authentication success status
    - Observed user permissions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as a qualified scheduling user and create a schedule requiring
      routing to Instrument A or Instrument B.
    expected_result: The system successfully pulls the current availability status
      from the integrated asset system (URS-018-025).
    data_to_capture:
    - Instrument status reported by integration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Submit the schedule, configured to route samples to the first available
      instrument matching the method requirements.
    expected_result: All samples are routed exclusively to Instrument A, as Instrument
      B is reported as unavailable.
    data_to_capture:
    - Final routing assignment for all samples
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Change the configuration rule to allow routing to Instrument B if Instrument
      A is busy, and then submit a new schedule.
    expected_result: The system routes the samples based on the updated availability
      rules, respecting the configured routing logic (URS-018-004).
    data_to_capture:
    - New routing assignment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - User authentication and role synchronization via LDAP/AD is successful (URS-018-027).
  - Sample routing respects configured availability rules based on real-time instrument
    status pulled from the asset system (URS-018-004, URS-018-025).
  regulatory_basis:
  - 21 CFR Part 11 (Access Control)
  - ALCOA+ (Attributable)
  risk_level: medium
  data_integrity_requirements:
  - User identity must be correctly attributed via AD integration.
  urs_requirements:
  - URS-018-004
  - URS-018-008
  - URS-018-025
  - URS-018-027
  related_tests:
  - OQ-005
  - OQ-010
  estimated_duration_minutes: 60
  required_expertise:
  - QC Analyst
  - Integration Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
