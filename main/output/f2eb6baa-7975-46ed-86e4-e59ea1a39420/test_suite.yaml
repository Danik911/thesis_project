  - Unauthorized access attempts are prevented and logged
  - Role-based security functions as per vendor's standard implementation
  - Audit trail captures all security-related events
  regulatory_basis:
  - FDA 21 CFR Part 11.10 - Controls for closed systems
  - EU GMP Annex 11 - Computerised Systems
