    timestamp_required: true
  - step_number: 2
    action: Scan barcode of a known inventory item using the connected scanner
    expected_result: System automatically populates item details in the receiving
      form
    data_to_capture:
    - Scan success rate
    - Data population accuracy
    - Time to populate data
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the scanned item details match the item master record
    expected_result: All item details (SKU, description, lot number) match master
