    data_to_capture:
    - Confirmation message
    - Record of the new assignment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log in as a user with a standard Viewer role.
    expected_result: Dashboard loads with a limited view, showing only the user's
