- test_id: OQ-008
  test_name: Electronic Signature and Record Retention Compliance Verification
  test_category: data_integrity
  gamp_category: 4
  objective: To verify that electronic signatures for document acknowledgments are
    properly captured and that acknowledgment records are maintained according to
    the retention policy.
  prerequisites:
  - System is installed and operational
  - Test user account is available
  - Document with acknowledgment requirement is assigned to the test user
  - Retention policy settings are configured
  test_steps:
  - step_number: 1
    action: Log in as a test user and navigate to the assigned document requiring
      acknowledgment.
    expected_result: Document is displayed with an option to acknowledge/electronically
      sign.
    data_to_capture:
    - Screenshot of the acknowledgment interface
    - Timestamp of access
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Complete the electronic acknowledgment process by checking the acknowledgment
      box and submitting.
    expected_result: System records the electronic signature including user ID, timestamp,
      and meaning of signature (read and understand).
    data_to_capture:
    - Confirmation message
    - Record of the electronic signature event
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the audit trail for the acknowledgment event and verify all required
      data elements are captured.
    expected_result: Audit trail contains complete record including who, what, when,
      and why for the signature.
    data_to_capture:
    - Screenshot of audit trail entry
    - List of captured data elements
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the acknowledgment record is persisted in the system and accessible
      per the configured retention policy.
    expected_result: Record is maintained and cannot be deleted before the retention
      period expires.
    data_to_capture:
    - Retention policy settings
    - Record accessibility confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Electronic signatures capture all required 21 CFR Part 11 elements
  - Acknowledgment records are immutable once created
  - Records are maintained for the full retention period
  - Audit trail contains complete signature transaction details
  regulatory_basis:
  - 21 CFR Part 11 - Electronic signatures and records requirements
  - 'URS-021-006: Maintain acknowledgment records per retention policy'
  - 'URS-021-007: Provide audit trail for assignments and acknowledgments'
  risk_level: high
  data_integrity_requirements:
  - Electronic signatures must be securely linked to their respective records
  - Acknowledgment records must be protected from alteration or deletion
  - Audit trails must be complete, accurate, and tamper-evident
  urs_requirements:
  - 'URS-021-005: Support vendor-provided electronic acknowledgment signature'
  - 'URS-021-006: Maintain acknowledgment records per retention policy'
  - 'URS-021-007: Provide audit trail for assignments and acknowledgments'
  related_tests:
  - 'OQ-005: Audit Trail Verification for Document Assignments and Acknowledgments'
  estimated_duration_minutes: 35
  required_expertise:
  - 21 CFR Part 11 Compliance
  - Electronic Records Management
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
