- test_id: OQ-003
  test_name: Role-Based View Access and Read-Only Data Control
  test_category: security
  gamp_category: 3
  objective: Verify that the system properly enforces role-based access controls and
    maintains read-only access for released datasets as required by regulatory standards.
  prerequisites:
  - System installed and configured
  - User accounts with different roles created (Admin, QC Analyst, Viewer)
  - Sample dataset imported and marked as released
  test_steps:
  - step_number: 1
    action: Log in as a user with Viewer role and attempt to access a released dataset
    expected_result: User can view the dataset but cannot modify any data or configuration
      settings
    data_to_capture:
    - Screenshot of view-only interface
    - System response to modification attempts
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as QC Analyst role and attempt to modify a released dataset
    expected_result: System prevents modifications and displays appropriate warning
      message about read-only status
    data_to_capture:
    - Error message displayed
    - System behavior when attempting edits
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as Admin role and verify access to all functionality including
      configuration changes
    expected_result: Admin user has full access to modify configurations and manage
      datasets as expected
    data_to_capture:
    - Admin interface screenshots
    - Configuration modification capabilities
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access controls function correctly
  - Released datasets remain read-only for all non-admin users
  - Appropriate error messages displayed for unauthorized actions
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - Data integrity principles for read-only access to finalized data
  risk_level: high
  data_integrity_requirements:
  - Ensures data cannot be modified after release
  - Maintains audit trail of access attempts
  - Preserves data integrity through access controls
  urs_requirements:
  - URS-020-004
  - URS-020-007
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Assurance
  - System Administration
  - Regulatory Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
