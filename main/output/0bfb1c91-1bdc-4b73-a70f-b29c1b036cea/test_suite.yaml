test_cases:
- test_id: OQ-001
  test_name: CSV Import and X-bar/R Chart Creation Test
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully import data from CSV files and generate
    X-bar/R control charts using vendor standard functionality
  prerequisites:
  - System installed and configured
  - Test CSV file with 100k data points prepared
  - User with appropriate permissions logged in
  test_steps:
  - step_number: 1
    action: Navigate to the data import section and select CSV import option
    expected_result: CSV import interface is displayed with file selection dialog
    data_to_capture:
    - Import completion time
    - Any error messages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Upload the test CSV file containing 100k data points
    expected_result: File uploads successfully and system processes data within 5
      seconds
    data_to_capture:
    - Data processing time
    - Record count verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select X-bar/R chart type from the visualization options
    expected_result: X-bar/R chart is generated and displayed within 2 seconds
    data_to_capture:
    - Chart rendering time
    - Chart configuration parameters
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Apply standard Nelson rules to the generated chart
    expected_result: Nelson rules are applied correctly with violations highlighted
      if present
    data_to_capture:
    - Rule application status
    - Violation detection accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - CSV import completes within 5 seconds
  - X-bar/R chart renders within 2 seconds
  - Nelson rules apply correctly without errors
  - All 100k data points are processed accurately
  regulatory_basis:
  - 21 CFR Part 11 compliance for electronic records
  - GAMP 5 guidelines for category 3 software
  risk_level: medium
  data_integrity_requirements:
  - Data must remain unchanged during import process
  - Chart calculations must maintain mathematical accuracy
  - All data points must be represented correctly in visual output
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-010
  - URS-020-011
  - URS-020-012
  related_tests:
  - OQ-002
  - PQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - SPC knowledge
  - CSV data formatting
  - Quality control chart interpretation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
