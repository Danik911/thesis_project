- test_id: OQ-005
  test_name: ODBC Data Source Integration and Import Verification
  test_category: integration
  gamp_category: 3
  objective: To verify that the SPC dashboard can successfully connect to and import
    data from a pre-configured ODBC data source using the vendor's standard connectors.
  prerequisites:
  - OQ-001 (Installation Verification) must be executed and passed
  - A test database with a configured ODBC System DSN is available
  - Valid login credentials for the test database
  - The database contains a table with sample QC data (e.g., batch results with timestamps
    and measurements)
  test_steps:
  - step_number: 1
    action: Launch the SPC dashboard application and log in with a user account that
      has data import permissions.
    expected_result: The dashboard main interface loads successfully.
    data_to_capture:
    - Screenshot of the main interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the data import module and select the option to import via
      ODBC connection.
    expected_result: The system displays a configuration screen for specifying ODBC
      connection parameters.
    data_to_capture:
    - Screenshot of the ODBC configuration screen
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select the pre-configured System DSN from the list, enter valid authentication
      credentials, and initiate the connection.
    expected_result: The system establishes a connection and displays a list of available
      tables/views from the data source.
    data_to_capture:
    - Screenshot of the table selection screen
    - Log message confirming successful connection
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Select the test table containing QC data, map the required columns (e.g.,
      sample ID, value, subgroup) to the dashboard's data fields, and execute the
      import.
    expected_result: The system imports the data without errors and displays a confirmation
      message with the number of records imported.
    data_to_capture:
    - Import confirmation message
    - Number of records imported
    - Log file entry for the import operation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Navigate to a chart creation module and attempt to create an X-bar/R chart
      using the newly imported ODBC data.
    expected_result: The chart is rendered correctly using the data from the ODBC
      source, confirming successful integration.
    data_to_capture:
    - Screenshot of the generated X-bar/R chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully connects to the ODBC data source using the provided DSN
    and credentials.
  - The system correctly imports the specified dataset from the source table.
  - The imported data is accurately reflected in the chart generation functionality.
  - No data corruption or loss occurs during the import process.
  regulatory_basis:
  - 21 CFR Part 11 - Requirements for electronic records, ensuring data integrity
    during transfer from external systems.
  risk_level: medium
  data_integrity_requirements:
  - Data must be transferred completely and accurately from the source database.
  - The import process must not alter the original source data.
  - Audit trail entries (if vendor-provided) must record the data source and import
    parameters.
  urs_requirements:
  - 'URS-020-012: Import data from CSV and ODBC connections using standard connectors.'
  related_tests:
  - OQ-001
  - OQ-006
  estimated_duration_minutes: 30
  required_expertise:
  - Knowledge of ODBC configuration
  - Familiarity with the test database structure
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Scheduled Report Generation and Email Distribution
  test_category: functional
  gamp_category: 3
  objective: To verify that the vendor's built-in scheduler can correctly generate
    reports (PDF/CSV) and distribute them via email to predefined recipients at a
    scheduled time.
  prerequisites:
  - OQ-001 (Installation Verification) must be executed and passed
  - A configured chart or report is saved in the system
  - A valid email server (SMTP) configuration is set up in the application
  - A list of valid test recipient email addresses is available
  test_steps:
  - step_number: 1
    action: Log in to the SPC dashboard with an administrator or power user account.
    expected_result: Successful login and access to the scheduling module.
    data_to_capture:
    - Screenshot of the dashboard home screen
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the report scheduler module and create a new schedule for
      a saved chart report.
    expected_result: The system displays a form to configure the schedule (frequency,
      time, recipients, output format).
    data_to_capture:
    - Screenshot of the schedule configuration form
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Configure the schedule to run immediately or within a short time frame
      (e.g., 2 minutes). Set the output format to PDF and CSV. Add the test recipient
      email addresses.
    expected_result: The schedule is saved successfully with the specified parameters.
    data_to_capture:
    - Screenshot of the saved schedule confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Wait for the scheduled time to elapse and check the scheduler's job history
      or log.
    expected_result: The log indicates that the report generation job executed successfully.
    data_to_capture:
    - Screenshot of the job history/log showing successful execution
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Check the email inboxes of the test recipients for the arrival of the
      scheduled report.
    expected_result: The email is received by all recipients, containing the correct
      PDF and/or CSV attachments.
    data_to_capture:
    - Screenshot of the received email with attachments
    - Verification that attachments are not corrupted and contain the expected data
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Open the attached report files and verify the content matches the original
      chart/report in the dashboard.
    expected_result: The data and formatting in the exported files are correct and
      identical to the dashboard view.
    data_to_capture:
    - Screenshot of the opened PDF/CSV file for content verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The scheduler executes the report generation job at the specified time without
    manual intervention.
  - The system generates reports in the specified formats (PDF and CSV).
  - The generated reports are accurate and complete representations of the dashboard
    data.
  - Emails are successfully sent to all configured recipients with the correct attachments.
  regulatory_basis:
  - General GxP requirements for automated reporting and data distribution to ensure
    timely information delivery.
  risk_level: medium
  data_integrity_requirements:
  - The data within the generated reports must be identical to the data displayed
    in the dashboard at the time of scheduling.
  - The export process must not alter the source data.
  urs_requirements:
  - 'URS-020-003: The system shall provide vendor standard export to PDF and CSV.'
  - 'URS-020-006: Users shall schedule report emails using vendor scheduler.'
  related_tests:
  - OQ-001
  - OQ-005
  estimated_duration_minutes: 30
  required_expertise:
  - Understanding of the application's scheduling feature
  - Access to test email accounts for verification
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
