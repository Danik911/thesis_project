    action: Log in as a standard user and navigate to the document acknowledgment
      dashboard
    expected_result: Dashboard displays only documents assigned to the logged-in user
      and their personal acknowledgment status
    data_to_capture:
    - Screenshot of user dashboard view
    - List of documents visible to standard user
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as a manager and navigate to the document acknowledgment dashboard
    expected_result: Dashboard displays team/group acknowledgment metrics, pending
      assignments, and completion statistics
    data_to_capture:
    - Screenshot of manager dashboard view
    - Team completion statistics displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify dashboard filtering and sorting capabilities for both user roles
    expected_result: Dashboards allow filtering by document type, due date, status,
      and sorting by various criteria
    data_to_capture:
    - Filter options available
    - Sort functionality working correctly
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Different user roles see appropriate dashboard content based on their permissions
  - Manager dashboard displays comprehensive team metrics and tracking information
  - User dashboard shows only personal document assignments and status
  - All dashboard filtering and sorting functions work as specified
  regulatory_basis:
  - 21 CFR Part 11 - Electronic records and electronic signatures
  - FDA guidance on computer systems in clinical investigations
  risk_level: medium
  data_integrity_requirements:
  - Dashboard data must accurately reflect current acknowledgment status
  - Role-based access must prevent unauthorized data access
  - All displayed metrics must be calculated correctly from source data
  urs_requirements:
  - 'URS-021-004: Provide role-based dashboards for managers'
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Management System knowledge
  - User role administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Document Acknowledgment Record Retention and Archival Verification
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that acknowledgment records are properly maintained according
    to the retention policy and can be archived/retrieved as required.
  prerequisites:
  - System is installed and operational
  - Retention policy configuration is set up in the system
  - Historical acknowledgment records exist in the system
  - Archive functionality is configured and accessible
  test_steps:
  - step_number: 1
    action: Access the retention policy settings and verify the configured document
      acknowledgment retention period
    expected_result: System displays the configured retention period for acknowledgment
      records
    data_to_capture:
    - Screenshot of retention policy settings
    - Configured retention period
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Generate a report of acknowledgment records approaching retention expiration
    expected_result: System generates a report showing records due for archival based
      on retention policy
    data_to_capture:
    - Report output
    - Number of records identified for archival
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Execute the archival process for expired acknowledgment records
    expected_result: System successfully archives records according to retention policy
      without data loss
    data_to_capture:
    - Archival process completion status
    - Number of records archived
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that archived acknowledgment records can be retrieved and viewed
    expected_result: Archived records remain accessible for review and audit purposes
    data_to_capture:
    - Ability to retrieve archived records
    - Data integrity of retrieved records
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Retention policy is correctly enforced for acknowledgment records
  - Archival process completes successfully without data corruption
  - Archived records remain accessible and readable
  - All regulatory retention requirements are met
  regulatory_basis:
  - 21 CFR Part 11.10 - Controls for closed systems
  - FDA record retention requirements
  - EU Annex 11 - Electronic records
  risk_level: high
  data_integrity_requirements:
  - Acknowledgment records must be preserved according to retention policy
  - Archival process must maintain data integrity and accessibility
  - No data loss or corruption during archival operations
  urs_requirements:
  - 'URS-021-006: Maintain acknowledgment records per retention policy'
  related_tests:
  - OQ-003
  - OQ-006
  estimated_duration_minutes: 60
  required_expertise:
  - Records management
  - Data archival procedures
  - Regulatory compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
