test_cases:
- test_id: OQ-001
  test_name: Document Assignment and Acknowledgment Workflow Verification
  test_category: functional
  gamp_category: 4
  objective: Verify that documents can be successfully assigned to users and groups,
    and that electronic acknowledgments are properly captured and recorded in the
    system with a complete audit trail.
  prerequisites:
  - System installed and configured
  - Test users created with appropriate roles
  - Test documents loaded into the system
  - Active Directory integration configured
  test_steps:
  - step_number: 1
    action: Log into the system as an administrator and navigate to the document assignment
      module
    expected_result: Administrator successfully logs in and can access the document
      assignment interface
    data_to_capture:
    - Login success/failure
    - Module accessibility status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Assign a test document to a specific user and a user group using the vendor
      UI
    expected_result: Document is successfully assigned to both the individual user
      and the group with confirmation message displayed
    data_to_capture:
    - Assignment success confirmation
    - Assigned user/group details
    - Assignment timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as the assigned user and navigate to the acknowledgment section
    expected_result: User can see the assigned document in their acknowledgment queue
    data_to_capture:
    - Document visibility in queue
    - Assignment details displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Complete the electronic acknowledgment process for the assigned document
    expected_result: Acknowledgment is successfully recorded with electronic signature
      and timestamp
    data_to_capture:
    - Acknowledgment completion status
    - Electronic signature details
    - Acknowledgment timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Verify the audit trail shows both the assignment and acknowledgment events
    expected_result: Complete audit trail is available showing assignment creation
      and acknowledgment completion with user and timestamp details
    data_to_capture:
    - Audit trail entries
    - Event timestamps
    - User identification in audit log
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Documents can be assigned to both individual users and groups
  - Electronic acknowledgments are properly captured with signature
  - Complete audit trail is maintained for all assignment and acknowledgment events
  - All regulatory requirements for record keeping are met
  regulatory_basis:
  - 21 CFR Part 11 electronic signatures requirements
  - Annex 11 electronic records compliance
  - Data integrity ALCOA+ principles
  risk_level: medium
  data_integrity_requirements:
  - Audit trail must capture all assignment and acknowledgment events
  - Electronic signatures must be securely linked to their respective records
  - All records must be maintained per retention policy requirements
  urs_requirements:
  - URS-021-001
  - URS-021-005
  - URS-021-006
  - URS-021-007
  related_tests:
  - OQ-002
  - PQ-001
  - PQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - System Administrator
  - Quality Assurance Specialist
  - Business Process Owner
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Automated Reminder and Reporting Functionality Verification
  test_category: functional
  gamp_category: 4
  objective: Verify that the system automatically sends reminders for pending acknowledgments
    and generates standard reports with performance metrics within specified timeframes.
  prerequisites:
  - System installed and configured
  - Test users with pending acknowledgments
  - Email server configured for notifications
  - Test data with multiple acknowledgment records
  test_steps:
  - step_number: 1
    action: Configure the vendor scheduler to send automated reminders for overdue
      acknowledgments
    expected_result: Reminder configuration is successfully saved and scheduler is
      activated
    data_to_capture:
    - Scheduler configuration status
    - Reminder settings
    - Activation confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that reminder emails are generated and sent to users with pending
      acknowledgments
    expected_result: Automated reminder emails are successfully sent to the appropriate
      users at the scheduled time
    data_to_capture:
    - Email generation timestamp
    - Recipient list
    - Email content validation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the standard acknowledgment reports module as a manager
    expected_result: Manager can successfully access and view all standard acknowledgment
      reports
    data_to_capture:
    - Report accessibility
    - Report generation time
    - Data accuracy in reports
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Generate a compliance report for 50,000 acknowledgment records
    expected_result: Report is generated in less than 10 seconds and contains accurate
      data for all records
    data_to_capture:
    - Report generation time
    - Record count accuracy
    - Data completeness in report
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Verify role-based dashboards display appropriate metrics and data for
      manager roles
    expected_result: Dashboard displays relevant acknowledgment metrics and compliance
      data specific to the manager's role and permissions
    data_to_capture:
    - Dashboard accessibility
    - Data accuracy
    - Role-specific content validation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Automated reminders are sent according to configured schedule
  - Reports generate in less than 10 seconds for 50k records
  - Role-based dashboards display appropriate metrics
  - All performance requirements are met for high-volume operations
  regulatory_basis:
  - Data integrity requirements for timely notifications
  - Performance standards for regulatory reporting
  - Role-based access control requirements
  risk_level: medium
  data_integrity_requirements:
  - Reports must accurately reflect current acknowledgment status
  - Reminder records must be maintained in audit trail
  - Dashboard data must be real-time and accurate
  urs_requirements:
  - URS-021-002
  - URS-021-003
  - URS-021-004
  - URS-021-008
  - URS-021-009
  related_tests:
  - OQ-001
  - PQ-003
  - PQ-004
  estimated_duration_minutes: 35
  required_expertise:
  - System Administrator
  - Quality Manager
  - Business Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Audit Trail Verification for Document Assignments and Acknowledgments
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that the system maintains a complete and unalterable audit trail
    for all document assignment and acknowledgment activities as required by regulatory
    standards.
  prerequisites:
  - System administrator access
  - Test users configured
  - Documents available for assignment
  - Audit trail viewing permissions enabled
  test_steps:
  - step_number: 1
    action: Assign a document to a test user using the vendor UI and record the assignment
      details
    expected_result: Assignment is successfully created and visible in the user's
      pending acknowledgments
    data_to_capture:
    - Assignment timestamp
    - Assigned document name
    - Assigned user ID
    - Assignment performed by user ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Have the test user acknowledge the assigned document using the electronic
      signature feature
    expected_result: Document acknowledgment is successfully recorded with electronic
      signature
    data_to_capture:
    - Acknowledgment timestamp
    - Acknowledging user ID
    - Electronic signature metadata
    - Document version acknowledged
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access the audit trail report for both assignment and acknowledgment events
    expected_result: Complete audit trail showing both assignment creation and acknowledgment
      completion with all relevant metadata
    data_to_capture:
    - Audit trail entries for both events
    - Timestamp accuracy
    - User identification
    - Event type classification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify audit trail entries cannot be modified or deleted by any user role
    expected_result: Audit trail entries are read-only and protected from modification
      or deletion
    data_to_capture:
    - Attempted modification results
    - System error messages if modification attempted
    - Security permissions verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All assignment and acknowledgment events are recorded in the audit trail with
    complete metadata
  - Audit trail entries are timestamped accurately and cannot be modified
  - Electronic signature records are properly captured and associated with the correct
    user and document
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - EU Annex 11 computerized systems requirements
  - FDA data integrity guidance
  risk_level: high
  data_integrity_requirements:
  - ALCOA+ principles compliance
  - Immutable audit trail maintenance
  - Timestamp accuracy and synchronization
  - User action attribution
  urs_requirements:
  - 'URS-021-007: Provide audit trail for assignments and acknowledgments'
  related_tests:
  - 'OQ-001: Document Assignment and Acknowledgment Workflow Verification'
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Assurance
  - Regulatory Compliance
  - System Administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Active Directory User Group Synchronization Verification
  test_category: integration
  gamp_category: 4
  objective: Verify that the system correctly synchronizes user groups from Active
    Directory using the standard connector and maintains proper group membership for
    document assignments.
  prerequisites:
  - Active Directory test environment
  - Test user groups configured in AD
  - AD connector properly configured
  - System administrator access
  test_steps:
  - step_number: 1
    action: Initiate a manual synchronization of user groups from Active Directory
      using the standard connector
    expected_result: Synchronization process completes successfully without errors
    data_to_capture:
    - Synchronization start/end timestamps
    - Number of groups synchronized
    - Synchronization status messages
    - Any error codes or warnings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that AD user groups are correctly imported and displayed in the
      document acknowledgment system
    expected_result: All configured AD groups appear in the system with correct membership
      counts
    data_to_capture:
    - Group names imported
    - User membership counts per group
    - Group hierarchy preservation
    - Synchronization timestamp accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Assign a document to an AD-synchronized group and verify group members
      receive the assignment
    expected_result: All members of the AD group receive the document assignment in
      their acknowledgment queue
    data_to_capture:
    - Assignment distribution success rate
    - Group membership validation
    - Assignment timestamp consistency
    - User notification delivery
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Modify group membership in Active Directory and verify changes propagate
      on next synchronization
    expected_result: System correctly updates group membership to reflect AD changes
      during synchronization
    data_to_capture:
    - Membership change detection
    - Update propagation timing
    - Change accuracy verification
    - Synchronization delta processing
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - AD user groups are successfully synchronized with correct membership
  - Document assignments to synchronized groups properly distribute to all group members
  - Group membership changes in AD are accurately reflected after synchronization
  - Synchronization process completes without data loss or corruption
  regulatory_basis:
  - GAMP5 integration testing requirements
  - Data synchronization integrity standards
  - User access management compliance
  risk_level: medium
  data_integrity_requirements:
  - Data synchronization accuracy
  - Membership consistency maintenance
  - Change propagation reliability
  - Integration error handling
  urs_requirements:
  - 'URS-021-010: Sync user groups from AD via standard connector'
  related_tests:
  - 'OQ-001: Document Assignment and Acknowledgment Workflow Verification'
  estimated_duration_minutes: 60
  required_expertise:
  - System Integration
  - Active Directory Administration
  - Network Connectivity
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
