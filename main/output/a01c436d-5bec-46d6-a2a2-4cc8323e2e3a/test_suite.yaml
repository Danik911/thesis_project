- test_id: OQ-006
  test_name: Electronic Signature and Audit Trail Verification for Acknowledgment
    Process
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that electronic signatures for document acknowledgments are properly
    captured and that the audit trail records all assignment and acknowledgment activities
    as required by regulatory standards.
  prerequisites:
  - System with configured electronic signature functionality
  - Test users with appropriate access rights
  - Documents assigned for acknowledgment
  - Audit trail logging enabled
  test_steps:
  - step_number: 1
    action: Assign a document to a test user and have them complete the electronic
      acknowledgment process
    expected_result: System captures electronic signature with timestamp, user ID,
      and meaning of signature as required by 21 CFR Part 11
    data_to_capture:
    - Electronic signature components captured
    - Timestamp accuracy
    - User identification verification
    - Signature meaning documentation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Review the audit trail for the document assignment and acknowledgment
      process
    expected_result: Audit trail contains complete record of assignment creation,
      reminder triggers, and acknowledgment completion with all required metadata
    data_to_capture:
    - Audit trail entries completeness
    - Event timestamps
    - User identification in audit records
    - Before/after values for changes
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify audit trail records are protected from modification and maintained
      per retention policy
    expected_result: Audit trail records are immutable and retained according to configured
      retention policy requirements
    data_to_capture:
    - Audit trail modification attempts
    - Retention policy configuration
    - Record archival and deletion processes
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Electronic signatures meet 21 CFR Part 11 requirements
  - Complete audit trail exists for all assignment and acknowledgment activities
  - Audit trail records are protected from modification and properly retained
  regulatory_basis:
  - FDA 21 CFR Part 11 electronic signatures requirements
  - EU Annex 11 computerised systems requirements
  - Data integrity ALCOA+ principles
  risk_level: critical
  data_integrity_requirements:
  - Electronic signatures must be attributable, legible, contemporaneous, original,
    and accurate
  - Audit trail must be complete, consistent, enduring, and available
  - Records must be maintained per retention policy requirements
  urs_requirements:
  - URS-021-005
  - URS-021-006
  - URS-021-007
  related_tests:
  - OQ-001
  - OQ-003
  estimated_duration_minutes: 90
  required_expertise:
  - Regulatory compliance
  - Data integrity principles
  - Audit trail analysis
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
