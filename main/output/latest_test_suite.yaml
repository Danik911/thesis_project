test_cases:
- test_id: OQ-001
  test_name: Functional Verification of SPC Chart Creation and Export
  test_category: functional
  gamp_category: 3
  objective: To verify that the SPC dashboard can successfully create X-bar/R and
    p-charts from a CSV file and export the results to PDF and CSV formats using standard
    vendor functionality.
  prerequisites:
  - SPC Dashboard software is installed and accessible
  - Valid CSV test file with sample QC data is available
  - User account with appropriate permissions for chart creation and export is configured
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using the pre-configured user credentials.
    expected_result: User successfully authenticates and the main dashboard interface
      is displayed.
    data_to_capture:
    - Screenshot of the main dashboard screen
    - Login timestamp from the system
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the data import section and select the option to import from
      a CSV file.
    expected_result: The system displays the CSV import dialog with options to select
      a file.
    data_to_capture:
    - Screenshot of the CSV import dialog
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the provided test CSV file containing sample QC data points.
    expected_result: The system confirms successful import and displays a preview
      of the loaded data.
    data_to_capture:
    - Screenshot of the data preview
    - System message confirming import success
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Select the option to create an X-bar/R chart using the imported data.
    expected_result: The system generates and displays a correctly formatted X-bar/R
      chart based on the data.
    data_to_capture:
    - Screenshot of the generated X-bar/R chart
    - Timestamp of chart generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Select the option to create a p-chart using the same imported data set.
    expected_result: The system generates and displays a correctly formatted p-chart
      based on the data.
    data_to_capture:
    - Screenshot of the generated p-chart
    - Timestamp of chart generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: For the X-bar/R chart, select the export function and choose the PDF format.
    expected_result: The system generates a PDF file containing the chart and downloads
      it to the local machine.
    data_to_capture:
    - Screenshot of the export confirmation
    - The generated PDF file for verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 7
    action: For the p-chart, select the export function and choose the CSV format.
    expected_result: The system generates a CSV file containing the chart data and
      downloads it to the local machine.
    data_to_capture:
    - Screenshot of the export confirmation
    - The generated CSV file for verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All chart types are generated without errors using the standard vendor functionality.
  - Exported PDF file contains the correct chart visualization and is readable.
  - Exported CSV file contains the correct underlying data points used for the chart.
  - The entire process completes within the performance requirements for data loading
    and rendering.
  regulatory_basis:
  - 21 CFR Part 11 for electronic records and signatures
  - GMP requirements for data integrity and traceability
  risk_level: medium
  data_integrity_requirements:
  - Imported data must remain unchanged during chart generation.
  - Exported files must accurately represent the source data and chart visualizations.
  - System must maintain data consistency between import, processing, and export operations.
  urs_requirements:
  - 'URS-020-001: Users shall create X-bar/R and p-charts from CSV inputs.'
  - 'URS-020-003: The system shall provide vendor standard export to PDF and CSV.'
  related_tests:
  - OQ-002
  - OQ-003
  estimated_duration_minutes: 45
  required_expertise:
  - SPC Chart Knowledge
  - Basic CSV Format Understanding
  - Dashboard Navigation Skills
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Performance Verification of Data Loading and Chart Rendering
  test_category: performance
  gamp_category: 3
  objective: To verify that the SPC dashboard meets the performance requirements for
    loading large datasets and rendering charts within specified time limits on supported
    hardware.
  prerequisites:
  - SPC Dashboard software is installed on supported hardware
  - Large test CSV file with approximately 100,000 data points is available
  - System performance monitoring tools are accessible
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard and navigate to the data import functionality.
    expected_result: User successfully accesses the import interface without performance
      degradation.
    data_to_capture:
    - System response time for interface loading
    - CPU and memory usage baseline
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the import process for the large CSV file containing 100,000
      data points and start a timer.
    expected_result: The system begins processing the file and shows progress indication.
    data_to_capture:
    - Start timestamp of the import process
    - System resource utilization during import
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Monitor the import process until completion and stop the timer when the
      system confirms success.
    expected_result: The system completes the data import and displays the loaded
      dataset.
    data_to_capture:
    - End timestamp of the import process
    - Total elapsed time for data loading
    - System resource peak usage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Apply a basic filter to the loaded dataset (e.g., date range or product
      type) and start a timer.
    expected_result: The system acknowledges the filter change and begins processing.
    data_to_capture:
    - Filter parameters applied
    - Start timestamp for filter processing
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Monitor the system until the chart is re-rendered with the applied filter
      and stop the timer.
    expected_result: The system displays the updated chart reflecting the filter changes.
    data_to_capture:
    - End timestamp for chart rendering
    - Total elapsed time for chart rendering
    - Final system resource utilization
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Repeat steps 4-5 with two additional different filter combinations to
      verify consistent performance.
    expected_result: The system maintains consistent performance across multiple filter
      operations.
    data_to_capture:
    - Performance metrics for each filter iteration
    - Consistency of response times
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data loading of 100,000 points completes in less than 5 seconds on supported hardware.
  - Chart rendering after filter changes completes in less than 2 seconds.
  - System resource utilization remains within acceptable limits during peak load.
  - Performance is consistent across multiple test iterations.
  regulatory_basis:
  - GMP requirements for system performance and reliability
  - Industry standards for software responsiveness in quality control environments
  risk_level: medium
  data_integrity_requirements:
  - Performance testing must not compromise data integrity or accuracy.
  - All data points must be correctly processed despite the performance optimization.
  urs_requirements:
  - 'URS-020-010: Load 100k data points in < 5 seconds on supported hardware.'
  - 'URS-020-011: Render charts in < 2 seconds after filter changes.'
  related_tests:
  - OQ-001
  - OQ-004
  estimated_duration_minutes: 30
  required_expertise:
  - Performance Testing
  - System Monitoring
  - SPC Dashboard Operation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based View Access Verification
  test_category: security
  gamp_category: 3
  objective: Verify that the system properly enforces role-based access controls for
    different user roles and view permissions.
  prerequisites:
  - System installed and configured
  - Test users with different roles created (Admin, QC Analyst, Viewer)
  - Sample datasets available in the system
  test_steps:
  - step_number: 1
    action: Log in as Admin user and verify access to all dashboard features and configuration
      options
    expected_result: Admin user has full access to all system features and configuration
      menus
    data_to_capture:
    - Screenshots of accessible features
    - List of available menu options
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as QC Analyst user and attempt to access various dashboard functions
    expected_result: QC Analyst has access to create/view charts but limited configuration
      access
    data_to_capture:
    - Screenshots of accessible features
    - Error messages for restricted functions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as Viewer user and attempt to modify or configure dashboard settings
    expected_result: Viewer user has read-only access with no modification capabilities
    data_to_capture:
    - Screenshots showing read-only interface
    - Error messages for modification attempts
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Different user roles have appropriate access levels
  - Read-only users cannot modify data or configurations
  - Access restrictions are consistently enforced
  regulatory_basis:
  - 21 CFR Part 11 - Electronic records and signatures
  - Data integrity requirements for access controls
  risk_level: medium
  data_integrity_requirements:
  - Access controls prevent unauthorized data modification
  - User permissions are consistently enforced
  urs_requirements:
  - URS-020-004
  - URS-020-007
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Assurance
  - System Administration
  - GxP Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
