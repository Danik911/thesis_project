test_cases:
- test_id: OQ-001
  test_name: X-bar/R Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully create X-bar/R control charts from
    CSV input data and correctly apply vendor-standard Nelson rules for statistical
    process control analysis.
  prerequisites:
  - System installed and configured
  - Test CSV file with 100k data points prepared
  - Valid user credentials with chart creation permissions
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard using valid credentials with appropriate permissions
    expected_result: User successfully logs in and accesses the main dashboard interface
    data_to_capture:
    - Login success/failure
    - Dashboard load time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to chart creation module and select X-bar/R chart option from
      available chart types
    expected_result: Chart creation interface loads with X-bar/R chart options displayed
    data_to_capture:
    - Module load time
    - Available chart types
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the prepared CSV file containing 100k data points using the import
      function
    expected_result: CSV file successfully uploads and data is processed within 5
      seconds
    data_to_capture:
    - Upload time
    - Data processing time
    - Any error messages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure the chart with appropriate subgroup size and enable Nelson rules
      application
    expected_result: Chart configuration is accepted and Nelson rules are enabled
      for analysis
    data_to_capture:
    - Configuration settings
    - Nelson rules activation status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate the X-bar/R chart and verify Nelson rules are visually indicated
      on the chart
    expected_result: Chart renders within 2 seconds with Nelson rule violations clearly
      marked
    data_to_capture:
    - Chart render time
    - Nelson rule violations count
    - Visual indicators quality
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart successfully created from CSV input
  - 100k data points processed in under 5 seconds
  - Chart renders within 2 seconds after configuration
  - Nelson rules correctly identify and mark statistical outliers
  - No data corruption during import process
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - GMP data integrity principles for statistical analysis
  - ICH Q9 Quality Risk Management guidelines
  risk_level: medium
  data_integrity_requirements:
  - Original CSV data must remain unaltered during import
  - Chart calculations must maintain mathematical accuracy
  - Nelson rule application must be consistent and reproducible
  - All data transformations must be auditable
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-010
  - URS-020-011
  related_tests:
  - OQ-002
  - PQ-001
  - PQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - SPC chart interpretation
  - CSV data formatting
  - Statistical process control knowledge
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Role-Based Access Control and Data Export Functionality
  test_category: security
  gamp_category: 3
  objective: Validate that the system properly implements role-based access controls
    and supports standard export functionality to PDF and CSV formats while maintaining
    data integrity.
  prerequisites:
  - System with multiple user roles configured
  - Released dataset available for testing
  - Test users with different permission levels created
  test_steps:
  - step_number: 1
    action: Log in as a user with administrator privileges and access a released dataset
    expected_result: Administrator can view and interact with the released dataset
      including edit capabilities
    data_to_capture:
    - User role permissions
    - Dataset access level
    - Available functions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to export the released dataset to PDF format using the vendor's
      standard export function
    expected_result: PDF export completes successfully with all chart data and annotations
      preserved
    data_to_capture:
    - Export completion time
    - PDF file integrity
    - Data completeness in export
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log in as a user with read-only privileges for released datasets
    expected_result: User successfully logs in with restricted permissions
    data_to_capture:
    - Login success
    - Permission level verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to access the same released dataset and verify read-only restrictions
    expected_result: User can view but not modify the released dataset, with edit
      functions disabled
    data_to_capture:
    - View access granted
    - Edit functions availability
    - Permission enforcement
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Attempt to export the dataset to CSV format and verify data integrity
    expected_result: CSV export completes with accurate data representation matching
      original values
    data_to_capture:
    - Export completion
    - Data accuracy in CSV
    - Format preservation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access controls properly enforce permissions for different user types
  - Released datasets maintain read-only access as configured
  - PDF and CSV exports complete successfully with preserved data integrity
  - No unauthorized access or modification of released data possible
  - Export formats maintain all original data and annotations
  regulatory_basis:
  - 21 CFR Part 11 access controls requirements
  - EU Annex 11 electronic system security
  - Data integrity ALCOA+ principles
  - GMP requirements for data protection
  risk_level: medium
  data_integrity_requirements:
  - Exported data must match source data exactly
  - Access controls must prevent unauthorized data modification
  - Read-only enforcement must be consistent across all interfaces
  - Export functions must preserve data accuracy and formatting
  urs_requirements:
  - URS-020-003
  - URS-020-004
  - URS-020-007
  - URS-020-008
  related_tests:
  - OQ-001
  - PQ-002
  - PQ-004
  estimated_duration_minutes: 30
  required_expertise:
  - User access management
  - Data export validation
  - Security permission testing
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
