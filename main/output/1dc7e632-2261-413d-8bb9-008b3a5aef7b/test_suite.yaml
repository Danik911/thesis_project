    action: Configure the SPC dashboard to connect to the test Active Directory server
      using vendor-provided configuration tools
    expected_result: System accepts AD configuration settings and establishes connection
      to AD server
    data_to_capture:
    - Configuration success status
    - AD server connection status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to log into the SPC dashboard using valid AD user credentials
    expected_result: System authenticates against AD and grants access to authorized
      user
    data_to_capture:
    - Authentication success
    - User role mapping from AD
    - Login timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to log into the SPC dashboard using invalid AD user credentials
    expected_result: System rejects login attempt with appropriate error message
    data_to_capture:
    - Authentication failure
    - Error message displayed
    - Security event logging
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify user roles and permissions are correctly mapped from Active Directory
      groups
    expected_result: User access rights correspond to their AD group memberships as
      configured
    data_to_capture:
    - Role mapping accuracy
    - Permission levels assigned
    - Group membership verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Test authentication with a user whose AD account has been disabled
    expected_result: System denies access to disabled AD accounts immediately
    data_to_capture:
    - Access denial for disabled accounts
    - Security response time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
