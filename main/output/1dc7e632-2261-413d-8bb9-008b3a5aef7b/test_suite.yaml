- test_id: OQ-001
  test_name: CSV Import and X-bar/R Chart Creation Verification
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully import data from CSV files and create
    X-bar/R control charts using vendor-standard functionality
  prerequisites:
  - System installed and configured
  - Test CSV file with 1000+ data points prepared
  - User with appropriate permissions logged in
  test_steps:
  - step_number: 1
    action: Navigate to the data import section and select CSV import option
    expected_result: CSV import interface loads successfully with file selection dialog
    data_to_capture:
    - Import interface screenshot
    - Time to load import interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Upload the prepared CSV file containing QC data points
    expected_result: File uploads successfully and system processes data without errors
    data_to_capture:
    - Upload completion time
    - Any error messages
    - Number of records processed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select X-bar/R chart creation option from the dashboard menu
    expected_result: Chart creation interface loads with appropriate data fields available
    data_to_capture:
    - Chart creation interface screenshot
    - Available data field options
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure chart parameters and generate X-bar/R chart
    expected_result: Chart renders successfully with correct data representation
    data_to_capture:
    - Chart rendering time
    - Chart configuration screenshot
    - Final chart output
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - CSV file imports without errors
  - X-bar/R chart renders correctly with imported data
  - All data points from CSV are accurately represented
  - Chart generation completes within 2 seconds
  regulatory_basis:
  - 21 CFR Part 11 compliance for electronic records
  - GAMP 5 guidelines for commercial software validation
  risk_level: medium
  data_integrity_requirements:
  - Imported data must match source CSV exactly
  - Chart calculations must maintain data accuracy
  - No data corruption during import process
  urs_requirements:
  - URS-020-001
  - URS-020-010
  - URS-020-011
  - URS-020-012
  related_tests:
  - OQ-002
  - PQ-Data-Import-001
  estimated_duration_minutes: 30
  required_expertise:
  - SPC chart knowledge
  - CSV data formatting
  - Quality control systems
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Nelson Rules Application and PDF Export Functionality
  test_category: functional
  gamp_category: 3
  objective: Verify the system correctly applies vendor-standard Nelson rules to control
    charts and exports results to PDF format
  prerequisites:
  - System with test data loaded
  - Control chart created with known pattern data
  - User with export permissions logged in
  test_steps:
  - step_number: 1
    action: Create a control chart with data patterns designed to trigger specific
      Nelson rules
    expected_result: Chart displays with data points showing expected patterns for
      rule testing
    data_to_capture:
    - Chart configuration
    - Data pattern details
    - Initial chart display
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Enable Nelson rules application from the chart configuration menu
    expected_result: Nelson rules options become available and can be selected
    data_to_capture:
    - Nelson rules interface screenshot
    - Available rule options
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Apply all standard Nelson rules to the chart and verify rule violations
    expected_result: System correctly identifies and flags data points violating Nelson
      rules
    data_to_capture:
    - Rule violation indicators
    - Number of violations detected
    - Specific rules triggered
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Select PDF export option from the report menu and generate export
    expected_result: PDF export completes successfully with chart and rule violations
      included
    data_to_capture:
    - Export completion time
    - PDF file integrity
    - Content accuracy in exported file
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Verify PDF content matches on-screen chart display and rule applications
    expected_result: Exported PDF accurately represents the chart and all Nelson rule
      violations
    data_to_capture:
    - PDF content verification results
    - Discrepancies found
    - Export quality assessment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Nelson rules correctly identify expected pattern violations
  - PDF export contains complete chart with rule violations
  - Export process completes without data loss
  - PDF format maintains data integrity and readability
  regulatory_basis:
  - 21 CFR Part 11 electronic signatures and records
  - FDA guidance on process validation
  - GAMP Category 3 software validation requirements
  risk_level: medium
  data_integrity_requirements:
  - Nelson rule calculations must be mathematically accurate
  - PDF export must preserve all chart data and annotations
  - Rule application must be consistent and reproducible
  urs_requirements:
  - URS-020-002
  - URS-020-003
  - URS-020-007
  - URS-020-008
  related_tests:
  - OQ-001
  - PQ-Reporting-001
  estimated_duration_minutes: 30
  required_expertise:
  - Statistical process control knowledge
  - Nelson rules understanding
  - PDF export verification
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based Access Control and Read-Only Data Verification
  test_category: security
  gamp_category: 3
  objective: To verify that role-based view access functions correctly and that released
    datasets are enforced as read-only as per regulatory requirements.
  prerequisites:
  - System installation is complete and verified (OQ-001).
  - At least two user accounts with different roles (e.g., Analyst, Reviewer) are
    configured.
  - A sample dataset has been imported and marked as 'released'.
  test_steps:
  - step_number: 1
    action: Log in to the SPC dashboard as a user with an 'Analyst' role.
    expected_result: Login is successful. The user interface and available functions
      are appropriate for the Analyst role.
    data_to_capture:
    - Screenshot of the dashboard home screen post-login.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the 'released' sample dataset and attempt to edit data points
      or chart configurations.
    expected_result: All modification functions (e.g., edit, delete, recalculate)
      for the released dataset are disabled or unavailable.
    data_to_capture:
    - Screenshot showing disabled controls or error message when attempting to edit.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log in as a user with a 'Reviewer' or 'Viewer' role.
    expected_result: Login is successful. The user interface displays only view-only
      functions.
    data_to_capture:
    - Screenshot of the dashboard home screen for the Reviewer role.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Attempt to access configuration menus or data import functions.
    expected_result: Configuration and data import functions are not visible or are
      inaccessible to the user.
    data_to_capture:
    - Screenshot showing the absence of configuration menus.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Users can only access functions and data views appropriate to their assigned role.
  - Released datasets are strictly read-only and cannot be modified by any user role.
  - The system correctly restricts access based on the configured role-based permissions.
  regulatory_basis:
  - 21 CFR Part 11 - Requirements for access controls and ability to generate accurate
    and complete copies of records.
  - General EU GMP Annex 11 - Principles of access privilege allocation and data integrity.
  risk_level: high
  data_integrity_requirements:
  - Prevention of unauthorized or accidental modification of released data.
  - Ensuring data authenticity by controlling user actions based on role.
  urs_requirements:
  - 'URS-020-004: The dashboard shall allow role-based view access.'
  - 'URS-020-007: Read-only access for released datasets.'
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - QA Analyst
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Data Import via ODBC Connection and Annotation Functionality
  test_category: integration
  gamp_category: 3
  objective: To verify successful data import using a standard ODBC connection and
    the proper functioning of the built-in point annotation feature.
  prerequisites:
  - System installation is complete and verified (OQ-001).
  - A test database is available with a configured ODBC Data Source Name (DSN).
  - A user account with permissions to import data and annotate charts is available.
  test_steps:
  - step_number: 1
    action: Log in to the SPC dashboard and navigate to the data import module.
    expected_result: The import module is accessible and displays the option to import
      via ODBC connection.
    data_to_capture:
    - Screenshot of the data import selection screen.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select the ODBC import option, choose the pre-configured test DSN, and
      execute a query to import a known dataset.
    expected_result: The system successfully connects to the database and imports
      the specified dataset without errors.
    data_to_capture:
    - Screenshot of the successful import confirmation message.
    - Log of the import process.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Create a control chart (X-bar/R or p-chart) from the imported ODBC data.
    expected_result: The chart is generated correctly, displaying the data points
      from the ODBC source.
    data_to_capture:
    - Screenshot of the generated control chart.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Select a specific data point on the chart and use the built-in annotation
      feature to add a test comment.
    expected_result: The annotation is successfully saved and is visibly associated
      with the selected data point.
    data_to_capture:
    - Screenshot of the chart showing the annotated point.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Refresh the chart view and verify the annotation persists.
    expected_result: The annotation remains visible and associated with the correct
      data point after refresh.
    data_to_capture:
    - Screenshot of the chart after refresh.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system can successfully import data using a standard ODBC connector.
  - Data integrity is maintained during the ODBC import process.
  - The built-in annotation feature allows users to add and persist comments on specific
    chart points.
  regulatory_basis:
  - 21 CFR Part 11 - Requirements for secure data transfer and audit trails for data
    creation/modification (annotations).
  risk_level: medium
  data_integrity_requirements:
  - Accurate and complete transfer of data from the source database via ODBC.
  - Persistence and accurate linking of annotations to specific data points.
  urs_requirements:
  - 'URS-020-005: Users shall annotate points with comments using built-in features.'
  - 'URS-020-012: Import data from CSV and ODBC connections using standard connectors.'
  related_tests:
  - OQ-001
  estimated_duration_minutes: 35
  required_expertise:
  - QA Analyst
  - Database Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
