  required_expertise:
  - Active Directory administration
  - Network security
  - Vendor authentication configuration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Chart Configuration Retention and Audit Trail Verification
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that chart configurations are retained as controlled records and
    that vendor-provided audit trail functionality captures configuration changes.
  prerequisites:
  - Valid user account with configuration permissions
  - Existing chart configuration saved in the system
  - Access to audit trail logs if provided by vendor
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with a user account that has configuration
      permissions.
    expected_result: User successfully authenticates and gains access to the dashboard
      interface.
    data_to_capture:
    - Screenshot of successful login
    - Timestamp of login
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to and open an existing, saved chart configuration (e.g., an
      X-bar/R chart setup).
    expected_result: The chart configuration loads correctly, displaying all previously
      saved settings.
    data_to_capture:
    - Screenshot of the loaded configuration
    - Name/ID of the configuration tested
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Modify a configuration parameter (e.g., change a control limit or chart
      title) and save the configuration.
    expected_result: The system confirms the configuration has been saved successfully.
    data_to_capture:
    - Screenshot of the save confirmation
    - Description of the specific change made
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: If the vendor provides an audit trail feature, access the audit log for
      the modified configuration.
    expected_result: The audit log (if available) displays an entry detailing the
      user, timestamp, and nature of the configuration change.
    data_to_capture:
    - Screenshot of the audit trail entry
    - Confirmation of data captured (user, time, change details)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Close and reopen the modified chart configuration to verify the changes
      were persisted.
    expected_result: The chart configuration opens with the modified settings intact.
    data_to_capture:
    - Screenshot confirming the persisted change
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Chart configurations are successfully saved and retrieved without data loss.
  - Modifications to configurations are accurately persisted.
  - Vendor-provided audit trail (if any) correctly records configuration changes with
    user and timestamp.
  regulatory_basis:
  - FDA 21 CFR Part 11 requirements for controlled records and audit trails.
  - GMP principles for data integrity and configuration management.
  risk_level: medium
  data_integrity_requirements:
  - Configuration data must be complete and accurate upon saving and retrieval.
  - Audit trail entries (if available) must be secure, time-stamped, and attributable.
  urs_requirements:
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-001
  - OQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - SPC Dashboard User
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: High-Volume Data Load and Chart Rendering Performance
  test_category: performance
  gamp_category: 3
  objective: Verify the system meets performance requirements for loading a large
    dataset and rendering charts within the specified time limits on supported hardware.
  prerequisites:
  - SPC dashboard installed on supported hardware
  - A CSV test file containing at least 100,000 data points
  - Stopwatch or system timer
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard and navigate to the data import function.
    expected_result: The import interface is accessible and ready for file selection.
    data_to_capture:
    - Screenshot of the import interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select the CSV file containing 100,000 data points and initiate the import
      process. Start the timer upon confirmation.
    expected_result: The system begins processing the import request.
    data_to_capture:
    - Name and size of the test file
    - Time import process started
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Stop the timer when the system indicates the data import is complete and
      the data is ready for charting.
    expected_result: The data is successfully loaded and available for use. The elapsed
      time is less than 5 seconds.
    data_to_capture:
    - Time import process completed
    - Total elapsed time for data load
    - Screenshot of successful import confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Create a new X-bar/R chart using the imported 100k point dataset. Start
      the timer upon applying the chart configuration.
    expected_result: The system begins rendering the chart.
    data_to_capture:
    - Time chart rendering started
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Stop the timer when the chart is fully rendered and displayed on the screen.
    expected_result: The chart is displayed correctly. The elapsed time is less than
      2 seconds.
    data_to_capture:
    - Time chart rendering completed
    - Total elapsed time for chart render
    - Screenshot of the fully rendered chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Apply a filter to the chart (e.g., filter by a specific subgroup). Start
      the timer upon confirming the filter change.
    expected_result: The system begins re-rendering the chart with the applied filter.
    data_to_capture:
    - Description of the filter applied
    - Time filter application started
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 7
    action: Stop the timer when the updated chart is fully rendered.
    expected_result: The filtered chart is displayed correctly. The elapsed re-render
      time is less than 2 seconds.
    data_to_capture:
    - Time filter render completed
    - Total elapsed time for re-render
    - Screenshot of the filtered chart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
