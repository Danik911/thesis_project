- test_id: OQ-006
  test_name: Active Directory Integration for User Authentication
  test_category: integration
  gamp_category: 3
  objective: Verify the system successfully integrates with Active Directory for user
    authentication when supported by vendor configuration.
  prerequisites:
  - System installed with AD integration module
  - Active Directory test environment
  - Test AD user accounts
  - Network connectivity to AD server
  - Vendor-supported AD configuration
  test_steps:
