  - AD authentication works correctly for valid credentials
  - Invalid credentials are properly rejected
  - User roles are correctly mapped from AD groups
  - Disabled accounts are denied access
  regulatory_basis:
  - 21 CFR Part 11 requirements for electronic signatures and authentication
  - GMP requirements for access control and user authentication
