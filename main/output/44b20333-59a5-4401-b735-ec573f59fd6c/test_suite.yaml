test_cases:
- test_id: OQ-001
  test_name: Verify Continuous Temperature Monitoring Functionality
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS continuously monitors temperature in GMP storage
    areas as per URS-EMS-001.
  prerequisites:
  - EMS installed and operational
  - Temperature sensors calibrated
  test_steps:
  - step_number: 1
    action: Access the EMS software interface and navigate to the temperature monitoring
      section.
    expected_result: Temperature readings for all GMP storage areas are displayed.
    data_to_capture:
    - Temperature readings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Observe the temperature readings for a period of 10 minutes.
    expected_result: Temperature readings are updated at intervals not exceeding 5
      minutes.
    data_to_capture:
    - Update intervals
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Temperature readings are continuously displayed and updated within 5-minute intervals.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Ensure temperature data is accurately recorded and stored.
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  related_tests:
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - EMS software operation
  - Temperature monitoring
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Validate Temperature Alert Generation
  test_category: functional
  gamp_category: 3
  objective: To validate that the EMS generates alerts when temperature deviates ±2°C
    from the setpoint as per URS-EMS-005.
  prerequisites:
  - EMS installed and operational
  - Temperature sensors calibrated
  test_steps:
  - step_number: 1
    action: Set a temperature setpoint in the EMS software.
    expected_result: Setpoint is successfully configured.
    data_to_capture:
    - Setpoint value
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate a temperature deviation of ±2°C from the setpoint.
    expected_result: EMS generates an alert within 30 seconds.
    data_to_capture:
    - Alert generation time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alerts are generated within 30 seconds of temperature deviation.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Ensure alerts are accurately logged and timestamped.
  urs_requirements:
  - URS-EMS-005
  - URS-EMS-011
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - EMS software operation
  - Temperature monitoring
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
