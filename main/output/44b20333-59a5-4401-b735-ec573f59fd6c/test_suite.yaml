- test_id: OQ-005
  test_name: Verify Temperature Range Accuracy
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS accurately measures temperature within the specified
    range of -80°C to +50°C with an accuracy of ±0.5°C.
  prerequisites:
  - EMS installed and operational
  - Calibrated temperature reference device
  test_steps:
  - step_number: 1
    action: Set the EMS to monitor temperature in a controlled environment.
    expected_result: EMS displays temperature readings within the specified range.
    data_to_capture:
    - Temperature readings from EMS
    - Temperature readings from reference device
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Compare EMS readings with the calibrated reference device at various temperatures.
    expected_result: EMS readings are within ±0.5°C of the reference device readings.
    data_to_capture:
    - Temperature readings from EMS
    - Temperature readings from reference device
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - EMS readings are within ±0.5°C of the reference device readings at all tested
    temperatures.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Ensure all temperature readings are accurately recorded and stored.
  urs_requirements:
  - URS-EMS-004
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - EMS operation
  - Temperature calibration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
