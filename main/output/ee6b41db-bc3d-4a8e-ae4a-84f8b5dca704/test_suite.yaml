- test_id: OQ-018
  test_name: Verify Workflow Exception Handling for Courier Delay
  test_category: functional
  gamp_category: 4
  objective: To confirm that the system correctly triggers and manages the defined
    exception workflow when a logistics event (e.g., courier delay) violates predefined
    time constraints.
  prerequisites:
  - Workflow configured with a time-based alert for material transit exceeding 12
    hours.
  - Test material staged for shipment to manufacturing.
  - Access to simulate or manually input a delayed status from the courier system.
  test_steps:
  - step_number: 1
    action: Simulate the material being scanned out for shipment and log the initial
      expected delivery time.
    expected_result: The system initiates the standard custody tracking timer.
    data_to_capture:
    - Initial expected delivery time
    - System time when shipment was logged
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Manually input a status update indicating the material is delayed by 4
      hours past the expected delivery time (triggering the exception rule).
    expected_result: The system detects the time violation and automatically transitions
      the patient journey to the 'Logistics Exception' workflow state.
    data_to_capture:
    - Time the exception was triggered
    - New workflow state recorded
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the system's response within the exception workflow (e.g., notification
      generation, task assignment).
    expected_result: A high-priority notification is sent to the designated logistics
      manager, and a task is created requiring manual review and disposition.
    data_to_capture:
    - Notification recipient verification
    - Task ID generated for review
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Complete the exception review task by documenting the resolution (e.g.,
      'Delay Accepted, New ETA Confirmed').
    expected_result: The system logs the resolution, updates the audit trail (URS-028-008),
      and resumes the workflow based on the manual input.
    data_to_capture:
    - Resolution documentation
    - Audit trail entry confirming workflow resumption
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The time-based exception rule is correctly triggered upon violation.
  - The system successfully switches to the predefined exception handling workflow.
  - All actions taken during the exception handling are fully auditable.
  regulatory_basis:
  - URS-028-004
  - URS-028-008
  risk_level: medium
  data_integrity_requirements:
  - Verification that the exception handling does not corrupt the chain-of-custody
    record.
  urs_requirements:
  - URS-028-004
  related_tests:
  - OQ-005
  estimated_duration_minutes: 45
  required_expertise:
  - Workflow Configuration
  - Logistics Process Knowledge
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
