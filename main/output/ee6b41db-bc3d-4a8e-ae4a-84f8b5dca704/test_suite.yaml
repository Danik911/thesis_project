test_cases:
- test_id: OQ-001
  test_name: Verify Configuration of End-to-End Workflow Template Execution
  test_category: functional
  gamp_category: 4
  objective: Validate the successful configuration and execution of a complete, standard
    personalized therapy workflow template from apheresis scheduling through QC release.
  prerequisites:
  - System is fully installed and configured.
  - Test patient data set is loaded.
  - Workflow template matching URS-028-001 is configured and active.
  test_steps:
  - step_number: 1
    action: Initiate a new patient journey using the standard end-to-end workflow
      template.
    expected_result: The system successfully transitions the patient record through
      the Apheresis Scheduling, Manufacturing Slotting, and initial QC stages without
      manual intervention.
    data_to_capture:
    - Workflow instance ID
    - Timestamp of transition between major stages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify the audit trail records for all automated handoffs within the workflow
      instance.
    expected_result: URS-028-008 is satisfied; all automated transitions are logged
      with system user and accurate timestamps.
    data_to_capture:
    - Audit log entries for handoffs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The workflow completes the defined stages successfully.
  - All required system-generated records are created correctly.
  regulatory_basis:
  - URS-028-001
  risk_level: medium
  data_integrity_requirements:
  - Ensure no data corruption occurs during automated state transitions.
  urs_requirements:
  - URS-028-001
  - URS-028-008
  related_tests: []
  estimated_duration_minutes: 45
  required_expertise:
  - Workflow Configuration Specialist
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Verify Chain-of-Custody Dual-Scanning and E-Signature Enforcement
  test_category: data_integrity
  gamp_category: 4
  objective: Confirm that critical custody transfers require dual-scanning verification
    and that final release actions are protected by 21 CFR Part 11 compliant e-signatures.
  prerequisites:
  - System configured for dual-scanning verification on custody events.
  - Test user accounts with appropriate e-signature privileges are active.
  test_steps:
  - step_number: 1
    action: Simulate a custody transfer event (e.g., material receipt) requiring dual
      scanning, attempting to confirm with only one scan.
    expected_result: The system rejects the transfer confirmation until the second,
      unique scan input is provided.
    data_to_capture:
    - Error message received for single scan attempt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Advance the workflow to the final QC Release step and attempt to execute
      the release action without providing valid e-signature credentials.
    expected_result: The system blocks the release action and prompts for valid credentials,
      logging the failed attempt.
    data_to_capture:
    - E-signature prompt details
    - Audit log entry for failed release attempt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Successfully execute the QC Release action using valid e-signature credentials.
    expected_result: The system records the e-signature, marks the product as released,
      and logs the signature details in the audit trail.
    data_to_capture:
    - Final release timestamp
    - E-signature verification record
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Custody transfers cannot proceed without dual verification.
  - Critical actions (like release) are gated by valid 21 CFR Part 11 e-signatures.
  regulatory_basis:
  - URS-028-002
  - URS-028-009
  risk_level: critical
  data_integrity_requirements:
  - Ensure e-signature integrity and non-repudiation.
  urs_requirements:
  - URS-028-002
  - URS-028-009
  related_tests:
  - OQ-001
  estimated_duration_minutes: 60
  required_expertise:
  - Security/Compliance Engineer
  - Validation Lead
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Verify Configurable Constraint-Based Scheduling and Slot Allocation
  test_category: functional
  gamp_category: 4
  objective: To verify that the system correctly enforces configurable constraints
    during scheduling and allocates manufacturing slots according to defined business
    rules.
  prerequisites:
  - System is fully installed and configured.
  - Workflow templates (URS-028-001) are defined.
  - Scheduling constraints (e.g., facility capacity, material availability) are configured
    (URS-028-003).
  test_steps:
  - step_number: 1
    action: Input three patient orders requiring manufacturing slots, ensuring one
      order violates a configured capacity constraint.
    expected_result: The two compliant orders are successfully slotted, and the violating
      order is flagged with an appropriate scheduling exception message.
    data_to_capture:
    - Order IDs for all three patients
    - System-assigned slot times
    - Error message for the rejected order
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to manually override the constraint for the rejected order via
      an authorized user interface.
    expected_result: The system prevents the override unless the user possesses the
      necessary elevated permissions, or the override is logged with an audit trail
      entry.
    data_to_capture:
    - User ID performing the override attempt
    - Audit log entry confirming success or failure of override
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully allocates slots based on defined constraints.
  - Violating orders are correctly rejected or flagged.
  - All scheduling actions are recorded in the audit trail (URS-028-008).
  regulatory_basis:
  - URS-028-003
  risk_level: medium
  data_integrity_requirements:
  - Ensure slot allocation data is immutable once confirmed.
  urs_requirements:
  - URS-028-003
  - URS-028-008
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - Workflow Configuration Specialist
  - QA Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Configurable Risk Scoring Rule Execution and Auditability
  test_category: functional
  gamp_category: 4
  objective: To validate that the system correctly executes configurable risk scoring
    rules based on input parameters and maintains a complete audit trail of the decision.
  prerequisites:
  - System is operational.
  - A risk scoring rule set (URS-028-005) is configured (e.g., Score > 50 requires
    manual review).
  - A custom algorithm module (if applicable) is deployed (URS-028-015).
  test_steps:
  - step_number: 1
    action: Submit a patient record designed to trigger a high-risk score (e.g., input
      data causing score = 65) using vendor scripting rules.
    expected_result: The system assigns a risk score of 65 and automatically routes
      the patient journey to a manual review queue.
    data_to_capture:
    - Patient ID
    - Input parameters used for scoring
    - Final calculated risk score (65)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Review the audit trail for the scoring event and verify the decision artifact.
    expected_result: The audit trail clearly documents the input parameters, the rule(s)
      triggered, the resulting score, and the subsequent routing action (URS-028-008).
      If a custom module was used, its version and explainability artifact must be
      present (URS-028-016).
    data_to_capture:
    - Audit entry timestamp
    - Rule ID(s) cited in the audit
    - Custom module version (if applicable)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Risk scores are calculated accurately according to the configured rules.
  - Workflow routing based on risk score thresholds functions correctly.
  - All scoring decisions are fully traceable via the audit trail.
  regulatory_basis:
  - URS-028-005
  - URS-028-008
  risk_level: high
  data_integrity_requirements:
  - Ensure the risk score calculation logic is executed without modification during
    runtime.
  urs_requirements:
  - URS-028-005
  - URS-028-008
  - URS-028-016
  related_tests:
  - OQ-001
  estimated_duration_minutes: 50
  required_expertise:
  - Validation Engineer
  - Domain Expert (Risk Assessment)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Exception Handling for Temperature Excursion Workflow
  test_category: functional
  gamp_category: 4
  objective: To verify that the system correctly triggers and manages the exception
    handling workflow when a simulated temperature excursion occurs during the logistics
    phase.
  prerequisites:
  - System is fully configured and operational.
  - Test data simulating a patient journey (URS-028-001) is loaded.
  - Access to a simulated logistics environment or data injection capability for temperature
    alerts.
  test_steps:
  - step_number: 1
    action: Initiate a standard patient journey workflow through the apheresis and
      manufacturing slotting stages.
    expected_result: Workflow proceeds normally to the logistics handoff stage.
    data_to_capture:
    - Workflow ID
    - Current status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Inject a simulated critical temperature excursion alert for the associated
      custody record.
    expected_result: The system immediately halts standard progression and triggers
      the configurable exception handling workflow (URS-028-004).
    data_to_capture:
    - Timestamp of alert
    - System notification details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the system requires an authorized user to acknowledge the
      exception and select a disposition (e.g., Quarantine, Rework, Destroy).
    expected_result: The system locks the custody record and prompts for e-signature/justification
      before proceeding with the exception path.
    data_to_capture:
    - User ID performing disposition
    - Audit log entry for disposition decision
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Review the audit trail (URS-028-008) for the entire sequence.
    expected_result: The audit trail accurately records the initial event, the workflow
      diversion, the user disposition, and the resulting status change.
    data_to_capture:
    - Audit trail verification status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully intercepts the standard workflow upon temperature excursion.
  - The required exception workflow (URS-028-004) is initiated.
  - Critical actions within the exception workflow are protected by e-signatures (URS-028-009).
  regulatory_basis:
  - URS-028-004
  - URS-028-008
  - URS-028-009
  risk_level: high
  data_integrity_requirements:
  - All custody events must be immutable.
  - Workflow state transitions must be accurately logged.
  urs_requirements:
  - URS-028-004
  - URS-028-008
  - URS-028-009
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Workflow Configuration Specialist
  - QA/Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify Custom Algorithm Module Integration and Explainability
  test_category: integration
  gamp_category: 4
  objective: To verify the successful integration, execution, and artifact generation
    of an optional custom-developed patient-to-lot matching algorithm module.
  prerequisites:
  - The custom algorithm module (containerized, URS-028-015) is deployed in the test
    environment.
  - A patient record requiring complex matching logic is available.
  - The system is configured to utilize the custom module for matching optimization
    (URS-028-006).
  test_steps:
  - step_number: 1
    action: Submit the patient record for manufacturing slotting, forcing the use
      of the custom matching algorithm.
    expected_result: The system calls the containerized custom module via the defined
      interface.
    data_to_capture:
    - API call logs to the container
    - Module version used (URS-028-015)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify the output of the matching process against a known expected result
      derived from the algorithm's logic.
    expected_result: The system accepts the match decision provided by the custom
      module.
    data_to_capture:
    - Final matched lot ID
    - System confirmation of match
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Retrieve and inspect the explainability artifacts generated by the custom
      module for this specific decision (URS-028-016).
    expected_result: A readable artifact (e.g., JSON, XML) detailing the inputs, weights,
      and decision path of the algorithm is present and accessible.
    data_to_capture:
    - Explainability artifact file path
    - Key decision factors listed in the artifact
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the decision and associated artifacts are linked to the patient
      record in the audit trail.
    expected_result: The audit trail confirms the execution of the custom module and
      references the generated explainability artifact.
    data_to_capture:
    - Audit trail entry linking to artifact
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The custom module executes successfully and returns a valid result.
  - The system correctly handles the containerized deployment and versioning.
  - Explainability artifacts are generated and traceable to the decision.
  regulatory_basis:
  - URS-028-006
  - URS-028-015
  - URS-028-016
  risk_level: critical
  data_integrity_requirements:
  - Algorithm inputs and outputs must be validated.
  - Explainability artifacts are considered part of the GxP record.
  urs_requirements:
  - URS-028-006
  - URS-028-015
  - URS-028-016
  related_tests:
  - OQ-004
  estimated_duration_minutes: 90
  required_expertise:
  - Software Developer (Algorithm)
  - DevOps/Containerization Expert
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
