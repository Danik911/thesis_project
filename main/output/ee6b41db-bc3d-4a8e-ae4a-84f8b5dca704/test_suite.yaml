  - Test patient data loaded into the EHR.
  - URS-028-008 (Audit Trail) functionality verified as active.
  test_steps:
  - step_number: 1
    action: Initiate a new patient journey workflow in the Orchestration Platform,
      triggering data pull from the EHR.
    expected_result: Patient demographic and order data are successfully imported
      into the platform.
    data_to_capture:
    - Timestamp of initiation
    - EHR data payload received
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Advance the workflow to the point requiring sample registration, triggering
      data push to the LIMS.
    expected_result: A unique sample ID is generated by LIMS and successfully returned
      to the Orchestration Platform.
    data_to_capture:
    - LIMS Sample ID returned
    - Audit log entry confirming LIMS interaction
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the Audit Trail (URS-028-008) for the entire transaction sequence.
    expected_result: All data handoffs between systems are logged, showing source,
      destination, and integrity checks passed.
    data_to_capture:
    - Audit trail records for EHR pull and LIMS push
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All required patient and order data are accurately transferred from EHR.
  - The system successfully receives and stores the LIMS-generated identifier.
  - The audit trail captures the integration events as required by URS-028-008.
  regulatory_basis:
