  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify High Concurrency and Latency Under Load
  test_category: performance
  gamp_category: 4
  objective: Verify the platform's ability to maintain required event processing latency
    while orchestrating 1,000 concurrent patient journeys.
  prerequisites:
  - Load testing environment configured to simulate 1,000 active, staggered patient
    workflows.
  - Monitoring tools active to capture system response times.
  test_steps:
  - step_number: 1
    action: Initiate the load test, simulating the start of 1,000 unique patient journeys
      simultaneously.
    expected_result: All 1,000 workflows are successfully instantiated and begin processing.
    data_to_capture:
    - Total number of workflows started
    - Start time of the load injection
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor key workflow events (e.g., scheduling confirmation, custody scan
      registration) across the load period.
    expected_result: The 95th percentile latency for critical event processing remains
      below 1 second.
    data_to_capture:
    - Latency metrics for 100 sampled events
    - CPU/Memory utilization logs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Allow the load test to run until all 1,000 journeys have reached a defined
      completion milestone (e.g., QC Release).
    expected_result: All 1,000 workflows complete successfully without deadlock or
      failure.
    data_to_capture:
    - Total completion time for the batch
    - Final status of all 1,000 journeys
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system successfully manages 1,000 concurrent journeys.
  - Event processing latency (P95) does not exceed 1 second during peak load.
  - No workflow failures or data corruption occur due to concurrency.
  regulatory_basis:
  - URS-028-011
  - URS-028-012
  risk_level: critical
  data_integrity_requirements:
  - No data loss or corruption observed across any of the 1,000 concurrent transactions.
  urs_requirements:
  - URS-028-011
  - URS-028-012
  related_tests:
  - OQ-003
  estimated_duration_minutes: 120
  required_expertise:
  - Performance Testing Engineer
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify GDP Compliance for Cold-Chain Logistics Handoff
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that the system correctly records and enforces GDP requirements
    for custody events involving temperature-sensitive material transfers.
  prerequisites:
  - System configured with a cold-chain workflow template.
  - Test material (simulated) with required temperature logging capabilities.
  - Integration with courier tracking system active.
  test_steps:
  - step_number: 1
    action: Initiate a patient journey requiring cold-chain logistics transfer between
      two defined sites.
    expected_result: The system generates the required GDP documentation template
      for the transfer.
    data_to_capture:
    - Workflow ID
    - Initial Custody Record
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate a temperature excursion event during the simulated transit phase
      using the logistics integration interface.
    expected_result: The system flags the custody event as non-compliant, triggers
      URS-028-004 exception workflow, and prevents downstream release steps.
    data_to_capture:
    - Excursion Timestamp
    - System Alert ID
    - Exception Workflow Status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the audit trail (URS-028-008) for the custody event and the subsequent
      exception handling.
    expected_result: The audit trail accurately reflects the custody transfer, the
      temperature reading, the excursion flag, and the initiation of the exception
      workflow.
    data_to_capture:
    - Audit Trail Entries
    - GDP Compliance Flag Status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All custody handoffs related to cold chain are logged with time/date stamps.
  - Temperature excursion data is captured and correctly triggers the defined exception
    workflow.
  - The system prevents progression of the material until the exception is formally
    resolved and documented.
  regulatory_basis:
  - URS-028-004
  - URS-028-008
  - URS-028-010 (GDP)
  risk_level: high
  data_integrity_requirements:
  - Temperature data must be immutable.
  - Custody records must link directly to the patient/lot ID.
  urs_requirements:
  - URS-028-004
  - URS-028-008
  - URS-028-010
  related_tests:
  - OQ-005
  estimated_duration_minutes: 60
  required_expertise:
  - Validation Engineer
  - Quality Assurance
  - Domain Expert (Logistics)
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Verify OIDC SSO and Device Identity for Scanner Access
  test_category: security
  gamp_category: 4
  objective: Verify that all critical data capture actions requiring dual-scanning
    utilize authenticated users via OIDC SSO and that scanners are properly identified.
  prerequisites:
  - OIDC/SSO provider configured and reachable.
  - Test scanners configured with device identity certificates.
  - User accounts provisioned in the SSO system.
  test_steps:
  - step_number: 1
    action: Attempt to perform a critical custody scan (e.g., material receipt) using
      an unauthenticated user session.
    expected_result: The system denies access and prompts for SSO login.
    data_to_capture:
    - Error Message
    - Authentication Attempt Log
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in via the OIDC portal and perform the dual-scan verification required
      for URS-028-002 (e.g., scanning patient ID and material ID).
    expected_result: The system successfully records both scans, associating them
      with the authenticated user identity and the device identity.
    data_to_capture:
    - Scan Verification Status
    - User ID Captured
    - Device ID Captured
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the audit trail (URS-028-008) for the custody event performed in
      Step 2.
    expected_result: The audit trail entry explicitly lists the User ID (from SSO)
      and the Device ID (from scanner certificate) associated with the custody change.
    data_to_capture:
    - Audit Trail Record Details
    - Identity Verification Confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All critical actions require successful OIDC authentication.
  - The system successfully captures and logs both the user identity and the device
    identity for custody events.
  - Unauthorized access attempts are blocked.
  regulatory_basis:
  - URS-028-002
  - URS-028-008
  - URS-028-014
  risk_level: critical
  data_integrity_requirements:
  - Identity linkage must be unbreakable for custody records.
  urs_requirements:
  - URS-028-002
  - URS-028-008
  - URS-028-014
  related_tests:
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Security Engineer
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-011
  test_name: Verify 21 CFR Part 11 E-Signature Enforcement on Release
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that the system strictly enforces 21 CFR Part 11 compliant electronic
    signatures for the final QC release step of a patient journey.
  prerequisites:
  - System is fully configured and operational.
  - Test user accounts with appropriate e-signature privileges are available.
  - A patient record is progressed to the final QC release stage.
  test_steps:
  - step_number: 1
    action: Attempt to finalize the QC release action for the test patient record
      without providing valid credentials.
    expected_result: The system rejects the release action and displays an error indicating
      missing or invalid e-signature.
    data_to_capture:
    - Error message captured
    - Audit log entry for failed signature attempt
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Execute the QC release action again, providing valid user ID, password,
      and reason for signature.
    expected_result: The system accepts the e-signature, updates the record status
      to 'Released', and logs the signature event.
    data_to_capture:
    - Final status of the patient record
    - E-signature timestamp and user ID from the audit trail
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the audit trail associated with the release event to confirm compliance
      with Part 11 requirements.
    expected_result: The audit trail clearly links the action, the user, the time,
      and the signature event.
    data_to_capture:
    - Audit trail screenshot confirming signature details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The system prevents critical actions (QC Release) without a valid e-signature.
  - All required Part 11 elements (user ID, time, meaning) are captured in the audit
    trail for the signature event.
  regulatory_basis:
  - URS-028-009
  - 21 CFR Part 11
  risk_level: critical
  data_integrity_requirements:
  - Signature integrity must be maintained throughout the record lifecycle.
  urs_requirements:
  - URS-028-009
  related_tests:
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Validation Engineer
  - Quality Assurance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
