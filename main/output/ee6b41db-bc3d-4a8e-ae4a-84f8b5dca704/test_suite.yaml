- test_id: OQ-013
  test_name: Verify Audit Trail Integrity for Custody Handoffs
  test_category: data_integrity
  gamp_category: 4
  objective: To verify that the system accurately records a complete, immutable audit
    trail for all critical custody handoffs between internal systems and external
    logistics partners.
  prerequisites:
  - System is fully configured and operational.
  - Test patient journey initiated and progressed to the logistics handoff stage.
  - Access to audit log review interface and courier tracking system.
  test_steps:
  - step_number: 1
    action: Initiate a simulated custody transfer event (e.g., material leaving the
      manufacturing suite for cold-chain shipment).
    expected_result: The system generates a timestamped custody record linked to the
      patient/lot ID.
    data_to_capture:
    - Timestamp of transfer initiation
    - User ID performing the transfer
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate the courier scanning the material upon receipt (external system
      integration point).
    expected_result: The system receives and records the external scan confirmation,
      updating the custody status to 'In Transit'.
    data_to_capture:
    - Courier ID
    - External scan timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the system's audit trail for the specific custody event, comparing
      it against the simulated actions.
    expected_result: The audit trail must show sequential, non-modifiable entries
      for initiation, external receipt, and all associated metadata (URS-028-008).
    data_to_capture:
    - Audit log entry sequence
    - Verification of data consistency across logs
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All custody handoffs are logged with accurate timestamps and user/system identifiers.
  - The audit trail cannot be modified or deleted by standard user roles.
  - Data integrity is maintained across the system boundary during the handoff.
  regulatory_basis:
  - URS-028-008 (Full audit trail)
  - URS-028-010 (GDP compliance)
  risk_level: high
  data_integrity_requirements:
  - Non-repudiation of custody events
  - Time synchronization verification
  urs_requirements:
  - URS-028-008
  - URS-028-010
  related_tests:
  - OQ-002
  - OQ-009
  estimated_duration_minutes: 45
  required_expertise:
  - Validation Engineer
  - Quality Assurance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-014
  test_name: Verify KPI Dashboard Accuracy for Vein-to-Vein Time
  test_category: functional
  gamp_category: 4
  objective: To verify that the system accurately calculates and displays the critical
    Vein-to-Vein (V2V) time KPI based on recorded workflow milestones.
  prerequisites:
  - System is configured with complete workflow templates.
  - A full, simulated patient journey (from apheresis scheduling to final infusion
    confirmation) has been successfully executed.
  - Access to the KPI dashboard interface.
  test_steps:
  - step_number: 1
    action: Identify the recorded timestamp for the initial patient contact/apheresis
      scheduling event (Start Time).
    expected_result: The Start Time is accurately recorded in the system's master
      timeline.
    data_to_capture:
    - Recorded Start Time (T_start)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Identify the recorded timestamp for the final infusion completion event
      (End Time).
    expected_result: The End Time is accurately recorded in the system's master timeline.
    data_to_capture:
    - Recorded End Time (T_end)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Calculate the expected V2V duration (T_end - T_start) manually using the
      recorded timestamps.
    expected_result: A definitive expected duration value is established.
    data_to_capture:
    - Calculated Expected V2V Duration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Navigate to the KPI dashboard and observe the displayed Vein-to-Vein time
      metric for the completed journey.
    expected_result: The displayed V2V time matches the manually calculated expected
      duration within acceptable tolerance (URS-028-007).
    data_to_capture:
    - Displayed V2V Duration
    - Tolerance check result
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The V2V KPI displayed on the dashboard matches the calculated duration derived
    from system timestamps.
  - The KPI calculation correctly incorporates all required workflow milestones.
  regulatory_basis:
  - URS-028-007 (Provide dashboards for KPIs)
  risk_level: medium
  data_integrity_requirements:
  - Accuracy of time-based calculations
  - Data visibility for reporting
  urs_requirements:
  - URS-028-007
  related_tests:
  - OQ-001
  estimated_duration_minutes: 40
  required_expertise:
  - Validation Engineer
  - Data Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
