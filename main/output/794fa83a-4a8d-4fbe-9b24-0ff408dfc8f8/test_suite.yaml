  estimated_duration_minutes: 30
  required_expertise:
  - Active Directory administration
  - System integration testing
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-010
  test_name: Chart Configuration Record Retention Verification
  test_category: data_integrity
  gamp_category: 3
  objective: To verify that chart configurations are properly retained as controlled
    records and cannot be modified after release.
  prerequisites:
  - SPC dashboard is operational with sample data loaded
  - User with configuration permissions is logged in
  - Sample chart configurations have been created and saved
  test_steps:
  - step_number: 1
    action: Create and save a new X-bar/R chart configuration with specific parameters
      and mark it as 'released'.
