test_cases:
- test_id: OQ-001
  test_name: CSV Import and X-bar/R Chart Creation Test
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully import data from CSV files and create
    X-bar/R control charts using vendor standard functionality.
  prerequisites:
  - System installed and configured
  - Test CSV file with 100k data points prepared
  - User with appropriate permissions logged in
  test_steps:
  - step_number: 1
    action: Navigate to the data import section and select CSV import option
    expected_result: CSV import interface is displayed with file selection dialog
    data_to_capture:
    - Import completion time
    - Any error messages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Upload the test CSV file containing 100k data points
    expected_result: System processes the file and displays confirmation message within
      5 seconds
    data_to_capture:
    - File processing time
    - Data validation results
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select X-bar/R chart creation option from the dashboard menu
    expected_result: Chart configuration interface is displayed with appropriate options
    data_to_capture:
    - Chart configuration settings
    - Available parameters
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure the X-bar/R chart using default settings and generate the chart
    expected_result: Chart is rendered completely within 2 seconds with all data points
      displayed
    data_to_capture:
    - Chart rendering time
    - Visual accuracy of data representation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - CSV file imported successfully within 5 seconds
  - X-bar/R chart rendered within 2 seconds
  - All 100k data points accurately represented on chart
  - No data corruption during import process
  regulatory_basis:
  - 21 CFR Part 11 compliance for electronic records
  - GAMP 5 guidelines for category 3 software validation
  risk_level: medium
  data_integrity_requirements:
  - Data must remain unchanged during import process
  - Chart calculations must use correct statistical formulas
  - All data points must be accurately represented visually
  urs_requirements:
  - URS-020-001
  - URS-020-010
  - URS-020-011
  - URS-020-012
  related_tests:
  - OQ-002
  - PQ-001
  - PQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - SPC knowledge
  - CSV data formatting
  - Statistical chart interpretation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Nelson Rules Application and PDF Export Functionality Test
  test_category: functional
  gamp_category: 3
  objective: Verify the system correctly applies vendor-standard Nelson rules to control
    charts and exports reports to PDF format as specified.
  prerequisites:
  - System with imported test data
  - X-bar/R chart created from test data
  - User with export permissions logged in
  test_steps:
  - step_number: 1
    action: Apply Nelson rules to the previously created X-bar/R chart using vendor
      standard settings
    expected_result: Nelson rules are applied and violations are clearly marked on
      the chart
    data_to_capture:
    - Number of rule violations detected
    - Visual indicators of violations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Add annotations to specific data points using the built-in comment feature
    expected_result: Comments are successfully attached to selected data points and
      displayed on chart
    data_to_capture:
    - Comment persistence
    - Annotation display functionality
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Select PDF export option from the report menu with current chart configuration
    expected_result: PDF export dialog appears with appropriate formatting options
    data_to_capture:
    - Export configuration options
    - File format selections
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Export the chart with Nelson rules and annotations to PDF format
    expected_result: PDF file is generated and downloaded successfully with all chart
      elements preserved
    data_to_capture:
    - Export completion time
    - PDF file integrity
    - Content accuracy in exported file
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Nelson rules correctly identify statistical violations
  - Annotations are preserved and displayed in exported PDF
  - PDF export completes without errors
  - All chart elements including rules and comments are accurately represented in
    PDF
  regulatory_basis:
  - 21 CFR Part 11 requirements for electronic records and signatures
  - GAMP 5 validation guidelines for standard software
  risk_level: medium
  data_integrity_requirements:
  - Statistical calculations for Nelson rules must be accurate
  - Annotations must be preserved through export process
  - PDF output must exactly match screen display
  urs_requirements:
  - URS-020-002
  - URS-020-003
  - URS-020-005
  - URS-020-008
  related_tests:
  - OQ-001
  - PQ-003
  - PQ-004
  estimated_duration_minutes: 30
  required_expertise:
  - Nelson rules knowledge
  - PDF format validation
  - Statistical process control principles
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Role-Based Access Control and View Permissions Test
  test_category: security
  gamp_category: 3
  objective: Verify that the dashboard properly enforces role-based access control
    and restricts views according to user permissions
  prerequisites:
  - System installed and configured
  - Test users with different roles created (Admin, QC Analyst, Viewer)
  - Sample dataset loaded into system
  test_steps:
  - step_number: 1
    action: Log in as Admin user and verify access to all dashboard features and configuration
      options
    expected_result: Admin user has full access to all system features and configuration
      menus
    data_to_capture:
    - Screenshot of admin dashboard view
    - List of accessible features
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as QC Analyst user and attempt to access configuration settings
      and data modification features
    expected_result: QC Analyst can view charts and data but cannot access system
      configuration or modify released datasets
    data_to_capture:
    - Screenshot of analyst dashboard view
    - Error messages if configuration access attempted
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as Viewer role user and verify read-only access to released datasets
    expected_result: Viewer can only view released datasets in read-only mode without
      editing capabilities
    data_to_capture:
    - Screenshot of viewer dashboard
    - Documentation of edit function restrictions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based access controls function as specified
  - Users cannot access features beyond their role permissions
  - Read-only access enforced for released datasets
  regulatory_basis:
  - 21 CFR Part 11 - Electronic records; electronic signatures
  - Data integrity ALCOA+ principles
  risk_level: high
  data_integrity_requirements:
  - Access controls prevent unauthorized data modification
  - User permissions enforce segregation of duties
  - Read-only access maintained for released data
  urs_requirements:
  - URS-020-004
  - URS-020-007
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Assurance
  - System Administration
  - GxP Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
