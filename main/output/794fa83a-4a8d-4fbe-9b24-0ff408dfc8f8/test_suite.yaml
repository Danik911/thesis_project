- test_id: OQ-005
  test_name: Scheduled Report Email Functionality and Performance Test
  test_category: functional
  gamp_category: 3
  objective: To verify that the system correctly schedules and sends automated report
    emails containing charts and data exports as configured by the user.
  prerequisites:
  - OQ-001 has been executed successfully
  - Valid email server configuration is completed
  - Test email accounts are set up and verified
  - User with scheduling permissions is logged in
  test_steps:
  - step_number: 1
    action: Configure a scheduled report to generate an X-bar/R chart and export to
      PDF, set to email to test accounts immediately
    expected_result: System accepts the schedule configuration and confirms the job
      is queued
    data_to_capture:
    - Scheduler configuration screenshot
    - Job confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Wait for the scheduled time to elapse and check the designated test email
      inboxes
    expected_result: Email is received by all configured recipients within 2 minutes
      of scheduled time
    data_to_capture:
    - Email receipt timestamp
    - Screenshot of received email
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the email attachments contain the correct PDF report and chart
      data
    expected_result: PDF attachment opens correctly and contains the expected chart
      and data matching the source
    data_to_capture:
    - PDF file integrity check
    - Chart content verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify the scheduling performance by measuring time from trigger to email
      delivery
    expected_result: Complete process from schedule trigger to email delivery completes
      within 5 minutes
    data_to_capture:
    - Process timing measurements
    - System performance metrics
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Scheduled reports are generated and emailed successfully to all configured recipients
  - Email delivery occurs within the configured time frame with correct attachments
  - Report content in emails matches the source data and chart configurations
  - Scheduling performance meets the 5-minute maximum delivery time requirement
  regulatory_basis:
  - 21 CFR Part 11 - Electronic records and signatures requirements for automated
    processes
  - GMP Annex 11 - Validation of automated systems including scheduling functions
  risk_level: medium
  data_integrity_requirements:
  - Scheduled report configuration must be accurately recorded and maintained
  - Email distribution logs must capture successful/failed delivery attempts
  - Report content integrity must be preserved through the email generation process
  urs_requirements:
  - 'URS-020-006: The system shall support scheduled report emails using vendor scheduler'
  related_tests:
