  estimated_duration_minutes: 30
  required_expertise:
  - SPC Dashboard Administration
  - Email System Configuration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Large Dataset Performance and Read-Only Access Verification
  test_category: performance
  gamp_category: 3
  objective: To validate system performance with large datasets and verify read-only
    access controls for released data as required by regulatory standards.
  prerequisites:
  - Test dataset of 100,000+ data points is prepared in CSV format
  - User accounts with different permission levels are configured
  - Sample dataset has been marked as 'released' in the system
  test_steps:
  - step_number: 1
    action: Import the 100,000+ point CSV dataset and time the import process
    expected_result: Dataset imports successfully in less than 5 seconds with no data
      corruption
    data_to_capture:
    - Import completion time
    - Data point count verification
    - System resource usage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Apply filters and generate an X-bar chart, measuring rendering time
    expected_result: Chart renders completely in less than 2 seconds after filter
      application
    data_to_capture:
    - Chart rendering time
    - Filter application time
    - Visual verification of chart accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Mark the dataset as 'released' and attempt to modify data points as a
      standard user
    expected_result: System prevents modifications to released data and displays read-only
      warning
    data_to_capture:
    - Error message when attempting modification
    - System access log entries
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that annotations can still be added to released datasets if permitted
      by configuration
    expected_result: Annotation functionality works correctly without allowing data
      modification
    data_to_capture:
    - Annotation success/failure results
    - Audit trail entries for annotations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - 100,000+ data points import in under 5 seconds on supported hardware
  - Chart rendering completes in under 2 seconds after filter changes
  - Released datasets are protected from modification with appropriate access controls
  - Read-only access is properly enforced while allowing permitted functions like
    annotation
  regulatory_basis:
  - 21 CFR Part 11 - Controls for closed systems and protection of electronic records
  - EU GMP Annex 11 - Data integrity requirements for electronic systems
  risk_level: high
  data_integrity_requirements:
  - Data integrity must be maintained during high-volume import operations
  - Read-only protection must prevent unauthorized modifications to released data
  - Audit trail must capture all access attempts to released datasets
  urs_requirements:
  - 'URS-020-007: Read-only access for released datasets'
  - 'URS-020-010: Load 100k data points in < 5 seconds on supported hardware'
  - 'URS-020-011: Render charts in < 2 seconds after filter changes'
  related_tests:
  - 'OQ-001: CSV Import and X-bar/R Chart Creation Test'
  - 'OQ-003: Role-Based Access Control and View Permissions Test'
  estimated_duration_minutes: 30
  required_expertise:
  - Performance Testing
  - Data Integrity Verification
  - Access Control Validation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Audit Trail Verification for Configuration Changes
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that the system maintains an audit trail for all configuration
    changes to chart settings and Nelson rule parameters as provided by the vendor.
  prerequisites:
  - System installed and configured
  - User with administrative privileges logged in
  - Initial chart configuration saved
  test_steps:
  - step_number: 1
    action: Access the chart configuration settings for an existing control chart.
    expected_result: Configuration menu opens successfully, displaying current settings.
    data_to_capture:
    - Screenshot of initial configuration settings
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Modify at least three different configuration parameters (e.g., control
      limits, rule selections).
    expected_result: Changes are accepted and saved by the system.
    data_to_capture:
    - List of modified parameters and their new values
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Navigate to the vendor-provided audit trail or event log feature.
    expected_result: Audit trail interface is accessible and displays entries.
    data_to_capture:
    - Screenshot of audit trail interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Search the audit trail for entries corresponding to the configuration
      changes made in Step 2.
    expected_result: Audit trail contains entries with timestamp, user ID, and description
      of each change.
    data_to_capture:
    - Screenshot of relevant audit trail entries
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All configuration changes are recorded in the audit trail.
  - Audit trail entries include the date/time, user identity, and nature of the change.
  - The audit trail is read-only and cannot be modified by users.
  regulatory_basis:
  - 21 CFR Part 11.10(e) - Audit trails must be secure, computer-generated, and time-stamped.
  risk_level: high
  data_integrity_requirements:
  - Audit trail must provide a secure, chronological record of configuration changes
    to ensure data integrity and traceability.
  urs_requirements:
  - URS-020-009
  related_tests:
  - OQ-003
  - OQ-006
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Assurance Specialist
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Chart Configuration Record Retention Verification
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that the system correctly retains chart configurations as controlled,
    unmodifiable records after finalization or release.
  prerequisites:
  - System installed and configured
  - A control chart created with a specific configuration
  - User with 'Reviewer' or 'Approver' role logged in
  test_steps:
  - step_number: 1
    action: Finalize or mark a completed control chart configuration as 'Released'
      using the system's designated function.
    expected_result: System confirms the configuration is now in a released state.
    data_to_capture:
    - Screenshot of the release confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to open and edit the configuration settings of the released chart.
    expected_result: The system prevents edits; configuration settings are read-only
      or grayed out.
    data_to_capture:
    - Screenshot demonstrating the read-only state of the configuration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log out and log in as a user with a different role (e.g., Analyst). Attempt
      to modify the released configuration.
    expected_result: The system prevents all users, regardless of role, from modifying
      the released configuration.
    data_to_capture:
    - Screenshot of access attempt and resulting error or read-only message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify the configuration can still be exported to PDF/CSV for reporting
      purposes.
    expected_result: The export function works correctly, preserving the original
      configuration in the output.
    data_to_capture:
    - Exported PDF/CSV file for verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Released chart configurations are retained as permanent, unalterable records.
  - No user role has permission to modify a released configuration.
  - The configuration remains intact and reproducible in exported reports.
  regulatory_basis:
  - FDA requirement for controlled records and prevention of unauthorized alterations
    to finalized data.
  risk_level: high
  data_integrity_requirements:
  - Configurations must be locked upon release to prevent unintended or unauthorized
    changes, ensuring the integrity of the quality control record.
  urs_requirements:
  - URS-020-007
  - URS-020-008
  related_tests:
  - OQ-003
  - OQ-006
  - OQ-007
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Control Analyst
  - Quality Assurance Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
