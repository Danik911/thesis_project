test_cases:
- test_id: OQ-001
  test_name: CSV Import and X-bar/R Chart Creation Verification
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully import CSV data and create X-bar/R
    control charts using vendor standard functionality
  prerequisites:
  - Test CSV file with 100k data points
  - Valid user credentials with chart creation permissions
  - SPC dashboard installed and configured
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with valid credentials and navigate to the
      data import section
    expected_result: User successfully logs in and accesses the data import interface
    data_to_capture:
    - Login success confirmation
    - Import interface accessibility
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Upload the test CSV file containing 100k data points using the standard
      import function
    expected_result: System processes the CSV file and displays successful import
      confirmation within 5 seconds
    data_to_capture:
    - Import completion time
    - Success/failure status
    - Data point count verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Navigate to chart creation and select X-bar/R chart type using the imported
      dataset
    expected_result: System generates X-bar/R control chart with all data points displayed
      correctly within 2 seconds
    data_to_capture:
    - Chart generation time
    - Chart accuracy verification
    - Data point representation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Apply standard Nelson rules to the generated chart using vendor-provided
      functionality
    expected_result: Nelson rules are correctly applied and violations are properly
      flagged on the chart
    data_to_capture:
    - Rule application success
    - Violation detection accuracy
    - Visual indicators
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - CSV import completes within 5 seconds
  - X-bar/R chart renders within 2 seconds
  - All 100k data points are accurately represented
  - Nelson rules are correctly applied and violations identified
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - GAMP 5 Category 3 software validation guidelines
  risk_level: medium
  data_integrity_requirements:
  - Data import must maintain original CSV data integrity
  - Chart calculations must preserve statistical accuracy
  - No data corruption during processing
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-010
  - URS-020-011
  - URS-020-012
  related_tests:
  - OQ-002
  - PQ-001
  - PQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - SPC methodology knowledge
  - CSV data formatting
  - Statistical process control principles
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Role-Based Access and Export Functionality Verification
  test_category: security
  gamp_category: 3
  objective: Verify role-based access controls and export functionality work as specified
    in vendor documentation
  prerequisites:
  - Multiple user accounts with different roles (admin, viewer, editor)
  - Pre-configured chart with released dataset
  - Email server configured for scheduled reports
  test_steps:
  - step_number: 1
    action: Log in as an administrator and create a chart configuration, then mark
      the dataset as released
    expected_result: Chart configuration is saved and dataset is successfully marked
      as released with read-only status
    data_to_capture:
    - Configuration save confirmation
    - Release status confirmation
    - Audit trail entry if available
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log out and attempt to access the released dataset with an editor role
      account
    expected_result: System prevents modifications to the released dataset and enforces
      read-only access
    data_to_capture:
    - Access denial for modifications
    - Read-only mode activation
    - Error messages if applicable
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Export the chart to PDF format using the vendor's standard export functionality
    expected_result: System generates a PDF file containing the complete chart with
      proper formatting and data representation
    data_to_capture:
    - Export completion time
    - PDF file integrity
    - Content accuracy verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Schedule a report email using the vendor's scheduler with CSV export format
    expected_result: System successfully schedules the report and generates CSV export
      as configured
    data_to_capture:
    - Scheduling confirmation
    - CSV file generation
    - Email delivery verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Released datasets enforce read-only access for non-admin roles
  - PDF exports contain accurate chart representations
  - Scheduled reports generate and deliver correctly
  - Role-based access controls function as specified
  regulatory_basis:
  - 21 CFR Part 11 access controls
  - Data integrity ALCOA+ principles
  - GAMP 5 security requirements
  risk_level: medium
  data_integrity_requirements:
  - Export formats must preserve data accuracy
  - Access controls must prevent unauthorized modifications
  - Scheduled reports must maintain data integrity during transmission
  urs_requirements:
  - URS-020-003
  - URS-020-004
  - URS-020-006
  - URS-020-007
  - URS-020-008
  - URS-020-009
  related_tests:
  - OQ-001
  - PQ-002
  - PQ-004
  estimated_duration_minutes: 30
  required_expertise:
  - User access management
  - Export functionality knowledge
  - Scheduling system operation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Control Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: Verify the system can correctly create X-bar/R and p-charts from CSV
    data and apply the vendor's standard Nelson rules for statistical process control.
  prerequisites:
  - System installation is verified and operational (OQ-001)
  - Test CSV files with known statistical patterns are available
  - User account with chart creation permissions is configured
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with a user account that has chart creation
      permissions.
    expected_result: User successfully authenticates and accesses the main dashboard
      interface.
    data_to_capture:
    - Screenshot of successful login
    - System timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the chart creation module and select the option to create
      a new X-bar/R chart.
    expected_result: System displays the chart creation wizard with options for X-bar/R
      chart configuration.
    data_to_capture:
    - Screenshot of chart creation interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Upload the prepared test CSV file containing subgroup data for X-bar/R
      chart analysis.
    expected_result: System successfully imports the CSV data and displays a preview
      of the dataset.
    data_to_capture:
    - Screenshot of data preview
    - Import confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Configure the chart parameters (subgroup size, control limits) and enable
      all vendor standard Nelson rules.
    expected_result: System accepts the configuration and displays the configured
      Nelson rules as active.
    data_to_capture:
    - Screenshot of configured parameters
    - List of active Nelson rules
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Generate the X-bar/R chart and verify Nelson rule violations are correctly
      flagged.
    expected_result: System renders the control chart with correct control limits
      and flags data points that violate Nelson rules.
    data_to_capture:
    - Screenshot of final chart
    - Record of flagged violations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 6
    action: Repeat steps 2-5 for a p-chart using attribute data from a separate test
      CSV file.
    expected_result: System correctly generates a p-chart with proper binomial control
      limits and Nelson rule application.
    data_to_capture:
    - Screenshot of p-chart
    - Comparison of expected vs actual violations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart displays correct control limits based on the uploaded data
  - All vendor standard Nelson rules are available and configurable
  - System correctly identifies and flags points that violate Nelson rules
  - p-chart calculations match expected binomial distribution results
  - Chart rendering completes within 2 seconds as specified in URS-020-011
  regulatory_basis:
  - FDA 21 CFR Part 11 for electronic records and automated processes
  - ICH Q9 Quality Risk Management for statistical process control
  risk_level: medium
  data_integrity_requirements:
  - Original CSV data must remain unaltered during import process
  - Chart configurations must be saved as controlled records per URS-020-008
  - Statistical calculations must maintain precision throughout processing
  urs_requirements:
  - 'URS-020-001: Users shall create X-bar/R and p-charts from CSV inputs'
  - 'URS-020-002: Users shall apply vendor''s standard Nelson rules'
  - 'URS-020-011: Render charts in < 2 seconds after filter changes'
  related_tests:
  - OQ-001
  - OQ-004
  estimated_duration_minutes: 45
  required_expertise:
  - SPC methodology
  - Statistical analysis
  - CSV data formatting
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
