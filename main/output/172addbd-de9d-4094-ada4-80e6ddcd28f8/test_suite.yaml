    action: Select the imported dataset and create an X-bar/R chart using the vendor's
      standard chart creation workflow.
    expected_result: System generates an X-bar/R chart displaying the correct control
      limits and data points based on the imported data.
    data_to_capture:
    - Screenshot of the generated X-bar/R chart
    - Chart configuration settings used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Create a p-chart using the same or a different imported dataset following
      the standard workflow.
    expected_result: System generates a p-chart with appropriate proportions and control
      limits calculated correctly.
    data_to_capture:
    - Screenshot of the generated p-chart
    - Chart configuration settings used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - CSV import completes successfully in under 5 seconds for 100k data points
  - ODBC import completes without connection or data retrieval errors
  - X-bar/R and p-charts are generated accurately reflecting the source data
  - All chart elements (control limits, center lines, data points) are displayed correctly
  regulatory_basis:
  - FDA 21 CFR Part 11 for electronic records integrity
  - GMP requirements for accurate data representation in quality control
