- test_id: OQ-001
  test_name: X-bar/R Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: Verify the system can create X-bar/R control charts from CSV input data
    and correctly apply vendor-standard Nelson rules for statistical process control
  prerequisites:
  - System installed and configured
  - Test CSV file with 1000 data points prepared
  - Valid user credentials with chart creation permissions
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with valid credentials and navigate to chart
      creation module
    expected_result: User successfully logs in and chart creation interface is accessible
    data_to_capture:
    - Login success status
    - Chart creation module accessibility
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Import prepared CSV file containing 1000 data points using standard import
      functionality
    expected_result: CSV file imports successfully without errors and data appears
      in preview
    data_to_capture:
    - Import success status
    - Data point count verification
    - Any error messages
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Configure X-bar/R chart parameters and enable all vendor-standard Nelson
      rules
    expected_result: Chart configuration completes successfully with Nelson rules
      enabled
    data_to_capture:
    - Configuration settings
    - Nelson rules activation status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Generate the X-bar/R chart and verify Nelson rule violations are properly
      flagged
    expected_result: Chart renders completely with proper statistical calculations
      and Nelson rule violations visually identified
    data_to_capture:
    - Chart rendering time
    - Statistical calculation accuracy
    - Nelson rule violation flags
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart renders successfully from CSV input
  - All vendor-standard Nelson rules are correctly applied and violations properly
    flagged
  - Statistical calculations match expected values from reference data
  regulatory_basis:
  - 21 CFR Part 211.68
  - ICH Q9 Quality Risk Management
  - FDA Data Integrity Requirements
  risk_level: medium
  data_integrity_requirements:
  - Original CSV data must remain unaltered during processing
  - Statistical calculations must be mathematically accurate
  - Nelson rule application must be consistent and reproducible
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-008
  related_tests:
  - OQ-002
  - PQ-010
  - PQ-015
  estimated_duration_minutes: 30
  required_expertise:
  - SPC chart interpretation
  - Statistical process control knowledge
  - CSV data formatting
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
