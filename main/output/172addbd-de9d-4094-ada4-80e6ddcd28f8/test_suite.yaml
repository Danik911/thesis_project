- test_id: OQ-004
  test_name: Nelson Rules Application and Reporting Verification
  test_category: functional
  gamp_category: 3
  objective: Verify the system correctly applies vendor-standard Nelson rules to control
    charts and generates accurate PDF/CSV exports of the results.
  prerequisites:
  - System is operational with test data loaded
  - Test datasets with known out-of-control patterns are available
  - User account with reporting permissions is available
  - Email server configuration is verified if testing scheduled reports
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard and open a control chart with a dataset containing
      known violations of Nelson rules.
    expected_result: Chart displays with data points clearly marked, including those
      that violate Nelson rules.
    data_to_capture:
    - Screenshot of the chart showing rule violations
    - List of which Nelson rules were triggered
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that all eight standard Nelson rules are correctly implemented
      by reviewing the chart against known pattern violations.
    expected_result: System correctly identifies and flags violations for all eight
      Nelson rules according to the vendor's implementation.
    data_to_capture:
    - Documentation of each Nelson rule verification
    - Screenshots showing correct violation detection
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Export the chart with Nelson rule violations to PDF format using the vendor's
      standard export function.
    expected_result: System generates a PDF file containing the chart image, data,
      and highlighted rule violations in a readable format.
    data_to_capture:
    - Exported PDF file
    - Verification that all chart elements and violations are included in PDF
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Export the underlying chart data with Nelson rule flags to CSV format.
    expected_result: System generates a CSV file containing the raw data with additional
      columns indicating which Nelson rules were violated for each point.
    data_to_capture:
    - Exported CSV file
    - Verification that Nelson rule flags are included in CSV export
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: If supported, configure and execute a scheduled report email for the chart
      using the vendor's scheduler.
    expected_result: System successfully schedules and sends the report email with
      the attached chart and data to the specified recipients.
    data_to_capture:
    - Screenshot of scheduler configuration
    - Confirmation of email receipt
    - Timestamp of email delivery
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All eight Nelson rules are correctly implemented and trigger appropriately
  - PDF exports contain complete chart representations with rule violations highlighted
  - CSV exports include Nelson rule violation flags for each data point
  - Scheduled reports are generated and delivered successfully if feature is supported
  regulatory_basis:
  - FDA guidance on statistical process control in pharmaceutical manufacturing
  - GMP requirements for proper out-of-control condition detection and documentation
  risk_level: medium
  data_integrity_requirements:
  - Nelson rule calculations must be mathematically accurate and consistent
  - Export functions must preserve all chart data and rule application results
  - Scheduled reports must maintain data integrity during generation and transmission
  urs_requirements:
  - URS-020-002
  - URS-020-003
  - URS-020-006
  - URS-020-008
  related_tests:
  - OQ-001
  - OQ-002
  - OQ-003
  estimated_duration_minutes: 40
  required_expertise:
  - Nelson rules knowledge
  - Reporting and export functionality
  - Email system configuration if testing scheduled reports
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
