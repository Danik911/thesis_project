- test_id: OQ-001
  test_name: X-bar/R Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: Verify the system can create X-bar/R control charts from CSV input data
    and correctly apply vendor's standard Nelson rules for statistical process control.
  prerequisites:
  - System installed and configured
  - Test CSV file with 100k data points prepared
  - User with appropriate access rights logged in
  test_steps:
  - step_number: 1
    action: Navigate to the chart creation module and select X-bar/R chart type
    expected_result: System displays the X-bar/R chart configuration interface
    data_to_capture:
    - Interface response time
    - Configuration options available
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Upload the prepared CSV file containing 100k data points
    expected_result: System processes the file and displays data preview within 5
      seconds
    data_to_capture:
    - File upload time
    - Data processing time
    - Data validation results
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Configure chart parameters and enable vendor's standard Nelson rules
    expected_result: System accepts configuration and Nelson rules are activated
    data_to_capture:
    - Configuration settings
    - Nelson rules activation status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Generate the X-bar/R control chart
    expected_result: Chart renders completely within 2 seconds with Nelson rules violations
      highlighted
    data_to_capture:
    - Chart rendering time
    - Nelson rule violations detected
    - Chart accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart renders correctly with all data points
  - Nelson rules are properly applied and violations highlighted
  - Chart generation completes within 2 seconds
  - Data processing completes within 5 seconds
  regulatory_basis:
  - 21 CFR Part 11 compliance for electronic records
  - GAMP 5 guidelines for category 3 software
  risk_level: medium
  data_integrity_requirements:
  - Data integrity maintained throughout processing
  - Original CSV data remains unaltered
  - Chart calculations are mathematically accurate
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-010
  - URS-020-011
  related_tests:
  - OQ-002
  - PQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - SPC knowledge
  - Quality control experience
  - System navigation skills
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
