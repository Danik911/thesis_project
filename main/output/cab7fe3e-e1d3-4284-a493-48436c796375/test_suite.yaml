- test_id: OQ-006
  test_name: Electronic Signature and Data Archival Feature Verification
  test_category: data_integrity
  gamp_category: 3
  objective: To verify the correct functioning of the vendor's built-in electronic
    signature feature and the data archival process for long-term retention.
  prerequisites:
  - EMS is operational with historical data
  - User accounts with electronic signing privileges are configured
  - Archival media or system is available and configured
  test_steps:
  - step_number: 1
    action: Log in as a user with appropriate permissions to perform an electronic
      signature on a critical event or report.
    expected_result: Successful login and access to the electronic signature functionality.
    data_to_capture:
    - Screenshot of the login and user interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select a critical event (e.g., an alarm acknowledgment or report approval)
      and apply an electronic signature using the vendor's built-in feature.
    expected_result: The electronic signature process completes successfully, and
      the signature is permanently linked to the event in the audit trail.
    data_to_capture:
    - Screenshot of the signature dialog
    - Screenshot of the signed event in the audit trail
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Navigate to the data archival feature within the vendor's software and
      initiate an archival process for data older than a specified date.
    expected_result: The archival process initiates and completes without errors,
      confirming data is copied to the designated archival location.
    data_to_capture:
    - Screenshot of the archival configuration
    - Screenshot of the successful archival completion message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify the integrity and readability of the archived data by attempting
      to restore or view a sample from the archive.
    expected_result: The archived data is intact, readable, and contains all original
      data points and metadata.
    data_to_capture:
    - Screenshot of restored/read archived data
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Electronic signatures are applied successfully and are non-repudiable
  - The audit trail correctly records signature events
  - Data is successfully archived and can be retrieved after 7 years
  regulatory_basis:
  - 21 CFR Part 11
  - EU GMP Annex 11
  risk_level: high
  data_integrity_requirements:
  - Electronic signatures must be secure, attributable, and linked to the record
  - Archived data must be complete, secure, and retrievable for the entire retention
    period
  urs_requirements:
  - URS-EMS-008
  - URS-EMS-009
  - URS-EMS-010
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Quality Assurance
  - IT System Administrator
  - Regulatory Affairs
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Temperature Range and Accuracy Verification Across Full Operating Spectrum
  test_category: functional
  gamp_category: 3
  objective: To verify that the EMS accurately measures and records temperature across
    the entire specified operating range of -80°C to +50°C with the required ±0.5°C
    accuracy.
  prerequisites:
  - EMS system is installed and operational
  - Calibrated temperature reference standards available for -80°C, -20°C, +5°C, +25°C,
    and +50°C
  - Environmental chamber or controlled temperature sources capable of achieving test
    temperatures
  - Access to system configuration and data viewing interfaces
  test_steps:
  - step_number: 1
    action: Place the EMS temperature probe in a controlled environment set to -80°C
      and allow temperature to stabilize for 30 minutes
    expected_result: Temperature stabilizes at -80°C ±0.5°C as verified by calibrated
      reference standard
    data_to_capture:
    - Reference standard reading
    - EMS displayed temperature
    - Stabilization time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Record simultaneous readings from the EMS and calibrated reference standard
      at -80°C, -20°C, +5°C, +25°C, and +50°C test points
    expected_result: EMS readings are within ±0.5°C of the reference standard at all
      test points
    data_to_capture:
    - All test point temperatures
    - Deviation calculations
    - Time stamps for each reading
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that temperature data is recorded in the system database at 5-minute
      intervals during the test
    expected_result: Complete temperature data set is stored with correct timestamps
      and values
    data_to_capture:
    - Database records
    - Recording interval verification
    - Data completeness check
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All temperature measurements are within ±0.5°C of the calibrated reference standard
  - System successfully records temperature data at all test points within the specified
    range
  - Data recording occurs at intervals not exceeding 5 minutes as required
  - No data gaps or recording failures during the test period
  regulatory_basis:
  - 21 CFR Part 211.68 - Automatic, mechanical, and electronic equipment
  - EU GMP Annex 11 - Computerised Systems
  - FDA Guidance on Data Integrity and Compliance
  risk_level: high
  data_integrity_requirements:
  - ALCOA+ principles applied to all temperature data
  - Audit trail must capture all temperature readings and system events
  - Data must be protected from unauthorized modification
  urs_requirements:
  - 'URS-EMS-001: Continuous temperature monitoring'
  - 'URS-EMS-002: 5-minute recording intervals'
  - 'URS-EMS-004: Temperature range and accuracy requirements'
  related_tests:
  - 'OQ-001: Temperature Monitoring Accuracy and Alarm Functionality Verification'
  - 'OQ-002: Data Recording and Storage Verification'
  estimated_duration_minutes: 120
  required_expertise:
  - Quality Assurance
  - Metrology/Calibration
  - EMS System Operation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: System Resilience and Data Recovery Verification After Simulated Failure
  test_category: performance
  gamp_category: 3
  objective: To verify that the EMS maintains data integrity and recovers properly
    from simulated system failures including power loss and network interruptions.
  prerequisites:
  - EMS system running normally with active monitoring
  - Backup power supply/UPS system
  - Network connectivity monitoring tools
  - System administration access for failure simulation
  test_steps:
  - step_number: 1
    action: Simulate a power failure by disconnecting main power to the EMS server
      for 5 minutes while UPS maintains operation
    expected_result: System continues monitoring and recording during UPS operation
      without data loss
    data_to_capture:
    - Power failure time
    - UPS activation
    - Data recording continuity
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Completely power down the system for 10 minutes, then restore power and
      observe system restart
    expected_result: System automatically restarts and resumes monitoring with all
      historical data intact
    data_to_capture:
    - Restart time
    - Data recovery verification
    - System status after restart
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Simulate network connectivity loss between sensors and central server
      for 15 minutes, then restore connection
    expected_result: System buffers sensor data during outage and transmits complete
      data set upon reconnection
    data_to_capture:
    - Network outage duration
    - Data buffering performance
    - Data transmission after restoration
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify audit trail captures all system events including failures and recoveries
    expected_result: Complete audit trail maintained throughout all failure scenarios
    data_to_capture:
    - Audit trail entries
    - Event timestamps
    - System status changes
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - No data loss occurs during any simulated failure scenario
  - System recovers automatically to normal operation after power restoration
  - Audit trail maintains complete record of all system events
  - Data integrity is preserved throughout failure and recovery cycles
  regulatory_basis:
  - 21 CFR Part 11.10 - Controls for closed systems
  - EU GMP Annex 11 - Data integrity requirements
  - PIC/S PI-041 Good Practices for Data Management and Integrity
  risk_level: critical
  data_integrity_requirements:
  - Data must be protected against loss during system failures
  - Audit trail must be maintained during all system states
  - Backup and recovery procedures must ensure data preservation
  urs_requirements:
  - 'URS-EMS-006: Data storage in vendor database format'
  - 'URS-EMS-008: Audit trail compliance'
  - 'URS-EMS-010: Data retention requirements'
  - 'URS-EMS-013: System availability requirements'
  related_tests:
  - 'OQ-003: System Availability and Performance Response Time Verification'
  - 'OQ-006: Electronic Signature and Data Archival Feature Verification'
  estimated_duration_minutes: 90
  required_expertise:
  - IT/System Administration
  - Quality Assurance
  - EMS System Operation
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
