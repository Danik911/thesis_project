test_cases:
- test_id: OQ-001
  test_name: Temperature Monitoring Accuracy and Alarm Functionality Verification
  test_category: functional
  gamp_category: 3
  objective: Verify that the EMS accurately monitors temperature within specified
    range and generates alarms when deviations occur
  prerequisites:
  - System installation completed
  - Sensors calibrated and connected
  - Software installed and configured
  - Test temperature probe available
  test_steps:
  - step_number: 1
    action: Set temperature setpoint to 5°C with ±2°C alarm limits in the system configuration
    expected_result: System accepts the configuration and displays the setpoint and
      alarm limits correctly
    data_to_capture:
    - Setpoint value
    - Alarm limit values
    - Configuration timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Apply a stable 5°C temperature to the sensor using calibrated test equipment
    expected_result: System displays temperature reading within ±0.5°C of applied
      temperature (4.5°C to 5.5°C)
    data_to_capture:
    - Displayed temperature
    - Applied temperature
    - Timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Gradually increase temperature to 7.1°C and observe system response
    expected_result: System generates high temperature alarm within 30 seconds of
      exceeding 7°C limit
    data_to_capture:
    - Alarm activation time
    - Temperature at alarm trigger
    - Alarm type and message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Return temperature to 5°C and verify alarm clears
    expected_result: Alarm condition clears and system returns to normal operation
      state
    data_to_capture:
    - Alarm clear time
    - Temperature reading
    - System status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All temperature readings within ±0.5°C accuracy
  - Alarms generated within 30 seconds of limit violation
  - Alarm messages clearly indicate deviation type and location
  - System returns to normal when conditions are within limits
  regulatory_basis:
  - 21 CFR Part 211.160(b) - Laboratory controls
  - EU GMP Annex 15 - Qualification and Validation
  risk_level: high
  data_integrity_requirements:
  - All temperature readings and alarm events must be time-stamped
  - No manual data entry or modification of recorded values
  - Audit trail must capture all configuration changes
  urs_requirements:
  - URS-EMS-001
  - URS-EMS-002
  - URS-EMS-004
  - URS-EMS-005
  - URS-EMS-011
  related_tests:
  - OQ-002
  - PQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Assurance
  - Validation Engineer
  - Metrology Technician
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Data Recording and Storage Verification with Audit Trail Functionality
  test_category: data_integrity
  gamp_category: 3
  objective: Verify that the system properly records, stores temperature data at required
    intervals and maintains compliant audit trail
  prerequisites:
  - System operational with default configuration
  - Test user accounts created
  - Database storage verified
  - System clock synchronized
  test_steps:
  - step_number: 1
    action: Verify system configuration for 5-minute data recording interval
    expected_result: System is configured to record temperature data every 5 minutes
      as specified
    data_to_capture:
    - Data recording interval setting
    - Configuration timestamp
    - User who configured interval
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor system for 30 minutes and verify data recording frequency
    expected_result: System records exactly 6 data points (every 5 minutes) during
      the 30-minute period
    data_to_capture:
    - Number of records created
    - Time intervals between records
    - Data completeness
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Access audit trail feature through vendor's standard interface
    expected_result: Audit trail is accessible and displays all system events including
      data recordings and configuration changes
    data_to_capture:
    - Audit trail accessibility
    - Event types recorded
    - Timestamp accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify data storage format and retention settings in vendor's database
    expected_result: Data is stored in vendor's standard format with retention period
      configured for minimum 7 years
    data_to_capture:
    - Database format verification
    - Retention period setting
    - Storage capacity assessment
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data recorded exactly every 5 minutes ±10 seconds
  - All data points include complete metadata (timestamp, location, value)
  - Audit trail captures all critical events without gaps
  - Storage format matches vendor specification
  - Retention period configured for 7+ years
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records
  - 21 CFR Part 211.194 - Laboratory Records
  - EU Annex 11 - Computerised Systems
  risk_level: high
  data_integrity_requirements:
  - ALCOA+ principles must be maintained for all records
  - Audit trail must be enabled and secure from modification
  - Data must be backed up according to vendor's archival procedures
  urs_requirements:
  - URS-EMS-002
  - URS-EMS-006
  - URS-EMS-008
  - URS-EMS-010
  - URS-EMS-012
  related_tests:
  - OQ-001
  - PQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - IT Specialist
  - Quality Assurance
  - Data Integrity Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: System Availability and Performance Response Time Verification
  test_category: performance
  gamp_category: 3
  objective: Verify that the EMS meets the required 99.5% availability and responds
    to alarm conditions within 30 seconds as specified in performance requirements.
  prerequisites:
  - EMS fully installed and configured
  - Test monitoring probes calibrated and connected
  - System clock synchronized
  - Performance monitoring tools available
  test_steps:
  - step_number: 1
    action: Initiate continuous system operation monitoring for a period of 72 hours
    expected_result: System remains operational and accessible throughout the monitoring
      period
    data_to_capture:
    - Start time of monitoring
    - System status at beginning of test
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Simulate an alarm condition by creating a temperature deviation exceeding
      ±2°C from setpoint
    expected_result: System detects the alarm condition and generates alert within
      30 seconds of deviation
    data_to_capture:
    - Time of alarm condition creation
    - Time of alert generation
    - Response time calculation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Calculate system availability percentage based on uptime during the monitoring
      period
    expected_result: System availability meets or exceeds the required 99.5% threshold
    data_to_capture:
    - Total monitoring duration
    - Downtime duration (if any)
    - Availability percentage calculation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System responds to alarm conditions within 30 seconds
  - System availability meets or exceeds 99.5%
  - All performance data is properly recorded and documented
  regulatory_basis:
  - 'GMP Annex 11: Computerized Systems'
  - FDA guidance on data integrity and compliance
  risk_level: high
  data_integrity_requirements:
  - All performance metrics must be accurately recorded with timestamps
  - No data manipulation during testing period
  - Audit trail must capture all system status changes
  urs_requirements:
  - 'URS-EMS-011: System response time shall not exceed 30 seconds for alarm conditions'
  - 'URS-EMS-013: System availability shall be 99.5% excluding planned maintenance'
  related_tests:
  - 'OQ-001: Temperature Monitoring Accuracy and Alarm Functionality Verification'
  estimated_duration_minutes: 4320
  required_expertise:
  - System Administrator
  - Quality Assurance Specialist
  - Validation Engineer
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Integration Testing with Facility Management and Paging Systems
  test_category: integration
  gamp_category: 3
  objective: Verify successful integration between EMS and existing facility management
    system, and validate alarm notification integration with site paging system.
  prerequisites:
  - EMS fully operational
  - Facility Management System (FMS) available and configured
  - Site paging system operational
  - Integration protocols documented
  - Test user accounts created
  test_steps:
  - step_number: 1
    action: Configure EMS to interface with FMS using standard communication protocols
      (e.g., OPC, Modbus)
    expected_result: EMS successfully establishes connection with FMS and can exchange
      data
    data_to_capture:
    - Connection status
    - Protocol used
    - Data exchange verification timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Send test data from EMS to FMS and verify successful reception and processing
    expected_result: FMS correctly receives and processes environmental data from
      EMS
    data_to_capture:
    - Data sent timestamp
    - Data received timestamp
    - Data integrity verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Configure EMS alarm notifications to integrate with site paging system
      using vendor API
    expected_result: EMS successfully connects to paging system API and can send notifications
    data_to_capture:
    - API connection status
    - Authentication verification
    - API response codes
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Trigger a temperature alarm in EMS and verify paging system receives and
      processes the notification
    expected_result: Paging system receives alarm notification and activates appropriate
      alert mechanisms
    data_to_capture:
    - Alarm trigger time
    - Notification send time
    - Paging system response time
    - Alert activation confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - EMS successfully interfaces with FMS using standard protocols
  - Alarm notifications are correctly sent to and processed by paging system
  - All integration points function as specified without data loss
  regulatory_basis:
  - '21 CFR Part 11: Electronic Records; Electronic Signatures'
  - 'GAMP 5: Good Automated Manufacturing Practice'
  risk_level: medium
  data_integrity_requirements:
  - All data exchanged between systems must maintain integrity and accuracy
  - Audit trails must capture integration events and data transfers
  - No unauthorized data modification during integration processes
  urs_requirements:
  - 'URS-EMS-014: System shall interface with existing facility management system
    via standard protocols'
  - 'URS-EMS-015: Alarm notifications shall integrate with site paging system using
    vendor API'
  related_tests:
  - 'OQ-001: Temperature Monitoring Accuracy and Alarm Functionality Verification'
  - 'OQ-002: Data Recording and Storage Verification with Audit Trail Functionality'
  estimated_duration_minutes: 120
  required_expertise:
  - Integration Specialist
  - Network Engineer
  - Quality Assurance Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
