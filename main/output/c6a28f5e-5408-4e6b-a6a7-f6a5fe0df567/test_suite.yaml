- test_id: OQ-003
  test_name: Chain-of-Identity and Chain-of-Custody Verification
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that dual-scanning verification properly enforces chain-of-identity
    and chain-of-custody throughout the therapy workflow
  prerequisites:
  - System configured with sample patient therapy workflow
  - Two authorized users with different roles
  - Barcode scanners configured and connected
  - Sample therapy materials with barcodes available
  test_steps:
  - step_number: 1
    action: Initiate a sample patient therapy workflow and generate initial patient
      specimen labels
    expected_result: System generates unique barcodes for patient specimen and associated
      documentation
    data_to_capture:
    - Barcode numbers
    - Timestamp of label generation
    - User who initiated workflow
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Perform first custody transfer by having User A scan the specimen barcode
      and transfer to User B
    expected_result: System records custody transfer with timestamp and requires User
      B to confirm receipt via scan
    data_to_capture:
    - Transfer timestamp
    - Both user identities
    - Scan confirmation status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to bypass dual-scanning by having only one user scan during transfer
    expected_result: System rejects the transfer and requires both sender and receiver
      scans to complete custody transfer
    data_to_capture:
    - Error message displayed
    - System behavior when protocol violated
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify audit trail entries for all custody events in the system logs
    expected_result: Complete audit trail shows all custody transfers with timestamps,
      user identities, and verification status
    data_to_capture:
    - Audit trail completeness
    - Data integrity of custody records
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All custody transfers require dual-scanning verification by both sending and receiving
    parties
  - Chain-of-identity is maintained throughout the entire workflow without gaps
  - Audit trail captures complete custody history with immutable timestamps
  - System prevents custody transfers that violate the dual-scanning protocol
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records and Signatures
  - GDP Guidelines for cold chain integrity and custody documentation
  - FDA Guidance on Chain of Identity and Chain of Custody for cell therapies
  risk_level: critical
  data_integrity_requirements:
  - ALCOA+ principles applied to all custody records
  - Immutable audit trail for all custody events
  - Prevention of unauthorized custody transfers
  - Timestamp accuracy synchronized across system
  urs_requirements:
  - 'URS-028-002: Enforce chain-of-identity and chain-of-custody with dual-scanning
    verification'
  - 'URS-028-008: Full audit trail for all handoffs and custody events'
  - 'URS-028-010: Compliance with GDP for logistics and cold-chain records'
  related_tests:
  - OQ-001
  - OQ-004
  estimated_duration_minutes: 45
  required_expertise:
  - Quality Assurance
  - Logistics Operations
  - Regulatory Compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
