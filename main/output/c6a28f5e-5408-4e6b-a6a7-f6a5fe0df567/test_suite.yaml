- test_id: OQ-009
  test_name: SSO Integration with OIDC and Device Identity Verification
  test_category: integration
  gamp_category: 4
  objective: Verify successful integration with Single Sign-On (SSO) using OpenID
    Connect (OIDC) and proper device identity verification for scanner authentication
  prerequisites:
  - OIDC identity provider configured
  - Scanner devices registered with device identities
  - Test user accounts created in identity provider
  - Network connectivity between platform and identity provider
  test_steps:
  - step_number: 1
    action: Attempt to access the platform using a web browser and initiate OIDC authentication
      flow
