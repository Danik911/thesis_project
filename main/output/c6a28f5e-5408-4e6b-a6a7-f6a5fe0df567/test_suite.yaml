test_cases:
- test_id: OQ-001
  test_name: End-to-End Workflow Template Configuration and Execution
  test_category: functional
  gamp_category: 4
  objective: Verify that the system can properly configure and execute a complete
    personalized therapy workflow from apheresis through infusion with all required
    handoffs and verifications.
  prerequisites:
  - System installed and configured
  - Test workflow templates created
  - Test user accounts with appropriate permissions
  - Test patient and lot data loaded
  test_steps:
  - step_number: 1
    action: Configure a complete therapy workflow template including apheresis, manufacturing
      slot allocation, QC release, and infusion steps
    expected_result: Workflow template is successfully configured and saved with all
      required steps and validation rules
    data_to_capture:
    - Template configuration details
    - Validation rule settings
    - Save operation timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate a test patient journey using the configured template and simulate
      dual-scanning verification at each handoff point
    expected_result: Patient journey progresses through all workflow steps with successful
      dual-scan verification at each custody transfer
    data_to_capture:
    - Scan verification results
    - Handoff timestamps
    - User performing verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Simulate a temperature excursion exception during logistics phase and
      trigger exception handling workflow
    expected_result: Exception handling workflow is properly triggered and guides
      user through appropriate corrective actions
    data_to_capture:
    - Exception event details
    - Workflow response time
    - Corrective actions taken
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Workflow template executes without errors
  - All dual-scan verifications are properly enforced
  - Exception handling workflow responds within 5 seconds
  - Complete audit trail generated for all actions
  regulatory_basis:
  - 21 CFR Part 11
  - GDP guidelines for cold-chain management
  - Chain of identity/chain of custody requirements
  risk_level: high
  data_integrity_requirements:
  - Full audit trail for all workflow steps
  - Immutable record of custody transfers
  - Timestamped verification events
  - Electronic signatures for critical actions
  urs_requirements:
  - URS-028-001
  - URS-028-002
  - URS-028-004
  - URS-028-008
  - URS-028-009
  - URS-028-010
  related_tests:
  - OQ-002
  - PQ-001
  - PQ-003
  estimated_duration_minutes: 45
  required_expertise:
  - Workflow configuration
  - Quality assurance
  - Regulatory compliance
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
