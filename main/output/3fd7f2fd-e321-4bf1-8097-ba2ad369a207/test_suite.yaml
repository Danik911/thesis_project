- test_id: OQ-007
  test_name: Verification of Scheduled Report Email Functionality
  test_category: functional
  gamp_category: 3
  objective: To verify that the vendor's standard scheduler correctly generates and
    emails reports containing SPC charts and data at predefined intervals.
  prerequisites:
  - System is installed and configured
  - Valid user account with scheduling permissions
  - Configured email server settings
  - Prepared dataset for reporting
  - Valid recipient email address
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with a user account that has scheduling permissions.
    expected_result: User successfully logs in and gains access to the scheduling
      module.
    data_to_capture:
    - Screenshot of successful login
    - User role and permissions displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the report scheduler module and configure a new scheduled
      report for a specific chart.
    expected_result: Scheduler interface loads, allowing configuration of report frequency,
      recipients, and content.
    data_to_capture:
    - Screenshot of scheduler configuration page
    - Selected report parameters
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Set the schedule for immediate execution or a short interval (e.g., 5
      minutes) and save the configuration.
    expected_result: System confirms the scheduled report has been saved and is active.
    data_to_capture:
    - Screenshot of confirmation message
    - Scheduled job ID and next run time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Wait for the scheduled time and verify the email is received by the designated
      recipient.
    expected_result: Email is delivered containing the correct report in the specified
      format (PDF/CSV).
    data_to_capture:
    - Screenshot of received email
    - Timestamp of email delivery
    - Attachment integrity check
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Scheduled report is generated and emailed successfully at the correct time.
  - Report content matches the configured chart and data selection.
  - Email is sent to all specified recipients without errors.
  regulatory_basis:
  - 21 CFR Part 11 for automated processes and electronic records.
  - Annex 11 for automated systems handling quality data.
  risk_level: medium
  data_integrity_requirements:
  - The data in the emailed report must be an exact representation of the data in
    the system at the time of generation.
  - The scheduling configuration must be stored reliably to ensure consistent execution.
  urs_requirements:
  - URS-020-006
  related_tests:
  - OQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - SPC Dashboard User
  - QA Analyst
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verification of Data Import via ODBC Connection
  test_category: integration
  gamp_category: 3
  objective: To verify that the system can successfully import data for SPC analysis
    using the vendor's standard ODBC connector.
  prerequisites:
  - System is installed and configured
  - ODBC data source (e.g., test SQL database) is configured and accessible
  - Valid user account with data import permissions
  - Test dataset available in the ODBC source
  test_steps:
  - step_number: 1
    action: Log into the SPC dashboard with a user account that has data import permissions.
    expected_result: User successfully logs in and navigates to the data import module.
    data_to_capture:
    - Screenshot of successful login
    - Access to import functionality verified
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Select the ODBC import option and configure the connection to the test
      database.
    expected_result: System prompts for ODBC connection parameters (DSN, query, etc.).
    data_to_capture:
    - Screenshot of ODBC configuration screen
    - Connection parameters used
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Execute a test query to import a defined dataset from the ODBC source.
    expected_result: System establishes connection and displays a preview of the data
      to be imported.
    data_to_capture:
    - Screenshot of data preview
    - Number of records identified for import
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Complete the import process and verify the data is loaded into the SPC
      dashboard.
    expected_result: Data is successfully imported and is available for creating charts
      and analysis.
    data_to_capture:
    - Screenshot of successful import confirmation
    - Record count in the SPC dashboard after import
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 5
    action: Create a basic chart (e.g., X-bar) using the imported ODBC data to verify
      integrity.
    expected_result: Chart renders correctly, confirming the data was imported accurately.
    data_to_capture:
    - Screenshot of the generated chart
    - Verification of data points against source
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Data is successfully imported from the configured ODBC source without errors.
  - The imported data is complete and accurate when compared to the source.
  - Charts can be generated from the ODBC-imported data.
  regulatory_basis:
  - 21 CFR Part 11 for electronic records and data integrity.
  - Annex 11 for computerized system integration.
  risk_level: medium
  data_integrity_requirements:
  - Data transferred via ODBC must maintain accuracy and completeness.
  - The import process must not alter the original data values.
  urs_requirements:
  - URS-020-012
  related_tests:
  - OQ-001
  estimated_duration_minutes: 30
  required_expertise:
  - Database Administrator
  - SPC Dashboard User
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
