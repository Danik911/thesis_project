    action: Navigate to the export menu and select PDF export option for an existing
      chart
    expected_result: System generates PDF file with chart visualization and basic
      statistics
    data_to_capture:
    - Export completion time
    - PDF file integrity
    - Chart accuracy in PDF
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the export menu and select CSV export option for the same
      chart
    expected_result: System generates CSV file containing raw data points and calculated
      statistics
    data_to_capture:
    - CSV file format compliance
    - Data completeness
    - Numerical accuracy
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - PDF exports contain accurate chart representations
  - CSV exports maintain data integrity and format
  - Both export types complete within vendor-specified time limits
  regulatory_basis:
  - 21 CFR Part 11 electronic records requirements
  - Data integrity principles ALCOA+
  risk_level: medium
  data_integrity_requirements:
  - Exported data must match source data exactly
  - Export files must be complete and uncorrupted
  - Metadata must be preserved in exports
  urs_requirements:
  - 'URS-020-003: The system shall provide vendor standard export to PDF and CSV'
  related_tests:
  - 'OQ-001: Functional Verification of Chart Creation and Nelson Rules Application'
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Control Analyst
  - Data Integrity Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Role-Based Access Control and Authentication Integration
  test_category: security
  gamp_category: 3
  objective: Verify that role-based view access functions correctly and integrates
    with Active Directory for user authentication when supported
  prerequisites:
  - Active Directory test environment
  - Multiple user accounts with different roles
  - Pre-defined access control matrix
  test_steps:
  - step_number: 1
    action: Attempt to log in using AD credentials with different role assignments
    expected_result: System authenticates users correctly and applies appropriate
      role-based access permissions
    data_to_capture:
    - Authentication success/failure
    - Role assignment accuracy
    - Login time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that users with read-only role cannot modify released datasets
    expected_result: Read-only users can view but not edit or delete controlled records
      and released data
    data_to_capture:
    - Access restriction effectiveness
    - User interface behavior for restricted functions
    - Error messages for unauthorized actions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - AD integration functions correctly when supported by vendor
  - Role-based access controls prevent unauthorized actions
  - Read-only access is enforced for released datasets
  regulatory_basis:
  - 21 CFR Part 11 access controls
  - EU Annex 11 electronic system security requirements
  risk_level: high
  data_integrity_requirements:
  - User access must be properly restricted based on roles
  - Authentication must be secure and reliable
  - Access attempts must be properly logged
  urs_requirements:
  - 'URS-020-004: The dashboard shall allow role-based view access'
  - 'URS-020-007: Read-only access for released datasets'
  - 'URS-020-013: Integrate with AD for user authentication if supported by vendor'
  related_tests:
  - 'OQ-001: Functional Verification of Chart Creation and Nelson Rules Application'
  estimated_duration_minutes: 45
  required_expertise:
  - IT Security Specialist
  - Quality System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verification of Read-Only Access for Released Datasets
  test_category: security
  gamp_category: 3
  objective: Verify that released datasets are restricted to read-only access as required
    by regulatory controls to prevent unauthorized modifications.
  prerequisites:
  - System installed and configured
  - Test user accounts with different roles created
  - Sample dataset created and released
  test_steps:
  - step_number: 1
    action: Log in as a user with data release permissions and mark a test dataset
      as released
    expected_result: Dataset status changes to released and system confirms successful
      status update
    data_to_capture:
    - Dataset status before and after release
    - System confirmation message
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to modify data points in the released dataset using various user
      roles
    expected_result: All modification attempts are prevented with appropriate error
      messages
    data_to_capture:
    - Error messages displayed
    - List of attempted modifications that were blocked
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that read operations (viewing, exporting) remain available for
      released data
    expected_result: All read operations function normally while write operations
      remain restricted
    data_to_capture:
    - Successful read operations performed
    - Export functionality verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Released datasets cannot be modified by any user role
  - Read operations remain fully functional for released data
  - Appropriate error messages are displayed for modification attempts
  regulatory_basis:
  - 21 CFR Part 11 electronic record requirements
  - Data integrity ALCOA+ principles
  risk_level: high
  data_integrity_requirements:
  - Data immutability after release
  - Audit trail for release actions if available
  - Access control enforcement
  urs_requirements:
  - 'URS-020-007: Read-only access for released datasets'
  related_tests:
  - 'OQ-004: Role-Based Access Control and Authentication Integration'
  estimated_duration_minutes: 30
  required_expertise:
  - Quality Assurance
  - Regulatory Compliance
  - System Administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
