test_cases:
- test_id: OQ-001
  test_name: Functional Verification of Chart Creation and Nelson Rules Application
  test_category: functional
  gamp_category: 3
  objective: Verify the system can successfully create X-bar/R and p-charts from CSV
    input data and correctly apply the vendor's standard Nelson rules for statistical
    process control.
  prerequisites:
  - System installed and configured
  - Test CSV file with sample QC data available
  - User with appropriate permissions logged in
  test_steps:
  - step_number: 1
    action: Navigate to the chart creation module and select the option to create
      a new X-bar/R chart.
    expected_result: System displays the chart creation interface with options to
      upload data.
    data_to_capture:
    - Screen capture of chart creation interface
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Upload the prepared test CSV file containing sample QC data points.
    expected_result: System successfully loads the CSV file and displays a preview
      of the data.
    data_to_capture:
    - Confirmation message of successful upload
    - Data preview screenshot
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Configure the chart parameters (subgroup size, specifications) and enable
      Nelson rules.
    expected_result: System accepts configuration and shows preview of chart with
      Nelson rules applied.
    data_to_capture:
    - Configuration settings used
    - Chart preview screenshot showing Nelson rule violations
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Repeat steps 1-3 to create a p-chart using attribute data from a different
      test CSV file.
    expected_result: System successfully creates p-chart with Nelson rules correctly
      applied to attribute data.
    data_to_capture:
    - p-chart configuration
    - p-chart output with Nelson rule indicators
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - X-bar/R chart created successfully from CSV input
  - p-chart created successfully from CSV input
  - Nelson rules correctly identify out-of-control points in both charts
  - All chart configurations are saved as controlled records
  regulatory_basis:
  - FDA 21 CFR Part 11
  - EU Annex 11
  - ICH Q9 Quality Risk Management
  risk_level: medium
  data_integrity_requirements:
  - Chart configurations must be retained as controlled records
  - All data points must be accurately represented in the charts
  urs_requirements:
  - URS-020-001
  - URS-020-002
  - URS-020-008
  related_tests:
  - OQ-002
  - PQ-020-001
  estimated_duration_minutes: 45
  required_expertise:
  - SPC knowledge
  - Quality Control processes
  - CSV data formatting
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Performance Verification of Data Loading and Chart Rendering
  test_category: performance
  gamp_category: 3
  objective: Verify the system meets performance requirements for loading large datasets
    and rendering charts within specified timeframes under supported hardware configurations.
  prerequisites:
  - System installed on supported hardware
  - Large test CSV file with approximately 100,000 data points available
  - Performance monitoring tools configured
  test_steps:
  - step_number: 1
    action: Navigate to the data import module and select the large test CSV file
      containing approximately 100,000 data points.
    expected_result: System begins processing the file without errors.
    data_to_capture:
    - Start time of file upload
    - System resource utilization during upload
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Measure the time from file selection completion to full data loading confirmation.
    expected_result: Data loading completes in less than 5 seconds as specified in
      performance requirements.
    data_to_capture:
    - Data loading completion time
    - CPU and memory usage during loading
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Apply filters to the loaded dataset and initiate chart rendering.
    expected_result: System applies filters and begins chart rendering process.
    data_to_capture:
    - Filter application time
    - Chart rendering start time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Measure the time from filter application to complete chart rendering.
    expected_result: Chart renders completely in less than 2 seconds after filter
      changes.
    data_to_capture:
    - Chart rendering completion time
    - Final system performance metrics
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - 100k data points load in under 5 seconds
  - Charts render in under 2 seconds after filter changes
  - System remains stable during performance testing
  - No data corruption occurs during high-volume operations
  regulatory_basis:
  - FDA 21 CFR Part 11 - System Performance
  - EU Annex 11 - Electronic System Performance
  risk_level: medium
  data_integrity_requirements:
  - All 100,000 data points must be accurately loaded without loss or corruption
  - Chart rendering must accurately represent the filtered dataset
  urs_requirements:
  - URS-020-010
  - URS-020-011
  related_tests:
  - OQ-001
  - IQ-020-002
  estimated_duration_minutes: 30
  required_expertise:
  - Performance testing
  - System monitoring
  - Data analysis
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Export Functionality Verification for PDF and CSV Formats
  test_category: functional
  gamp_category: 3
  objective: Verify that the system correctly exports charts and reports to both PDF
    and CSV formats using vendor standard export functionality
  prerequisites:
  - Valid user credentials with export permissions
  - Pre-configured chart with sample QC data
  - Export directory with write permissions
  test_steps:
