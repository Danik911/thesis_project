- test_id: OQ-010
  test_name: Verification of AD Authentication Integration
  test_category: integration
  gamp_category: 3
  objective: Verify that the system properly integrates with Active Directory for
    user authentication when this feature is supported by the vendor.
  prerequisites:
  - System installed and configured
  - AD integration configured per vendor documentation
  - Test AD user accounts available
  - Network connectivity to AD server verified
  test_steps:
  - step_number: 1
    action: Attempt to log in to the SPC dashboard using valid AD credentials
    expected_result: User is successfully authenticated and granted access to the
      system
    data_to_capture:
    - Login success/failure
    - Authentication time
    - User roles assigned
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify user roles and permissions are correctly mapped from AD groups
    expected_result: User has appropriate access rights based on AD group membership
    data_to_capture:
    - Available menu options
    - Access to restricted functions
    - Role-based view permissions
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Attempt to log in with invalid AD credentials
    expected_result: System rejects login attempt with appropriate error message
    data_to_capture:
    - Error message displayed
    - Login attempt logged
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Test login with AD account that has expired password or disabled status
    expected_result: System rejects login attempt and provides appropriate feedback
    data_to_capture:
    - Error message specificity
