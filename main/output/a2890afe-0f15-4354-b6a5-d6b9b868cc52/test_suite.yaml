    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Manually review and resolve 5 exceptions within the validation queue,
      applying a resolution that triggers the CAPA linkage workflow (URS-019-010).
    expected_result: Upon resolution/approval, the system successfully transmits the
      exception details (metadata, error code) to the mock CAPA system.
    data_to_capture:
    - CAPA ID generated by the external system
    - Timestamp of linkage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the audit trail for the resolved documents accurately reflects
      the manual intervention and the linkage to the generated CAPA ID (URS-019-013).
    expected_result: The audit trail entry for the document clearly shows the exception
      resolution and references the external CAPA ID.
