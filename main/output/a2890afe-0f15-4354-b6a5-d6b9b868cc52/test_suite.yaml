test_cases:
- test_id: OQ-001
  test_name: Verify Standard TMF Reference Model v3.3 Configuration and Classification
  test_category: functional
  gamp_category: 4
  objective: Validate the system's ability to correctly map and classify documents
    using the standard TMF Reference Model v3.3 configuration.
  prerequisites:
  - System is fully installed and configured for GAMP Cat 4.
  - TMF Reference Model v3.3 mapping configuration is loaded.
  - Test data set containing 100 documents representative of standard TMF artifacts
    is available.
  test_steps:
  - step_number: 1
    action: Upload the batch of 100 test documents into the ingestion queue.
    expected_result: All 100 documents are accepted into the processing pipeline.
    data_to_capture:
    - Timestamp of batch submission
    - Initial document status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Monitor the system processing queue until all documents are classified.
    expected_result: All 100 documents are classified, and the classification latency
      for the batch is recorded.
    data_to_capture:
    - Total processing time
    - Classification results for 10 randomly selected documents
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the metadata of the 10 selected documents against the expected
      TMF Reference Model v3.3 structure.
    expected_result: The document metadata (Study, Artifact Type, Zone) matches the
      expected classification based on source file metadata/content.
    data_to_capture:
    - Final TMF artifact ID
    - Assigned Study ID
    - Assigned Artifact Type
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Minimum 98% of documents are classified correctly according to the standard configuration.
  - Processing time meets the performance requirement for the batch size (URS-019-015
    implicitly tested via batch size).
  - All resulting metadata adheres to controlled vocabularies (URS-019-005).
  regulatory_basis:
  - URS-019-001
  - URS-019-005
  - URS-019-007
  - URS-019-011
  risk_level: medium
  data_integrity_requirements:
  - Ensure no data loss during transformation.
  - Verify metadata integrity against source data.
  urs_requirements:
  - URS-019-001
  - URS-019-005
  - URS-019-007
  - URS-019-011
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Clinical Operations SME
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Validate Custom Plugin Classification and Human-in-the-Loop Review Workflow
  test_category: integration
  gamp_category: 4
  objective: Verify the functionality of a custom classification plugin and the subsequent
    human review/approval process.
  prerequisites:
  - System is configured with a custom classification plugin designed to handle a
    specific edge-case document type.
  - A test document requiring the custom plugin is available.
  - User accounts configured for Reviewer and Approver roles.
  test_steps:
  - step_number: 1
    action: Submit the edge-case document requiring the custom plugin for indexing.
    expected_result: The system automatically routes the document to the validation
      queue (URS-019-006) because the custom plugin flags it as requiring review.
    data_to_capture:
    - Document status upon entry to queue
    - Plugin execution log entry
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as the Reviewer and access the validation queue to review the classification
      suggested by the custom plugin.
    expected_result: The Reviewer can view the source data, the plugin's suggested
      classification, and the audit trail of the automated step (URS-019-013).
    data_to_capture:
    - Reviewer's initial assessment
    - Time spent in review
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: The Reviewer approves the classification, and the Approver applies an
      electronic signature to finalize the artifact.
    expected_result: The document is finalized, and the electronic signature is correctly
      applied and recorded (URS-019-012).
    data_to_capture:
    - Finalization timestamp
    - Signature record details
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify traceability from the final artifact back to the initial submission
      event.
    expected_result: Full traceability is confirmed, showing the path through the
      custom plugin and the human review steps (URS-019-007).
    data_to_capture:
    - Traceability report confirmation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - The custom plugin executes successfully and routes the document to the validation
    queue.
  - The human-in-the-loop review and approval process completes successfully.
  - All review/approval actions are captured with compliant electronic signatures.
  regulatory_basis:
  - URS-019-003
  - URS-019-006
  - URS-019-007
  - URS-019-012
  - URS-019-013
  risk_level: high
  data_integrity_requirements:
  - Ensure the electronic signature is immutable.
  - Verify that the audit trail captures all changes made during the review process.
  urs_requirements:
  - URS-019-003
  - URS-019-006
  - URS-019-007
  - URS-019-012
  - URS-019-013
  - URS-019-020
  related_tests:
  - OQ-001
  estimated_duration_minutes: 90
  required_expertise:
  - Validation Engineer
  - Regulatory/Compliance Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Validate Rule-Based Classification with Controlled Vocabulary Enforcement
  test_category: functional
  gamp_category: 4
  objective: Verify the system correctly applies vendor-scripted rules for document
    classification and enforces controlled vocabularies for required metadata fields.
  prerequisites:
  - System is fully installed and configured for OQ testing.
  - A specific set of test documents requiring classification via scripting are available
    in the source ingestion queue.
  - Controlled vocabularies for Study ID and Artifact Type are defined and active
    in the configuration.
  test_steps:
  - step_number: 1
    action: Ingest 50 test documents into the harmonization service, ensuring metadata
      triggers a specific vendor-scripted classification rule (e.g., documents tagged
      'Protocol Amendment' should map to TMF Artifact 1.1.1).
    expected_result: All 50 documents are automatically classified by the script,
      and the resulting TMF metadata fields (Study ID, Artifact Type) match the defined
      controlled vocabulary values.
    data_to_capture:
    - Document IDs processed
    - Final classification result
    - Metadata values captured
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to manually override the 'Study ID' field in the validation queue
      with a value NOT present in the controlled vocabulary list.
    expected_result: The system prevents the save/submission action, displaying an
      error message indicating the value violates the controlled vocabulary constraint
      (URS-019-005).
    data_to_capture:
    - Error message captured
    - Final status of the document review
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Review the audit trail for one successfully classified document to confirm
      traceability of the classification action.
    expected_result: The audit trail clearly indicates the classification was performed
      by the automated rule engine, linking back to the versioned ruleset (URS-019-007,
      URS-019-013).
    data_to_capture:
    - Audit trail entry timestamp and user/system ID
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All documents are classified correctly according to the scripted rules.
  - The system successfully blocks manual entry of non-controlled vocabulary terms.
  - Audit trails confirm automated classification traceability.
  regulatory_basis:
  - URS-019-002
  - URS-019-005
  - URS-019-013
  risk_level: medium
  data_integrity_requirements:
  - Metadata integrity must be maintained during automated transformation.
  urs_requirements:
  - URS-019-002
  - URS-019-005
  - URS-019-007
  - URS-019-013
  related_tests:
  - OQ-001
  estimated_duration_minutes: 45
  required_expertise:
  - Clinical Operations SME
  - System Configuration Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-004
  test_name: Verify Batch Reprocessing with Ruleset Versioning and Performance
  test_category: performance
  gamp_category: 4
  objective: Assess the system's ability to process a large batch of documents using
    a specific ruleset version and measure performance against defined throughput
    requirements.
  prerequisites:
  - System is stable and ready for high-volume processing.
  - A baseline ruleset (Version 1.0) is active.
  - A new, slightly modified ruleset (Version 1.1) is available for comparison.
  - A test dataset of exactly 10,000 documents is prepared for ingestion.
  test_steps:
  - step_number: 1
    action: Ingest the 10,000 test documents, explicitly selecting Ruleset Version
      1.0 for processing.
    expected_result: The system initiates batch processing, and the total processing
      time is recorded.
    data_to_capture:
    - Start time of batch job
    - End time of batch job
    - Total documents processed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Calculate the throughput (Documents/Hour) from the recorded times and
      compare against URS-019-015.
    expected_result: The calculated throughput must be greater than or equal to 10,000
      documents/hour.
    data_to_capture:
    - Calculated throughput (DPH)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Modify the classification ruleset to Version 1.1 (e.g., change one mapping)
      and initiate batch reprocessing of the same 10,000 documents.
    expected_result: The system successfully processes the batch using Version 1.1,
      and the audit trail confirms the use of the new version (URS-019-009).
    data_to_capture:
    - Ruleset version used for reprocessing
    - Audit trail confirmation of version usage
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify that the metadata output for the documents processed in Step 3
      reflects the changes introduced in Ruleset Version 1.1.
    expected_result: A sample of documents shows the classification change dictated
      by Version 1.1, confirming versioned rule application.
    data_to_capture:
    - Sample document metadata comparison (V1.0 vs V1.1 output)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Batch processing throughput meets or exceeds 10,000 documents/hour.
  - The system correctly utilizes the specified versioned ruleset during reprocessing.
  - Reprocessing results reflect the changes in the new ruleset.
  regulatory_basis:
  - URS-019-009
  - URS-019-013
  risk_level: high
  data_integrity_requirements:
  - Traceability of ruleset version must be maintained for all reprocessing activities.
  urs_requirements:
  - URS-019-009
  - URS-019-013
  - URS-019-015
  related_tests:
  - OQ-001
  estimated_duration_minutes: 60
  required_expertise:
  - Performance Engineer
  - Clinical Operations SME
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Duplicate Detection and Exception Handling Workflow
  test_category: functional
  gamp_category: 4
  objective: Verify the system's ability to detect duplicate documents and successfully
    route exceptions for human review and CAPA linkage.
  prerequisites:
  - System configured with standard TMF mapping.
  - User roles configured for Reviewer and Administrator.
  - Test data prepared containing known duplicates across different source systems.
  test_steps:
  - step_number: 1
    action: Submit a batch of documents known to contain exact duplicates (based on
      metadata hash) from two different integrated source systems.
    expected_result: The system processes the batch, flags the duplicates, and prevents
      automatic indexing.
    data_to_capture:
    - Batch processing ID
    - Number of documents flagged as duplicates
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Navigate to the Validation Queue (URS-019-006) and locate the duplicate
      entries.
    expected_result: Duplicate documents are clearly marked and routed to the designated
      Reviewer queue.
    data_to_capture:
    - Queue entry IDs for duplicates
    - Reviewer assignment status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: As the Reviewer, select one duplicate pair and choose the 'Resolve as
      Duplicate - Keep Source A' action.
    expected_result: The non-retained document is marked for deletion/archival, and
      the retained document is indexed.
    data_to_capture:
    - Audit trail entry for resolution
    - Final index status of the retained document
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Simulate a complex exception (e.g., metadata mismatch requiring manual
      correction) and initiate the Exception Handling workflow (URS-019-010).
    expected_result: The system generates an exception record linked to a new CAPA
      tracking ID.
    data_to_capture:
    - Generated CAPA ID
    - Traceability link between exception and CAPA
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Duplicate documents are successfully identified and prevented from being indexed
    without explicit user intervention.
  - The resolution workflow maintains ALCOA+ integrity for the retained document metadata
    (URS-019-011).
  - All resolution and exception actions are recorded in the audit trail (URS-019-013).
  regulatory_basis:
  - URS-019-004
  - URS-019-006
  - URS-019-010
  - URS-019-011
  - URS-019-013
  risk_level: high
  data_integrity_requirements:
  - Ensure no data loss occurs during duplicate resolution.
  - Verify that the audit trail captures the identity of the user performing the resolution.
  urs_requirements:
  - URS-019-004
  - URS-019-006
  - URS-019-007
  - URS-019-010
  - URS-019-011
  - URS-019-013
  related_tests:
  - OQ-002
  estimated_duration_minutes: 60
  required_expertise:
  - Clinical Operations SME
  - System Administrator
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Verify Integration Security and eCTD Export Functionality
  test_category: integration
  gamp_category: 4
  objective: Validate secure integration via SAML/OIDC and confirm the system's ability
    to generate regulatory submission-ready export packages.
  prerequisites:
  - SAML/OIDC Identity Provider (IdP) configured and reachable.
  - System configured with appropriate roles (e.g., Submission Publisher).
  - A set of fully indexed and approved documents available for export.
  test_steps:
  - step_number: 1
    action: Attempt to access the system dashboard using a user account not provisioned
      in the enterprise IdP.
    expected_result: Access is denied, and the system redirects to the IdP login page.
    data_to_capture:
    - Error message or redirection URL
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Successfully log in via the SAML/OIDC flow and verify that the user's
      permissions align with the role assigned by the IdP (URS-019-021).
    expected_result: User is logged in with the correct authorization level, adhering
      to least-privilege defaults (URS-019-014).
    data_to_capture:
    - User session token details
    - Verified user role
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: As a user with Submission Publisher rights, initiate an export package
      generation for a complete study dataset, targeting eCTD format (URS-019-022).
    expected_result: The system generates a ZIP/XML package containing all indexed
      documents with correct metadata structure for regulatory submission.
    data_to_capture:
    - Export package file name and size
    - Timestamp of export completion
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Inspect the generated eCTD package structure, specifically verifying the
      presence and integrity of the index/metadata files.
    expected_result: The package structure adheres to standard eCTD requirements,
      and all documents are present and correctly linked.
    data_to_capture:
    - Verification of XML manifest integrity
    - Sample document path verification
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Authentication is strictly enforced via the configured enterprise identity provider.
  - Role-based authorization is correctly enforced upon login.
  - The generated eCTD export package is structurally valid and contains all required
    indexed artifacts.
  regulatory_basis:
  - URS-019-012
  - URS-019-014
  - URS-019-021
  - URS-019-022
  risk_level: critical
  data_integrity_requirements:
  - Ensure no metadata is altered during the export process.
  - Verify that only authorized users can initiate the submission export.
  urs_requirements:
  - URS-019-012
  - URS-019-014
  - URS-019-021
  - URS-019-022
  related_tests:
  - OQ-004
  estimated_duration_minutes: 75
  required_expertise:
  - Security Engineer
  - Regulatory Submission Specialist
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-007
  test_name: Verify ALCOA+ Integrity During Metadata Transformation
  test_category: data_integrity
  gamp_category: 4
  objective: Verify that all document metadata transformations maintain ALCOA+ integrity
    as required by regulatory standards.
  prerequisites:
  - System is fully configured and operational.
  - Test data set containing documents requiring classification changes (e.g., study
    ID, site ID) is available.
  - Audit trail logging is enabled and verified.
  test_steps:
  - step_number: 1
    action: Submit a batch of 50 documents requiring metadata updates (e.g., changing
      Study ID via a configured rule).
    expected_result: All 50 documents are processed, and the new metadata is applied
      successfully.
    data_to_capture:
    - Batch processing time
    - Final classification status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: For 5 randomly selected documents, access the audit trail and review the
      history of the modified metadata fields (e.g., Study ID).
    expected_result: The audit trail clearly shows the original value, the new value,
      the timestamp, the user/system responsible, and the reason for change (linking
      to the processing rule).
    data_to_capture:
    - Audit trail entries for 5 documents
    - Verification of Attributable, Legible, Contemporaneous, Original, and Accurate
      (ALCOA+) elements in the trail.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify that the final TMF artifact metadata reflects the correct, authorized
      classification.
    expected_result: The final metadata matches the expected output based on the transformation
      rules, satisfying the 'Accurate' and 'Complete' aspects of ALCOA+.
    data_to_capture:
    - Final metadata snapshot for the 5 documents
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All metadata transformations are successfully recorded in the audit trail.
  - The audit trail explicitly demonstrates ALCOA+ compliance for all changes.
  - No data loss or corruption occurred during the transformation process.
  regulatory_basis:
  - URS-019-011 (Maintain ALCOA+ integrity)
  - URS-019-013 (Retain audit trails)
  risk_level: high
  data_integrity_requirements:
  - Traceability must be maintained (URS-019-007)
  urs_requirements:
  - URS-019-001
  - URS-019-007
  - URS-019-011
  - URS-019-013
  related_tests:
  - OQ-003
  estimated_duration_minutes: 60
  required_expertise:
  - Clinical Data Management
  - System Administration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-008
  test_name: Verify Role-Based Authorization and Part 11 Signature Workflow
  test_category: security
  gamp_category: 4
  objective: Verify that role-based access controls restrict unauthorized actions
    and that Part 11 compliant signatures are correctly enforced for approvals.
  prerequisites:
  - 'System configured with at least three distinct user roles: Indexer (Low Privilege),
    Reviewer (Medium Privilege), and Administrator (High Privilege).'
  - A document requiring manual approval is present in the validation queue (URS-019-006).
  - Electronic Signature configuration is active.
  test_steps:
  - step_number: 1
    action: Log in as 'Indexer' user. Attempt to modify the classification ruleset
      configuration (Admin function).
    expected_result: Access is denied, and an appropriate authorization error message
      is displayed.
    data_to_capture:
    - Error message received
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Log in as 'Indexer' user. Attempt to approve a document in the validation
      queue.
    expected_result: The system prompts for an electronic signature, and upon entry
      of credentials, the signature is applied, and the document status changes to
      'Approved'.
    data_to_capture:
    - Signature timestamp and user ID recorded in audit trail
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Log in as 'Reviewer' user. Attempt to reject the same document after it
      has been signed by the Indexer.
    expected_result: The system prompts for an electronic signature. Upon successful
      signature, the document status changes to 'Rejected' or 'Rework Required'.
    data_to_capture:
    - Audit trail entry showing the second signature (rejection)
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Log in as 'Administrator'. Verify that the audit trail for the document
      shows both signatures and that the system enforces the least-privilege default
      for the Indexer role.
    expected_result: The audit trail confirms the sequence of actions and signatures,
      and the Indexer's inability to perform administrative tasks is confirmed.
    data_to_capture:
    - Final audit trail review confirming signature integrity and role separation.
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Role-based authorization prevents unauthorized configuration changes.
  - All approval/rejection actions require a compliant 21 CFR Part 11 electronic signature.
  - Audit trails accurately record all signature events.
  regulatory_basis:
  - URS-019-012 (21 CFR Part 11 signatures)
  - URS-019-014 (Role-based authorization)
  risk_level: critical
  data_integrity_requirements:
  - Electronic signatures must be unique to the individual.
  urs_requirements:
  - URS-019-006
  - URS-019-012
  - URS-019-013
  - URS-019-014
  related_tests:
  - OQ-006
  estimated_duration_minutes: 75
  required_expertise:
  - Security/Compliance
  - Validation Lead
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-009
  test_name: Verify Dashboard Completeness KPI Generation and Load Time
  test_category: performance
  gamp_category: 4
  objective: Verify the system's ability to generate and display completeness KPIs
    on the dashboard within specified performance limits under high data volume.
  prerequisites:
  - System is fully configured with TMF Reference Model v3.3 mappings.
  - A dataset containing at least 1 million indexed documents is loaded into the system.
  - User has 'Viewer' role access to the dashboard.
  test_steps:
  - step_number: 1
    action: Navigate to the main system dashboard interface.
    expected_result: The dashboard loads successfully, displaying the main overview
      screen.
    data_to_capture:
    - Initial dashboard load time (start to first render).
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Locate and load the 'Completeness KPIs' widget or report.
    expected_result: The KPI report loads, displaying metrics for study, site, and
      artifact completeness based on the 1M record dataset.
    data_to_capture:
    - Time taken for the Completeness KPI report to fully render.
