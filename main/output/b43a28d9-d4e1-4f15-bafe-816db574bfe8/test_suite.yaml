- test_id: OQ-004
  test_name: Validate Alarm Notification Integration
  test_category: integration
  gamp_category: 3
  objective: To verify that alarm notifications integrate with the site paging system
    using the vendor API as specified in URS-EMS-015.
  prerequisites:
  - System installed and operational
  - Site paging system configured
  test_steps:
  - step_number: 1
    action: Simulate a temperature deviation exceeding ±2°C from the setpoint.
    expected_result: System generates an alarm condition.
    data_to_capture:
    - Timestamp of alarm generation
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Check the site paging system for the alarm notification.
    expected_result: Alarm notification is received on the site paging system.
    data_to_capture:
    - Timestamp of alarm notification on paging system
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Alarm notification is successfully integrated with the site paging system
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: high
  data_integrity_requirements:
  - Ensure alarm notifications are accurately transmitted
  urs_requirements:
  - URS-EMS-015
  related_tests:
  - OQ-002
  estimated_duration_minutes: 30
  required_expertise:
  - System integration
  - API testing
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-005
  test_name: Verify Temperature Data Storage in Vendor Database
  test_category: data_integrity
  gamp_category: 3
  objective: To ensure that temperature data is accurately stored in the vendor's
    standard database format without any loss or corruption.
  prerequisites:
  - System is operational
  - Temperature sensors are calibrated
  - Database is accessible
  test_steps:
  - step_number: 1
    action: Simulate temperature readings within the specified range (-80°C to +50°C).
    expected_result: Temperature readings are recorded in the vendor's standard database
      format.
    data_to_capture:
    - Temperature readings
    - Database records
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify the integrity of the stored data by comparing simulated readings
      with database records.
    expected_result: Simulated readings match the database records without discrepancies.
    data_to_capture:
    - Data integrity check results
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All temperature readings are stored accurately in the vendor's database format.
  - No data loss or corruption is detected.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: medium
  data_integrity_requirements:
  - Data must be stored in the vendor's standard database format.
  - Data integrity must be maintained without loss or corruption.
  urs_requirements:
  - URS-EMS-006
  related_tests:
  - OQ-003
  estimated_duration_minutes: 30
  required_expertise:
  - Database management
  - Data integrity verification
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-006
  test_name: Validate System Response Time for Alarm Conditions
  test_category: performance
  gamp_category: 3
  objective: To verify that the system responds to alarm conditions within the specified
    time frame of 30 seconds.
  prerequisites:
  - System is operational
  - Alarm conditions are configured
  - Paging system is integrated
  test_steps:
  - step_number: 1
    action: Simulate a temperature deviation exceeding ±2°C from the setpoint.
    expected_result: System generates an alert within 30 seconds.
    data_to_capture:
    - Alert generation time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Verify that the alarm notification is sent to the site paging system.
    expected_result: Alarm notification is received by the paging system within 30
      seconds.
    data_to_capture:
    - Notification receipt time
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - System generates alerts within 30 seconds of temperature deviation.
  - Alarm notifications are sent to the paging system within 30 seconds.
  regulatory_basis:
  - 21 CFR Part 11
  risk_level: high
  data_integrity_requirements:
  - System response time must not exceed 30 seconds for alarm conditions.
  urs_requirements:
  - URS-EMS-011
  - URS-EMS-015
  related_tests:
  - OQ-002
  - OQ-004
  estimated_duration_minutes: 30
  required_expertise:
  - System performance testing
  - Alarm system integration
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
