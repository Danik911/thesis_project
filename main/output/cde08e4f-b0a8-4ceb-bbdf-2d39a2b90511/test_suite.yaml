- test_id: OQ-008
  test_name: Role-Based Access Control and Electronic Signature Verification
  test_category: security
  gamp_category: 3
  objective: To verify that role-based access control is properly implemented with
    least-privilege defaults and that electronic signatures are 21 CFR Part 11 compliant
    for approval workflows.
  prerequisites:
  - System integrated with enterprise identity provider
  - Multiple test user accounts with different roles configured
  - Documents in validation queue requiring approval
  - Access control policies configured
  test_steps:
  - step_number: 1
    action: Attempt to access system functions with a user account having minimal
      privileges
    expected_result: User can only access functions appropriate to their role with
      all restricted functions properly blocked
    data_to_capture:
    - Functions accessible
    - Functions blocked
    - Error messages displayed
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Attempt to perform privileged operations (rule modification, user management)
      with non-admin accounts
    expected_result: All privileged operations are properly blocked with appropriate
      access denied messages
    data_to_capture:
    - Operation attempts
    - System responses
    - Security event logging
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Perform document approval workflow using appropriate privileged accounts
      and capture electronic signature process
