test_cases:
- test_id: OQ-001
  test_name: Rule-Based Document Classification and TMF Mapping Verification
  test_category: functional
  gamp_category: 3
  objective: To verify that the system correctly classifies documents using configurable
    rule sets and accurately maps them to the appropriate TMF Reference Model v3.3
    artifacts, ensuring proper metadata assignment.
  prerequisites:
  - System installation is complete and validated
  - Test environment with sample document repository is available
  - Pre-configured rule sets for TMF mapping are loaded
  - Test user with appropriate permissions is created
  test_steps:
  - step_number: 1
    action: Upload a batch of 50 test documents with varying document types and metadata
      to the system input directory
    expected_result: System detects and acknowledges the arrival of new documents
      in the processing queue
    data_to_capture:
    - Document ingestion timestamp
    - Number of documents detected
    - System processing status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Initiate the automated classification process using the pre-configured
      rule sets
    expected_result: System processes all documents and applies classification rules
      according to the configured mappings
    data_to_capture:
    - Processing start/end time
    - Classification rules applied
    - Any rule execution errors
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Verify the classification results for each document in the validation
      queue
    expected_result: All documents are correctly mapped to appropriate TMF Reference
      Model artifacts with accurate metadata assignment
    data_to_capture:
    - Assigned TMF artifact codes
    - Metadata accuracy percentage
    - Classification confidence scores
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Review and approve classifications through the human-in-the-loop validation
      workflow
    expected_result: Validation workflow functions correctly with proper electronic
      signature capture for approvals
    data_to_capture:
    - Validation timestamp
    - Approver identity
    - Electronic signature compliance
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - 100% of test documents are correctly classified according to pre-defined rules
  - All TMF mappings align with Reference Model v3.3 specifications
  - Metadata assignments maintain ALCOA+ integrity throughout processing
  - Validation workflow enforces 21 CFR Part 11 electronic signature requirements
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records and Signatures
  - ICH E6 R2 - Good Clinical Practice
  - TMF Reference Model v3.3 compliance requirements
  risk_level: high
  data_integrity_requirements:
  - ALCOA+ principles maintained for all document metadata transformations
  - Audit trail captures all classification decisions and modifications
  - Traceability maintained from source document to final TMF artifact
  urs_requirements:
  - 'URS-019-001: Configure mappings between source systems and TMF Reference Model
    artifacts'
  - 'URS-019-002: Support rule-based document classification using vendor''s scripting'
  - 'URS-019-005: Enforce controlled vocabularies for study, site, and artifact metadata'
  - 'URS-019-006: Provide validation queue with human-in-the-loop review'
  - 'URS-019-007: Maintain traceability from source entry to final TMF artifact'
  - 'URS-019-011: Maintain ALCOA+ integrity for all document metadata transformations'
  - 'URS-019-012: Enforce 21 CFR Part 11-compliant electronic signatures for approvals'
  - 'URS-019-013: Retain audit trails for indexing, reclassification, and deletions'
  related_tests:
  - OQ-002
  - OQ-004
  - OQ-007
  estimated_duration_minutes: 45
  required_expertise:
  - TMF Reference Model knowledge
  - Clinical document management
  - Quality assurance testing
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-002
  test_name: Custom Plugin Integration and Exception Handling Verification
  test_category: integration
  gamp_category: 3
  objective: To validate the integration and functionality of custom-developed classification
    plugins for complex document types and verify the exception handling workflow
    with CAPA linkage.
  prerequisites:
  - System with plugin SDK framework is operational
  - Custom classification plugin for edge-case documents is developed and installed
  - Test documents requiring custom classification are prepared
  - CAPA system integration is configured and tested
  test_steps:
  - step_number: 1
    action: Upload documents specifically designed to trigger custom plugin processing
      (complex sponsor-specific taxonomies)
    expected_result: System recognizes documents requiring custom plugin processing
      and routes them appropriately
    data_to_capture:
    - Plugin detection accuracy
    - Routing decision logic
    - Processing queue status
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Execute the custom classification plugin on the targeted documents
    expected_result: Custom plugin processes documents successfully and returns appropriate
      classification results
    data_to_capture:
    - Plugin execution time
    - Classification results
    - Error messages if any
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Intentionally introduce classification failures to test exception handling
      workflow
    expected_result: System detects classification failures and routes documents to
      exception queue with proper error logging
    data_to_capture:
    - Exception trigger conditions
    - Error severity levels
    - Queue management behavior
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify CAPA linkage and workflow initiation for exception documents
    expected_result: System automatically creates CAPA records for classification
      failures and links them to the affected documents
    data_to_capture:
    - CAPA record creation
    - Document-CAPA linkage
    - Workflow initiation timestamp
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - Custom plugins integrate seamlessly with the core classification engine
  - Exception handling workflow properly manages classification failures
  - CAPA linkage automatically creates corrective action records for systematic issues
  - All plugin executions maintain data integrity and audit trail requirements
  regulatory_basis:
  - 21 CFR Part 11 - Electronic Records and Signatures
  - ICH E6 R2 - Quality Management System requirements
  - FDA Guidance on Computerized Systems Used in Clinical Investigations
  risk_level: critical
  data_integrity_requirements:
  - Plugin execution maintains ALCOA+ principles for all data transformations
  - Exception handling preserves original document integrity
  - CAPA linkages maintain full traceability and auditability
  urs_requirements:
  - 'URS-019-003: Allow custom-developed classification plugins for edge-case documents'
  - 'URS-019-004: Provide duplicate detection and resolution workflow'
  - 'URS-019-006: Provide validation queue with human-in-the-loop review'
  - 'URS-019-010: Provide exception handling with CAPA linkage'
  - 'URS-019-011: Maintain ALCOA+ integrity for all document metadata transformations'
  - 'URS-019-013: Retain audit trails for indexing, reclassification, and deletions'
  - 'URS-019-020: Pluggable plugin SDK for custom classification modules'
  related_tests:
  - OQ-001
  - OQ-005
  - OQ-009
  estimated_duration_minutes: 60
  required_expertise:
  - Plugin development knowledge
  - Exception handling workflows
  - CAPA process management
  - Integration testing
  reviewed_by: QA Manager
  data_retention_period: 10 years
  execution_timestamp_required: true
- test_id: OQ-003
  test_name: Duplicate Document Detection and Resolution Workflow Verification
  test_category: functional
  gamp_category: 3
  objective: To verify that the system correctly identifies potential duplicate documents
    and executes the configured resolution workflow with proper audit trail and user
    approval.
  prerequisites:
  - System is installed and configured
  - Test user accounts with appropriate permissions
  - Sample document set with known duplicates
  - Duplicate detection rules configured
  - Resolution workflow configured
  test_steps:
  - step_number: 1
    action: Upload a batch of documents including known duplicates with varying similarity
      levels
    expected_result: System processes documents and flags potential duplicates according
      to configured rules
    data_to_capture:
    - Number of duplicates detected
    - Similarity scores calculated
    - Time to process batch
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 2
    action: Access the duplicate resolution queue with appropriate user credentials
    expected_result: User can view all flagged potential duplicates in the resolution
      interface
    data_to_capture:
    - Queue accessibility
    - Display of duplicate pairs/groups
    - Metadata shown for each document
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 3
    action: Execute resolution actions (merge, keep both, delete) on duplicate pairs
    expected_result: System executes resolution actions and maintains proper relationships
      between documents
    data_to_capture:
    - Resolution actions available
    - System response to each action
    - Resulting document relationships
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  - step_number: 4
    action: Verify audit trail entries for all resolution actions
    expected_result: Complete audit trail maintained showing user, action, timestamp,
      and before/after states
    data_to_capture:
    - Audit trail completeness
    - ALCOA+ compliance
    - Electronic signature requirements met
    verification_method: visual_inspection
    acceptance_criteria: Result matches expected outcome
    performed_by: QA Technician
    timestamp_required: true
  acceptance_criteria:
  - All configured duplicate scenarios are correctly detected
  - Resolution workflow functions as designed
  - Audit trail maintains complete record of all actions
  - User permissions are properly enforced throughout the process
  regulatory_basis:
  - 21 CFR Part 11
  - ALCOA+ principles
  - TMF Reference Model compliance requirements
  risk_level: high
  data_integrity_requirements:
  - All document relationships maintained accurately
  - Complete audit trail of resolution actions
  - No unauthorized modifications to source documents
  urs_requirements:
  - URS-019-004
  - URS-019-007
  - URS-019-011
  - URS-019-013
  - URS-019-014
  related_tests:
  - OQ-001
  - OQ-002
  estimated_duration_minutes: 45
  required_expertise:
  - eTMF operations
  - Quality assurance
  - Clinical documentation management
  reviewed_by: QA Manager
