name: Deploy to AWS ECS

on:
  push:
    branches: [main, deploy]
  workflow_dispatch:  # Manual trigger from GitHub UI or CLI

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 275333454012.dkr.ecr.eu-west-2.amazonaws.com
  PROJECT_NAME: pharma-test-gen
  CLUSTER_NAME: pharma-test-gen-cluster

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275333454012:role/pharma-test-gen-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="staging-latest"

          if [ "${{ matrix.service }}" == "frontend" ]; then
            echo "Building frontend with CloudFront-relative API URL..."
            docker build \
              --build-arg NEXT_PUBLIC_API_BASE_URL="" \
              --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
              -t ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${IMAGE_TAG} \
              -f Dockerfile.frontend .
          else
            echo "Building ${{ matrix.service }}..."
            docker build \
              -t ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${IMAGE_TAG} \
              -f Dockerfile.${{ matrix.service }}.pip .
          fi

          echo "Pushing image to ECR..."
          docker push ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}:${IMAGE_TAG}
          echo "Successfully pushed ${{ matrix.service }} image"

  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      api_task_def_arn: ${{ steps.get-task-defs.outputs.api_arn }}
      worker_task_def_arn: ${{ steps.get-task-defs.outputs.worker_arn }}
      frontend_task_def_arn: ${{ steps.get-task-defs.outputs.frontend_arn }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275333454012:role/pharma-test-gen-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: aws/terraform
        run: terraform init

      - name: Import existing resources if they exist
        working-directory: aws/terraform
        run: |
          # Import OIDC provider if it exists in AWS but NOT in Terraform state
          OIDC_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?ends_with(Arn, 'token.actions.githubusercontent.com')].Arn | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$OIDC_ARN" ] && [ "$OIDC_ARN" != "None" ] && [ "$OIDC_ARN" != "null" ]; then
            echo "Found existing OIDC provider in AWS: $OIDC_ARN"

            # Check if resource exists in Terraform state (using state list, not state show)
            if terraform state list 2>/dev/null | grep -q "^aws_iam_openid_connect_provider.github$"; then
              echo "OIDC provider already in Terraform state, skipping import"
            else
              echo "OIDC provider not in Terraform state, importing..."
              terraform import -var-file=environments/staging.tfvars \
                aws_iam_openid_connect_provider.github "$OIDC_ARN"
            fi
          else
            echo "No existing OIDC provider found in AWS (will be created by Terraform)"
          fi

          # Import GitHub Actions role if it exists in AWS but NOT in Terraform state
          if aws iam get-role --role-name ${{ env.PROJECT_NAME }}-github-actions 2>/dev/null; then
            echo "Found existing GitHub Actions IAM role in AWS"

            if terraform state list 2>/dev/null | grep -q "^aws_iam_role.github_actions$"; then
              echo "IAM role already in Terraform state, skipping import"
            else
              echo "IAM role not in Terraform state, importing..."
              terraform import -var-file=environments/staging.tfvars \
                aws_iam_role.github_actions ${{ env.PROJECT_NAME }}-github-actions
            fi
          else
            echo "GitHub Actions IAM role not found in AWS (will be created by Terraform)"
          fi

          # Route53 cert validation records are handled by allow_overwrite=true in route53.tf
          # No import needed - Terraform will create or update existing records idempotently

          # Import existing ACM certificate if it exists (prevents creating duplicate)
          echo "Checking for existing ACM certificate for csvgeneration.com..."
          ACM_CERT_ARN=$(aws acm list-certificates --region us-east-1 \
            --query "CertificateSummaryList[?DomainName=='csvgeneration.com' && Status=='ISSUED'].CertificateArn | [0]" \
            --output text 2>/dev/null || echo "")

          if [ -n "$ACM_CERT_ARN" ] && [ "$ACM_CERT_ARN" != "None" ] && [ "$ACM_CERT_ARN" != "null" ]; then
            echo "Found existing ACM certificate: $ACM_CERT_ARN"
            if ! terraform state show 'aws_acm_certificate.cloudfront[0]' 2>/dev/null; then
              echo "Importing ACM certificate into Terraform state..."
              terraform import -var-file=environments/staging.tfvars \
                'aws_acm_certificate.cloudfront[0]' "$ACM_CERT_ARN" || true

              # Also import the validation resource
              echo "Importing ACM certificate validation..."
              terraform import -var-file=environments/staging.tfvars \
                'aws_acm_certificate_validation.cloudfront[0]' "$ACM_CERT_ARN" || true
            else
              echo "ACM certificate already in Terraform state"
            fi
          else
            echo "No existing ACM certificate found (will be created by Terraform)"
          fi

          # Import ECR repositories if they exist (destroy.yml preserves them but removes from state)
          for svc in api worker frontend; do
            REPO_NAME="${{ env.PROJECT_NAME }}-${svc}"
            if aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1; then
              echo "Found existing ECR repo: ${REPO_NAME}"
              if ! terraform state show "module.ecr.aws_ecr_repository.this[\"${svc}\"]" >/dev/null 2>&1; then
                echo "Importing ECR repo into Terraform state: ${REPO_NAME}"
                terraform import -var-file=environments/staging.tfvars \
                  "module.ecr.aws_ecr_repository.this[\"${svc}\"]" "$REPO_NAME" || true
              else
                echo "ECR repo already in Terraform state: ${REPO_NAME}"
              fi

              # Lifecycle policy import (safe even if policy not present yet)
              if ! terraform state show "module.ecr.aws_ecr_lifecycle_policy.this[\"${svc}\"]" >/dev/null 2>&1; then
                echo "Importing ECR lifecycle policy into Terraform state: ${REPO_NAME}"
                terraform import -var-file=environments/staging.tfvars \
                  "module.ecr.aws_ecr_lifecycle_policy.this[\"${svc}\"]" "$REPO_NAME" || true
              else
                echo "ECR lifecycle policy already in Terraform state: ${REPO_NAME}"
              fi
            else
              echo "ECR repo not found (will be created by Terraform): ${REPO_NAME}"
            fi
          done

          # Import ChromaDB bucket if it exists (destroy.yml preserves it but removes from state)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -n "$ACCOUNT_ID" ] && [ "$ACCOUNT_ID" != "None" ] && [ "$ACCOUNT_ID" != "null" ]; then
            CHROMA_BUCKET="${{ env.PROJECT_NAME }}-chromadb-${ACCOUNT_ID}"
            if aws s3api head-bucket --bucket "$CHROMA_BUCKET" >/dev/null 2>&1; then
              echo "Found existing ChromaDB bucket: ${CHROMA_BUCKET}"
              if ! terraform state show aws_s3_bucket.chromadb >/dev/null 2>&1; then
                echo "Importing ChromaDB bucket into Terraform state..."
                terraform import -var-file=environments/staging.tfvars aws_s3_bucket.chromadb "$CHROMA_BUCKET" || true
              else
                echo "ChromaDB bucket already in Terraform state"
              fi

              # Import ChromaDB bucket sub-resources (preserved by destroy.yml)
              echo "Importing ChromaDB bucket sub-resources..."
              if ! terraform state show aws_s3_bucket_versioning.chromadb >/dev/null 2>&1; then
                terraform import -var-file=environments/staging.tfvars \
                  aws_s3_bucket_versioning.chromadb "$CHROMA_BUCKET" || true
              fi
              if ! terraform state show aws_s3_bucket_server_side_encryption_configuration.chromadb >/dev/null 2>&1; then
                terraform import -var-file=environments/staging.tfvars \
                  aws_s3_bucket_server_side_encryption_configuration.chromadb "$CHROMA_BUCKET" || true
              fi
              if ! terraform state show aws_s3_bucket_public_access_block.chromadb >/dev/null 2>&1; then
                terraform import -var-file=environments/staging.tfvars \
                  aws_s3_bucket_public_access_block.chromadb "$CHROMA_BUCKET" || true
              fi
            else
              echo "ChromaDB bucket not found (will be created by Terraform): ${CHROMA_BUCKET}"
            fi
          else
            echo "WARNING: Could not determine AWS account id; skipping ChromaDB bucket import"
          fi

          echo "Import step completed"

      - name: Terraform Apply
        working-directory: aws/terraform
        run: |
          terraform apply \
            -var-file=environments/staging.tfvars \
            -auto-approve

      - name: Get latest task definition ARNs
        id: get-task-defs
        run: |
          # Get the latest active task definition for each service
          API_ARN=$(aws ecs describe-task-definition --task-definition ${{ env.PROJECT_NAME }}-api --query 'taskDefinition.taskDefinitionArn' --output text)
          WORKER_ARN=$(aws ecs describe-task-definition --task-definition ${{ env.PROJECT_NAME }}-worker --query 'taskDefinition.taskDefinitionArn' --output text)
          FRONTEND_ARN=$(aws ecs describe-task-definition --task-definition ${{ env.PROJECT_NAME }}-frontend --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "api_arn=${API_ARN}" >> $GITHUB_OUTPUT
          echo "worker_arn=${WORKER_ARN}" >> $GITHUB_OUTPUT
          echo "frontend_arn=${FRONTEND_ARN}" >> $GITHUB_OUTPUT

          echo "Task definitions:"
          echo "  API: ${API_ARN}"
          echo "  Worker: ${WORKER_ARN}"
          echo "  Frontend: ${FRONTEND_ARN}"

  update-services:
    name: Update ECS Services
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275333454012:role/pharma-test-gen-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Force ECS service updates
        run: |
          echo "Forcing new deployment for all services..."

          for service in api worker frontend; do
            echo "Updating ${{ env.PROJECT_NAME }}-${service}..."
            aws ecs update-service \
              --cluster ${{ env.CLUSTER_NAME }} \
              --service ${{ env.PROJECT_NAME }}-${service} \
              --force-new-deployment \
              --query 'service.serviceName' \
              --output text
          done

          echo "All services updated. Waiting for stability..."

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for ECS services to reach steady state..."
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services \
              ${{ env.PROJECT_NAME }}-api \
              ${{ env.PROJECT_NAME }}-worker \
              ${{ env.PROJECT_NAME }}-frontend
          echo "All services are stable!"

  health-check:
    name: Health Check & Cache Invalidation
    needs: update-services
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275333454012:role/pharma-test-gen-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ALB target registration
        run: |
          echo "Waiting 30 seconds for ALB to register new targets..."
          sleep 30

      - name: Health check - API (via ALB)
        run: |
          # Get API ALB DNS name dynamically
          API_ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ env.PROJECT_NAME }}-api-alb \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          if [ -z "$API_ALB_DNS" ] || [ "$API_ALB_DNS" == "None" ]; then
            echo "WARNING: Could not find API ALB, trying CloudFront domain..."
            API_ALB_DNS="csvgeneration.com"
            PROTOCOL="https"
          else
            PROTOCOL="http"
          fi

          echo "Checking API health at ${PROTOCOL}://${API_ALB_DNS}/health..."
          for i in {1..5}; do
            if curl -sf "${PROTOCOL}://${API_ALB_DNS}/health"; then
              echo ""
              echo "API health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "API health check failed after 5 attempts"
          exit 1

      - name: Health check - Frontend (via ALB)
        run: |
          # Get Frontend ALB DNS name dynamically
          FRONTEND_ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ env.PROJECT_NAME }}-frontend-alb \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          if [ -z "$FRONTEND_ALB_DNS" ] || [ "$FRONTEND_ALB_DNS" == "None" ]; then
            echo "WARNING: Could not find Frontend ALB, trying CloudFront domain..."
            FRONTEND_ALB_DNS="csvgeneration.com"
            PROTOCOL="https"
          else
            PROTOCOL="http"
          fi

          echo "Checking frontend at ${PROTOCOL}://${FRONTEND_ALB_DNS}/..."
          for i in {1..5}; do
            if curl -sf "${PROTOCOL}://${FRONTEND_ALB_DNS}/" | grep -q "<!DOCTYPE html>"; then
              echo "Frontend health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Frontend health check failed after 5 attempts"
          exit 1

      - name: Invalidate CloudFront cache
        run: |
          echo "Getting CloudFront distribution ID..."
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Comment, 'pharma-test-gen')].Id | [0]" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" == "None" ]; then
            echo "No CloudFront distribution found, skipping invalidation"
            exit 0
          fi

          echo "Invalidating CloudFront cache for distribution: ${DISTRIBUTION_ID}..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${DISTRIBUTION_ID} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created invalidation: ${INVALIDATION_ID}"

      - name: Deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "  DEPLOYMENT COMPLETE!"
          echo "=========================================="
          echo ""
          echo "  URL: https://csvgeneration.com"
          echo "  API: https://csvgeneration.com/health"
          echo ""
          echo "  Services deployed:"
          echo "    - pharma-test-gen-api"
          echo "    - pharma-test-gen-worker"
          echo "    - pharma-test-gen-frontend"
          echo ""
          echo "=========================================="
